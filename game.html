const _curve=(pts,o)=>{
 if(o<=pts[0][0])return pts[0][1];
 for(let i=1;i<pts.length;i++)if(o<=pts[i][0]){
 const A=pts[i-1],B=pts[i];return Math.round(A[1]+(B[1]-A[1])*(o-A[0])/(B[0]-A[0]));
 }
 return pts[pts.length-1][1];
};

function dropBestPlayer(s){
 if(!(s.players||[]).length)return null;
 const best=s.players.slice().sort((a,b)=>overall(b)-overall(a))[0];
 s.players=s.players.filter(p=>p!==best);
 if(s.playersById)delete s.playersById[best.id];
 s.lineup=(s.lineup||[]).filter(id=>id!==best.id);
 if(s.pick)delete s.pick[best.pos];
 return best;
}

function checkAchievements(s){
 if(!s)return;
 s.achieved=s.achieved||{};
 const unlock=s.achieved;

 if(Object.keys(unlock).length>=ACHIEVEMENTS.length)return;
 ACHIEVEMENTS.forEach(a=>{
 if(unlock[a.id])return;
 let ok=false;
 try{ok=a.test(s);}catch(e){ok=false;}
 if(!ok)return;
 unlock[a.id]=gameYear(s);
 try{toast(' 成就解锁：'+a.name+'（'+a.desc+'）');logEvent(s,' 成就解锁「'+a.name+'」——'+a.desc);}catch(e){}
 });
}

const ROOKIE_NAMES=['小沐','阿泽','子辰','昊然','清扬','星野','无眠','逐梦','南风','初见','慕白','亦辰'];

const RK_A=['阿','小','白','苏','陆','沈','顾','洛','叶','凌','夜','莫','江','温','秦','池','祁','许','林','常'];
const RK_B=['川','野','辞','屿','柒','晏','深','迟','昭','眠','遥','笙','秋','策','尘','澜','溪','澈','泠','桉'];
function combName(used){
 for(const a of RK_A)for(const b of RK_B){const n=a+b;if(!used||!used.has(n))return n;}
 for(const a of RK_A)for(const b of RK_B)for(const c of RK_B){const n=a+b+c;if(!used||!used.has(n))return n;}
 return '选手'+(used?used.size:0); // 理论不可达（8400 个组合）；真到了也不能生成 undefined
}

function poolName(pool,used){
 if(!used)return pick(pool);
 const hit=pool.find(n=>!used.has(n));
 return hit||combName(used);
}

function genEraDef(eraId,team,pos,used){
 const key='g'+eraId+'_'+team.replace(/\./g,'')+'_'+pos; // 队名去点号（RNG.M→RNGM），保证 id 稳定可引用
 const exist=PLAYER_POOL.find(d=>d.id===key);
 if(exist)return exist;
 let name=poolName(ERA_GEN_NAMES.concat(ACADEMY_NAMES),used); // 池尽回退 combName（原为「新援N」）
 used.add(name);
 let h=5381;for(let i=0;i<key.length;i++)h=((h*33)^key.charCodeAt(i))>>>0;
 const rv=()=>{h=((h*1103515245)+12345)>>>0;return (h>>>16)%1000/1000;};
 const band=70+Math.floor(rv()*10); // 时代轮换/草根基准 70-79
 const base=[0,1,2,3].map(()=>clamp(band+Math.floor(rv()*9)-4,40,99));
 const skK=['lane','farm','team','mind'][Math.floor(rv()*4)];
 const sk={lane:['线霸体系','对线属性额外+8%'],farm:['运营体系','运营属性额外+8%'],team:['团战体系','团战属性额外+8%'],mind:['大心脏体系','心态属性额外+8%']}[skK];
 const cands=HEROES.filter(x=>x.pos[0]===pos);
 const def={id:key,name,pos,team,tags:[],base,skill:{n:sk[0],t:skK,d:sk[1]},
  sig:cands[Math.floor(rv()*cands.length)].n,
  career:eraId+'年效力于'+team+'的轮换选手（阵容演绎）。'};
 PLAYER_POOL.push(def); // 注册进选手池：defOf/defIndex 才能解析该 id
 return def;
}

<script>
const StateStore = (function () {
  const TRACE_KEY = 'km_trace';
  const CRASH_KEY = 'km_crash_snapshot';
  const LOG_MAX = 80;
  let _changeLog = [];
  let _trace = null;

  function _traceOn() {
    if (_trace === null) {
      try { _trace = localStorage.getItem(TRACE_KEY) === '1'; }
      catch (_) { _trace = false; }
    }
    return _trace;
  }

  function _now() { return Date.now(); }

  function _logChange(meta, keys) {
    if (!_traceOn()) return;
    const entry = {
      t: _now(),
      who: (meta && meta.who) || 'unknown',
      keys: keys || [],
      note: (meta && meta.note) || '',
    };
    _changeLog.push(entry);
    if (_changeLog.length > LOG_MAX) _changeLog = _changeLog.slice(-LOG_MAX);
    try { console.debug('[state]', entry.who, entry.keys.join(','), entry.note); }
    catch (_) {}
  }

  function _readState() {
    return (typeof S !== 'undefined' && S) ? S : null;
  }

  function _replaceState(next, meta) {
    if (typeof S === 'undefined') {
      throw new Error('stateStore.setState: global S not declared');
    }
    S = next;
    _logChange(meta || { who: 'setState', note: 'replace' }, ['*']);
    return S;
  }

  function _applyPatch(partial, meta) {
    const target = (meta && meta.target) || _readState();
    if (!target || !partial || typeof partial !== 'object') return target;
    const keys = Object.keys(partial);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
      target[k] = partial[k];
    }
    _logChange(meta || { who: 'patchState' }, keys);
    return target;
  }

  function _writeCrashSnapshot(tag, err) {
    try {
      const s = _readState();
      const payload = {
        t: _now(),
        tag: String(tag || 'err'),
        msg: String((err && err.message) || err || 'unknown'),
        stack: (err && err.stack) ? String(err.stack).slice(0, 2000) : '',
        team: s && s.teamName,
        season: s && s.season,
        phase: s && s.phase,
        day: s && s.day,
        mode: s && s.mode,
        state: null,
      };
      try {
        if (typeof serializeForSave === 'function') payload.state = serializeForSave(s);
        else payload.state = JSON.stringify(s);
      } catch (_) {
        try { payload.state = JSON.stringify({ teamName: s && s.teamName, phase: s && s.phase }); }
        catch (__ ) { payload.state = null; }
      }
      const raw = JSON.stringify(payload);
      localStorage.setItem(CRASH_KEY, raw);

      try {
        const stamp = CRASH_KEY + '_' + _now();
        localStorage.setItem(stamp, raw);
        const keys = Object.keys(localStorage).filter(k => k.indexOf(CRASH_KEY + '_') === 0).sort();
        while (keys.length > 3) {
          const k = keys.shift();
          try { localStorage.removeItem(k); } catch (_) {}
        }
      } catch (_) {}
      return true;
    } catch (_) {
      return false;
    }
  }

  function _readCrashSnapshot() {
    try {
      const raw = localStorage.getItem(CRASH_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function _clearCrashSnapshot() {
    try { localStorage.removeItem(CRASH_KEY); } catch (_) {}
  }

  function _freezeStatics(objs) {
    (objs || []).forEach(function (o) {
      if (o && typeof o === 'object') {
        try { Object.freeze(o); } catch (_) {}
      }
    });
  }

  return {
    getState: _readState,
    setState: _replaceState,
    patchState: _applyPatch,
    logChange: _logChange,
    changeLog: function () { return _changeLog.slice(); },
    clearChangeLog: function () { _changeLog = []; },
    writeCrashSnapshot: _writeCrashSnapshot,
    readCrashSnapshot: _readCrashSnapshot,
    clearCrashSnapshot: _clearCrashSnapshot,
    freezeStatics: _freezeStatics,
    traceOn: _traceOn,
    CRASH_KEY: CRASH_KEY,
    TRACE_KEY: TRACE_KEY,
  };
})();

function getState() { return StateStore.getState(); }
function setState(next, meta) { return StateStore.setState(next, meta); }
function patchState(partial, meta) { return StateStore.patchState(partial, meta); }
function writeCrashSnapshot(tag, err) { return StateStore.writeCrashSnapshot(tag, err); }

</script>

<script>
const gameLog = (function () {
  const MAX = 200;
  let buf = [];
  let verbose = null;

  function isVerbose() {
    if (verbose === null) {
      try {
        verbose = (function(){try{return typeof StateStore !== 'undefined' && StateStore.traceOn();}catch(e){return false;}})() ||
          localStorage.getItem('km_trace') === '1';
      } catch (_) { verbose = false; }
    }
    return verbose;
  }

  function push(cat, msg, data, level) {
    const lv = level || 'info';
    if (!isVerbose() && lv === 'info') return;
    buf.push({
      t: Date.now(),
      cat: String(cat || 'sys'),
      msg: String(msg || ''),
      level: lv,
      data: data === undefined ? null : tryJson(data),
    });
    if (buf.length > MAX) buf = buf.slice(-MAX);
  }

  function tryJson(v) {
    try { return JSON.parse(JSON.stringify(v)); }
    catch (_) { return String(v); }
  }

  return {
    info: function (cat, msg, data) { push(cat, msg, data, 'info'); },
    warn: function (cat, msg, data) { push(cat, msg, data, 'warn'); },
    error: function (cat, msg, data) { push(cat, msg, data, 'error'); },
    ai: function (msg, data) { push('ai', msg, data, 'info'); },
    transfer: function (msg, data) { push('transfer', msg, data, 'info'); },
    match: function (msg, data) { push('match', msg, data, 'info'); },
    board: function (msg, data) { push('board', msg, data, 'info'); },
    dump: function () { return buf.slice(); },
    clear: function () { buf = []; },
    exportText: function () {
      return buf.map(function (e) {
        return new Date(e.t).toISOString() + ' [' + e.level + '][' + e.cat + '] ' + e.msg +
          (e.data ? ' ' + JSON.stringify(e.data) : '');
      }).join('\n');
    },
  };
})();

<script>
const PHASES = {
  R1: 'r1',
  R2: 'r2',
  CARD: 'card',
  R3: 'r3',
  PLAYOFF: 'playoff',
  CHAMPION: 'champion',
  ELIMINATED: 'eliminated',
  CHALLENGER: 'challenger',
  EWC: 'ewc',
  ASIAD: 'asiad',
  ANNUAL: 'annual',
};

const PHASE_NEXT = {
  r1: ['r2', 'eliminated', 'champion'], // champion 仅极端补完路径
  r2: ['card', 'r3', 'eliminated', 'playoff'], // r3 直通：卡位赛后胜者/跳过
  card: ['r3', 'eliminated'],
  r3: ['playoff', 'eliminated', 'champion'],
  playoff: ['champion', 'eliminated'],
  champion: ['challenger', 'ewc', 'asiad', 'annual', 'r1'],
  eliminated: ['challenger', 'ewc', 'asiad', 'annual', 'r1'],
  challenger: ['ewc', 'asiad', 'annual', 'r1', 'r2', 'card', 'r3'], // 挑杯后开夏/直接年总
  ewc: ['asiad', 'annual', 'r1'],
  asiad: ['annual', 'r1'],
  annual: ['r1'],
};

const PHASE_LABEL = {
  r1: '常规赛·第一轮',
  r2: '常规赛·第二轮',
  card: '卡位赛',
  r3: '常规赛·第三轮',
  playoff: '季后赛',
  champion: '赛季结束·夺冠',
  eliminated: '赛季结束·止步',
  challenger: '挑战者杯',
  ewc: 'EWC 电竞世界杯',
  asiad: '亚运会',
  annual: 'KPL 年度总决赛',
};

function _phaseTrace() {
  try { return typeof StateStore !== 'undefined' && StateStore.traceOn(); }
  catch (_) { return false; }
}

function isKnownPhase(p) {
  return Object.prototype.hasOwnProperty.call(PHASE_NEXT, p);
}

function canTransition(from, to) {
  if (!isKnownPhase(from) || !isKnownPhase(to)) return false;

  if (from === to) return true;
  return PHASE_NEXT[from].indexOf(to) >= 0;
}

function setPhase(s, to, meta) {
  const from = s && s.phase;
  const force = !!(meta && meta.force);
  const who = (meta && meta.who) || 'setPhase';
  if (!s) return { ok: false, from: from, to: to, reason: 'no-state' };
  if (!isKnownPhase(to)) {
    if (_phaseTrace()) try { console.warn('[phase] unknown target', to); } catch (_) {}
    return { ok: false, from: from, to: to, reason: 'unknown-target' };
  }
  if (!force && from != null && !canTransition(from, to)) {
    if (_phaseTrace()) try { console.warn('[phase] illegal', from, '->', to, who); } catch (_) {}
    try { if (typeof gameLog !== 'undefined') gameLog.warn('phase', 'illegal ' + from + ' -> ' + to, { who: who }); } catch (_) {}
    return { ok: false, from: from, to: to, reason: 'illegal-transition' };
  }
  s.phase = to;
  try { if (typeof StateStore !== 'undefined') StateStore.logChange({ who: who, note: 'phase:' + from + '→' + to }, ['phase']); } catch (_) {}
  return { ok: true, from: from, to: to, reason: '' };
}

function setPhaseOrWarn(s, to, meta) {
  const r = setPhase(s, to, meta);
  if (!r.ok && r.reason === 'illegal-transition') {
    try { if (typeof toast === 'function') toast(' 赛程状态无法从「' + (PHASE_LABEL[r.from] || r.from) + '」跳到「' + (PHASE_LABEL[to] || to) + '」'); } catch (_) {}
  }
  return r.ok;
}

<script>
const Commands = (function () {
  function _ok(name, summary) {
    try { if (typeof gameLog !== 'undefined') gameLog.info('cmd', name, summary || null); } catch (_) {}
    return { ok: true, name: name, summary: summary || null };
  }
  function _skip(name, reason) {
    try { if (typeof gameLog !== 'undefined') gameLog.warn('cmd', name + ' skipped: ' + reason); } catch (_) {}
    return { ok: false, skipped: true, name: name, reason: reason };
  }


  function nextDayCommand(s) {
    s = s || (typeof getState === 'function' ? getState() : null);
    if (!s) return _skip('nextDay', 'no-state');
    if (s.board && s.board.fired) return _skip('nextDay', 'board-fired');
    const dayBefore = s.day;
    if (typeof nextDayStep === 'function') nextDayStep(s);
    else if (typeof nextDay === 'function') nextDay(s);
    else return _skip('nextDay', 'impl-missing');
    if (typeof save === 'function') { try { save(); } catch (e) {} }
    if (typeof renderAll === 'function') { try { renderAll(); } catch (e) {} }
    return _ok('nextDay', { day: dayBefore + '→' + s.day, fund: s.fund });
  }


  function advancePhaseCommand(s) {
    s = s || (typeof getState === 'function' ? getState() : null);
    if (!s) return _skip('advancePhase', 'no-state');
    const from = s.phase;
    if (typeof advancePhase !== 'function') return _skip('advancePhase', 'impl-missing');

    if (!['r1', 'r2', 'r3'].includes(from)) return _skip('advancePhase', 'not-in-round:' + from);
    advancePhase(s);
    return _ok('advancePhase', { from: from, to: s.phase });
  }


  function finishSeriesCommand(finalWin) {
    if (typeof finishSeries !== 'function') return _skip('finishSeries', 'impl-missing');
    const s = (typeof getState === 'function' ? getState() : null);
    const meta = s && s.series ? { mw: s.series.mw, ow: s.series.ow, max: s.series.max } : null;
    finishSeries(!!finalWin);
    return _ok('finishSeries', { win: !!finalWin, before: meta });
  }


  function aiTransferWindowCommand(s) {
    s = s || (typeof getState === 'function' ? getState() : null);
    if (!s) return _skip('aiTransferWindow', 'no-state');
    if (typeof aiTransferWindow !== 'function') return _skip('aiTransferWindow', 'impl-missing');
    aiTransferWindow(s);
    return _ok('aiTransferWindow', null);
  }


  function endTransferWindowCommand(s) {
    s = s || (typeof getState === 'function' ? getState() : null);
    if (!s) return _skip('endTransferWindow', 'no-state');
    if (typeof denyIfBlocked === 'function' && denyIfBlocked('endTransferWindow', s)) {
      return _skip('endTransferWindow', 'denied');
    }
    if (typeof endTransferWindow !== 'function') return _skip('endTransferWindow', 'impl-missing');
    endTransferWindow(s);
    return _ok('endTransferWindow', null);
  }

  return {
    nextDay: nextDayCommand,
    advancePhase: advancePhaseCommand,
    finishSeries: finishSeriesCommand,
    aiTransferWindow: aiTransferWindowCommand,
    endTransferWindow: endTransferWindowCommand,
  };

<script>
class PerfMonitor {
  constructor() {

    this.baseline = {
      initTime: 200,       // 初始化耗时 (ms)
      renderTime: 50,      // 单次渲染耗时 (ms)
      memoryLimit: 50,     // 单赛季内存增长上限 (MB)
      fpsMinimum: 55       // 最低 FPS
    };


    this.history = [];
    this.lastRenderStart = 0;
    this.lastRenderEnd = 0;
    this.currentFPS = 0;
    this.renderQueue = [];


    this.startPeriodicSampling();

    console.log('[PerfMonitor] Initialized');
  }


  measureInit() {
    const start = performance.now();


    const originalInitStart = window.initStart;
    if (originalInitStart) {
      window.initStart = () => {
        const result = originalInitStart.call(this);
        const duration = performance.now() - start;
        this.logMetric('initTime', duration);
        return result;
      };
    }

    return () => performance.now() - start;
  }


  markRenderStart() {
    this.lastRenderStart = performance.now();
  }


  markRenderEnd() {
    this.lastRenderEnd = performance.now();
    const duration = this.lastRenderEnd - this.lastRenderStart;
    this.lastRenderTime = duration;
    this.logMetric('renderTime', duration);


    this.renderQueue.push({
      timestamp: Date.now(),
      duration: duration
    });


    if (this.renderQueue.length > 100) {
      this.renderQueue.shift();
    }

    return duration;
  }


  logMetric(name, value) {
    const status = value <= this.baseline[name] ? '✓' : '✗';

    const snapshot = {
      timestamp: new Date().toISOString(),
      metric: name,
      value: parseFloat(value.toFixed(2)),
      baseline: this.baseline[name],
      status: status
    };

    this.history.push(snapshot);


    if (status === '✗') {
      console.warn(`[PERF] ${name} 超基线：${value.toFixed(1)}ms (阈值：${this.baseline[name]}ms)`);
    }
  }


  getTrend(metricName, days = 7) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);

    return this.history
      .filter(h => new Date(h.timestamp) > cutoff && h.metric === metricName)
      .map(h => ({
        date: h.timestamp.split('T')[0],
        value: h.value
      }));
  }


  exportToCSV(filename = null) {
    const fname = filename || `perf-history-${new Date().toISOString().split('T')[0]}.csv`;

    const headers = ['timestamp', 'metric', 'value', 'baseline', 'status'];
    const rows = this.history.map(h =>
      [h.timestamp, h.metric, h.value, h.baseline, h.status].join(',')
    );

    const csvContent = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');
    link.href = url;
    link.download = fname;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    console.log(`[PERF] Exported ${this.history.length} records to ${fname}`);
  }


  startPeriodicSampling() {

    if (typeof window.self !== 'undefined') {
      try {
        const intervalId = setInterval(() => {
          try {

            const now = performance.now();
            if (this.lastFrameTime) {
              const delta = now - this.lastFrameTime;
              this.currentFPS = delta > 0 ? Math.round(1000 / delta) : 0;
            }
            this.lastFrameTime = now;


            if (performance.memory) {
              const memoryData = {
                used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024),
                total: Math.round(performance.memory.jsHeapSizeLimit / 1024 / 1024)
              };

              if (memoryData.used > this.baseline.memoryLimit) {
                console.warn(`[PERF] 内存使用过高：${memoryData.used}MB / ${memoryData.total}MB`);
              }
            }

          } catch (e) {

          }
        }, 1000); // 每秒采样一次


        clearInterval(intervalId);
      } catch (_) {

      }
    }
  }


  generateSummary() {
    const summary = {
      totalMetrics: this.history.length,
      issues: this.history.filter(h => h.status === '✗').length,
      lastValues: {},
      trends: {}
    };


    const metrics = new Set(this.history.map(h => h.metric));
    metrics.forEach(m => {
      const latest = this.history.filter(h => h.metric === m).pop();
      if (latest) {
        summary.lastValues[m] = latest.value;
        summary.trends[m] = latest.status;
      }
    });

    console.table(summary);
    return summary;
  }
}

function findPoBracketMatch(p,slot){
	if(!p||!slot)return null;
	if(slot==='wb1')return p.wb&&p.wb[0]||null;

	if(slot==='lb1')return p.lb&&p.lb[0]||null;
	if(slot==='lb2')return p.lb&&p.lb[1]||null;
	if(/^lb2_(\d+)$/.test(slot))return (p.lb2||[])[+RegExp.$1-1]||null;
	if(slot==='胜者组决赛'||slot==='wf')return p.wf||null;
	if(/^lb3_(\d+)$/.test(slot))return (p.lb3||[])[+RegExp.$1-1]||null;
	if(slot==='败者组半决赛'||slot==='lb4')return p.lb4||null;
	if(slot==='败者组决赛'||slot==='lbf')return p.lbf||null;
	if(slot==='总决赛'||slot==='final')return p.final||null;
	return null;
}
function findCup8BySuffix(p,suf){
	if(!p||!suf)return null;
	if(/^wb1_(\d+)$/.test(suf))return (p.wb1||[])[+RegExp.$1-1]||null;
	if(/^lb1_(\d+)$/.test(suf))return (p.lb1||[])[+RegExp.$1-1]||null;
	if(/^wb2_(\d+)$/.test(suf))return (p.wb2||[])[+RegExp.$1-1]||null;
	if(/^lb2_(\d+)$/.test(suf))return (p.lb2||[])[+RegExp.$1-1]||null;
	if(suf==='wf')return p.wf||null;
	if(suf==='lbs')return p.lbs||null;
	if(suf==='lbf')return p.lbf||null;
	if(suf==='final')return p.final||null;

function findCupMatchBySlot(s,slot){
	if(!s||!slot)return null;
	const a=s.annual,c=s.challenger,e=s.ewc;
	if(/^arena_r(\d+)$/.test(slot)&&a&&a.rounds){
	const rd=a.rounds[+RegExp.$1-1];
	if(!rd)return null;
	return rd.find(m=>m.a===s.teamName||m.b===s.teamName)||null;
	}
	if(/^brk(\d+)$/.test(slot)&&a&&a.brk)return a.brk[+RegExp.$1-1]||null;
	if(/^apo_/.test(slot)&&a&&a.po)return findCup8BySuffix(a.po,slot.slice(4));
	if(/^ch_r1_(\d+)$/.test(slot)&&c&&c.r1)return c.r1[+RegExp.$1-1]||null;
	if(/^ch_r2_(\d+)$/.test(slot)&&c&&c.r2)return c.r2[+RegExp.$1-1]||null;
	if(/^chpo_/.test(slot)&&c&&c.po)return findCup8BySuffix(c.po,slot.slice(5));
	if(slot==='ch_final'&&c)return c.final||null;
	if(/^ewc_qf(\d+)$/.test(slot)&&e)return (e.qf||[])[+RegExp.$1-1]||null;
	if(/^ewc_sf(\d+)$/.test(slot)&&e)return (e.sf||[])[+RegExp.$1-1]||null;
	if(slot==='ewc_final'&&e)return e.final||null;
	return null;
}
function resolveSeriesMatch(s,srIn){
	if(!s)return null;
	const sr=srIn||s.series;

	if(sr.mid){
	const live=getMatch(s,sr.mid);
	if(live)return live;
	}
	if(sr.stage==='regular'&&sr.mid==null&&s.schedule){

	const m=s.schedule[s.matchIdx];
	if(m)return m;
	}
	if(sr.stage==='card'&&s.card&&s.card.matches){
	if(sr.cardIdx!=null&&s.card.matches[sr.cardIdx])return s.card.matches[sr.cardIdx];
	}
	if(sr.stage==='po'){
	const live=findPoBracketMatch(s.playoff,sr.poSlot);
	if(live)return live;
	}
	if(sr.stage==='cup'){
	const live=findCupMatchBySlot(s,sr.cupSlot);
	if(live)return live;
	}

	const findPair=(list,a,b)=>(list||[]).find(m=>m&&(m.a===a&&m.b===b||m.a===b&&m.b===a));
	let a=sr.myName,b=sr.opName;
	if((!a||!b)){

		const src=sr.cupMatch||sr.poMatch||sr.cardMatch;
		if(src){a=a||src.a;b=b||src.b;}
	}
	if(!a||!b)return null;
	let live=null;
	if(sr.stage==='card'&&s.card&&s.card.matches)live=findPair(s.card.matches,a,b);
	else if(sr.stage==='po'&&s.playoff){
	const p=s.playoff;
	live=findPair(p.wb,a,b)||findPair(p.lb,a,b)||findPair(p.lb2,a,b)||findPair(p.lb3,a,b)
	||findPair([p.wf],a,b)||findPair([p.lb4],a,b)||findPair([p.lbf],a,b)||findPair([p.final],a,b);
	}
	else if(sr.stage==='cup'){
	if(s.phase==='annual'&&s.annual){
	if(s.annual.stage==='arena'&&s.annual.rounds)live=s.annual.rounds.flat().find(m=>findPair([m],a,b));
	else if(s.annual.stage==='breakthrough')live=findPair(s.annual.brk,a,b);
	else if(s.annual.po){
	const p=s.annual.po;
	live=findPair(p.wb1,a,b)||findPair(p.lb1,a,b)||findPair(p.wb2,a,b)||findPair(p.lb2,a,b)
	||findPair([p.wf],a,b)||findPair([p.lbs],a,b)||findPair([p.lbf],a,b)||findPair([p.final],a,b);
	}
	}else if(s.phase==='challenger'&&s.challenger){
	const c=s.challenger;
	live=findPair(c.r1,a,b)||findPair(c.r2,a,b);
	if(!live&&c.po){
	const p=c.po;
	live=findPair(p.wb1,a,b)||findPair(p.lb1,a,b)||findPair(p.wb2,a,b)||findPair(p.lb2,a,b)
	||findPair([p.wf],a,b)||findPair([p.lbs],a,b)||findPair([p.lbf],a,b);
	}
	if(!live)live=findPair([c.final],a,b);
	}else if(s.phase==='ewc'&&s.ewc){
	const e=s.ewc;
	live=findPair(e.qf,a,b)||findPair(e.sf,a,b)||findPair([e.final],a,b);
	}
	}
	return live||null;
}
function rebindSeriesMatch(s){

<script>
function ensureAiRosters(s,teamName){
 s.aiRosters=s.aiRosters||{};
 if(s.aiRosters[teamName])return s.aiRosters[teamName];
 const map=aiRosterDefMap(s);
 const ids=map[teamName]||(s.ewcDefMap||{})[teamName]; // ewcDefMap：EWC 海外队选手（杯赛期间可正常 BP/结算）
 if(!ids)return [];
 s.aiPower=s.aiPower||{};
 const ownedIds=new Set(s.players.map(p=>p.id));
 const ownedNames=new Set(s.players.map(p=>p.name));
 const roster=ids.map(pid=>{
 const def=defOf(s,pid);
 if(!def)return null;
 if(s.retiredDefs&&s.retiredDefs.includes(pid))return null; // 已退役：空位由青训递补
 if(ownedIds.has(def.id)||ownedNames.has(def.name))return null; // 已被玩家签走：不再出现在对手阵中
 const p=genSeasonPlayer(s,def);
 return p;
 }).filter(Boolean).filter(p=>p.age<(AGE_MODEL[p.pos]||AGE_MODEL.mid).retire); // 到龄退役，空位由青训递补

 ['top','jg','mid','ad','sup'].forEach(pos=>{
 if(roster.some(p=>p.pos===pos))return;
 const usedNames=rookieUsedNames(s);
 roster.forEach(p=>usedNames.add(p.name));
 const fill=genAcademyDef(pos,usedNames,s.season);

 s.extraDefs=s.extraDefs||[];
 if(!s.extraDefs.some(d=>d&&d.id===fill.id))s.extraDefs.push(fill);
 const p=genSeasonPlayer(s,fill);
 roster.push(p);
 });
 s.aiRosters[teamName]=roster;
 s.aiPower[teamName]=aiRosterPower(roster,s,teamName); // AI 战力=真实阵容结算（与玩家 teamPower 同刻度）
 if(s.challDefMap&&s.challDefMap[teamName])s.aiPower[teamName]=Math.round(s.aiPower[teamName]*1.05); // 挑战者的祝福：低赛道队 vs KPL +5%（玩家对局同规则）
 return roster;
}

function gcDefs(s){
 if(!s)return;
 s.extraDefs=s.extraDefs||[];
 s.retiredDefs=s.retiredDefs||[];
 s.aiAcademy=s.aiAcademy||{};
 const live=new Set();
 const addId=x=>{if(x==null)return;live.add(typeof x==='string'?x:(x.id||null));};
 (s.players||[]).forEach(addId);
 (s.freeAgents||[]).forEach(addId);
 (s.market||[]).forEach(addId);
 (s.transferList||[]).forEach(addId);
 (s.academy||[]).forEach(addId);
 Object.values(s.loanBenches||{}).forEach(arr=>(arr||[]).forEach(addId));
 Object.values(s.aiRosterDefs||{}).forEach(arr=>(arr||[]).forEach(addId));
 Object.values(s.aiRosters||{}).forEach(r=>(r||[]).forEach(addId));
 Object.values(s.challDefMap||{}).forEach(arr=>(arr||[]).forEach(addId));
 Object.values(s.ewcDefMap||{}).forEach(arr=>(arr||[]).forEach(addId));
 Object.values(s.aiAcademy||{}).forEach(arr=>(arr||[]).forEach(addId));

 Object.keys(s.aiAcademy).forEach(tn=>{
  s.aiAcademy[tn]=(s.aiAcademy[tn]||[]).filter(id=>{
   if(!id||s.retiredDefs.includes(id))return false;
   return !!defOf(s,id);
  });
  if(!s.aiAcademy[tn].length)delete s.aiAcademy[tn];
 });
 const year=gameYear(s)||2026;
 s.extraDefs=s.extraDefs.filter(d=>{
  if(!d||!d.id)return false;
  if(live.has(d.id))return true;
  if(s.retiredDefs.includes(d.id))return false; // 已退役：def 可丢，id 留在 retiredDefs
  const m=/^(?:ch|ewc)(\d{4})_/.exec(d.id);
  if(m){const y=parseInt(m[1],10);if(!isNaN(y)&&year>y)return false;} // 杯赛外援跨年后丢
  return true;
 });
 const CAP=480;
 if(s.extraDefs.length>CAP){
  const must=s.extraDefs.filter(d=>live.has(d.id));
  const rest=s.extraDefs.filter(d=>!live.has(d.id));
  s.extraDefs=must.concat(rest.slice(-Math.max(0,CAP-must.length)));
 }
 s.retiredDefs=s.retiredDefs.slice(-350);
}

}

function emergencyFillRoster(s){
 if(!s)return false;
 let signed=false;
 const used=rookieUsedNames(s);
 POS_ORDER.forEach(pos=>{
  const ok=(s.players||[]).some(p=>p.pos===pos&&matchEligible(s,p));
  if(ok)return;
  const def=genFreeAgentDef(pos,'low',used);
  used.add(def.name);
  const p=genPlayer(def);
  p.contract=1;
  s.players.push(p);
  signed=true;
  logEvent(s,' 紧急补签自由球员 '+p.name+'（'+POS[pos][0]+' · 总值 '+overall(p)+'）——原主力无法出战且无替补可顶');
 });
 if(signed){try{autoFillLineup(s);}catch(e){}}
 return signed;
}

function ageDrift(p){
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age<=m.gold){
 const gk=pick(['lane','farm','team','mind']);
 p.attrs[gk]=clamp(p.attrs[gk]+rnd(2,3),55,99);
 }else if(p.age<m.retire){
 const key=pick(['lane','farm','team','mind']);
 p.attrs[key]=clamp(p.attrs[key]-rnd(1,m.decay),40,99);
 }
}

function genSeasonPlayer(s,def){
 const p=genPlayer(def);

 const born=(def.age0!=null)?(def.ageFrom||s.season||1):1;
 const years=Math.max(0,(s.season||1)-born);
 for(let i=0;i<years;i++){p.age++;ageDrift(p);}
 if(def.age0!=null)p.age=def.age0+years;
 return p;
}

function genAcademyDef(pos,usedNames,season){
 const name=typeof ACADEMY_NAMES!=='undefined'?poolName(ACADEMY_NAMES,usedNames):combName(usedNames);
 usedNames.add(name);
 const cands=HEROES.filter(h=>h.pos[0]===pos);
 const boost=Math.min(2*((season||1)-1),14);
 const b=v=>clamp(v+boost,40,99);
 return {id:'ac_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:['青训'],
 base:[b(68),b(68),b(70),b(72)],skill:{n:'青训体系',t:'team',d:'团战属性额外+8%'},
 sig:pick(cands.length?cands:HEROES).n,career:'本队青训营提拔，阶梯赛历练稳定。'};
}

function aiRosterDefMap(s){
 if(!s.aiRosterDefs){
 s.aiRosterDefs={};
 for(const tn in AI_ROSTERS)s.aiRosterDefs[tn]=AI_ROSTERS[tn].p.slice();
 }
 return s.aiRosterDefs;
}

let _defIdx=null;
function defIndex(){
 if(!_defIdx){
 _defIdx={};
 PLAYER_POOL.forEach(d=>{_defIdx[d.id]=d;});
 FA_2026.forEach(d=>{_defIdx[d.id]=d;});
 }
 return _defIdx;
}
function defOf(s,pid){return defIndex()[pid]||(s.extraDefs||[]).find(d=>d.id===pid)||null;}
function aiDetachDef(s,pid){ // def 被玩家签走/转会：从所有 AI 队与青训营除名，避免同一人挂两队
 if(!defOf(s,pid))return;
 const map=aiRosterDefMap(s);
 for(const tn in map)map[tn]=map[tn].filter(id=>id!==pid);

 if(s.aiAcademy){
 for(const tn in s.aiAcademy){
  if(Array.isArray(s.aiAcademy[tn]))s.aiAcademy[tn]=s.aiAcademy[tn].filter(id=>id!==pid);
 }
 }
 s.aiRosters=s.aiRosters||{};
 for(const tn in s.aiRosters){if(Array.isArray(s.aiRosters[tn]))s.aiRosters[tn]=s.aiRosters[tn].filter(p=>p&&p.id!==pid);}
}
function ensureDef(s,p){
 if(!p||p.id==null)return defOf(s,p&&p.id);
 if(defOf(s,p.id))return defOf(s,p.id);
 const a=p.attrs||{lane:70,farm:70,team:70,mind:70};
 const def={id:p.id,name:p.name||('选手'+p.id),pos:p.pos||'mid',team:p.team||null,tags:(p.tags||[]).slice(),
  base:[a.lane||70,a.farm||70,a.team||70,a.mind||70],skill:p.skill,sig:p.sig,career:p.career||''};
 (s.extraDefs=s.extraDefs||[]).push(def);
 if(_defIdx)_defIdx[def.id]=def;
 return def;
}
function parkFreeAgent(s,p,note){
 if(!p||p.id==null)return false;
 ensureDef(s,p);
 const fa={...p,team:null,freeAgent:true,willingness:Math.max(p.willingness||50,60),
  signCost:Math.max(30,Math.round(valueOf(overall(p))*0.6)),
  loan:null,loanOut:null,kjia:0,ownerTeam:null,untouchable:false};
 delete fa.acqCost;
 s.freeAgents=(s.freeAgents||[]).filter(x=>x.id!==p.id).concat([fa]);
 s.players=(s.players||[]).filter(x=>x.id!==p.id);
 const li=(s.lineup||[]).indexOf(p.id);
 if(li>=0)s.lineup.splice(li,1);
 if(s.pick&&p.pos)delete s.pick[p.pos];
 s.listed=(s.listed||[]).filter(x=>x.id!==p.id);
 s.bids=(s.bids||[]).filter(x=>x.id!==p.id);
 s.transferList=(s.transferList||[]).filter(x=>x.id!==p.id);
 try{logEvent(s,' '+(p.name||'选手')+' 进入自由市场'+(note?'（'+note+'）':''));}catch(e){}
 return true;
}
function aiAttachDef(s,pid,teamName){ // def 流入某 AI 队（位置与名额合法才接收）；返回是否入册
 const def=defOf(s,pid);
 if(!def)return false;
 if(typeof canSign==='function'){
  const chk=canSign(s,{id:pid,name:def.name,pos:def.pos},{actor:'ai',team:teamName});
  if(!chk.ok)return false;
 }
 const map=aiRosterDefMap(s);
 if(!map[teamName]||map[teamName].length>=5)return false;
 if(map[teamName].some(id=>{const d=defOf(s,id);return d&&d.pos===def.pos;}))return false;
 aiDetachDef(s,pid);
 const arr=map[teamName]; // aiDetachDef 会整体替换各队数组，必须在除名后重取引用，否则 push 到孤儿数组、该选手从联盟消失
 arr.push(pid);
 s.aiRosters={}; // 名册缓存失效：该选手立即为买方出战、原队除名（与 negoComplete 同步，否则整个赛季缓存都是旧的）
 return true;
}

function genStarDef(s,usedNames,forcePos){
 const pos=forcePos||pick(POS_ORDER);
 const name=poolName(ACADEMY_NAMES,usedNames); // 池尽回退 combName，不再生成「新星N」
 usedNames.add(name);
 const sk=pick([['lane','线霸体系','对线属性额外+10%'],['farm','运营体系','运营属性额外+10%'],
 ['team','团战体系','团战属性额外+10%'],['mind','大心脏体系','心态属性额外+10%']]);
 const boost=Math.min(2*((s.season||1)-1),12);
 const b=v=>clamp(v+boost,40,99);
 return {id:'ns_'+s.season+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:['青训'],
 base:[b(rnd(74,84)),b(rnd(74,84)),b(rnd(74,84)),b(rnd(74,84))],
 skill:{n:sk[1],t:sk[0],d:sk[2]},sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,
 career:'赛季'+s.season+'从青训营出道的新生代，天赋肉眼可见。'};
}

function aiTierOf(s,tn){
 const t=AI_TEAMS.find(x=>x.name===tn)||{};

 const seed=t.seed!=null?t.seed:(t.power||450);
 const p=s.aiPower&&s.aiPower[tn]!=null?s.aiPower[tn]:seed;
 if(seed>=560||p>=520)return 'elite';
 if(seed>=470||p>=470)return 'mid';
 return 'weak';
}
function aiDiffMul(s,tn){

 const pressure=1+Math.min(dynastyStreak(s,s.teamName),3)*0.08;
 const t=aiTierOf(s,tn);
 return (t==='elite'?1.35:t==='mid'?1:0.72)*pressure;
}

function aiBrain(s,tn){
 let base=1;
 try{ base=(typeof aiDiffMul==='function')?aiDiffMul(s,tn):1; }catch(e){ base=1; }
 let sc=1;
 try{
  const id=(s&&s.scenario)||'normal';
  if(id==='exodus'||id==='cursed')sc=1.14; // 残阵/魔咒：对手更针对
  else if(id==='debt'||id==='cap')sc=1.08; // 穷/帽紧：联盟不会放水
  else sc=1;
 }catch(e){}
 return Math.max(0.35,Math.min(1.6,base*sc));
}

function aiDevelopStarters(s,tn,map,ovrOf){
 const ids=(map[tn]||[]).slice();
 if(ids.length<3)return;
 const tier=aiTierOf(s,tn);
 const budget=tier==='elite'?10:tier==='mid'?8:6;

 const ranked=ids.map(id=>({id,def:defOf(s,id)})).filter(x=>x.def)
  .sort((a,b)=>ovrOf(a.def)-ovrOf(b.def)).slice(0,2);
 let left=budget;
 ranked.forEach(({def})=>{
  if(left<=0||!Array.isArray(def.base))return;
  const cap=Math.max(1,Math.round(budget*0.6));
  let used=0;
  while(left>0&&used<cap){

   let idx=0;
   for(let i=1;i<4;i++)if((def.base[i]||0)<(def.base[idx]||0))idx=i;
   const step=Math.min(left,used+2<=cap?2:1);
   def.base[idx]=clamp((def.base[idx]||70)+step,40,99);
   left-=step;used+=step;
  }
  if(used)logEvent(s,' '+tn+' 赛训加练：'+def.name+' 最弱项 +'+used+'（教练组特训）');
 });
}
function aiTransferWindow(s){
 try{if(typeof gameLog!=='undefined')gameLog.ai('aiTransferWindow start');}catch(e){}
 const map=aiRosterDefMap(s);
 s.extraDefs=s.extraDefs||[];
 s.retiredDefs=s.retiredDefs||[];
 const teams=Object.keys(map).filter(tn=>tn!==s.teamName);
 const roll={}; // def 当前赛季估值（窗口内缓存，避免同 def 多次随机重掷）
 const ovrOf=def=>roll[def.id]||(roll[def.id]=overall(genSeasonPlayer(s,def)));

 teams.forEach(tn=>{
 map[tn]=map[tn].filter(pid=>{
 const def=defOf(s,pid);
 if(!def)return false;
 if(s.retiredDefs.includes(pid))return false;
 const p=genSeasonPlayer(s,def);
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age>=m.retire){
 s.retiredDefs.push(pid);
 retireToCoach(s,p);
 logEvent(s,' '+p.name+'（'+p.age+'岁）宣布退役，'+tn+' 腾出'+POS[p.pos][0]+'位置');
 return false;
 }
 return true;
 });
 });

 const releasedFrom={};
 teams.forEach(tn=>{
 const tier=aiTierOf(s,tn);

  const holdBias=tier==='elite'?-0.25:tier==='weak'?0.15:0;
 map[tn]=map[tn].filter(pid=>{
 const def=defOf(s,pid);
 if(!def)return false;
 const p=genSeasonPlayer(s,def);
 const am=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 const badForm=(p.age>am.gold&&Math.random()<0.55+holdBias)||(overall(p)<76&&Math.random()<0.5+holdBias);
 if(badForm){
 releasedFrom[pid]=tn;
 logEvent(s,' '+tn+' 未与 '+p.name+'（'+p.age+'岁 · 总值'+overall(p)+'）续约，状态下滑进入自由市场');
 return false;
 }
 return true; // 状态好：续约留队
 });
 });

 teams.forEach(tn=>{
 map[tn]=map[tn].filter(pid=>!s.players.some(x=>x.id===pid));
 });
 const assigned=new Set();
 teams.forEach(tn=>map[tn].forEach(id=>assigned.add(id)));

 let freePool=PLAYER_POOL.concat(s.extraDefs).filter(d=>!assigned.has(d.id)&&!s.retiredDefs.includes(d.id)&&!s.players.some(x=>x.id===d.id)).slice();

 const order=teams.slice().sort((a,b)=>(s.aiPower[a]||400)-(s.aiPower[b]||400));
 const usedNames=rookieUsedNames(s); // 全局查重（玩家/青训/市场/各队缓存/选秀池/静态池）
 PLAYER_POOL.concat(s.extraDefs||[]).forEach(d=>d&&d.name&&usedNames.add(d.name));
 order.forEach(tn=>{
 let guard=0;
 while(map[tn].length<5&&guard++<6){
 const have=new Set(map[tn].map(id=>defOf(s,id)).filter(Boolean).map(d=>d.pos));
 const need=POS_ORDER.find(pos=>!have.has(pos));
 if(!need)break;
 const cands=freePool.filter(d=>d.pos===need&&releasedFrom[d.id]!==tn); // 本队不签回刚放走的
 let def;
 if(cands.length){
 def=cands.sort((a,b)=>ovrOf(b)-ovrOf(a))[0];
 freePool=freePool.filter(d=>d!==def);
 logEvent(s,' 转会：'+def.name+' 加盟 '+tn+'（'+POS[def.pos][0]+'）');
 }else{
 def=genStarDef(s,usedNames,need); // 自由池无人可签：按缺位引进新援（对位培养，底子随赛季水涨船高）
 s.extraDefs.push(def);
 logEvent(s,' 补强：'+tn+' 引进 '+def.name+'（'+POS[def.pos][0]+' · 次级联赛引援）');
 }
 aiDetachDef(s,def.id); // 全局除名后再入册，杜绝同一 def 双挂
 map[tn].push(def.id);
 }
 });

 order.forEach(tn=>aiDevelopStarters(s,tn,map,ovrOf));

 const ageOf=def=>{
 const p=genSeasonPlayer(s,def);
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 return {age:p.age,pastGold:p.age>m.gold,gold:m.gold,retire:m.retire};
 };
 const upgradeScore=(outDef,inDef,tier)=>{
 const gain=ovrOf(inDef)-ovrOf(outDef);
 const aOut=ageOf(outDef),aIn=ageOf(inDef);
 const aggressive=tier==='elite'?1.35:tier==='weak'?0.75:1;
 const minGain=tier==='elite'?1:tier==='weak'?5:3;
 if(gain<minGain)return null;
 let score=gain*aggressive;
 if(aOut.pastGold)score+=4+(aOut.age-aOut.gold)*0.4;
 if(aIn.age<=aIn.gold-2)score+=2.5;
 if(aIn.age>=aIn.retire-1)score-=3;
 if(ovrOf(inDef)>=88)score+=2;
 return score;
 };
 order.forEach(tn=>{
 const tier=aiTierOf(s,tn);
 const slots=tier==='elite'?2:1;
 for(let slot=0;slot<slots;slot++){
 if(map[tn].length<5||!freePool.length)break;
 let best=null;
 map[tn].forEach(pid=>{
 const def=defOf(s,pid);
 if(!def)return;
 freePool.forEach(d=>{
 if(d.pos!==def.pos)return;
 const sc=upgradeScore(def,d,tier);
 if(sc==null)return;
 if(!best||sc>best.score)best={score:sc,pid,def,out:def,in:d,gain:ovrOf(d)-ovrOf(def)};
 });
 });
 if(!best||best.score<6)break;
 freePool=freePool.filter(d=>d!==best.in);
 map[tn]=map[tn].map(id=>id===best.pid?best.in.id:id);
 freePool.push(best.out);
 logEvent(s,' 转会：'+best.in.name+' 加盟 '+tn+'（效用 '+Math.round(best.score)+' · 战力+'+best.gain+'），'+best.out.name+' 离队寻找下家'+(ageOf(best.out).pastGold?'（老化顶替）':''));
 }
 });

 const tierRank={elite:3,mid:2,weak:1};
 order.forEach(tn=>{
 if(aiTierOf(s,tn)!=='elite')return;
 if(Math.random()>=0.5*aiDiffMul(s,tn))return;
 let best=null;
 map[tn].forEach(pid=>{
 const def=defOf(s,pid);
 if(!def)return;
 const cur=ovrOf(def);
 const ag=ageOf(def);
 const floor=ag.pastGold?3:5;
 teams.forEach(src=>{
 if(src===tn)return;
 if((tierRank[aiTierOf(s,src)]||0)>=(tierRank[aiTierOf(s,tn)]||0))return;
 (map[src]||[]).forEach(sid=>{
 const sd=defOf(s,sid);
 if(!sd||sd.pos!==def.pos)return;
 const gain=ovrOf(sd)-cur;
 if(gain<floor)return;
 const score=gain+(ag.pastGold?2:0);
 if(!best||score>best.score)best={score,gain,pid,def,sid,sd,src};
 });
 });
 });
 if(!best)return;
 map[tn]=map[tn].map(id=>id===best.pid?best.sd.id:id);
 map[best.src]=(map[best.src]||[]).filter(id=>id!==best.sid);
 freePool.push(best.def);
 logEvent(s,' 重磅转会！'+best.sd.name+' 从 '+best.src+' 转投 '+tn+'（'+POS[best.sd.pos][0]+'）· '+best.def.name+' 进入自由市场');
 });

 const extraBirth=dynastyStreak(s,s.teamName)>=2?1:0;
 const births=rnd(2,3)+extraBirth;
 for(let i=0;i<births;i++){
 const def=genStarDef(s,usedNames);
 s.extraDefs.push(def);
 const tn=order.find(t=>map[t].length<5&&!map[t].some(id=>{const d=defOf(s,id);return d&&d.pos===def.pos;}));
 if(tn){map[tn].push(def.id);logEvent(s,' 新星出道：'+def.name+'（'+POS[def.pos][0]+'）加盟 '+tn);}
 else{logEvent(s,' 新星出道：'+def.name+'（'+POS[def.pos][0]+'）进入自由市场');}
 }

 teams.forEach(tn=>{
 let guard=0;
 while((map[tn]||[]).length<5&&guard++<6){
 const have=new Set((map[tn]||[]).map(id=>defOf(s,id)).filter(Boolean).map(d=>d.pos));
 const need=POS_ORDER.find(pos=>!have.has(pos));
 if(!need)break;
 const cands=freePool.filter(d=>d.pos===need);
 let def;
 if(cands.length){
 def=cands.sort((a,b)=>ovrOf(b)-ovrOf(a))[0];
 freePool=freePool.filter(d=>d!==def);
 logEvent(s,' 转会：'+def.name+' 加盟 '+tn+'（'+POS[def.pos][0]+' · 挖角后补位）');
 }else{
 def=genStarDef(s,usedNames,need);
 s.extraDefs.push(def);
 logEvent(s,' 补强：'+tn+' 紧急引进 '+def.name+'（'+POS[def.pos][0]+'）');
 }
 map[tn]=map[tn]||[];
 map[tn].push(def.id);
 }
 });

 s.retiredCoaches=s.retiredCoaches||[];
 let coachMoved=false;
 order.forEach(tn=>{
 if(Math.random()>=0.45*aiDiffMul(s,tn))return;
 const cur=aiCoachState(s)[tn]||{bonus:6};
 const c=s.retiredCoaches.filter(r=>r.type!=='host'&&r.bonus>cur.bonus).sort((a,b)=>b.bonus-a.bonus)[0];
 if(!c)return;
 s.retiredCoaches=s.retiredCoaches.filter(r=>r.id!==c.id);

 if(cur.name){
  const price=legendPrice(cur.rating,cur.bonus);
  s.retiredCoaches.push({...cur,type:'coach',wage:(typeof cur.wage==='number'?cur.wage:price.wage),cost:(typeof cur.cost==='number'?cur.cost:price.cost)});
 }
 aiCoachState(s)[tn]={id:c.id,name:c.name,rating:c.rating,bonus:c.bonus,styleBonus:c.styleBonus,style:c.style};
 coachMoved=true;
 logEvent(s,'换帅！'+c.name+'（全队战力+'+c.bonus+'%）执教 '+tn+(cur.name?'，'+cur.name+' 回流名宿市场':''));
 });
 if(coachMoved)s.aiRosters={}; // 教练加成变化：名册缓存战力失效

 s.aiAcademy=s.aiAcademy||{};
 let rookMoved=false;
 order.forEach(tn=>{
 const mul=aiDiffMul(s,tn);
 const tier=aiTierOf(s,tn);

 const pOpen=tier==='elite'?0.95:tier==='mid'?0.7:0.5;
 if(Math.random()>=pOpen*mul)return;
 if(!s.aiAcademy[tn]||!s.aiAcademy[tn].length){
 const pool=[];
 const n=tier==='elite'?rnd(2,3):rnd(1,2);
 for(let k=0;k<n;k++){
 const def=genAiRookieDef(s,tn);
 s.extraDefs.push(def);
 pool.push(def.id);
 }
 s.aiAcademy[tn]=pool;
 logEvent(s,' '+tn+' 青训营开班，签入 '+pool.length+' 名新秀（'+pool.map(id=>defOf(s,id).name).join('、')+'）');
 }

 const trains=tier==='elite'?2:1;
 for(let t=0;t<trains;t++){
 if(!s.aiAcademy[tn]||!s.aiAcademy[tn].length)break;
 const id=s.aiAcademy[tn][rnd(0,s.aiAcademy[tn].length-1)];
 const r=defOf(s,id);
 if(!r)break;
 const key=pick(['lane','farm','team','mind']);
 const idx=['lane','farm','team','mind'].indexOf(key);
 const trainMax=tier==='elite'?5:4;
 r.base[idx]=clamp((r.base[idx]||70)+rnd(2,trainMax),40,95);
 const rSum=sumBase(r);
 logEvent(s,' '+tn+' 培养青训 '+r.name+'（'+POS[r.pos][0]+'）「'+(TRAIN_ITEMS.find(x=>x.k===key)||{n:key||'训练'}).n+'」+2~'+trainMax);

 if(rSum>=300){
 const rOvr=overall(genSeasonPlayer(s,r));
 const oldIdx=map[tn].findIndex(pid=>{const d=defOf(s,pid);return d&&d.pos===r.pos;});

 const already=Object.keys(map).find(x=>x!==tn&&(map[x]||[]).includes(r.id));
 if(already){
 s.aiAcademy[tn]=(s.aiAcademy[tn]||[]).filter(id=>id!==r.id);
 continue;
 }
 if(oldIdx>=0){
 const oldDef=defOf(s,map[tn][oldIdx]);
 if(oldDef&&overall(genSeasonPlayer(s,oldDef))<rOvr){
 map[tn][oldIdx]=r.id;
 s.aiAcademy[tn]=(s.aiAcademy[tn]||[]).filter(id=>id!==r.id); // 晋升后摘营，防转会后二次写回
 freePool.push(oldDef); // 被顶替的老将进自由池，别从联盟蒸发
 rookMoved=true;
 logEvent(s,' '+tn+' 新秀 '+r.name+'（'+rOvr+'总值）晋升一线队，'+oldDef.name+' 离队寻找下家');
 break;
 }
 }else if(map[tn].length<5){
 map[tn].push(r.id);

 for(let i=0;i<cnt&&pool.length;i++){
 const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
 const wealth=0.85+(t.power/640)*0.5; // 豪门预算更足
 let max=Math.round(ask*wealth*rnd(90,115)/100);
 if(cap!=null)max=Math.min(max,cap);
 clubs.push({name:t.name,max,bid:Math.round(max*rnd(60,78)/100),status:'active'});
 }
 window._sellNego={s,pid,round:1,ask,lock:cap!=null,lockCaps:Math.min(p.caps||0,4),
 lowball:Math.round(valueOf(overall(p))*0.65),
 clubs,
 msg:clubs.length?'收到 '+clubs.length+' 家俱乐部的初步报价：可直接接受、对某家逐轮抬价，或统一递交心理要价。':'暂无俱乐部感兴趣——可去挂牌等报价，或接受回收商一口价。'};
 renderSellNego();
}

function sellSubmitAsk(){
 const n=window._sellNego;if(!n)return;
 const A=Math.max(1,parseInt($('#sell-ask').value,10)||0);
 n.ask=A;n.round++;
 let agreed=0,finals=0,left=0;
 n.clubs.forEach(c=>{
 if(c.status!=='active')return;
 if(A<=c.max){c.bid=A;c.status='agreed';agreed++;}
 else if(A<=c.max*1.25){c.bid=c.max;c.status='final';finals++;}
 else{c.status='walked';left++;}
 });
 if(n.round>3){
 n.clubs.forEach(c=>{if(c.status==='active'){c.bid=c.max;c.status='final';}});
 n.msg=' 最后通牒：三轮报价结束，仍在谈的俱乐部给出了最终报价——接受或放弃。';
 }else if(agreed){
 n.msg=' '+agreed+' 家俱乐部接受你的要价，点「接受」即可成交！';
 }else if(finals){
 n.msg=' '+finals+' 家俱乐部给出了最终报价，再抬价他们就退出了'+(left?'，另有 '+left+' 家已离场':'')+'。';
 }else{
 n.msg=' 要价太高，俱乐部都在观望或离场……';
 }
 renderSellNego();
}
function sellAcceptClub(i){
 const n=window._sellNego;if(!n)return;
 const s=n.s;
 let team,fee;
 if(i<0){team='回收商';fee=n.lowball;}
 else{
 const c=n.clubs[i];
 if(!c||c.status==='walked'){toast('该俱乐部已退出谈判');return;}
 team=c.name;fee=c.bid;
 }
 const p=s.players.find(x=>x.id===n.pid);
 if(!p)return;
 const wasStarter=s.lineup.includes(p.id);
 completeSale(s,p,fee,team);
 if(wasStarter&&!s.players.some(x=>x.pos===p.pos))toast(' '+POS[p.pos][0]+'位置已无人，记得补签');
 window._sellNego=null;closeModal('app-modal');
 save();renderAll();toast(p.name+' 已售出（'+fee+'万）');
}
function sellQuit(){
 window._sellNego=null;closeModal('app-modal');toast('已停止出售，选手留队');
}

function completeSale(s,p,fee,team){
 fee=isFinite(fee)&&fee>0?Math.round(fee):0; // 残档/异常报价不得把 fund 加成 NaN
 recordTransfer(s,'out',p,fee,team,'转会出售'); // 年度回顾·转会台账
 s.fund+=fee;
 s.windowSold=(s.windowSold||0)+1; // 联盟备案：本转会期卖出计数（卖出≤名单一半守卫用）
 s.maxSale=Math.max(s.maxSale||0,fee); // 单笔出售纪录（成就「天价交易」）
 s.players=s.players.filter(x=>x.id!==p.id);
 if(s.lineup.includes(p.id))s.lineup=s.lineup.filter(x=>x!==p.id);
 if(s.pick)delete s.pick[p.pos];
 s.listed=(s.listed||[]).filter(x=>x.id!==p.id);
 s.bids=(s.bids||[]).filter(x=>x.id!==p.id);

 if(!defOf(s,p.id)){
 const a=p.attrs||{lane:70,farm:70,team:70,mind:70};
 (s.extraDefs=s.extraDefs||[]).push({
 id:p.id,name:p.name,pos:p.pos||'mid',team:p.team||null,tags:p.tags||[],
 base:[a.lane||70,a.farm||70,a.team||70,a.mind||70],skill:p.skill||{n:'—',t:'team',d:'—'},sig:p.sig,
 career:p.career||''});
 }
 const attached=aiAttachDef(s,p.id,team); // 买入方 AI 队在册（若为 def），下赛季起为他出战
 const tl=(s.transferList||[]).find(x=>x.id===p.id);
 if(tl){tl.ownerTeam=team;tl.untouchable=false;} // 转会市场条目同步归属新东家
 else if(!attached){

 const entry={...p,team:null,untouchable:false,freeAgent:true,willingness:Math.max(p.willingness||60,70)};
 entry.signCost=Math.max(30,Math.round(valueOf(overall(p))*0.6));
 delete entry.ownerTeam;
 (s.freeAgents=(s.freeAgents||[]).filter(x=>x.id!==p.id)).push(entry);
 logEvent(s,' '+p.name+' 未能即时入册 '+team+'，转入自由市场待签');
 }
 logEvent(s,' '+p.name+' 转会至 '+team+'（转会费 '+fee+'万）');
 if(fee>=TRANSFER_CAP)logEvent(s,' 重磅转会！顶星身价摸到联盟 1500 万封顶');
 else if(fee>=800)logEvent(s,' 重磅转会！联盟震动');
}

function listPlayer(s,pid){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('listPlayer',s))return;
 const p=s.players.find(x=>x.id===pid);
 if(!p)return;
 if(p.loan){toast('租借选手不属于俱乐部，不能挂牌');return;}
 if(p.loanOut){toast(p.name+' 正租借在外，归队后再挂牌');return;}
 if(p.kjia>0){toast(p.name+' 正在 K甲锻炼（剩余 '+p.kjia+' 天），归队后再挂牌');return;}
 if(typeof natCamping==='function'&&natCamping(s,p)){toast(p.name+' 正在国家队集训，不能挂牌');return;}
 if(s.lineup.includes(pid)){toast('请先将该选手移出首发');return;}
 if((s.listed||[]).some(x=>x.id===pid)){toast('该选手已在挂牌名单');return;}
 if(!sellGuard(s))return; // 联盟规则：一个转会期卖出不得超过队内一半
 const price=capFee(Math.round(valueOf(overall(p))*(p.willingness>=60?0.8:1.1))); // 成交价封顶 1500
 s.listed=[...(s.listed||[]),{id:pid,price}];
 toast(p.name+' 已挂牌（'+price+'万）'+(p.willingness>=60?'，本人愿意转会':'，本人不太愿意'));
 logEvent(s,' '+p.name+' 进入转会市场（挂牌 '+price+'万）');
 save();renderAll();
}
function delistPlayer(s,pid){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('delistPlayer',s))return;
 const p=s.players.find(x=>x.id===pid);
 const bids=(s.bids||[]).filter(x=>x.id===pid);
 if(bids.length&&!confirmDanger('撤掉 '+((p&&p.name)||'选手')+' 的挂牌？\n当前 '+bids.length+' 份报价将全部作废。'))return;
 s.listed=(s.listed||[]).filter(x=>x.id!==pid);
 s.bids=(s.bids||[]).filter(x=>x.id!==pid); // 有报价也可撤牌：撤牌即作废所有未接受报价
 logEvent(s,''+(p?p.name:'选手')+'撤牌，报价作废，选手留队');
 toast((p?p.name+' ':'')+'已撤牌（未成交报价一并作废）');
 save();renderAll();
}

function aiBidTick(s){
 try{if(typeof gameLog!=='undefined')gameLog.ai('aiBidTick',{listed:(s.listed||[]).length});}catch(e){}
 (s.listed||[]).forEach(item=>{
 if((s.bids||[]).some(b=>b.id===item.id))return;
 if(Math.random()<0.4){

 const pool=AI_TEAMS.filter(t=>t.name!==s.teamName);
 const elite=pool.filter(t=>aiTierOf(s,t.name)==='elite');
 const team=(elite.length&&Math.random()<0.6)?pick(elite):pick(pool);
 const p=s.players.find(x=>x.id===item.id);
 let bid=Math.min(TRANSFER_CAP,Math.round(item.price*(0.85+Math.random()*0.35))); // AI 报价同样受 1500 封顶
 if(p){const cap=sellCeiling(p);if(cap!=null)bid=Math.min(bid,cap);} // 挂牌报价同样受转售保护
 s.bids=[...(s.bids||[]),{id:item.id,team:team.name,bid}];
 if(p)toast(' '+team.name+' 对 '+p.name+' 报价 '+bid+'万！');
 }
 });

 if(Math.random()<0.15){
 const candidates=(s.transferList||[]).filter(p=>p.untouchable&&p.willingness<75);
 if(candidates.length){
 const p=pick(candidates);
 const buyer=pick(AI_TEAMS.filter(t=>t.name!==p.ownerTeam&&t.name!==s.teamName));
 const price=untouchablePrice(p);
 aiAttachDef(s,p.id,buyer.name);
 logEvent(s,' 重磅转会！'+p.name+' 以 '+price+'万 转会至 '+buyer.name+'（非卖品破例放行）');
 s.transferList=s.transferList.filter(x=>x.id!==p.id);
 }
 }

 if(Math.random()<0.35&&(s.freeAgents||[]).length){
 const map=aiRosterDefMap(s);

 const pool=s.freeAgents.slice().sort((a,b)=>overall(b)-overall(a));
 let fa=pool[0];
 const eliteTeams=Object.keys(map).filter(tn=>tn!==s.teamName&&aiTierOf(s,tn)==='elite');
 if(!eliteTeams.length||Math.random()<0.4)fa=pick(s.freeAgents); // 仍保留部分随机，避免豪门包场
 const faOvr=overall(fa);
 const buyers=[];
 Object.keys(map).forEach(tn=>{
 if(tn===s.teamName)return;
 if(typeof canSign==='function'){
  const chk=canSign(s,fa,{actor:'ai',team:tn,allowReplace:true});
  if(!chk.ok&&String(chk.reason||'').indexOf('已有')<0)return;
 }
 const cur=map[tn].map(id=>defOf(s,id)).filter(Boolean);
 const atPos=cur.find(d=>d.pos===fa.pos);
 if(!atPos){if(cur.length<5)buyers.push({tn,replace:null});}
 else if(faOvr-overall(genSeasonPlayer(s,atPos))>=3)buyers.push({tn,replace:atPos}); // 明显更强才动首发
 });
 const buyer=buyers.sort((a,b)=>(s.aiPower[a.tn]||400)-(s.aiPower[b.tn]||400))[0]; // 弱旅优先
 if(buyer){
  if(buyer.replace){

   ensureDef(s,buyer.replace);
   parkFreeAgent(s,buyer.replace,'被 '+buyer.tn+' 放弃');
  }
  const def=defOf(s,fa.id)||ensureDef(s,fa);
  if(def&&!s.retiredDefs.includes(def.id)&&!(s.extraDefs||[]).some(x=>x.id===def.id))s.extraDefs.push(def);
  const ok=aiAttachDef(s,fa.id,buyer.tn);
  if(ok){
   s.freeAgents=s.freeAgents.filter(x=>x.id!==fa.id);
   logEvent(s,' 转会动态：'+fa.name+'（'+POS[fa.pos][0]+'）以自由身加盟 '+buyer.tn+(buyer.replace?'，顶替 '+buyer.replace.name:''));
  }else{
   logEvent(s,' 转会动态：'+fa.name+' 与 '+buyer.tn+' 未能完成注册，留在自由市场');
  }
 }else{
  s.freeAgents=s.freeAgents.filter(x=>x.id!==fa.id);
  logEvent(s,' 转会动态：'+fa.name+' 被海外联赛球队签走，退出自由市场');
 }
}
}

const RENEW_YEARS=2;
function renewCost(p){
 const f=(p.val||100)>=125?1.25:(p.val||100)<90?0.75:1; // 表现火热更贵、低迷更便宜
 return Math.max(100,Math.round(sellAskPrice(p)*0.18*f));
}
function renewPlayer(s,pid,years,offerWage){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('renewPlayer',s))return;
 const p=s.players.find(x=>x.id===pid);
 if(!p||p.loan||(p.contract||0)>1){toast('该选手合同未到期');return;}
 const y=Math.min(4,Math.max(1,years||RENEW_YEARS));
 const cost=renewCostN(p,y);
 if(s.fund<cost){toast('资金不足（续约签字费 '+cost+'万）');return;}
 s.fund-=cost;
 const nw=offerWage?Math.round(offerWage):Math.round(wageOf(overall(p))*((p.val||100)/100)); // 报价成交按谈定年薪，否则按表现重定
 const wageFinal=Math.min(PLAYER_WAGE_MAX,Math.max(1,nw)); // 个人顶薪封顶
 if(wageFinal>p.wage)logEvent(s,' '+p.name+' 续约涨薪：'+p.wage+'万 → '+wageFinal+'万（表现好值得加薪）');
 else if(wageFinal<p.wage)logEvent(s,' '+p.name+' 接受降薪续约：'+p.wage+'万 → '+wageFinal+'万');
 p.wage=wageFinal;
 p.contract=y;
 p.morale=clamp(p.morale+6,20,100);
 p.willingness=Math.min(100,(p.willingness||50)+10);
 logEvent(s,' 与 '+p.name+' 完成续约（'+y+' 年 · 签字费 '+cost+'万 · 年薪 '+nw+'万）');
 s.expiring=(s.expiring||[]).filter(x=>x!==pid);
 save();renderAll();toast(p.name+' 续约 '+y+' 年！');
}

function renewAskWage(p,years){
 let w=wageOf(overall(p))*((p.val||100)/100);
 w*=1+0.09*((years||2)-1);
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age>=m.gold)w*=1.05;
 if((p.morale||50)<40)w*=1.05;
 return Math.min(PLAYER_WAGE_MAX,Math.max(5,Math.round(w/5)*5)); // 个人顶薪封顶
}
function renewCostN(p,years){return Math.max(50,Math.round(renewCost(p)*(0.55+0.45*((years||2)-1))));}

 $('#app-modal-body').innerHTML=`

 <button class="btn sm" onclick="renewNegoOffer(5)">+5</button>
 <button class="btn sm" onclick="renewNegoOffer(10)">+10</button>
 <span class="dim" style="font-size:12px">万</span>
 </div>

function submitRenewNego(){
 if(!_nego||!S)return;
 const p=S.players.find(x=>x.id===_nego.pid);
 if(!p){closeModal('app-modal');return;}
 const y=_nego.years,offer=_nego.offer,ask=_nego.ask,cost=renewCostN(p,y);
 if(S.fund<cost){toast('资金不足（签字费 '+cost+'万）');return;}
 const r=offer/ask;
 let prob=r>=1.2?0.98:r>=1.05?0.85:r>=0.95?0.55:r>=0.85?0.25:0.05;
 prob=clamp(prob+((p.morale||50)-50)/RENEW_MORALE_DIV,0.02,0.99);
 if(rnd(1,100)<=Math.round(prob*100)){
 renewPlayer(S,p.id,y,offer);
 _nego=null;
 closeModal('app-modal');
 return;
 }
 _nego.attempt++;
 if(_nego.attempt>=3){
 p.morale=clamp(p.morale-4,20,100);
 logEvent(S,' 与 '+p.name+' 的续约谈判破裂（三轮未谈拢，士气受损）');
 _nego=null;
 save();renderAll();closeModal('app-modal');
 toast('谈判破裂：'+p.name+' 坚持要价 '+ask+'万');
 return;
 }
 _nego.ask=Math.max(5,Math.round(_nego.ask*1.07/5)*5);
 _nego.offer=null;
 renderRenewNego();
 toast(p.name+' 的经纪人嫌低了，要价涨到 '+_nego.ask+'万');
}
function releasePlayer(s,pid){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('releasePlayer',s))return;
 const p=s.players.find(x=>x.id===pid);
 if(!p||p.contract>0){toast('该选手合同未到期');return;}
 if(p.loanOut){toast(p.name+' 正租借在外，归队后再操作');return;}
 if(typeof natCamping==='function'&&natCamping(s,p)){toast(p.name+' 正在国家队集训（缺席夏季赛），不能放走');return;}
 if(p.kjia>0){toast(p.name+' 正在 K甲锻炼（剩余 '+p.kjia+' 天），归队后再操作');return;}
 if(!confirmDanger('确定不续约并放走 '+p.name+'（总值 '+overall(p)+'）？\n选手将进入自由市场，其他队可直签。'))return;
 s.players=s.players.filter(x=>x.id!==pid);
 const li=s.lineup.indexOf(pid);if(li>=0)s.lineup.splice(li,1);
 if(s.pick)delete s.pick[p.pos];
 p.freeAgent=true;p.willingness=rnd(70,95);
 p.signCost=Math.round(valueOf(overall(p))*0.7);
 p.contract=1;
 s.freeAgents=[...(s.freeAgents||[]).filter(x=>x.id!==pid),p];
 s.expiring=(s.expiring||[]).filter(x=>x!==pid);
 recordTransfer(s,'out',p,0,'自由球员','合同到期不续约放走'); // 年度回顾·转会台账
 logEvent(s,' 未与 '+p.name+' 续约，进入自由市场（其他队可直签）');
 save();renderAll();toast(p.name+' 进入自由市场');
}
function endTransferWindow(s){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('endTransferWindow',s))return;

 (s.expiring||[]).slice().forEach(pid=>{
 const p=s.players.find(x=>x.id===pid);
 if(p&&!p.loan&&p.contract<=0){
  p.contract=1;
  logEvent(s,' '+p.name+' 合同自动续约 1 年（转会期未处理）');
 }
 });
 s.expiring=[];
 s.listed=[];
 s.bids=[];

 (s.transferList||[]).slice().forEach(p=>{
  if(!p||p.id==null)return;
  if(s.players.some(x=>x.id===p.id))return;
  const owned=Object.values(aiRosterDefMap(s)||{}).some(arr=>(arr||[]).indexOf(p.id)>=0);
  if(owned)return;
  if((s.freeAgents||[]).some(x=>x.id===p.id))return;
  parkFreeAgent(s,p,'转会窗关闭转入自由市场');
 });
 s.transferList=[];
}

function endPreseason(s){

 autoFillLineup(s);

 s.transferWindow=0;
 endTransferWindow(s);

function skipTransferWindow(s){
 const left=s.transferWindow||0;
 if(left<=0){toast('当前不在转会期');return;}
 if(!confirm('跳过剩余 '+left+' 天转会期？期间每天自动：\n· 训练一名核心选手（练最弱属性，13万/次）\n· 培养一名青训（潜力优先，17万/次）\n资金不足的天数自动跳过；AI 报价照常进行。'))return;
 autoFillLineup(s);
 const miss=POS_ORDER.filter(pos=>!s.players.some(p=>p.pos===pos));
 if(miss.length){toast(' '+miss.map(pos=>POS[pos][0]).join('、')+' 位置无人，无法开赛，请先签约选手');return;}
 let guard=0;
 s._quietSave=true; // 内部 nextDay 不再天天全量存档；结束/中断时统一 save 一次
 try{
 while(s.transferWindow>0&&guard++<30){
 if(!s.trained)autoDoTrain(s);
 if(!s.academyTrained)autoTrainRookie(s);
 const bidsBefore=(s.bids||[]).length;
 nextDay(s); // 内部处理 AI 报价 / 转会窗关闭自动开赛 / 发薪 / 随机事件

 if((s.bids||[]).length>bidsBefore){
 logEvent(s,' 转会期出现新报价，跳过流程暂停——请到转会市场处理（接受/拒绝/撤牌）');
 save();renderAll();
 toast(' 有 AI 报价！已暂停跳过，去转会市场谈判');
 goPage('market');
 return;
 }
 }
 }finally{
 s._quietSave=false;
 }
 logEvent(s,'跳过转会期剩余天数：已自动完成训练与青训培养，联赛正式开始');
 checkAchievements(s); // 跳过期结束强制扫（quiet 期间未走 save 巡检）
 save();renderAll();
 toast('转会期跳过完成，联赛开始！');
}
function autoDoTrain(s){
 if(s.fund<13)return;
 const p=s.players.filter(x=>!trainBlockedReason(s,x)&&x.energy>=10).sort((a,b)=>overall(b)-overall(a))[0];
 if(!p)return;
 const key=['lane','farm','team','mind'].sort((a,b)=>p.attrs[a]-p.attrs[b])[0]; // 练最弱属性
 doTrain(s,p.id,key);
}
function autoTrainRookie(s){
 if(s.fund<17)return;
 const r=(s.academy||[]).filter(x=>!rookieReady(x)).sort((a,b)=>(b.potential||0)-(a.potential||0))[0];
 if(!r)return;
 trainRookie(s,r.id);
}

const MARKET_REFRESH_COST=5;
function marketRefreshFree(s){return !!(s&&s.transferWindow>0&&!s.marketRefreshed);}
function refreshMarket(s,opts){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('refreshMarket',s))return;
 const seed=!!(opts&&opts.seed); // 开局播种货架：不是玩家主动刷的，不该吃掉他的当日免费额度
 const free=marketRefreshFree(s);
 if(!seed&&!free){
 if(s.fund<MARKET_REFRESH_COST){toast('资金不足（刷新需 '+MARKET_REFRESH_COST+' 万）');return;}
 s.fund-=MARKET_REFRESH_COST;
 }
 const usedNames=rookieUsedNames(s); // 全局查重：市场生成的选手不与联盟任何人重名
 s.market=[];
 for(let i=0;i<6;i++){
 const roll=Math.random();
 const band=s.transferWindow>0?(roll<0.2?'star':roll<0.6?'mid':'low'):(roll<0.1?'star':roll<0.5?'mid':'low'); // 转会窗内顶星供给增加
 const np=genPlayer(genFreeAgentDef(pick(POS_ORDER),band,usedNames));
 if(Math.random()<0.15)np.discount=0.8; // 特惠上架（15% 概率 8 折，对应市场页划线价/特惠标签）
 s.market.push(np);
 }
 if(!seed)s.marketRefreshed=true; // 播种不占用玩家的当日免费额度

 s.coachMarket=s.coachMarket||[];
 const coachSeen=new Set();
 if(s.coach)coachSeen.add(s.coach.id);
 let cGuard=0;
 while(s.coachMarket.length<3&&cGuard++<40){
 const c=pick(COACH_POOL);
 if(coachSeen.has(c.id))continue;
 coachSeen.add(c.id);s.coachMarket.push({...c});
 }
 s.coachMarket.sort((a,b)=>(b.rating||0)-(a.rating||0));
 if(seed){ // 开局播种在建队流程内部：此时 S 尚未落盘，不该 save/renderAll/toast
 return;
 }
 save();renderAll();
 toast(free?'转会窗内今日首刷：免费':'市场已刷新（-'+MARKET_REFRESH_COST+'万）');
}

function signCoach(s,c){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('signCoach',s))return;

 if(s.fund<c.cost){toast('资金不足（签约费 '+c.cost+'万）');return;}
 if(s.coach&&s.coach.id===c.id){toast('该教练已是你队主教练');return;}
 s.fund-=c.cost;
 s.coachMarket=(s.coachMarket||[]).filter(x=>x.id!==c.id); // 已执教教练移出市场

 else logEvent(s,' 签约主教练 '+c.name+'（'+(c.rating||80)+'评分·'+COACH_STYLE[c.style]+'型）');

}

const LOAN_DAYS=21;
const LOAN_CAP_BASE=2;
const LOAN_CAP_MAX=3;
function untouchableSet(){
 const U=new Set();
 for(const tn in AI_ROSTERS)AI_ROSTERS[tn].u.forEach(id=>U.add(id));
 return U;
}
function loanRent(p){return Math.max(80,Math.round(valueOf(overall(p))*0.15));}
function healthyPosCount(s,pos){ // 当前能打该位置的人（不含外租/K甲/伤停/未成年）
 return (s.players||[]).filter(p=>p.pos===pos&&matchEligible(s,p)).length; // matchEligible 已含外租/K甲/伤停/集训/未成年
}
function injuryGapPositions(s){ // 伤停/K甲后完全无人可打的位置——应急租借触发条件
 return POS_ORDER.filter(pos=>healthyPosCount(s,pos)===0);
}
function loanCap(s){
 const gap=injuryGapPositions(s).length;
 return Math.min(LOAN_CAP_MAX,LOAN_CAP_BASE+(gap>0?1:0));
}
function loanCandidates(s){
 const U=untouchableSet();

 const map=aiRosterDefMap(s);
 const need=new Set(injuryGapPositions(s));
 const out=[];
 const used=rookieUsedNames(s);
 for(const tn in map){
 if(tn===s.teamName)continue;
 const rosterDefs=(s.aiRosterDefs&&s.aiRosterDefs[tn])||map[tn]||[];
 const full=ensureAiRosters(s,tn)||[];
 const top5=new Set(full.slice().sort((a,b)=>overall(b)-overall(a)).slice(0,5).map(p=>p.id));
 full.forEach(p=>{
 if(U.has(p.id))return;
 if(top5.has(p.id))return; // 当前队内前五 = 主力
 if(rosterDefs.slice(0,5).includes(p.id))return;
 if(overall(p)>=80)return; // 高总值不外借（主力/准主力）
 used.add(p.name);
 out.push({p,from:tn,rent:loanRent(p)});
 });

 const benches=s.loanBenches=s.loanBenches||{};
 if(!benches[tn]||!benches[tn].length){
  benches[tn]=[];
  for(let i=0;i<2;i++){
   const p=genSeasonPlayer(s,genAcademyDef(POS_ORDER[i%5],used,s.season));
   used.add(p.name);

   p.id='loan_bench_'+tn+'_'+i+'_'+p.id;
   if(overall(p)>=75){
    ['lane','farm','team','mind'].forEach(k=>{p.attrs[k]=Math.max(50,(p.attrs[k]||70)-8);});
   }
   benches[tn].push(p);
  }
 }
 (benches[tn]||[]).forEach(p=>{
  if(!p||p.id==null)return;
  if(overall(p)>=80)return;
  out.push({p,from:tn,rent:loanRent(p)});
 });
 }
 return out.sort((a,b)=>{
 const an=need.has(a.p.pos)?1:0,bn=need.has(b.p.pos)?1:0;
 if(an!==bn)return bn-an;
 return overall(b.p)-overall(a.p);
 });
}
function loanPlayer(s,teamName,pid){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('loanIn',s))return;
 const cap=loanCap(s);
 if((s.players||[]).filter(p=>p.loan).length>=cap){
 toast('租借名额已满（当前上限 '+cap+' 人'+(cap>LOAN_CAP_BASE?' · 含伤停应急名额':'')+'）');
 return;
 }
 let p=(ensureAiRosters(s,teamName)||[]).find(x=>x.id===pid);
 if(!p&&s.loanBenches&&s.loanBenches[teamName])p=s.loanBenches[teamName].find(x=>x.id===pid);

 if(!p&&String(pid).indexOf('loan_bench_')===0){
  p=(loanCandidates(s)||[]).find(x=>x.p.id===pid);
  if(p)p=p.p;
 }
 if(!p){toast('该选手不在租借名单');return;}
 if(untouchableSet().has(p.id)){toast(p.name+' 是非卖品，不外借');return;}

 const starters=new Set();
 for(const tn in AI_ROSTERS)(AI_ROSTERS[tn].p||[]).forEach(id=>starters.add(id));
 const rosterDefs=(s.aiRosterDefs&&s.aiRosterDefs[teamName])||[];
 const fullRoster=ensureAiRosters(s,teamName)||[];
 const top5=new Set(fullRoster.slice().sort((a,b)=>overall(b)-overall(a)).slice(0,5).map(x=>x.id));
 if(starters.has(p.id)||rosterDefs.slice(0,5).includes(p.id)||top5.has(p.id)||overall(p)>=80){
 toast(p.name+' 是 '+teamName+' 主力/核心，俱乐部不放人——只能租替补');
 return;
 }
 if(String(p.id).indexOf('loan_')===0&&overall(p)>=80){
 toast(p.name+' 级别过高，'+teamName+' 不会放人');
 return;
 }
 const rent=loanRent(p);
 if(s.fund<rent){toast('资金不足（租金 '+rent+'万）');return;}

 if(s.players.some(x=>x.id===p.id))return;
 s.fund-=rent;
 p.loan={from:teamName,days:LOAN_DAYS};
 s.players.push(p);
 if(s.loanBenches&&s.loanBenches[teamName]){
  s.loanBenches[teamName]=s.loanBenches[teamName].filter(x=>x.id!==p.id);
 }
 aiDetachDef(s,p.id); // 原队除名（真实 def）：租借期内原队青训递补
 s.aiRosters={}; // 名册缓存失效
 const gap=injuryGapPositions(s).includes(p.pos);
 logEvent(s,' 租借达成：'+p.name+'（'+POS[p.pos][0]+' · 总值'+overall(p)+'）从 '+teamName+' 租借 '+LOAN_DAYS+' 天，租金 '+rent+'万'+(gap?'——应急补位':''));
 save();renderAll();toast(p.name+' 租借加盟！'+LOAN_DAYS+' 天后自动归队');
}
function tickLoans(s){
 (s.players||[]).slice().forEach(p=>{
 if(!p.loan)return;
 p.loan.days--;
 if(p.loan.days<=0){
 const from=p.loan.from;
 s.players=s.players.filter(x=>x.id!==p.id);
 const li=s.lineup.indexOf(p.id);
 if(li>=0)s.lineup.splice(li,1);
 if(s.pick)delete s.pick[p.pos];

 ensureDef(s,p);
 const back=aiAttachDef(s,p.id,from);
 if(back){
  logEvent(s,' 租借到期：'+p.name+' 返回 '+from);
 }else{
  parkFreeAgent(s,p,'租借到期未能回 '+from+'，转入自由市场');
 }
 s.aiRosters={};
 }
 });
}

const OFFER_TTL=3; // 报价有效期（天）
function eligibleForOffer(s,p){
 if(!p)return false;
 const st=playerStatus(p,s);
 if(st.loan||st.loanOut||st.kjia)return false;
 if(typeof natCamping==='function'&&natCamping(s,p))return false; // 国家队集训缺席，不接 offer
 if((p.val||100)<112)return false; // 表现门槛：打出名堂（火热≥112%）
 return true;
}
function inSeasonOfferTick(s){
 if(s.transferWindow>0)return; // 转会期走挂牌竞价，不重复
 s.offers=s.offers||[];
 const before=s.offers.length;
 s.offers=s.offers.filter(o=>o.expire>s.day);
 if(s.offers.length<before)logEvent(s,' 有俱乐部的赛中报价到期无人答复，买家转向了其他目标');
 if(s.offers.length>=2)return; // 同时最多挂 2 份，避免刷屏
 const onlyMe=(s.mode==='player')?(s.career&&s.career.me):null; // 选手模式：只盯我自己的表现
 (s.players||[]).forEach(p=>{
 if(s.offers.length>=2)return;
 if(onlyMe&&p.id!==onlyMe)return;
 if(s.offers.some(o=>o.pid===p.id))return;
 if(!eligibleForOffer(s,p))return;
 if((p._offerCd||0)>s.day)return;

 const heat=(p.val||100)-100;
 if(Math.random()>=clamp(0.015+heat*0.0012,0.015,0.06))return;
 const fee=capFee(buyoutPrice(p)*(0.95+Math.random()*0.4)); // 95%~135% 身价（联盟 1500 封顶）

 const pool=AI_TEAMS.filter(t=>t.name!==s.teamName);
 const buyer=pick(pool.slice(0,Math.max(6,Math.round(pool.length*(overall(p)>=88?0.5:1)))));
 s.offers.push({pid:p.id,name:p.name,team:buyer.name,fee,expire:s.day+OFFER_TTL,status:'open'});
 p._offerCd=s.day+20; // 同一选手 20 天内不再被报价
 logEvent(s,' 赛中报价：'+buyer.name+' 开价 '+fee+'万 买断 '+p.name+'（表现引起联盟关注，俱乐部页 '+OFFER_TTL+' 天内答复）');
 });
}

function sellViaOffer(s,p,fee,team){
 const pop=p.popularity||0;
 const wasStarter=s.lineup.includes(p.id);
 completeSale(s,p,fee,team);
 const fanHit=clamp(Math.round(pop/12),1,5);
 addFans(s,-fanHit,team+' 挖走 '+p.name);
 s.players.forEach(x=>x.morale=clamp(x.morale-4,20,100));
 if(wasStarter)logEvent(s,' '+POS[p.pos][0]+'位置出现空缺——转会市场签人 / 训练页提拔青训，二选一');
 return fanHit;
}
function respondOffer(s,idx,action){
 s.offers=s.offers||[];
 const o=s.offers[idx];
 if(!o)return;
 if(s.mode==='player'){ // 选手生涯：只有自己的报价可回应——留队=涨薪续约，接受=赛段间转会
 if(o.pid!==(s.career&&s.career.me)){toast('那是队友的报价，经纪人不是你');return;}
 const p=s.players.find(x=>x.id===o.pid);
 if(!p){s.offers.splice(idx,1);save();renderAll();return;}
 if(action==='keep'){
 const raise=Math.max(2,Math.round(p.wage*0.08));
 p.wage=Math.min(PLAYER_WAGE_MAX,p.wage+raise); // 个人顶薪封顶
 p.morale=clamp(p.morale+5,20,100);
 p.willingness=clamp((p.willingness==null?70:p.willingness)+5,0,100);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 留队：回绝 '+o.team+'，俱乐部给 '+p.name+' 涨薪至 '+p.wage+'万（士气+5 · 忠诚+5）');
 toast(p.name+' 留队！年薪 +'+raise+'万');
 }else if(action==='sell'){
 s.career.pendingMove={team:o.team,fee:o.fee};
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 转会达成意向：你接受 '+o.team+' 的报价（'+o.fee+'万）——当前赛段继续为 '+s.teamName+' 出战，赛段结束正式加盟');
 toast(' 转会意向达成：赛段结束后加盟 '+o.team);

 return;
 }

 if(!p){s.offers.splice(idx,1);save();renderAll();return;}
 if(action==='keep'){ // 留人：回绝报价 + 涨薪表达诚意

 p.wage=Math.min(PLAYER_WAGE_MAX,p.wage+raise); // 个人顶薪封顶

 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 留人：回绝 '+o.team+' 的报价，给 '+p.name+' 涨薪至 '+p.wage+'万（士气+5 · 忠诚+5）——工资帽压力自负');
 toast(p.name+' 留队！年薪 +'+raise+'万');
 }else if(action==='sell'){ // 放人：接受报价
 const fanHit=sellViaOffer(s,p,o.fee,o.team);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 toast(p.name+' 已转会 '+o.team+'（+'+o.fee+'万 · 粉丝-'+fanHit+'万）');
 }else if(action==='counter'){ // 抬价：+20~35% 反报价 → 成交 / 最终报价 / 离场
 if(o.status==='final'){toast('对方已给出最终报价：接受成交或留人');return;}
 const ask=Math.round(o.fee*(1.2+Math.random()*0.15));
 const roll=Math.random();
 if(roll<0.55){

 sellViaOffer(s,p,ask,o.team);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 toast(p.name+' 加价转会 '+o.team+'（+'+ask+'万）');
 }else if(roll<0.85){
 o.status='final';o.fee=ask;
 logEvent(s,' '+o.team+' 给出最终报价 '+ask+'万：接受成交或留人，不再抬价');
 }else{
 s.offers=s.offers.filter(x=>x.pid!==o.pid);
 p.morale=clamp(p.morale-4,20,100);
 logEvent(s,' '+o.team+' 觉得被抬价羞辱，退出谈判——'+p.name+' 留队但情绪受影响（士气-4）');
 }
 }
 save();renderAll();
}

 [s.players,s.academy].forEach(l=>(l||[]).forEach(p=>p&&p.name&&used.add(p.name)));
 ['market','transferList','freeAgents'].forEach(k=>(s[k]||[]).forEach(p=>p&&p.name&&used.add(p.name)));

  else if(x.id!=null){const d=(typeof defOf==='function')?defOf(s,x.id):null;if(d&&d.name)used.add(d.name);}
 };
 ['aiRosterDefs','aiAcademy','challDefMap','ewcDefMap'].forEach(k=>{
  Object.values(s[k]||{}).forEach(arr=>(arr||[]).forEach(addRef));
 });
 Object.values(s.loanBenches||{}).forEach(arr=>(arr||[]).forEach(addRef));

 if(typeof PLAYER_POOL!=='undefined')PLAYER_POOL.forEach(d=>d&&d.name&&used.add(d.name));
 if(typeof FA_2026!=='undefined')FA_2026.forEach(d=>d&&d.name&&used.add(d.name));

 if(!used.has(n)){used.add(n);return n;}
 }
 return combName(used); // 兜底改为确定性扫描，保证不重名（旧版随机三字仍可能撞名）
}

 _rkSeq++;
 const pos=pick(POS_ORDER);
 const potential=rnd(2,5);

 ['lane','farm','team','mind'].forEach(k=>{attrs[k]=clamp(rnd(42,58)+(potential>=4?rnd(0,5):0),40,70);});
 const mainPool=HEROES.filter(h=>h.pos[0]===pos).map(h=>h.n);
 const sig=pick(mainPool);

 const cand=[...new Set(mainPool)].filter(h=>h!==sig);
 for(let i=0;i<3&&cand.length;i++){heroPool.push({n:cand.splice(Math.floor(Math.random()*cand.length),1)[0],lv:1});}
 const name=s?genRookieName(s):(pick(ROOKIE_NAMES)+'·'+_rkSeq);
 return {id:'rk'+_rkSeq,name,pos,team:null,tags:['青训'],

 sig,heroPool,career:' 青训出品 · 未来之星',wage:rnd(2,4),energy:ENERGY_MAX,morale:rnd(70,90),injury:0,
 mvp:0,retiring:false,age:rnd(16,17),popularity:rnd(3,8),willingness:rnd(60,90),potential,isRookie:true,contract:2};

 r.attrs[key]=clamp(r.attrs[key]+gain,40,95);

function trainAllRookies(s){
 if(s.academyTrained){toast('今日已培养过青训');return;}

 if(!all.length){toast('青训营还没有人，先招募一名新秀');return;}

 list.sort((a,b)=>(b.potential||0)-(a.potential||0));
 let done=0,spent=0,short=0;

 for(const r of list){
  if(s.fund<ROOKIE_TRAIN_COST){short++;continue;}
  s.fund-=ROOKIE_TRAIN_COST;spent+=ROOKIE_TRAIN_COST;
  const t=applyRookieTrain(r);

 }

 s.academyTrained=true;

 logEvent(s,' 青训一键培养 '+done+' 人（共 '+spent+'万）：'+parts.join(' · ')+(short?'；'+short+' 人资金不足跳过':''));
 save();renderAll();
 toast('青训培养完成：'+done+' 人 / 共 '+spent+'万'+(short?'（'+short+' 人资金不足跳过）':''));

function convertPos(s,pid,newPos){

 const p=s.players.find(x=>x.id===pid);

 p.pos=newPos;

 p.sig=pick(HEROES.filter(h=>h.pos[0]===newPos)).n; // 招牌不通用则重立
 }
 const newPool=[{n:p.sig,lv:3}];
 const add=(n,lv)=>{if(!newPool.some(x=>x.n===n))newPool.push({n,lv});};
 HEROES.filter(h=>h.pos.includes(newPos)&&h.n!==p.sig).forEach(h=>add(h.n,oldPool.has(h.n)?oldPool.get(h.n):2));
 p.heroPool=newPool;
 logEvent(s,' '+p.name+' 位置改造：'+POS[oldPos][0]+' → '+POS[newPos][0]+'（'+cost+'万）');
 save();renderAll();toast(p.name+' 已转型 '+POS[newPos][0]);
}

const ANNUAL_PTS={spring:{p1:100,p2:80,p34:60,p56:40,p78:20,p910:10,p1112:5,p1318:0},
 summer:{p1:120,p2:100,p34:80,p56:50,p78:30,p910:20,p1112:10,p1318:0}};

function logLevel(txt){
 if(/成就解锁|冠军|王朝|捧杯|FMVP|名人堂|亚运/.test(txt))return 'gold';

 if(/惜败|落败|战败|不敌|淘汰|无缘|拖欠工资|负 /.test(txt))return 'lose';
 if(/胜 |击败|获胜|晋级/.test(txt))return 'win'; // 不写"卡位"：赛制说明里的"卡位赛"会被误染成胜绩色
 if(/赞助|奖金|分润|收入|涨薪|代言|曝光|返还|找回/.test(txt))return 'gold';

const LOG_CATS=[
 {k:'honor',n:'荣誉成就',re:/总冠军|夺冠|捧杯|FMVP|王朝|名人堂|成就解锁|亚运|征召|荣耀|卫冕/},

];
function logCat(txt){

 if(/赛制|版本更新|经济体系升级/.test(t))return 'other'; // 说明性文案：既不是比赛也不是账目
 for(const c of LOG_CATS){if(c.re.test(t))return c.k;}
 return 'other';
}
function logEvent(s,txt){(s.eventLog=s.eventLog||[]).unshift({txt,t:Date.now(),level:logLevel(txt),cat:logCat(txt)});s.eventLog=s.eventLog.slice(0,200);} // 200：newSeason 的 AI 转会/青训日志很多，120 会把王朝反制等玩家向文案挤掉
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function powerOf(s,name){
 if(name===s.teamName)return teamPower(s);
 ensureAiRosters(s,name); // 懒建真实阵容并写入 aiPower（与玩家同刻度）
 return s.aiPower[name]||450;
}
function phaseGroups(s){
 if(s.phase==='r1')return ['G1','G2','G3'];
 if(s.phase==='r2')return ['S','A','B'];
 if(s.phase==='r3')return ['S','A'];
 return [];
}
function myGroup(s){
 if(!s||!s.groups)return null; // 读档残缺/迁移中途：不能在渲染里炸成整页空白
 for(const g of phaseGroups(s)){if(s.groups[g]&&s.groups[g].includes(s.teamName))return g;}
 return null;
}
function sortGroup(s,g){
 const table=s.tables[g]||{};
 return (s.groups[g]||[]).slice().sort((a,b)=>{
 const ta=table[a]||{pts:0,pw:0},tb=table[b]||{pts:0,pw:0};
 if(ta.pts!==tb.pts)return tb.pts-ta.pts;
 return tb.pw-ta.pw;
 });
}

function initGroups(s){

 let aiList=AI_TEAMS.filter(t=>t.name!==s.teamName);

 if(aiList.length>17)aiList=aiList.filter(t=>t.name!=='常山UUG');

 const all=aiList.map(t=>{
 const r=ensureAiRosters(s,t.name);
 return {name:t.name,power:r.length?aiRosterPower(r,s,t.name):t.power};
 });
 all.push({name:s.teamName,power:s.seedPower||teamPower(s)}); // 玩家种子=开局真实战力
 all.sort((a,b)=>b.power-a.power);
 s.leagueTeams=all.map(x=>x.name); // 联盟 18 队注册名录（联盟页/榜单用）
 const g1=all.slice(0,6).map(x=>x.name);
 const g2=all.slice(6,12).map(x=>x.name);
 const g3=all.slice(12,18).map(x=>x.name);
 s.groups={G1:g1,G2:g2,G3:g3};
 setPhase(s,'r1',{who:'initGroups',force:true});
 s.aiPower={};
 aiList.forEach(t=>{
 const r=s.aiRosters[t.name];
 s.aiPower[t.name]=r&&r.length?aiRosterPower(r,s,t.name):t.power;
 });
 initTables(s);
 genRoundSchedule(s);
 s.card=null;s.playoff=null;s.eliminated=[];
}
function initTables(s){
 s.tables={};
 phaseGroups(s).forEach(g=>{
 s.tables[g]={};
 s.groups[g].forEach(n=>{s.tables[g][n]={w:0,l:0,pts:0,pw:0};});
 });
}

function genRoundSchedule(s){
 const g=myGroup(s);
 const opps=(s.groups[g]||[]).filter(n=>n!==s.teamName);
 shuffle(opps);

 s.schedule=opps.map((op,i)=>({round:i+1,opp:op,result:null,myScore:0,opScore:0,mid:'reg_'+(s.phase||'r1')+'_'+(i+1)}));
 s.matchIdx=0;
 try{(s.schedule||[]).forEach(m=>{if(m.mid)tagMatch(s,m,m.mid);});}catch(e){}
 buildGroupSchedule(s);
}

function buildGroupSchedule(s){
 s.aiSchedule={};
 phaseGroups(s).forEach(g=>{
 const teams=(s.groups[g]||[]).slice();

 const n=teams.length,rounds=[];
 const arr=teams.slice(1);
 for(let r=0;r<n-1;r++){
 const pairs=[];
 const ring=[teams[0],...arr];
 for(let i=0;i<n/2;i++){
 const a=ring[i],b=ring[n-1-i];
 if(a&&b)pairs.push([a,b]);
 }
 rounds.push(pairs);
 arr.unshift(arr.pop());
 }
 s.aiSchedule[g]=[];
 rounds.forEach((pairs,ri)=>{
 pairs.forEach(([a,b])=>{
 if(a===s.teamName||b===s.teamName)return; // 玩家场次不模拟
 s.aiSchedule[g].push({round:ri+1,a,b,r:null});
 });
 });
 });
}

function simulateAiRound(s,upToRound){
 if(!s.aiSchedule||!phaseGroups(s).some(g=>s.aiSchedule[g]))buildGroupSchedule(s); // 老存档懒构建
 const reports=[];
 phaseGroups(s).forEach(g=>{
 (s.aiSchedule[g]||[]).forEach(m=>{
 if(m.round>upToRound||m.r)return;
 const r=simSeriesResult(s,m.a,m.b,KPL.BO5);
 m.r={w:r.win?m.a:m.b,mw:r.mw,ow:r.ow};
 const ta=(s.tables[g]||{})[m.a],tb=(s.tables[g]||{})[m.b];
 if(!ta||!tb)return;
 if(r.win){ta.w++;ta.pts++;tb.l++;}
 else{tb.w++;tb.pts++;ta.l++;}
 ta.pw+=r.mw;tb.pw+=r.ow;
 if(m.round===upToRound)reports.push(g+'组：'+m.a+' '+r.mw+':'+r.ow+' '+m.b);
 });
 });
 if(reports.length)logEvent(s,' 联赛战报（第'+upToRound+'轮）：'+reports.slice(0,6).join('；'));
}

function simSeriesResult(s,a,b,bo){
 let mw=0,ow=0;
 const need=Math.ceil(bo/2);
 const aEff=powerOf(s,a)*(1+dynastyStreak(s,b)*0.02); // 王朝反制①：对方连冠 → 我方研究加成
 const bEff=powerOf(s,b)*(1+dynastyStreak(s,a)*0.02);
 for(let i=1;i<=bo&&mw<need&&ow<need;i++){

 const w=(typeof singleGame==='function')?singleGame(aEff,bEff).w:(Math.random()<winChance(aEff,bEff));
 if(w)mw++;else ow++;
 }
 return {win:mw>ow,mw,ow};
}

function advancePhase(s){
 simulateAiRound(s,99); // 兜底补完本阶段未模拟的 AI 场次
 if(s.phase==='r1'){
 const sTeams=[],aTeams=[],bTeams=[];
 ['G1','G2','G3'].forEach(grp=>{

 sTeams.push(rank[0],rank[1]);
 aTeams.push(rank[2],rank[3]);
 bTeams.push(rank[4],rank[5]);
 });
 s.groups={S:sTeams,A:aTeams,B:bTeams};
 setPhase(s,'r2',{who:'advancePhase'});
 initTables(s);
 genRoundSchedule(s);
 const g=myGroup(s);
 logEvent(s,' 第一轮结束！'+s.teamName+' 进入'+(g==='S'?'S组':g==='A'?'A组':'B组')+'（第二轮）');
 }else if(s.phase==='r2'){
 setPhase(s,'card',{who:'advancePhase'});

 }else if(s.phase==='r3'){

 }

}

 }
 tagMatch(s,m,'card_'+s.card.idx);

 s.series={used:[],usedOpp:[],mw:0,ow:0,max:KPL.CARD,stage:'card',mid:'card_'+s.card.idx,cardIdx:s.card.idx,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'card',opName)};s.seriesAuto=false;
 resetOppEnergy(s,opName);
 showPreMatch('卡位赛（BO5·含巅峰对决）vs '+opName+' · 第1局');
 }else{
 const r=simSeriesResult(s,m.a,m.b,KPL.CARD);
 m.r=r.win?m.a:m.b;
 logEvent(s,' 卡位赛：'+m.a+' vs '+m.b+'，'+m.r+' 晋级');

function finishCard(s){
 const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
 const sNew=[sRank[0],sRank[1],sRank[2],sRank[3]];
 const aNew=[aRank[2],aRank[3]];
 (s.card.matches||[]).forEach(m=>{
 if(!m.r){const r=simSeriesResult(s,m.a,m.b,KPL.CARD);m.r=r.win?m.a:m.b;}
 if(m.winTo==='S'){sNew.push(m.r);aNew.push(m.r===m.a?m.b:m.a);}
 else aNew.push(m.r);
 });
 s.cardLosers=(s.card.matches||[]).map(m=>m.r===m.a?m.b:m.a); // 卡位赛败者：年度积分按 11-12 名档计
 s.groups={S:sNew,A:aNew};
 const alive=new Set([...sNew,...aNew]);
 s.eliminated=AI_TEAMS.map(t=>t.name).filter(n=>!alive.has(n));
 if(!alive.has(s.teamName)){

 setPhase(s,'r3',{who:'finishCard',force:true});
