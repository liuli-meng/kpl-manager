function nextDay(s){
  s.day++;s.trained=false;s.marketRefreshed=false;s.academyTrained=false;
  s.fund+=SPONSORS[s.sponsorLv].income; // 赞助商每日结算
  if(s.hosts&&s.hosts.length)s.fund+=s.hosts.reduce((t,h)=>t+h.income,0); // 退役主播人气收入
  if(s.transferWindow>0){
    s.transferWindow--;
    aiBidTick(s); // AI 队对挂牌选手报价
    if(s.transferWindow===0){
      endTransferWindow(s);
      if(s.preseason){
        s.preseason=false;
        logEvent(s,'📋 赛前转会期结束（天数用完），联赛正式开始！');
      }else{
        logEvent(s,'📉 转会窗关闭，未成交的挂牌选手自动撤牌');
      }
    }
  }
  if(s.day%WAGE_EVERY===0)payWage(s);
  s.players.forEach(p=>{p.injury=Math.max(0,p.injury-1);p.energy=clamp(p.energy+10,0,ENERGY_MAX);}); // 伤情恢复 + 体力自然回复
  if(s.day%3===0){s.fund+=8;toast('签到奖励：赞助补贴 +8万');}
  if(Math.random()<0.65&&s.players.length){ // 名单被卖空时跳过随机事件（事件需要选手参与）
    const ev=pick(EVENTS);
    const txt=ev.desc.replace('{p}',()=>pick(rosterAll(s)).name);
    ev.fn(s);
    logEvent(s,'🎲 【'+ev.t+'】'+txt);
  }
  save();
}
function payWage(s){
  const wage=weeklyWage(s);
  // 选手代言收入：人气 × 0.3万/周（商业价值对冲工资帽压力）
  const endorse=Math.round(s.players.reduce((t,p)=>t+((p.popularity||0)*0.3),0));
  s.fund-=wage;
  s.fund+=endorse;
  let tax=0;
  if(wage>s.wageCap){
    // KPL 工资帽：超帽部分缴纳 60% 奢侈税
    tax=Math.round((wage-s.wageCap)*0.6);
    s.fund-=tax;
    logEvent(s,'💸 周薪 '+wage+'万（工资帽 '+s.wageCap+'万，超帽缴纳奢侈税 '+tax+'万）');
  }else{
    logEvent(s,'💸 发放周薪 '+wage+'万（工资帽内 '+s.wageCap+'万）');
  }
  if(endorse>0)logEvent(s,'📣 选手代言收入 '+endorse+'万（人气变现）');
  if(s.fund<0){
    s.fund=Math.max(0,s.fund);
    s.players.forEach(p=>p.morale=clamp(p.morale-15,20,100));
    logEvent(s,'⚠️ 资金不足！拖欠工资导致全员士气大降');
  }else{
    s.players.forEach(p=>p.morale=clamp(p.morale+3,20,100));
  }
}
/* ================= 王朝反制（连冠≥2 触发） =================
   现实中反制王朝的三板斧：对手研究录像（BP 吃亏）、版本针对体系、联盟财政条款。
   ①对阵连冠队伍，研究方有效战力 +2%/连冠季（上限+6%，AI 互赛同规则）
   ②连冠队伍工资帽成长减半 ③新赛季版本针对：核心选手属性/士气/状态受挫 */
function dynastyStreak(s,teamName){
  const hist=(s.titleHistory||[]).slice().sort((a,b)=>b.season-a.season);
  let streak=0,expect=s.season-1; // 当前赛季进行中，从上个已完赛赛季往回数
  for(const h of hist){
    if(h.season!==expect||h.champ!==teamName)break;
    streak++;expect--;
  }
  return Math.min(streak,3);
}
/* ================= 赛季最佳阵容（一阵/二阵） =================
   按位置评选：评分=招牌战力×状态系数（表现火热的选手可越级入选）；
   新赛季开启时入册 s.awards（历届），联盟页实时展示当期评选 */
function allStarScore(p){return playerPower(p,p.sig)*((p.val||100)/100);}
function allStarTeams(s){
  const pool=s.players.map(p=>({p,team:s.teamName}));
  (s.leagueTeams||[]).forEach(n=>{
    if(n===s.teamName)return;
    (ensureAiRosters(s,n)||[]).forEach(p=>pool.push({p,team:n}));
  });
  const t1=[],t2=[];
  POS_ORDER.forEach(pos=>{
    const two=pool.filter(x=>x.p.pos===pos).sort((a,b)=>allStarScore(b.p)-allStarScore(a.p)).slice(0,2);
    if(two[0])t1.push({p:two[0].p,team:two[0].team});
    if(two[1])t2.push({p:two[1].p,team:two[1].team});
  });
  return {t1,t2};
}
/* 赛季收官：最佳阵容入册 + 公告（newSeason 顶部调用，用刚结束赛季的阵容快照） */
function recordSeasonAwards(s){
  s.awards=s.awards||[];
  if(s.awards.some(a=>a.season===s.season))return;
  const {t1,t2}=allStarTeams(s);
  s.awards.unshift({season:s.season,
    first:t1.map(x=>({pos:x.p.pos,name:x.p.name,team:x.team,ovr:overall(x.p)})),
    second:t2.map(x=>({pos:x.p.pos,name:x.p.name,team:x.team,ovr:overall(x.p)}))});
  s.awards=s.awards.slice(0,10);
  logEvent(s,'🏆 KPL 赛季最佳阵容揭晓：一阵——'+t1.map(x=>POS[x.p.pos][1]+' '+x.p.name+'（'+x.team+'）').join('、'));
  logEvent(s,'🥈 二阵——'+t2.map(x=>POS[x.p.pos][1]+' '+x.p.name+'（'+x.team+'）').join('、'));
}
function newSeason(s){
  recordSeasonAwards(s); // 上赛季最佳阵容入册（趁阵容还没跨季老化）
  s.season++;s.day=1;s.trained=false;s.marketRefreshed=false;
  s.pick={}; // 清掉上赛季末的英雄选择残留（BP 确认后才会重新写入）
  s.academyTrained=false;
  // 年龄增长：黄金期属性成长，下滑期按位置衰减，达到位置退役年龄离队
  const retired=[];
  s.players.forEach(p=>{
    p.age=(p.age||0)+1;
    const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
    const key=pick(['lane','farm','team','mind']);
    if(p.age<=m.gold){
      // 黄金期（19-22 反应手速巅峰）：随机属性+1
      p.attrs[key]=clamp(p.attrs[key]+1,55,99);
    }else if(p.age<m.retire){
      // 下滑期：按位置衰减（野射下滑快，辅助缓）
      p.attrs[key]=clamp(p.attrs[key]-rnd(1,m.decay),40,99);
    }
    if(p.age>=m.retire)retired.push(p);
    else p.retiring=p.age>=m.retire-1;
    p.energy=ENERGY_MAX;p.morale=clamp(p.morale+15,20,100);p.injury=0;
  });
  // 青训新秀同步长一岁：满 18 岁才有晋升一线队资格（KPL 注册规则）
  (s.academy||[]).forEach(r=>{r.age=(r.age||16)+1;});
  retired.forEach(p=>{
    s.players=s.players.filter(x=>x.id!==p.id);
    const li=s.lineup.indexOf(p.id);
    if(li>=0){s.lineup.splice(li,1);if(s.pick)delete s.pick[p.pos];}
    // 退役去向：转教练（按实力给战力加成）或 转型主播（俱乐部人气收入）
    retireToCoach(s,p);
  });
  s.fund+=130;
  // 王朝反制②：连冠队伍工资帽成长减半（保住豪华阵容越来越难）
  const st=dynastyStreak(s,s.teamName);
  s.wageCap=(s.wageCap||90)+(st>=2?7:15); // KPL 联盟每赛季调整工资帽
  // 王朝反制③：版本针对——力度随连冠次数加码
  if(st>=2){
    logEvent(s,'⚖️ 联盟公平条款：'+s.teamName+' 已'+st+'连冠，新赛季工资帽成长减半（+'+(st>=2?7:15)+'万）');
    const core=s.players.slice().sort((a,b)=>overall(b)-overall(a))[0];
    if(core){
      const key=pick(['lane','farm','team','mind']);
      core.attrs[key]=clamp(core.attrs[key]-st,40,99);
      core.morale=clamp(core.morale-5*st,20,100);
      core.val=clamp((core.val||100)-10,70,150);
      logEvent(s,'📌 版本针对：全联盟都在研究你——新版本削弱了核心 '+core.name+' 的招牌体系（属性-'+st+' · 士气-'+5*st+'%点 · 状态-10%）');
    }
  }
  s.transferWindow=7; // 赛前转会期 7 天：自由组队，结束/到期后联赛才开打
  s.preseason=true;
  s.streak=0;
  aiTransferWindow(s); // AI 转会期：退役结算/缺位补强/明星流转/新星出道（联盟生态推进）
  buildTransferMarket(s); // 构建转会市场（AI 队选手 + 非卖品）
  s.aiRosters={}; // 对手阵容每赛季重建（年龄成长）
  logEvent(s,'📈 联盟调整工资帽：本周薪上限 '+s.wageCap+'万');
  logEvent(s,'📋 赛前转会期开启（7天）：可买断/挂牌/直签选手与教练，市场刷新免费；结束转会期后联赛开打');
  s.stage='regular';
  initGroups(s);
  logEvent(s,'🚀 赛季 '+s.season+' 开始！18队 S/A/B 赛制，目标：总冠军！');
  save();renderAll();
}
/* 选手退役去向：转教练（战力加成）或转型主播（人气收入），进入"退役名宿"市场 */
function retireToCoach(s,p){
  s.retiredCoaches=s.retiredCoaches||[];
  const isStar=p.mvp>=1||overall(p)>=88; // 名宿看生涯成就与实力，看出身
  if(Math.random()<0.6||!isStar){
    // 转教练：实力越强加成越高
    const bonus=isStar?rnd(5,8):rnd(3,5);
    const style=pick(['lane','farm','team','mind']);
    const coach={id:'rc'+Date.now()+'_'+rnd(100,999),name:p.name,rating:isStar?80:70,style,bonus,styleBonus:isStar?rnd(3,5):2,
      wage:isStar?rnd(12,18):rnd(8,11),cost:isStar?rnd(120,180):rnd(70,100),
      skill:{n:'名宿执教',d:'全队战力+'+bonus+'% · 退役选手转型教练'},type:'coach',origin:p.name};
    s.retiredCoaches.push(coach);
    logEvent(s,'🧑‍🏫 '+p.name+'（'+p.age+'岁）退役转型主教练！执教能力已进入教练市场');
  }else{
    // 转型主播：给俱乐部带来人气收入（每日资金）
    const host={id:'rh'+Date.now()+'_'+rnd(100,999),name:p.name,rating:80,type:'host',
      income:rnd(4,9),cost:rnd(90,140),popularity:(p.popularity||40)+rnd(10,25),
      skill:{n:'转型主播',d:'每日为俱乐部带来 '+0+'万 人气收入'},origin:p.name};
    host.skill={n:'转型主播',d:'每日为俱乐部带来 '+host.income+'万 人气收入（热度 '+(p.popularity||40)+'）'};
    s.retiredCoaches.push(host);
    logEvent(s,'📺 '+p.name+'（'+p.age+'岁）退役转型人气主播！每日可为俱乐部带来 '+host.income+'万 收入');
  }
}
/* 签约退役名宿（教练 or 主播） */
function signRetired(s,id){
  const r=(s.retiredCoaches||[]).find(x=>x.id===id);
  if(!r)return;
  if(s.fund<r.cost){toast('资金不足（签约费 '+r.cost+'万）');return;}
  s.fund-=r.cost;
  s.retiredCoaches=s.retiredCoaches.filter(x=>x.id!==id);
  if(r.type==='coach'){
    // 教练：替换当前主教练（旧教练解约）
    if(s.coach)logEvent(s,'🔁 换帅！'+s.coach.name+' 离任，'+r.name+' 出任主教练');
    else logEvent(s,'🤝 签约退役名宿 '+r.name+' 出任主教练');
    s.coach={...r};
    toast(r.name+' 执教！全队战力+'+r.bonus+'%');
  }else{
    // 主播：加入主播席，每日提供人气收入
    s.hosts=[...(s.hosts||[]).filter(h=>h.id!==id),r];
    logEvent(s,'🤝 签约退役主播 '+r.name+'，每日人气收入 '+r.income+'万');
    toast(r.name+' 入驻直播平台！');
  }
  save();renderAll();
}
function fireHost(s,id){
  s.hosts=(s.hosts||[]).filter(x=>x.id!==id);
  save();renderAll();toast('已解除主播合约');
}
/* 签约自由球员（无球可打流向市场的选手） */
function signFreeAgent(s,id){
  const p=(s.freeAgents||[]).find(x=>x.id===id);
  if(!p)return;
  if(s.players.some(x=>x.id===p.id)){toast('已拥有该选手');return;}
  if(s.fund<p.signCost){toast('资金不足（签约费 '+p.signCost+'万）');return;}
  if(weeklyWage(s)+p.wage>s.wageCap){toast('❌ 联盟注册被驳回：签下 '+p.name+' 后周薪 '+(weeklyWage(s)+p.wage)+'万 超出工资帽 '+s.wageCap+'万，请先出售或裁减选手');return;}
  s.fund-=p.signCost;
  p.acqCost=p.signCost; // 买入价锚定（转售保护用）
  s.freeAgents=s.freeAgents.filter(x=>x.id!==id);
  s.players.push(p);
  logEvent(s,'⚪ 自由市场签下 '+p.name+'（无球可打选手 · 签约费 '+p.signCost+'万）');
  save();renderAll();toast(p.name+' 加盟！');
}
</script>
<script>

/* ================= KPL 选边系统（红蓝方） =================
   季后赛/卡位赛首局：常规赛排名更高者选边；常规赛首局：抛硬币
   第 2-6 局：败方选边（自由选蓝/红）；BO7 第 7 局巅峰对决：第 6 局败方选边
   蓝方=先ban先选一抢；红方=counter位后手克制（本局战力+2%） */
function groupOfTeam(s,n){
  // 检查所有可能的组（含季后赛阶段，phaseGroups 在 playoff 时为空）
  for(const g of ['S','A','B','G1','G2','G3']){if(s.groups[g]&&s.groups[g].includes(n))return g;}
  return 'G3';
}
function sidePriority(s,a,b){
  const order={S:0,A:1,B:2,G1:0,G2:1,G3:2};
  const gA=groupOfTeam(s,a),gB=groupOfTeam(s,b);
  if(order[gA]!==order[gB])return order[gA]<order[gB]?a:b;
  const tA=(s.tables[gA]||{})[a]||{pts:0,pw:0},tB=(s.tables[gB]||{})[b]||{pts:0,pw:0};
  if(tA.pts!==tB.pts)return tA.pts>tB.pts?a:b;
  return tA.pw>=tB.pw?a:b;
}
/* 首局选边：常规赛抛硬币；卡位/季后赛排名高者拥有选边权 */
function firstSide(s,stage,opName){
  if(stage==='regular'||!stage)return Math.random()<0.5?'blue':'red';
  const hi=sidePriority(s,s.teamName,opName);
  if(hi===s.teamName)return Math.random()<0.5?'blue':'red';
  return Math.random()<0.6?'red':'blue'; // AI 偏好红方 counter
}
function aiPickSide(s){return Math.random()<0.5?'red':'blue';}
/* 败方选边弹窗（玩家拥有选边权时） */
function showSideChoice(nextTitle){
  $('#app-modal-body').innerHTML=`
    <h2><span class="h-ic">${ic('vs')}</span>败方选边</h2>
    <div class="hint" style="text-align:center;margin-bottom:14px">上一局落败，按 KPL 规则败方拥有下一局选边权（自由选蓝/红，非强制互换）</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn primary" style="flex:1" onclick="setSide('blue')">蓝方 · 先ban先选<br><small style="color:var(--dim)">第一轮主动权 · 一抢版本强势</small></button>
      <button class="btn gold" style="flex:1" onclick="setSide('red')">红方 · 后手counter<br><small style="color:var(--dim)">第二轮针对性选人 · 克制对方</small></button>
    </div>`;
  $('#app-modal').classList.add('on');
  window._sideNext=nextTitle||'';
}
function setSide(side){
  if(S.series)S.series.side=side;
  closeModal('app-modal');
  openBP(window._sideNext||'',playGame);
}

/* ================= BP 有效战力结算（BP 影响胜负的核心） =================
   有效战力 = 基础战力 × BP 修正，双方对称可对赌：
   · 我方 BAN：禁掉「对方池内英雄」每个 -2%（BAN 空气只 -0.5%）→ 最高 -8%
   · 对方 BAN：禁掉「我方首发池内英雄」每个 -1%（叠加我方被迫换人的熟练度损失）
   · 版本强势（🔥）：我方由英雄加成内置；对方每选一个 +2% 补齐对称
   · 红方后手 counter +2%（蓝方优势=先手一抢，已体现在选人顺序）
   · 巅峰对决：盲选无 BAN，不吃任何修正 */
function bpEffective(v){
  const myLs=rosterLineup(S);
  let my=teamPower(S,v.myPicks||null);
  // 对方战力：有真实阵容时实时结算（与玩家同刻度、含体力衰减），否则退回静态值
  let op=(v.opRoster&&v.opRoster.length)?aiRosterPower(v.opRoster):powerOf(S,v.opName);
  const notes=[];
  if(!v.isPeak){
    let banCut=0;
    (v.myBans||[]).forEach(h=>{
      const real=(v.opRoster||[]).some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.usedOpp||[]).includes(h); // 对方本系列赛已用：BAN不到，只算池外价
      banCut+=real?0.02:0.005;
    });
    if(banCut){op*=1-banCut;notes.push('我方 BAN×'+(v.myBans||[]).length+' 对方-'+Math.round(banCut*100)+'%');}
    let myCut=0;
    (v.oppBans||[]).forEach(h=>{
      const real=myLs.some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.used||[]).includes(h);
      myCut+=real?0.01:0.002;
    });
    if(myCut){my*=1-myCut;notes.push('对方 BAN×'+(v.oppBans||[]).length+' 我方-'+Math.round(myCut*100)+'%');}
    const hot=Object.values(v.oppPicks||{}).filter(h=>heroOf(h)&&heroOf(h).hot).length;
    if(hot){op*=1+hot*0.02;notes.push('对方🔥×'+hot+' +'+(hot*2)+'%');}
    if(v.side==='red'){my*=1.02;notes.push('红方counter+2%');}
    else{op*=1.02;notes.push('对方counter+2%');}
    // 王朝反制①：对阵连冠队伍，研究方有效战力 +2%/连冠季（上限+6%）
    const mySt=dynastyStreak(S,S.teamName),opSt=dynastyStreak(S,v.opName);
    if(mySt){op*=1+mySt*0.02;notes.push('对手研究我方'+mySt+'连冠 +'+(mySt*2)+'%');}
    if(opSt){my*=1+opSt*0.02;notes.push('我方研究对方'+opSt+'连冠 +'+(opSt*2)+'%');}
  }
  return {my:Math.round(my),op:Math.round(op),notes};
}
/* BP 台实时结算：我方未选位置按当前可选最优估算，对方按其池内最优可用估算 */
function bpEffPreview(d){
  const myPicks={...d.myPicks};
  myOpenPositions(d).forEach(pos=>{
    const best=bestHeroFor(d,pos,myCandidates(d,pos));
    if(best)myPicks[pos]=best;
  });
  const taken=takenSet(d),oppPicks={...d.oppPicks};
  (d.oppRoster||[]).forEach(p=>{
    if(oppPicks[p.pos])return;
    let best=null,bp=-1;
    (p.heroPool||[]).forEach(x=>{
      const h=heroOf(x.n);
      if(h&&h.pos.includes(p.pos)&&!taken.has(x.n)&&!(d.usedOpp||[]).includes(x.n)){const pw=playerPower(p,x.n);if(pw>bp){bp=pw;best=x.n;}}
    });
    if(best)oppPicks[p.pos]=best;
  });
  return bpEffective({myPicks,myBans:d.myBans,oppPicks,oppBans:d.oppBans,side:d.sr.side,isPeak:d.isPeak,opName:d.sr.opName,opRoster:d.oppRoster,used:d.used,usedOpp:d.usedOpp});
}

/* ================= KPL 官方 BP 引擎（两段式征召 · 逐手交互） =================
   官方每局流程（蓝方视角，红方镜像）：
   ① 第一轮 BAN：蓝1 → 红1 → 蓝1 → 红1（各2个）
   ② 第一轮 PICK：蓝1 → 红2 → 蓝2 → 红1（各3人）
   ③ 第二轮 BAN：红1 → 蓝1 → 红1 → 蓝1（再各2个，共4个）
   ④ 第二轮 PICK：红1 → 蓝2 → 红1（各2人，满5人）
   系列赛全局 BP：己方本系列赛用过的英雄不能再选；
   BO7 打至 3:3 进入第 7 局「巅峰对决」：无 BAN、双方盲选、不受全局 BP 限制。 */
function kplDraftSteps(){
  return [ // {s:蓝/红, t:ban/pick, n:连选手数} —— 共 8 ban + 10 pick = 18 手
    {s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},
    {s:'B',t:'pick',n:1},{s:'R',t:'pick',n:2},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
    {s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},
    {s:'R',t:'pick',n:1},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
  ];
}
function expandSteps(sr,isPeak){
  if(isPeak)return [{s:'M',t:'pick',n:1},{s:'M',t:'pick',n:1},{s:'M',t:'pick',n:1},{s:'M',t:'pick',n:1},{s:'M',t:'pick',n:1}];
  const myIsBlue=(sr.side!=='red');
  const steps=[];
  kplDraftSteps().forEach(st=>{
    const mine=(st.s==='B')===myIsBlue;
    for(let i=0;i<st.n;i++)steps.push({side:mine?'M':'O',type:st.t});
  });
  return steps; // 18 手，side: M=我方 O=对方
}
/* 首发缺位时从替补席同位置自动递补（退役/转会后防呆） */
function autoFillLineup(s){
  POS_ORDER.forEach(pos=>{
    const cur=s.lineup.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);
    if(cur.some(p=>p.pos===pos))return;
    const bench=s.players.find(p=>!s.lineup.includes(p.id)&&p.pos===pos);
    if(bench){s.lineup.push(bench.id);logEvent(s,'🔁 '+bench.name+' 递补进入首发（'+POS[pos][0]+'）');}
  });
}
/* 系列赛开始：对手阵容体力回满（体力衰减只在系列赛内逐局累积，跨系列赛恢复；AI 互比用构建值） */
function resetOppEnergy(s,opName){
  ensureAiRosters(s,opName);
  (s.aiRosters[opName]||[]).forEach(p=>{p.energy=ENERGY_MAX;});
}
function openBP(title,onConfirm){
  autoFillLineup(S);
  const ls=rosterLineup(S);
  if(ls.length<POS_ORDER.length){
    const miss=POS_ORDER.filter(pos=>!ls.some(x=>x.pos===pos)).map(pos=>POS[pos][0]).join('、');
    toast('❌ '+miss+' 无人可用：请签约/提拔该位置选手，或使用训练页「位置改造」');
    return;
  }
  const sr=S.series;
  const isPeak=sr&&sr.max>=7&&sr.mw===3&&sr.ow===3&&sr.mw+sr.ow===6;
  window._draft={
    onConfirm,sr,ls,title,isPeak,
    used:(sr&&!isPeak&&sr.used)?sr.used.slice():[],
    usedOpp:(sr&&!isPeak&&sr.usedOpp)?sr.usedOpp.slice():[],
    steps:expandSteps(sr,isPeak),idx:0,
    myBans:[],oppBans:[],myPicks:{},oppPicks:{},curPos:null,
    oppRoster:isPeak?[]:(ensureAiRosters(S,sr.opName)||[]),
  };
  renderBP();
}
/* 当前是否轮到我方（自动处理对方所有连续手） */
function draftAction(d){
  while(d.idx<d.steps.length&&d.steps[d.idx].side==='O'){
    aiDraftStep(d);d.idx++;
  }
  if(d.idx>=d.steps.length)return {type:'done'};
  const st=d.steps[d.idx];
  return {type:st.type,side:'M'};
}
/* ---------- 可选英雄/禁用候选 ---------- */
function takenSet(d){
  return new Set([...d.used,...d.myBans,...d.oppBans,...Object.values(d.myPicks),...Object.values(d.oppPicks)]);
}
function myCandidates(d,pos){
  const p=(d.ls||[]).find(x=>x.pos===pos);
  if(!p)return [];
  const taken=takenSet(d);
  const cand=p.heroPool.filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n));
  if(cand.length)return cand;
  // 职业选手兜底：池内英雄全被 BAN/选完时，可临时拿出该位置任意英雄（生疏-8%，赛后进池）
  return HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)).map(h=>({n:h.n,lv:0}));
}
/* 临时掏的英雄写入选手英雄池（生疏），保证战力结算与展示一致 */
function ensureHeroInPool(p,hero){
  if(p&&!p.heroPool.some(x=>x.n===hero))p.heroPool.push({n:hero,lv:0});
}
function banCandidates(d){
  const taken=takenSet(d);
  return HEROES.map(h=>h.n).filter(n=>!taken.has(n));
}
function myOpenPositions(d){
  return POS_ORDER.filter(pos=>!(pos in d.myPicks)&&d.ls.some(x=>x.pos===pos));
}
function bestHeroFor(d,pos,avail){
  const p=(d.ls||[]).find(x=>x.pos===pos);
  if(!p||!avail.length)return null;
  let best=avail[0].n,bp=-1;
  avail.forEach(h=>{const pw=playerPower(p,h.n)+(heroOf(h.n)&&heroOf(h.n).hot?1.5:0);if(pw>bp){bp=pw;best=h.n;}});
  return best;
}
/* 威胁值：某英雄对某方阵容的威胁 = 该方能玩此英雄的选手最高战力
   我方 BAN 时看 'opp'（禁掉对面的强点）；对方 AI BAN 时看 'me' */
function threatOf(d,h,side){
  if(side==='opp'&&(d.usedOpp||[]).includes(h))return null; // 对方本系列赛已用：本局选不了，无威胁
  if(side!=='opp'&&(d.used||[]).includes(h))return null;    // 我方已用同理
  const roster=side==='opp'?(d.oppRoster||[]):d.ls;
  let bp=null;
  roster.forEach(p=>{
    if((p.heroPool||[]).some(x=>x.n===h)&&heroOf(h)&&heroOf(h).pos.includes(p.pos)){
      const pw=playerPower(p,h);if(bp==null||pw>bp)bp=pw;
    }
  });
  return bp;
}
/* 我方 BAN 推荐：对方已用的英雄本局选不了，BAN 它=浪费（结算只按池外 -0.5% 计），排到最后 */
function banScore(d,h){
  const oppUsed=(d.usedOpp||[]).includes(h);
  return (threatOf(d,h,'opp')||0)+((heroOf(h).hot&&!oppUsed)?2:0)+(oppUsed?-1:0);
}
function bestBanFor(d){
  let best=null,bs=-1;
  banCandidates(d).forEach(h=>{const v=banScore(d,h);if(v>bs){bs=v;best=h;}});
  return best;
}
/* ---------- AI 逐手决策 ---------- */
function aiDraftStep(d){
  const st=d.steps[d.idx];
  if(st.type==='ban'){
    // 对方 AI 禁用：禁掉我方阵容威胁最大的英雄（跳过自己本系列赛已用的——本局也选不了）
    const avail=banCandidates(d).filter(h=>!((d.usedOpp||[]).includes(h)));
    let best=null,bs=-1;
    avail.forEach(h=>{
      const th=threatOf(d,h,'me')||0;
      const score=th+(heroOf(h).hot?2:0)+(Math.random()*1.5);
      if(score>bs){bs=score;best=h;}
    });
    if(best)d.oppBans.push(best);
    return;
  }
  // AI 选人：挑剩余位置中（选手×英雄）战力最高的一手，稍带保护招牌倾向
  let bestPos=null,bestHero=null,bs=-1;
  POS_ORDER.forEach(pos=>{
    if(pos in d.oppPicks)return;
    const p=(d.oppRoster||[]).find(x=>x.pos===pos);
    if(!p)return;
    const taken=takenSet(d),oppUsed=d.usedOpp||[]; // 全局BP：对方本系列赛己方用过的也不能再选
    let cand=(p.heroPool||[]).filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n));
    if(!cand.length)cand=HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n)).map(h=>({n:h.n,lv:0})); // 兜底：临时掏
    cand.forEach(h=>{
      const pw=playerPower(p,h.n);
      let score=pw+(heroOf(h.n).hot?1.2:0)+(h.n===p.sig?0.8:0)+Math.random();
      if(score>bs){bs=score;bestPos=pos;bestHero=h.n;}
    });
  });
  if(bestPos){d.oppPicks[bestPos]=bestHero;ensureHeroInPool((d.oppRoster||[]).find(x=>x.pos===bestPos),bestHero);}
}
/* ---------- 我方操作入口 ---------- */
function bpBanPick(hero){
  const d=window._draft;if(!d)return;
  if(d.myBans.includes(hero)){toast('已禁用该英雄');return;}
  d.myBans.push(hero);d.idx++;d.curPos=null;renderBP();
}
function bpChoosePos(pos){const d=window._draft;if(!d)return;d.curPos=pos;renderBP();}
function bpBackToPos(){const d=window._draft;if(!d)return;d.curPos=null;renderBP();}
function bpBackFromSwap(){const d=window._draft;if(!d)return;d.swap=false;renderBP();}
function bpPickHero(hero){
  const d=window._draft;if(!d)return;
  const pos=d.curPos;if(!pos){toast('请先选择要出战的位置');return;}
  if(!myCandidates(d,pos).some(h=>h.n===hero)){toast('「'+hero+'」不可选');return;}
  const pl=(d.ls||[]).find(x=>x.pos===pos);
  if(pl&&!pl.heroPool.some(x=>x.n===hero))ensureHeroInPool(pl,hero); // 临时掏，生疏-8%
  d.myPicks[pos]=hero;d.idx++;d.curPos=null;renderBP();
}
/* ---------- 推荐与自动 ---------- */
function bpSuggest(){
  const d=window._draft;if(!d)return;
  let guard=0;
  while(guard++<40){
    const act=draftAction(d);
    if(act.type==='done')break;
    if(act.type==='ban'){
      const best=bestBanFor(d);
      if(best)d.myBans.push(best);
      d.idx++;
    }else{
      let bestPos=null,bestHero=null,bs=-1;
      myOpenPositions(d).forEach(pos=>{
        const avail=myCandidates(d,pos),best=bestHeroFor(d,pos,avail);
        if(best){const p=(d.ls||[]).find(x=>x.pos===pos);const pw=playerPower(p,best);if(pw>bs){bs=pw;bestPos=pos;bestHero=best;}}
      });
      if(bestPos){d.myPicks[bestPos]=bestHero;ensureHeroInPool((d.ls||[]).find(x=>x.pos===bestPos),bestHero);}
      d.idx++;
    }
  }
  renderBP();
}
function bpAuto(){bpSuggest();bpConfirm();}
function bpAutoAll(){
  if(!confirm('开启后本系列赛剩余局次将自动 BP 并直接开赛，不再弹 BP 界面（想手动参与就别开）。确定开启？'))return;
  S.seriesAuto=true;
  closeModal('app-modal');
  autoPlayNext();
}
/* 无 UI 自动跑完一整局 BP（系列赛自动模式） */
function autoPlayNext(){
  const sr=S.series;
  if(!sr)return;
  const isPeak=sr.max>=7&&sr.mw===3&&sr.ow===3&&sr.mw+sr.ow===6;
  const ls=rosterLineup(S);
  if(!ls.length){toast('没有可用阵容');S.seriesAuto=false;return;}
  const d={sr,ls,isPeak,
    used:(sr&&!isPeak&&sr.used)?sr.used.slice():[],
    usedOpp:(sr&&!isPeak&&sr.usedOpp)?sr.usedOpp.slice():[],
    steps:expandSteps(sr,isPeak),idx:0,
    myBans:[],oppBans:[],myPicks:{},oppPicks:{},curPos:null,
    oppRoster:isPeak?[]:(ensureAiRosters(S,sr.opName)||[])};
  let guard=0;
  while(guard++<40){
    const act=draftAction(d);
    if(act.type==='done')break;
    if(act.type==='ban'){
      const best=bestBanFor(d);
      if(best)d.myBans.push(best);
      d.idx++;
    }else{
      let bestPos=null,bestHero=null,bs=-1;
      myOpenPositions(d).forEach(pos=>{
        const avail=myCandidates(d,pos),best=bestHeroFor(d,pos,avail);
        if(best){const p=ls.find(x=>x.pos===pos);const pw=playerPower(p,best);if(pw>bs){bs=pw;bestPos=pos;bestHero=best;}}
      });
      if(bestPos){d.myPicks[bestPos]=bestHero;ensureHeroInPool(ls.find(x=>x.pos===bestPos),bestHero);}
      d.idx++;
    }
  }
  if(POS_ORDER.some(pos=>!d.myPicks[pos])){
    toast('有选手英雄池耗尽，自动BP暂停，请去阵容页换人');
    S.seriesAuto=false;
    openBP('英雄池耗尽 · 请换替补后继续',playGame);
    return;
  }
  sr.myBans=d.myBans;sr.oppBans=d.oppBans;sr.oppPicks={...d.oppPicks};
  applyBp({...d.myPicks});
  playGame();
}
function applyBp(sels){
  S.pick=sels;
  if(S.series){
    const sr=S.series;
    sr.used=sr.used||[];
    POS_ORDER.forEach(pos=>{const h=sels[pos];if(h&&!sr.used.includes(h))sr.used.push(h);});
    // 全局 BP 分队记账：对方本局所选英雄同样入册——己方用过的本系列赛不能再选，按队分开算
    sr.usedOpp=sr.usedOpp||[];
    POS_ORDER.forEach(pos=>{const h=(sr.oppPicks||{})[pos];if(h&&!sr.usedOpp.includes(h))sr.usedOpp.push(h);});
  }
}
/* ---------- BP 内换替补（不打断 BP 进度，已选英雄保留给该位置） ---------- */
function bpOpenSwap(){const d=window._draft;if(!d)return;d.swap=true;renderBP();}
function bpSwapIn(pid){
  const d=window._draft;if(!d)return;
  const p=S.players.find(x=>x.id===pid);
  const cur=rosterLineup(S).find(x=>x.pos===p.pos);
  if(!cur){toast('该位置没有首发');return;}
  S.lineup[S.lineup.indexOf(cur.id)]=p.id;
  if(S.pick&&S.pick[p.pos])ensureHeroInPool(p,S.pick[p.pos]); // 上局英雄残留：新选手临时掏
  if(d.myPicks[p.pos])ensureHeroInPool(p,d.myPicks[p.pos]);   // 本局已选英雄：保留，新选手接手
  d.ls=rosterLineup(S);d.swap=false;
  save();toast(p.name+' 替补登场（'+POS[p.pos][0]+'）');
  renderBP();
}
function bpConfirm(){
  const d=window._draft;if(!d){toast('未找到BP状态');return;}
  if(d.stage!=='done')bpSuggest();
  const sels={...d.myPicks};
  if(POS_ORDER.some(pos=>!sels[pos])){toast('还有位置没选英雄');return;}
  const sr=d.sr;
  if(sr){sr.myBans=(d.myBans||[]).slice(0,4);sr.oppBans=(d.oppBans||[]).slice(0,4);sr.oppPicks={...d.oppPicks};}
  applyBp(sels);
  save();closeModal('app-modal');
  window._draft=null;
  if(d.onConfirm)d.onConfirm();
}

/* ================= BP 台 UI（赛事转播观感） ================= */
function bpSlot(cls,txt,sub){return `<div class="bp-slot ${cls}"><b>${txt||'&nbsp;'}</b><small>${sub||'&nbsp;'}</small></div>`;}
function bpSideColumn(d,mine){
  const sr=d.sr;
  const myBlue=(sr.side!=='red');
  const isBlue=mine?myBlue:!myBlue;
  const name=mine?(S.teamName):(sr.opName);
  const bans=mine?d.myBans:d.oppBans;
  const picks=d.oppPicks;
  const order=mine?POS_ORDER:['top','jg','mid','ad','sup'];
  let pickSlots='';
  if(d.isPeak&&mine){
    pickSlots=order.map(pos=>bpSlot('pick'+(d.myPicks[pos]?' filled':''),d.myPicks[pos]||'',POS[pos][0])).join('');
  }else if(d.isPeak){
    pickSlots=order.map(()=>bpSlot('pick blind','？？？','盲选')).join('');
  }else{
    pickSlots=order.map(pos=>{
      const p=(mine?d.ls:d.oppRoster||[]).find(x=>x.pos===pos);
      const hero=mine?d.myPicks[pos]:picks[pos];
      return bpSlot('pick'+(hero?' filled':''),hero||'',(p?p.name:POS[pos][0]));
    }).join('');
  }
  const banSlots=[0,1,2,3].map(i=>bpSlot('ban'+(bans[i]?' filled red':''),d.isPeak?'—':(bans[i]||''),'BAN')).join('');
  return `<div class="bp-col ${isBlue?'blue':'red'}">
    <div class="bp-col-hd"><span class="side-dot"></span>${name}<small>${isBlue?'蓝方':'红方'}</small></div>
    <div class="bp-bans">${banSlots}</div>
    <div class="bp-picks">${pickSlots}</div>
  </div>`;
}
function phaseLabel(d){
  if(d.isPeak)return '巅峰对决 · 盲选（无BAN · 不受全局BP限制）';
  if(d.idx<4)return '第一轮 BAN';
  if(d.idx<10)return '第一轮 PICK';
  if(d.idx<14)return '第二轮 BAN';
  if(d.idx<18)return '第二轮 PICK';
  return 'BP 完成';
}
function renderBP(){
  const d=window._draft;
  if(!d){toast('BP状态丢失');return;}
  const act=draftAction(d);
  const sr=d.sr;
  const sideTxt=(sr&&sr.side==='red')?'我方红方 · 第二轮后手 counter':'我方蓝方 · 第一轮先ban先选';

    board=`<div class="bp-board"><div class="bp-center"><div class="bp-phase">盲选模式 · 双方互相不可见 · 英雄池全解锁</div></div>
      <div style="display:flex;gap:8px;justify-content:center">${bpSideColumn(d,true)}</div></div>`;

      ${bpSideColumn(d,true)}
      <div class="bp-center"><div class="bp-phase">${phaseLabel(d)}</div>

        ${(d.used.length||d.usedOpp.length)?`<div class="bp-used" style="cursor:help" title="我方已用：${d.used.join('、')||'无'}
对方已用：${d.usedOpp.join('、')||'无'}">全局BP已用 · 我方 ${d.used.length} 个 ｜ 对方 ${d.usedOpp.length} 个 · 悬停看明细</div>`:''}
      </div>

  }
  board=`<div class="hint" style="text-align:center;margin-bottom:8px">${d.title||''}　·　${d.isPeak?'盲选':sideTxt}</div>`+board;
  // 实时结算：BP 每一步对有效战力/胜率的影响
  const v=bpEffPreview(d);

    <div style="flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center">
      <div style="font-size:11px;color:var(--dim)">我方有效战力</div>

    <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:92px">
      <div style="font-size:11px;color:var(--dim)">预测胜率</div>
      <div style="font-size:17px;font-weight:800;color:${wr>=55?'var(--green)':wr>=45?'var(--gold)':'var(--red)'}">${wr}%</div>
      <div style="font-size:10px;color:var(--dim)">BP 结算${est?'·含预估':''}</div></div>
    <div style="flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center">
      <div style="font-size:11px;color:var(--dim)">${sr.opName} 有效战力</div>
      <div style="font-size:18px;font-weight:800;color:var(--red)">${v.op}</div></div>
  </div>
  ${v.notes.length?`<div class="hint" style="font-size:11px;margin-top:4px;text-align:center">⚖️ ${v.notes.join('　')}</div>`:''}`;
  // 操作区
  let action='';
  if(d.swap){
    const bn=rosterBench(S);
    action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">⇄ 换替补：点击替补换下同位置首发（BP 进度保留，已选英雄由新选手接手）</div>
      ${POS_ORDER.map(pos=>{
        const cur=d.ls.find(x=>x.pos===pos);
        const cands=bn.filter(x=>x.pos===pos);
        return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap">
          <span class="tag" style="min-width:58px;text-align:center">${POS[pos][1]} ${cur?cur.name:'空缺'}</span>
          ${cands.length?cands.map(p=>`<button class="btn sm" onclick="bpSwapIn('${p.id}')">${p.name} · 战力${playerPower(p)}</button>`).join(''):'<span class="dim" style="font-size:11px">该位置无替补</span>'}
        </div>`;
      }).join('')}
      <div class="center mt8"><button class="btn" onclick="bpBackFromSwap()">← 返回 BP</button></div>`;
  }else if(act.type==='ban'){
    const avail=banCandidates(d);
    const bestBan=bestBanFor(d);
    action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">轮到我方 BAN · 第 ${d.myBans.length+1}/4 个（BAN 对方池内英雄每个 -2% 战力 · ⭐ 为推荐 · 别浪费在对方已用的英雄上）</div>
      <div class="bp-hero-grid">${avail.map(h=>{
        const th=threatOf(d,h,'opp');
        const oppUsed=(d.usedOpp||[]).includes(h);
        const real=!oppUsed&&(d.oppRoster||[]).some(p=>(p.heroPool||[]).some(x=>x.n===h));

    const open=myOpenPositions(d);
    if(!d.curPos){
      action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">轮到我方 PICK · 第 ${Object.keys(d.myPicks).length+1}/5 人：先点选要选人的位置</div>
        <div class="bp-hero-grid">${open.map(pos=>`<button class="bp-hero pos" onclick="bpChoosePos('${pos}')">${POS[pos][1]} ${POS[pos][0]}<small>${(d.ls.find(x=>x.pos===pos)||{}).name||''}</small></button>`).join('')}</div>`;

      }else{
        action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">为 <b>${POS[pos][1]} ${p?p.name:''}</b> 选英雄（推荐已标 ⭐ · <button class="btn sm" style="display:inline;padding:1px 8px" onclick="bpBackToPos()">← 重选位置</button>）</div>
        <div class="bp-hero-grid">${avail.map(h=>{
          const hd=heroOf(h.n),lv=HERO_LV[h.lv],rec=best===h.n;
          return `<button class="bp-hero ${rec?'rec':''}" onclick="bpPickHero('${h.n}')">${rec?'⭐ ':''}${h.n}${hd&&hd.hot?'🔥':''}<small>${lv.n}${lv.b>0?'+'+Math.round(lv.b*100)+'%':lv.b<0?Math.round(lv.b*100)+'%':''} · ${TYPE_NAME[hd?hd.t:'team']}</small></button>`;
        }).join('')}</div>`;
      }
    }
  }else{
    action=`<div class="hint" style="margin:10px 0;text-align:center;color:var(--green)">BP 完成，可以确定出战</div>`;
  }
  const html=`<h2><span class="h-ic">${ic(d.isPeak?'bolt':'vs')}</span>${d.isPeak?'巅峰对决 · 盲选':'BP · 两段式征召'} <span class="tag">${d.isPeak?'第7局':'全局BP · 绝活+8%'}</span></h2>
    ${board}${verdict}${action}
    <div class="center mt16" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="closeModal('app-modal')">取消</button>
      <button class="btn" onclick="bpOpenSwap()">⇄ 换替补</button>

  $('#app-modal-body').innerHTML=html;

}

<script>

/* ===== 比赛文字直播（借鉴 esports-manager 事件解说体系：事件驱动 + 多模板随机） ===== */
function genMatchStory(sr,g){
  const myLs=rosterLineup(S);
  const opR=ensureAiRosters(S,sr.opName)||[];
  const R=arr=>arr[Math.floor(Math.random()*arr.length)];
  const myA=()=>myLs.length?R(myLs).name:'我方选手';
  const myB=()=>myLs.length?R(myLs).name:'我方选手';
  const opA=()=>opR.length?R(opR).name:'对方选手';
  const opB=()=>opR.length?R(opR).name:'对方选手';
  const lane=()=>R(['对抗路','发育路','中路']);
  const win=g.w;
  const diff=Math.abs(g.myK-g.opK);
  const close=diff<=2,blowout=diff>=5;
  const mins=[3,6,9,13,17,21];
  const lines=[];
  // 一血
  const fbMy=Math.random()<(win?0.62:0.38);
  lines.push(fbMy
    ? `第${mins[0]}分钟，一血爆发！${myA()} 单杀 ${opB()}，拿下开门红！`
    : `第${mins[0]}分钟，${opA()} 拿到一血，我方 ${myB()} 被击杀。`);
  for(let i=1;i<mins.length;i++){
    const m=mins[i];
    const myEvent=Math.random()<(win?0.7:0.36);
    const pool=myEvent
      ? ['kill','kill','obj','tower','fight','fight']
      : ['opkill','opkill','opobj','optower','opfight'];
    const kind=R(pool);
    const t=R({
      kill:[
        `${myA()} 配合 ${myB()} 抓死 ${opA()}，节奏来了！`,
        `${myA()} 草丛蹲伏，一套连招带走 ${opA()}！`,
        `${myA()} 极限反杀 ${opA()}，丝血逃生！`,
        `${myA()} 绕后切入，${opA()} 来不及反应直接蒸发！`,
        `${myA()} 越塔强杀 ${opA()}，打得真凶！`,
      ],
      obj:[
        `我方稳稳控下暴君，经济小优！`,
        `${myA()} 抢下暗影主宰，召唤主宰先锋推进！`,
        `风暴龙王刷新，我方抱团控下，局面大好！`,
      ],
      tower:[
        `我方推掉对方${lane()}一塔，打开局面！`,
        `${myA()} 带线推进，对方${lane()}二塔告破！`,
        `我方强上高地，${lane()}高地塔被磨掉大半！`,
      ],
      fight:[
        `河道团战，我方 1 换 3，血赚！`,
        `${myA()} 大招开团，我方打出 0 换 4！`,
        `ACE！我方团灭对手，天平彻底倾斜！`,
        `${myA()} 关键绕后开团，直接打崩对方阵型！`,
      ],
      opkill:[
        `${opA()} 越塔强杀我方 ${myB()}，这波有点亏。`,
        `对方 ${opA()} 开团，我方 ${myB()} 被集火击杀。`,
        `${opA()} 蹲到我方 ${myB()}，视野缺失导致掉点。`,
      ],
      opobj:[
        `对方收下暴君，经济被拉开一点。`,
        `对方拿到暗影主宰，兵线压力陡增。`,
      ],
      optower:[
        `对方推掉我方${lane()}一塔，需要稳住。`,
        `我方${lane()}二塔被破，对方视野压进来了。`,
      ],
      opfight:[
        `团战失利，我方 2 换 1，有点难受。`,
        `对方打出 ACE，我方被打了一波团灭。`,
      ],
    }[kind]);
    lines.push(`第${m}分钟，${t}`);
  }
  // 收官
  const endM=22+Math.floor(Math.random()*10);
  if(win){
    if(close)lines.push(`第${endM}分钟，逆风翻盘！${myA()} 关键抢龙，一波推平水晶拿下本局！`);
    else if(blowout)lines.push(`第${endM}分钟，碾压局！${myA()} 带队直取水晶，对手毫无还手之力！`);
    else lines.push(`第${endM}分钟，兵线进塔，${myA()} 点掉水晶，拿下本局！`);
  }else{
    if(close)lines.push(`第${endM}分钟，基地前最后一波团战失利，水晶告破……可惜了。`);
    else if(blowout)lines.push(`第${endM}分钟，对方带着主宰先锋推上高地，水晶告破，惨败一局。`);
    else lines.push(`第${endM}分钟，对方推掉水晶……${opA()} 这局发挥确实好。`);
  }
  return lines.map(l=>'🎙️ '+l);
}
/* ================= 比赛流程（KPL 赛制：常规赛 BO5 / 季后赛 BO7 全局BP） ================= */
function singleGame(my,op){
  const w=Math.random()<winChance(my,op);
  return {w,myK:rnd(6,13),opK:rnd(6,13)};
}
/* 每局表现结算：为全体首发生成 KDA，滚动更新身价（均衡值=100×平均表现），并选出 MVP
   perf≈1 为平：EMA 每局向 100×近期表现收敛，区间 70~150；MVP 额外 +3 */
function gamePerform(winner){
  const ls=rosterLineup(S);
  if(!ls.length)return null;
  let best=null,bs=-1;
  ls.forEach(p=>{
    const pw=playerPower(p,pickedHero(S,p));
    const k=rnd(1,12),d=rnd(0,6),a=rnd(0,12);
    const score=k*3+a*2-d*1.5+(winner?6:2)+pw*0.5+rnd(0,3);
    const perf=(k*3+a*2-d*1.5)/25+(winner?0.35:-0.15);
    p.val=clamp(Math.round((p.val||100)*0.92+perf*8),70,150);
    p.kTotal=(p.kTotal||0)+k;p.dTotal=(p.dTotal||0)+d;p.aTotal=(p.aTotal||0)+a; // 赛季累计（场均展示用）
    if(score>bs){bs=score;best={id:p.id,name:p.name,k,d,a};}
  });
  return best;
}

function startMatch(){
  if(S.preseason){toast('📋 赛前转会期进行中：先去转会市场完成组队，结束转会期后联赛才开始');return;}
  const m=S.schedule[S.matchIdx];
  if(!m){toast('赛程已结束');return;}
  // 系列赛中断恢复：不重置比分，直接回到赛前准备
  if(S.series&&S.series.stage==='regular'){
    showPreMatch(PHASE_NAME[S.phase]+' 第'+m.round+'/'+KPL.ROUNDS+'轮 vs '+m.opp+' · 第'+(S.series.mw+S.series.ow+1)+'局（'+S.series.mw+':'+S.series.ow+'）');
    return;
  }
  S.series={used:[],usedOpp:[],mw:0,ow:0,max:5,stage:'regular',logs:[],myName:S.teamName,opName:m.opp,side:firstSide(S,'regular')};S.seriesAuto=false;
  resetOppEnergy(S,m.opp); // 对手体力回满：衰减只在系列赛内累积
  showPreMatch(PHASE_NAME[S.phase]+' 第'+m.round+'/'+KPL.ROUNDS+'轮 vs '+m.opp+' · 第1局（BO5 全局BP）');
}

/* 选手在本位置的最佳英雄与战力（情报/换人参考） */
function playerBest(p){
  let best=null,bp=-1;
  (p.heroPool||[]).forEach(x=>{
    const h=heroOf(x.n);
    if(h&&h.pos.includes(p.pos)){const v=playerPower(p,x.n);if(v>bp){bp=v;best=x.n;}}
  });
  return {hero:best,pow:bp<0?playerPower(p,null):Math.round(bp)};
}

function prepChoosePos(pos){window._prepPos=pos;renderPreMatch();}
function prepSwapIn(pid){
  const p=S.players.find(x=>x.id===pid);
  const cur=rosterLineup(S).find(x=>x.pos===p.pos);
  if(!cur)return;
  S.lineup[S.lineup.indexOf(cur.id)]=p.id;
  if(S.pick)delete S.pick[p.pos]; // 换人后该位置英雄需重新 BP
  save();
  window._prepPos=null;
  toast(cur.name+' 换下，'+p.name+' 首发');
  renderPreMatch();
}
function playGame(){
  const sr=S.series;
  // 有效战力结算：BAN/选人质量/红蓝 counter 全部折算进胜负（详见 bpEffective）
  const isLastPeak=sr.max>=7&&sr.mw+sr.ow>=6; // 巅峰对决：无 BP，不吃任何修正
  const v=bpEffective({myBans:sr.myBans,oppBans:sr.oppBans,oppPicks:sr.oppPicks,side:sr.side,isPeak:isLastPeak,opName:sr.opName,opRoster:ensureAiRosters(S,sr.opName)||[],used:sr.used,usedOpp:sr.usedOpp});
  const g=singleGame(v.my,v.op);
  // 每小局双方消耗体力（8/局）：系列赛越深越考验轮换——替补体力满员是翻盘资本
  const opR=ensureAiRosters(S,sr.opName)||[];
  rosterLineup(S).forEach(p=>{p.energy=clamp(p.energy-8,0,ENERGY_MAX);p.caps=(p.caps||0)+1;}); // caps：出场记录（转售保护期解锁用）
  opR.forEach(p=>p.energy=clamp(p.energy-8,0,ENERGY_MAX));
  if(g.w)sr.mw++;else sr.ow++;
  const isPeak=sr.max>=7&&sr.mw===3&&sr.ow===3&&sr.mw+sr.ow===6;
  const tag=isPeak?' 巅峰对决（盲选）':'';
  const mvp=gamePerform(g.w);
  if(mvp){const mp=S.players.find(x=>x.id===mvp.id);if(mp){mp.mvp=(mp.mvp||0)+1;mp.popularity=Math.min(99,(mp.popularity||0)+2);mp.val=clamp((mp.val||100)+3,70,150);}} // MVP：人气+2、身价+3
  sr.logs.push('第'+(sr.mw+sr.ow)+'局 '+(g.w?'✅':'❌')+' 我方 '+g.myK+'-'+g.opK+' '+(g.w?'击败':'憾负')+' '+sr.opName+' ｜ 总比分 '+sr.mw+':'+sr.ow+tag+' '+(sr.side==='red'?'红方':'蓝方')+' '+pick(CASTER)+(mvp?' ｜ MVP：'+mvp.name+'（'+mvp.k+'/'+mvp.d+'/'+mvp.a+'）':''));
  // 文字直播（借鉴 esports-manager 事件解说体系）
  sr.logs.push(...genMatchStory(sr,g));
  const need=Math.ceil(sr.max/2);
  if(sr.mw>=need||sr.ow>=need){
    finishSeries(sr.mw>=need);
  }else{
    // 进入下一局：败方选边（KPL 规则：第2-6局败方选边；第7局巅峰对决由第6局败方选边）
    const nextTitle=(sr.stage==='card'?'卡位赛':sr.stage==='po'?(sr.poSlot==='总决赛'?'总决赛':'季后赛'):PHASE_NAME[S.phase])+' · 第'+(sr.mw+sr.ow+1)+'局（当前 '+sr.mw+':'+sr.ow+'）';
    if(S.seriesAuto){
      autoPlayNext(); // 本系列赛自动BP模式
    }else if(!g.w){
      // 玩家本局落败 → 玩家拥有选边权
      showSideChoice(nextTitle);
    }else{
      // AI 落败 → AI 自动选边
      sr.side=aiPickSide(S);
      openBP(nextTitle,playGame);
    }
  }
}
function recordSeason(s){
  try{
    s.honors=s.honors||[];
    s.honors.push({season:s.season,title:(s.champion?('🏆 赛季'+s.season+' 总冠军'):('赛季'+s.season+' 亚军')),champion:!!s.champion});
    s.honors=s.honors.slice(-20);
  }catch(e){}
}
function finishSeries(finalWin){
  const sr=S.series;
  S.series=null; // 先清系列赛状态，再走收尾链（playoffStep/playCardNext 可能立即开启下一场）
  // 体力按小局在 playGame 中逐局扣除，此处不再重复扣
  // 赛后小概率有人受伤
  if(Math.random()<0.08){
    const ls=rosterLineup(S);
    if(ls.length){const p=pick(ls);p.injury=rnd(2,4);logEvent(S,'🤕 '+p.name+' 在比赛中受伤，将伤停'+p.injury+'天（战力打折）');}
  }
  const winGames=sr.mw; // 2026 KPL 奖金按胜小局数结算
  // 连胜/连败手感（常规赛与季后赛系列赛均计入）
  if(sr.stage==='regular'||sr.stage==='po'){
    S.streak=(S.streak||0)+(finalWin?1:-1);
    if(S.streak>=3)logEvent(S,'🔥 '+S.streak+'连胜！队伍手感火热（全队战力+'+clamp(S.streak,-5,5)*2+'%）');
    else if(S.streak<=-3)logEvent(S,'❄️ '+(-S.streak)+'连败，士气低迷（全队战力'+clamp(S.streak,-5,5)*2+'%）');
  }
  let title='';
  if(sr.stage==='regular'){
    const g=myGroup(S);
    const t=(g&&S.tables[g])?S.tables[g][S.teamName]:null;
    const m=S.schedule[S.matchIdx];
    m.result=finalWin?'W':'L';m.myScore=sr.mw;m.opScore=sr.ow;
    if(t){
      if(finalWin){t.w++;t.pts++;}else{t.l++;}
      t.pw+=sr.mw;
    }
    const bonus=winGames*8;
    S.fund+=bonus;
    if(finalWin&&Math.random()<0.5)S.fund+=20;
    S.players.forEach(p=>p.morale=clamp(p.morale+(finalWin?8:-8),20,100));
    logEvent(S,'⚔️ '+PHASE_NAME[S.phase]+'：'+S.teamName+' '+(finalWin?'胜':'负')+' '+sr.opName+' '+sr.mw+':'+sr.ow+'（小局奖金 '+bonus+'万）');
    S.matchIdx++;
    simulateAiRound(S,m.round); // 本轮打完，联盟其他场次同步开打并更新积分
    if(S.matchIdx>=KPL.ROUNDS)advancePhase(S);
    title=S.teamName+' vs '+sr.opName;
  }else if(sr.stage==='card'){
    const m=sr.cardMatch;
    m.r=finalWin?sr.myName:sr.opName;
    const bonus=winGames*12;
    S.fund+=bonus;
    S.players.forEach(p=>p.morale=clamp(p.morale+(finalWin?8:-8),20,100));
    logEvent(S,'卡位赛：'+S.teamName+' '+(finalWin?'晋级':'遗憾落败')+' '+sr.mw+':'+sr.ow+'（奖金 '+bonus+'万）');
    title='卡位赛'+(finalWin?'晋级':'出局');
    S.card.idx++;
    if(S.card.idx>=S.card.matches.length)finishCard(S);
    else playCardNext(S);
  }else if(sr.stage==='po'){
    const m=sr.poMatch;
    m.r=finalWin?sr.myName:sr.opName;
    const bonus=winGames*15;
    S.fund+=bonus;
    if(finalWin&&sr.poSlot==='总决赛')S.fund+=60;
    if(!finalWin){
      // 联盟分润：按出局名次
      const place=poPlace(sr.poSlot,sr.poSlot==='总决赛');
      leaguePayout(S,place);
    }
    S.players.forEach(p=>p.morale=clamp(p.morale+(finalWin?8:-8),20,100));
    logEvent(S,'🏆 季后赛（'+sr.poSlot+'）：'+S.teamName+' '+(finalWin?'晋级':'出局')+' '+sr.mw+':'+sr.ow+(sr.poSlot==='总决赛'&&finalWin?'——夺得总冠军！':'')+'（奖金 '+bonus+'万）');
    title=sr.poSlot==='总决赛'?(finalWin?'我们是冠军！':'总决赛落幕'):'季后赛'+(finalWin?'晋级':'出局');
    playoffStep(S);
  }
  const r={win:finalWin,logs:sr.logs,opName:sr.opName,myTeam:true};
  // 比赛复盘记录（含巅峰对决名场面标记）
  S.history=S.history||[];

    opp:sr.opName,stage:sr.stage==='card'?'卡位赛':sr.stage==='po'?(sr.poSlot||'季后赛'):PHASE_NAME[S.phase],
    score:sr.mw+':'+sr.ow,win:finalWin,logs:sr.logs,

  });

function swapPlayer(pid){
  const p=S.players.find(x=>x.id===pid);
  const inLineup=S.lineup.includes(pid);
  if(inLineup){
    // 找同位置替补
    const bn=rosterBench(S).filter(x=>x.pos===p.pos);
    if(!bn.length){toast('没有同位置的替补选手可替换');return;}
    S.lineup[S.lineup.indexOf(pid)]=bn[0].id;
    toast(`${p.name} 换下，${bn[0].name} 上场`);
  }else{
    const cur=rosterLineup(S).find(x=>x.pos===p.pos);
    if(cur){S.lineup[S.lineup.indexOf(cur.id)]=pid;toast(`${cur.name} 换下，${p.name} 上场`);}
    else{S.lineup.push(pid);toast(`${p.name} 加入首发`);}
  }
  if(S.pick)delete S.pick[p.pos]; // 换人后该位置英雄需重新 BP
  save();renderAll();
}

/* ================= 联盟页（战队总览 / 阵容浏览 / 选手榜单） ================= */
function unionTeams(){
  const names=(S.leagueTeams&&S.leagueTeams.length)?S.leagueTeams.slice():AI_TEAMS.map(t=>t.name);
  const teams=[];
  names.forEach(n=>{
    if(n===S.teamName){
      teams.push({name:n,mine:true,icon:S.icon,roster:S.players.slice(),power:teamPower(S)});
    }else{
      const t=AI_TEAMS.find(x=>x.name===n);
      const r=ensureAiRosters(S,n)||[];
      teams.push({name:n,mine:false,icon:t?t.icon:'⚔️',roster:r,power:aiRosterPower(r)});
    }
  });
  return teams;
}
function renderUnion(){
  const teams=unionTeams().sort((a,b)=>b.power-a.power);

    ${teams.map((t,i)=>{
      const avg=t.roster.length?Math.round(t.roster.reduce((a,p)=>a+overall(p),0)/t.roster.length):0;
      const core=t.roster.slice().sort((a,b)=>overall(b)-overall(a))[0];
      const dst=dynastyStreak(S,t.name); // 连冠王朝标记
      let rec='—'; // 当前阶段积分表（r1/r2/r3 各自重置）
      Object.keys(S.tables||{}).forEach(g=>{
        if(rec!=='—')return;
        const row=(S.tables[g]||{})[t.name];
        if(row)rec=row.w+'胜'+row.l+'负 · '+row.pts+'分';
      });
      return `<tr class="${t.mine?'me':''}" style="cursor:pointer" onclick="showSquad('${t.name}')">
        <td>${i+1}</td><td>${t.icon} ${t.name}${t.mine?' ★':''}${dst?` <span class="tag" style="color:var(--gold)">🏆${dst}连冠</span>`:''}</td>
        <td><b class="cyan">${fmt(t.power)}</b></td><td>${avg}</td>
        <td>${core?core.name+' <b style="color:'+ovrColor(overall(core))+'">'+overall(core)+'</b>':'—'}</td>

    }).join('')}</table>
    <div class="hint mt8">总战力=五位置最强结算（与比赛同刻度）· 核心选手=全队总值最高者 · 战绩为当前阶段积分表</div></div>`;

  const tab=window._unionTab||'ovr';
  const TABS=[{k:'ovr',n:'总值榜'},{k:'value',n:'身价榜'},{k:'pop',n:'人气榜'},{k:'young',n:'新星榜 U21'}];

  else if(tab==='pop')list.sort((a,b)=>(b.popularity||0)-(a.popularity||0)||overall(b)-overall(a));
  else if(tab==='young')list=list.filter(p=>(p.age||99)<=20).sort((a,b)=>overall(b)-overall(a));
  list=list.slice(0,15);
  const lastTh=tab==='pop'?'人气':tab==='young'?'年龄 / 潜力':'身价';
  const metric=p=>{
    if(tab==='pop')return p.popularity||0;
    if(tab==='young')return (p.age||'?')+'岁'+(p.potential?' · '+'⭐'.repeat(p.potential):'');
    return fmt(sellAskPrice(p))+'万';

  html+=`<div class="panel"><h3><span class="h-ic">${ic('star')}</span>选手榜单 <span class="tag">全联盟注册选手 TOP15</span></h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${TABS.map(t=>`<button class="btn sm ${tab===t.k?'primary':''}" onclick="window._unionTab='${t.k}';renderUnion()">${t.n}</button>`).join('')}</div>
    <table class="tbl"><tr><th>#</th><th>选手</th><th>战队</th><th>总值</th><th>战力</th><th>${lastTh}</th></tr>
    ${list.map((p,i)=>`<tr class="${p._mine?'me':''}"><td>${i+1}</td>
      <td><b>${p.name}</b> <span class="tag">${POS[p.pos][1]}</span></td>
      <td style="font-size:11px;color:var(--dim)">${p._team}</td>
      <td><b style="color:${ovrColor(overall(p))}">${overall(p)}</b></td>
      <td>${fmt(playerPower(p,p.sig))}</td>
      <td>${metric(p)}</td></tr>`).join('')}</table></div>`;
  // 赛季最佳阵容（实时评选 + 历届入册）
  const as=allStarTeams(S);
  const asRow=(x,gold)=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
    <span class="tag" style="min-width:38px;text-align:center">${POS[x.p.pos][1]}</span>
    <b style="font-size:12px;min-width:58px">${x.p.name}</b>
    <span style="font-size:11px;color:var(--dim)">${x.team}</span>
    <b style="margin-left:auto;color:${gold?'var(--gold)':'var(--dim)'};font-size:11px">评分 ${Math.round(allStarScore(x.p))}</b></div>`;
  html+=`<div class="panel"><h3><span class="h-ic">${ic('medal')}</span>赛季最佳阵容 <span class="tag">按位置评选 · 实时</span></h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><div class="gold" style="font-weight:800;margin-bottom:4px">🥇 一阵</div>${as.t1.map(x=>asRow(x,true)).join('')}</div>
      <div style="flex:1;min-width:220px"><div style="font-weight:800;margin-bottom:4px;color:var(--dim)">🥈 二阵</div>${as.t2.map(x=>asRow(x,false)).join('')}</div>
    </div>
    ${(S.awards||[]).length?`<div class="hint" style="margin-top:8px">历届一阵：${S.awards.map(a=>'S'+a.season+' '+a.first.map(f=>f.name).join('/')).join('　｜　')}</div>`:''}
    <div class="hint mt8">评分=招牌英雄战力×状态系数（表现火热可越级入选）· 开启新赛季时评出并公告入册</div></div>`;
  $('#page-union').innerHTML=html;
}
/* 战队阵容弹窗：本队=注册名单（含替补），AI 队=当前真实阵容 */
function showSquad(teamName){
  const mine=teamName===S.teamName;
  let icon='⚔️',roster=[];
  if(mine){icon=S.icon;roster=S.players.slice();}
  else{
    const t=AI_TEAMS.find(x=>x.name===teamName);
    icon=t?t.icon:'⚔️';
    roster=ensureAiRosters(S,teamName)||[];
  }
  const ls=mine?rosterLineup(S):[];
  const rows=roster.slice().sort((a,b)=>overall(b)-overall(a)).map(p=>{
    const starter=ls.some(x=>x.id===p.id);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)">
      <span class="tag" style="min-width:40px;text-align:center">${POS[p.pos]?POS[p.pos][1]:'?'}</span>

      <b style="color:${ovrColor(overall(p))};font-size:15px;min-width:28px">${overall(p)}</b>
      <span style="font-size:11px;color:var(--dim)">战力 ${playerPower(p,p.sig)} · ${p.age||'?'}岁 · 招牌 ${p.sig||'—'} · ${p.skill?p.skill.n:''}${starter?' · <span style="color:var(--cyan)">首发</span>':''}</span>
    </div>`;
  }).join('');
  $('#app-modal-body').innerHTML=`
    <h2><span class="h-ic">${ic('shield')}</span>${icon} ${teamName} · 全队阵容 <span class="tag">${roster.length} 人</span></h2>
    <div class="hint" style="margin-bottom:8px">总值=按位置加权四维实时计算 · 战力=招牌英雄结算${mine?'（本队选手可在转会页挂牌/出售）':''}</div>

    <div class="center mt16"><button class="btn primary" onclick="closeModal('app-modal')">关闭</button></div>`;
  $('#app-modal').classList.add('wide');
  $('#app-modal').classList.add('on');
}

<script>
function closeModal(id){$('#'+id).classList.remove('on');$('#'+id).classList.remove('wide');}

/* ================= 面板折叠（次要面板默认收起，点标题切换，偏好记忆） ================= */
function foldCls(key,def){
  let v=null;try{v=localStorage.getItem('pfold_'+key);}catch(e){}
  const collapsed=v==null?def==='collapsed':v==='1';
  return 'collapsible'+(collapsed?' collapsed':'');
}
document.addEventListener('click',e=>{
  const h3=e.target.closest('.panel.collapsible>h3');
  if(!h3)return;
  const panel=h3.parentElement;
  const folded=!panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed',folded);
  try{localStorage.setItem('pfold_'+(panel.dataset.fold||h3.textContent.trim().slice(0,10)),folded?'1':'0');}catch(err){}
});

function goPage(name){
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===name));

function openSaveMgmt(){
  const occ=i=>!!localStorage.getItem(SAVE_KEY+(i>1?'_'+i:''));
  $('#app-modal-body').innerHTML=`
    <h2><span class="h-ic">${ic('doc')}</span>存档管理</h2>
    <div class="center" style="margin-bottom:12px">
      ${[1,2,3].map(i=>`<div class="pack-btn ${i===curSlot?'style="border-color:var(--gold)"':''}" onclick="setSlot(${i})">
        <b style="font-size:14px">槽${i}</b><span style="font-size:10px">${i===curSlot?'(当前)':occ(i)?'有档':'空槽'}</span></div>`).join('')}
    </div>
    <div class="hint" style="margin-bottom:8px">导出：点击"复制导出"得到存档代码并收藏；导入：粘贴代码后点"导入"（覆盖当前槽）。</div>
    <textarea id="save-io" style="width:100%;min-height:90px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-size:11px;resize:vertical"></textarea>
    <div class="center mt8" style="display:flex;gap:8px;justify-content:center">
      <button class="btn sm" onclick="save();exportSave()">📤 复制导出</button>
      <button class="btn sm primary" onclick="importSave()">📥 导入</button>
      <button class="btn sm" onclick="closeModal('app-modal')">关闭</button>
    </div>`;

function setSlot(i){
  curSlot=i;localStorage.setItem('esport_manager_curslot',String(i));
  if(load()){save();renderAll();closeModal('app-modal');toast('已切换到 槽'+i);}
  else{S=null;closeModal('app-modal');toast('槽'+i+' 暂无存档，可在创建界面开局');}
}
function exportSave(){
  const t=$('#save-io');
  t.value=b64e(JSON.stringify(S));
  t.select();
  try{document.execCommand('copy');}catch(e){}
  toast('存档已复制，请妥善保存');
}
function importSave(){
  const v=$('#save-io').value.trim();
  if(!v){toast('请先粘贴存档代码');return;}
  try{
    const d=JSON.parse(b64d(v));
    if(!d||!d.teamName)throw new Error('bad');
    S=d;migrateSave();save();renderAll();closeModal('app-modal');toast('导入成功！');
  }catch(e){toast('导入失败：存档代码无效');}
}
function resetGame(){
  if(confirm('确定重新开始？将清空当前槽存档')){
    localStorage.removeItem(slotKey());
    location.reload();
  }
}

function upgradeSponsor(){
  const next=SPONSORS[S.sponsorLv+1];
  if(!next)return;
  if(S.fund<next.cost){toast('资金不足');return;}
  S.fund-=next.cost;S.sponsorLv++;
  logEvent(S,`🤝 签约新赞助商「${next.name}」，每日收入 ${next.income}万`);
  save();renderAll();toast(`赞助商升级成功！`);
}

  </div>`).join('');
  $('#start-modal-body').innerHTML=`
    <h2><span class="h-ic">${ic('bolt')}</span>王者电竞经理 · KPL 篇</h2>
    <div class="center dim" style="font-size:12px;margin-bottom:14px">化身战队经理：签约选手、经营俱乐部、征战联赛、冲击总冠军</div>
    <div class="center" style="margin-bottom:12px;display:flex;gap:8px;justify-content:center">
      <button class="btn sm primary" id="tab-self" onclick="switchStartTab('self')">创建我的俱乐部</button>
      <button class="btn sm" id="tab-club" onclick="switchStartTab('club')">执教原版俱乐部</button>
    </div>
    <div id="tab-self-body">
      <div class="center" style="margin-bottom:12px">
        <span class="dim">战队名称：</span><input id="new-team-name" maxlength="8" style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:15px;width:180px" placeholder="输入队名">
      </div>
      <div class="center dim" style="margin-bottom:8px">选择队标：</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">
        ${icons.map((ic,i)=>`<div class="pack-btn ic-pick" data-i="${i}" ${i===0?'style="border-color:var(--cyan)"':''} onclick="pickIcon(${i})">
          <b style="font-size:22px">${ic}</b></div>`).join('')}
      </div>
      <div class="hint" style="margin-bottom:14px;text-align:center">初始资金 800万 · 工资帽 90万 · 开局组建你的 KPL 战队（含一名 90+ 王牌）</div>
      <div class="center"><button class="btn primary" style="padding:12px 44px;font-size:16px" onclick="createTeam()">创建战队</button></div>
    </div>
    <div id="tab-club-body" style="display:none">
      <div class="hint" style="margin-bottom:10px;text-align:center">直接执教一支真实 KPL 俱乐部——豪门预算拉满，草根从零挑战，继承该队首发阵容与主教练</div>
      <div class="grid g4" style="gap:8px">${clubs}</div>
      <div class="hint" style="margin:10px 0;text-align:center;color:var(--cyan)" id="club-pick-tip">👆 点击选择俱乐部</div>
      <div class="center"><button class="btn gold" style="padding:12px 44px;font-size:16px" onclick="applyClub()" id="club-apply-btn" disabled>执教所选俱乐部</button></div>
    </div>`;
  $('#start-modal').classList.add('on');
}
let _clubPick=-1;
function switchStartTab(tab){
  $('#tab-self').className=tab==='self'?'btn sm primary':'btn sm';
  $('#tab-club').className=tab==='club'?'btn sm primary':'btn sm';
  $('#tab-self-body').style.display=tab==='self'?'':'none';
  $('#tab-club-body').style.display=tab==='club'?'':'none';
}
function pickClub(i){
  _clubPick=i;
  $$('.club-card').forEach(c=>{c.style.borderColor=parseInt(c.dataset.ci)===i?'var(--cyan)':'var(--line)';});
  $('#club-pick-tip').textContent='已选择：'+CLUB_TEMPLATES[i].name;
  $('#club-apply-btn').disabled=false;
}
function pickIcon(i){
  $$('.ic-pick').forEach(b=>b.style.borderColor='');
  document.querySelector('.ic-pick[data-i="'+i+'"]').style.borderColor='var(--cyan)';
}
function createTeam(){
  const name=$('#new-team-name').value.trim()||'无名战队';
  const idx=Array.from($$('.ic-pick')).findIndex(b=>b.style.borderColor==='var(--cyan)');
  const icon=['⚔️','🐉','🦁','🚀','🌊','🔥','⚡','👑'][idx<0?0:idx];
  S=newState(name,icon);
  // 直签开局：使用独立的自由球员池（与 18 队注册名单不重叠，保证全联盟一人一队）
  const usedNames=new Set();
  POS_ORDER.forEach((pos,i)=>{
    const band=i===0?'star':'mid'; // 保底一名 90+ 王牌，其余主力级（档位决定四维基准）
    S.players.push(genPlayer(genFreeAgentDef(pos,band,usedNames)));
  });
  // 仍不足5人则按空缺位置强制补签
  while(POS_ORDER.some(pos=>!S.players.some(p=>p.pos===pos))){
    const miss=POS_ORDER.find(pos=>!S.players.some(p=>p.pos===pos));
    const cand=PLAYER_POOL.filter(p=>p.pos===miss&&!S.players.some(x=>x.id===p.id));
    if(cand.length)S.players.push(genPlayer(pick(cand)));
    else break;
  }
  // 按位置安排首发（每位置1人，多出的进替补，缺的留空）
  const byPos={};
  S.players.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  const lineup=[];
  POS_ORDER.forEach(pos=>{
    const cand=byPos[pos];
    if(cand&&cand.length){
      cand.sort((a,b)=>playerPower(b)-playerPower(a));
      lineup.push(cand[0].id);
    }
  });
  S.lineup=lineup;
  // 新手教练：青训助教
  S.coach={...COACH_POOL.find(c=>c.id==='co12')};
  S.seedPower=teamPower(S)||280; // 种子=开局真实战力（决定分组落位）
  initGroups(S); // KPL 2025 官方赛制：18队 S/A/B 分组
  // 赛前转会期：先组队再开赛
  S.preseason=true;S.transferWindow=7;
  buildTransferMarket(S);refreshMarket(S);
  logEvent(S,`战队 ${name} 成立！初始资金800万，目标：KPL 总冠军！`);
  logEvent(S,'🎁 开局直签 5 名选手 + 青训助教，赛前转会期 7 天可自由调整阵容');
  logEvent(S,'📋 赛前转会期开启（7天）：买断/直签/挂牌自由组队，市场刷新免费；结束转会期后联赛开打');
  logEvent(S,'📋 KPL 2025 赛制：第一轮3组单循环 → S/A/B → 卡位赛 → 第三轮 → 10强双败季后赛');
  $('#start-modal').classList.remove('on');
  goPage('market');
  toast('📋 赛前转会期开启（7天）：先组队，再开赛');
  save();
}
/* 执教原版俱乐部：继承豪门/草根的预算、工资帽、教练与首发阵容 */
function applyClub(){
  if(_clubPick<0){toast('请先选择俱乐部');return;}
  const tmpl=CLUB_TEMPLATES[_clubPick];
  S=newState(tmpl.name,tmpl.icon);
  S.fund=tmpl.budget;
  S.wageCap=tmpl.cap;
  S.coach={...COACH_POOL.find(c=>c.id===tmpl.coach)};
  tmpl.players.forEach(pid=>{
    const def=PLAYER_POOL.find(d=>d.id===pid);
    if(def)S.players.push(genPlayer(def));
  });
  // 首发直接安排模板阵容（同位置多取战力最高）
  const byPos={};
  S.players.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  const lineup=[];
  POS_ORDER.forEach(pos=>{
    const cand=byPos[pos];
    if(cand&&cand.length){
      cand.sort((a,b)=>playerPower(b)-playerPower(a));
      lineup.push(cand[0].id);
    }
  });
  S.lineup=lineup;
  S.seedPower=teamPower(S)||tmpl.seed; // 种子=执教班底真实战力（决定分组落位）
  initGroups(S);
  // 赛前转会期：先组队再开赛
  S.preseason=true;S.transferWindow=7;
  buildTransferMarket(S);refreshMarket(S);
  logEvent(S,`你正式执教 ${tmpl.name}！预算 ${tmpl.budget}万，工资帽 ${tmpl.cap}万/周`);
  logEvent(S,`主教练 ${S.coach.name} 已就位，首发：${lineup.map(id=>S.players.find(p=>p.id===id).name).join(' / ')}`);
  logEvent(S,'📋 赛前转会期开启（7天）：买断/直签/挂牌自由组队，市场刷新免费；结束转会期后联赛开打');
  logEvent(S,'📋 KPL 2025 赛制：第一轮3组单循环 → S/A/B → 卡位赛 → 第三轮 → 10强双败季后赛');
  $('#start-modal').classList.remove('on');
  goPage('market');
  toast('📋 赛前转会期开启（7天）：先组队，再开赛');
  save();
}

/* ================= 启动 ================= */
$$('nav button').forEach(b=>b.addEventListener('click',()=>goPage(b.dataset.page)));
if(load()&&S&&S.teamName){
  ensureSeason(S); // 旧档自动迁移到 KPL 2025 赛制
  goPage('club');
}else{
  initStart();
}

</script>
</body>
</html>
