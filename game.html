function ensureLeagueChampion(s){
 if(!s)return null;
 let p=s.playoff;
 if(p&&p.final&&p.final.r)return p;

 if(!s.groups||!s.groups.S||!s.groups.S.length){
  const all=(s.leagueTeams&&s.leagueTeams.length?s.leagueTeams.slice():AI_TEAMS.map(t=>t.name))
   .filter(t=>t!==s.teamName)
   .concat(s.teamName?[s.teamName]:[]);
  const ranked=all.slice().sort((a,b)=>powerOf(s,b)-powerOf(s,a));
  s.groups={S:ranked.slice(0,6),A:ranked.slice(6,12),B:ranked.slice(12,18)};
 }
 if(!p||!p.wb){
  try{buildPlayoff(s);}catch(e){s._poError='buildPlayoff: '+(e&&e.message||e);console.warn('buildPlayoff fail',e);}
  p=s.playoff;
 }
 if(!p)return null;
 let guard=0;
 while(!(p.final&&p.final.r)&&guard++<25){
  try{playoffStep(s);}catch(e){s._poError='playoffStep: '+(e&&e.message||e);console.warn('playoffStep fail',e);break;}
  p=s.playoff;
  if(!p)break;
 }
 if(p&&p.final&&!p.final.r){

  const ranks=[...sortGroup(s,'S'),...sortGroup(s,'A')];
  const champ=ranks[0]||s.teamName;
  const runner=ranks[1]||champ;
  p.final.a=p.final.a||champ;
  p.final.b=p.final.b||runner;
  p.final.r=p.final.r||champ;
  p.champ=p.final.r;
  s.champion=p.final.r===s.teamName;
  const ourFinal=p.final.a===s.teamName||p.final.b===s.teamName;
  if(s.champion||ourFinal){if(s.phase!=='eliminated')setPhase(s,'champion',{who:'finishTitle',force:true});}
  else setPhase(s,'eliminated',{who:'season',force:true});
  try{logEvent(s,' 季后赛残局补完：'+p.final.r+' 夺得 '+splitLabel(s)+' 冠军'+(s._poError?'（推进异常：'+s._poError+'）':''));}catch(e){}
 }
 return (p&&p.final&&p.final.r)?p:null;
}
function buildPlayoff(s){

 const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
 if(!sRank.length){setPhase(s,'eliminated',{who:'season',force:true});save();renderAll();return;}
 s.playoff={
 wb:[{a:sRank[0],b:sRank[3],r:null},{a:sRank[1],b:sRank[2],r:null}], // 胜者组R1: S1vS4,S2vS3
 lb:[{a:aRank[0],b:aRank[3],r:null},{a:aRank[1],b:aRank[2],r:null}], // 败者组R1: A1vA4,A2vA3
 lb2:[{a:sRank[4],b:null,r:null},{a:sRank[5],b:null,r:null}], // S5/S6 直进败者组R2
 lb3:[{a:null,b:null,r:null},{a:null,b:null,r:null}], // 败者组R3: 胜者组R1败者 vs 败者组R2胜者
 wf:{a:null,b:null,r:null}, // 胜者组决赛
 lb4:{a:null,b:null,r:null}, // 败者组半决赛: lb3两胜者
 lbf:{a:null,b:null,r:null}, // 败者组决赛: wf败者 vs lb4胜者
 final:{a:null,b:null,r:null},champ:null
 };
 if(s.phase!=='eliminated')setPhase(s,'playoff',{who:'buildPlayoff',force:true}); // 玩家已出局时保留"止步"状态
 const inPlayoff=s.groups.S.includes(s.teamName)||aRank.slice(0,4).includes(s.teamName);
 logEvent(s,' 季后赛开启！10强 BO7 双败淘汰');
 if(!inPlayoff){
 logEvent(s,' 未能晋级季后赛，本赛季止步');
 let guard=0;
 while(!s.playoff.final.r&&guard<20){playoffStep(s);guard++;}
 return;
 }
 save();renderAll();
}
function playoffStep(s){
 const p=s.playoff;
 if(!p)return;
 for(let i=0;i<2;i++){const m=p.wb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'wb'+(i+1));return;}}
 for(let i=0;i<2;i++){const m=p.lb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb'+(i+1));return;}}
 for(let i=0;i<2;i++){
 const m=p.lb2[i];
 if(m.b===null&&p.lb[i].r)m.b=p.lb[i].r;
 if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb2_'+(i+1));return;}
 }
 if(p.wf.a===null){const _w0=p.wb&&p.wb[0],_w1=p.wb&&p.wb[1];if(_w0&&_w1){p.wf.a=_w0.r;p.wf.b=_w1.r;}}
 if(p.wf.r===null&&p.wf.a&&p.wf.b){playPoMatch(s,p.wf,'胜者组决赛');return;}
 for(let i=0;i<2;i++){
 const m=p.lb3[i];
 if(m.a===null)m.a=p.wb[i].r===p.wb[i].a?p.wb[i].b:p.wb[i].a;
 if(m.b===null&&p.lb2[i].r)m.b=p.lb2[i].r;
 if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb3_'+(i+1));return;}
 }
 if(p.lb4.a===null){const _l30=p.lb3&&p.lb3[0],_l31=p.lb3&&p.lb3[1];if(_l30&&_l31){p.lb4.a=_l30.r;p.lb4.b=_l31.r;}}
 if(p.lb4.r===null&&p.lb4.a&&p.lb4.b){playPoMatch(s,p.lb4,'败者组半决赛');return;}

 if(p.lbf.a===null){p.lbf.a=p.wf.r===p.wf.a?p.wf.b:p.wf.a;p.lbf.b=p.lb4.r;}
 if(p.lbf.r===null&&p.lbf.a&&p.lbf.b){playPoMatch(s,p.lbf,'败者组决赛');return;}
 if(p.final.a===null){p.final.a=p.wf.r;p.final.b=p.lbf.r;}
 if(p.final.r===null&&p.final.a&&p.final.b){playPoMatch(s,p.final,'总决赛');return;}
 if(p.final.r){
 p.champ=p.final.r;
 s.titleHistory=(s.titleHistory||[]).concat([{season:s.season,split:s.split||'spring',event:SPLIT_NAME[s.split]||'春季赛',champ:p.final.r}]).slice(-48); // 王朝统计（连冠反制用，一年两冠按时间序）
 s.champion=p.final.r===s.teamName;
 const ourFinal=p.final.a===s.teamName||p.final.b===s.teamName;

 if(s.champion||ourFinal){if(s.phase!=='eliminated')setPhase(s,'champion',{who:'finishTitle',force:true});}
 else setPhase(s,'eliminated',{who:'season',force:true});
 if(s.champion||ourFinal)recordSeason(s); // 冠军/亚军均入册荣誉室
 if(s.champion){

 s.players.forEach(p=>p.popularity=Math.min(99,(p.popularity||0)+5));
 logEvent(s,' 夺冠带来巨大曝光！全队选手人气+5，代言收入提升');
 registerChampCore(s,splitLabel(s)+' 总冠军'); // 冠军班底羁绊：记下夺冠首发
 }
 else if(p.final.r)registerAiChampCore(s,p.final.r); // AI 夺冠：记入 AI 冠军班底（按难度档加成）
 leaguePayout(s,s.champion?'冠军':'亚军');
 logEvent(s,splitLabel(s)+'总冠军：'+p.final.r+'！'+(s.champion?'你就是冠军！':''));

 awardAnnualPts(s);
 awardSplitFans(s,s.champion,p.final.a===s.teamName||p.final.b===s.teamName); // 粉丝随赛段成绩增长
 awardFMVP(s,p.final.r,splitLabel(s));
 save();renderAll();
 }
}
function playPoMatch(s,m,slot){
 if(m.a===s.teamName||m.b===s.teamName){
 const opName=m.a===s.teamName?m.b:m.a;
 if(s.mode==='player'){ // 选手生涯：教练指挥，自动打季后赛系列赛（走 finishSeries：结算弹窗 + 延后推进）
 tagMatch(s,m,'po_'+slot);
 playerPlayAndFinish(s,opName,KPL.BO7,{stage:'po',mid:'po_'+slot,poSlot:slot,_match:m});
 return;
 }

 if(s.series&&s.series.stage==='po'){
 if(!s.series.poSlot||s.series.poSlot===slot){
 showPreMatch((slot==='总决赛'?'总决赛':'季后赛')+'（BO7·含巅峰对决）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
 return;
 }
 logEvent(s,'⚠ 赛程修复：废弃未同步的季后赛残影（'+s.series.poSlot+'），本场重新开打');
 console.warn('stale po series discarded',s.series.poSlot,slot);
 s.series=null;
 }
 tagMatch(s,m,'po_'+slot);

 s.series={used:[],usedOpp:[],mw:0,ow:0,max:7,stage:'po',mid:'po_'+slot,poSlot:slot,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'playoff',opName)};s.seriesAuto=false;
 resetOppEnergy(s,opName);
 showPreMatch((slot==='总决赛'?'总决赛':'季后赛')+'（BO7·含巅峰对决）vs '+opName+' · 第1局');
 return;
 }
 const r=simSeriesResult(s,m.a,m.b,KPL.BO7);
 m.r=r.win?m.a:m.b;
 logEvent(s,' 季后赛（'+slot+'）：'+m.a+' '+(r.win?'胜':'负')+' '+m.b+'，'+m.r+' 晋级');
 save();renderAll();
 playoffStep(s);
}

function poPlace(slot,isFinal){
 if(isFinal)return '亚军';

 if(/^lb[12]$|^lb2_/.test(slot))return '八强';
 return '四强';

function dynastyStreak(s,teamName){

 const hist=s.titleHistory||[];
 let streak=0;
 for(let i=hist.length-1;i>=0;i--){
 if(hist[i].champ===teamName)streak++;else break;
 }
 return Math.min(streak,3);
}

function allStarScore(p){return playerPower(p,p.sig)*(1+((p.val||100)-100)/250);}
function allStarTeams(s){
 const pool=s.players.map(p=>({p,team:s.teamName}));
 (s.leagueTeams||[]).forEach(n=>{
 if(n===s.teamName)return;
 (ensureAiRosters(s,n)||[]).forEach(p=>pool.push({p,team:n}));
 });
 const t1=[],t2=[];
 POS_ORDER.forEach(pos=>{
 const two=pool.filter(x=>x.p.pos===pos).sort((a,b)=>allStarScore(b.p)-allStarScore(a.p)).slice(0,2);
 if(two[0])t1.push({p:two[0].p,team:two[0].team});
 if(two[1])t2.push({p:two[1].p,team:two[1].team});
 });
 return {t1,t2};
}

 logEvent(s,' '+splitLabel(s)+' 赛前转会期开启（7天）：可买断/挂牌/直签选手与教练，市场每日首刷免费（再刷 5 万/次）；结束转会期后联赛开打');

function leaguePlacements(s){
 const place={};
 const p=s.playoff;
 if(!p||!p.final.r)return place;
 const matchWinner=m=>{if(!m)return null;if(m.r===m.a||m.r===m.b)return m.r;const a=Number(m.ms)||0,b=Number(m.es)||0;return a>=b?m.a:m.b;};
 const loserOf=m=>{const w=matchWinner(m);return w===m.a?m.b:m.a;};
 const champ=matchWinner(p.final)||p.final.r;
 place[champ]='p1';place[loserOf(p.final)]='p2';
 if(!place[loserOf(p.lbf)])place[loserOf(p.lbf)]='p34';if(!place[loserOf(p.lb4)])place[loserOf(p.lb4)]='p34';
 [p.lb3[0],p.lb3[1]].forEach(m=>{const n=loserOf(m);if(n&&!place[n])place[n]='p56';});
 [p.lb2[0],p.lb2[1]].forEach(m=>{const n=loserOf(m);if(n&&!place[n])place[n]='p78';});
 [p.lb[0],p.lb[1]].forEach(m=>{const n=loserOf(m);if(n&&!place[n])place[n]='p910';});
 (s.groups.A||[]).slice(4).forEach(n=>{if(!place[n])place[n]='p1112';}); // 第三轮 A组第5/6名（不得覆盖冠亚）
 (s.cardLosers||[]).forEach(n=>{if(!place[n])place[n]='p1112';}); // 卡位赛败者（不得覆盖冠亚）
 (s.eliminated||[]).forEach(n=>{if(!place[n])place[n]='p1318';}); // B组3-6名
 return place;
}

<script>
const BOARD_WARN_TRUST=24; // 低于此值：董事会介入干预（下赛季工资帽削减）
const BOARD_FAVOR_TRUST=80; // 高于此值：董事会放权（下赛季追加预算）
function myAnnualRank(s){ // 本队年度积分排名（从 1 起）；本队不在名录时返回 null

 const pts=s.annualPts||{},me=s.teamName;
 const all=[...new Set([...(s.leagueTeams||[]),...Object.keys(pts),me])];
 const list=all.sort((a,b)=>(pts[b]||0)-(pts[a]||0)||powerOf(s,b)-powerOf(s,a));
 const i=list.indexOf(me);
 return i<0?null:i+1;
}
function boardKpiTarget(prevRank,s){ // 豪门保前4 / 争冠组保前8 / 其余保前12（进年总线）
 if(prevRank)return prevRank<=4?4:prevRank<=8?8:12;

 const inG=g=>(s&&s.groups&&s.groups[g]||[]).indexOf(s.teamName)>=0;
 if(inG('S')||inG('G1'))return 4;
 if(inG('A')||inG('G2'))return 8;
 return 12;
}
function setBoardKpi(s){
 s.board=s.board||{};
 s.managerCareer=s.managerCareer||{years:0,titles:0,lastRank:null};
 const prev=s.managerCareer.lastRank||null;
 const target=boardKpiTarget(prev,s);
 s.board.kpi={target,from:prev,label:'赛季末年度积分进前 '+target};
 return s.board.kpi;
}
function boardSettle(s){

 s.board=s.board||{};
 s.managerCareer=s.managerCareer||{years:0,titles:0,lastRank:null};
 const kpi=s.board.kpi, rank=myAnnualRank(s);
 const champs=(s.honors||[]).filter(h=>h.season===s.season&&h.champion).length;
 let delta=0,note='';
 if(kpi&&rank){
  if(rank<=kpi.target){delta+=12;note='达成董事会目标（年度积分第 '+rank+' 名，目标前 '+kpi.target+'）';}
  else{
   const over=rank-kpi.target;
   delta-=Math.min(30,Math.max(8,Math.round(over*1.5))); // 差得越多扣得越狠，下限 -30
   note='未达成董事会目标（年度积分第 '+rank+' 名，目标前 '+kpi.target+'）';
  }
 }else{
  note='本赛季缺少完整积分数据，董事会未作评价';
 }
 if(champs){delta+=6*champs;note+='；年内 '+champs+' 冠额外嘉奖';} // 拿冠军永远算成绩
 if(delta>20)delta=20; // 单赛季上限：防信任度靠一次夺冠暴涨到满
 const before=s.board.trust==null?60:s.board.trust;
 s.board.trust=clamp(before+delta,0,100);
 s.board.log=s.board.log||[];
 s.board.log.unshift({season:s.season,rank,target:kpi?kpi.target:null,delta,note,trust:s.board.trust});
 s.board.log=s.board.log.slice(0,12);
 s.managerCareer.years=(s.managerCareer.years||0)+1;
 s.managerCareer.titles=(s.managerCareer.titles||0)+champs;
 s.managerCareer.lastRank=rank;
 logEvent(s,'【董事会】'+note+'：信任度 '+(delta>=0?'+':'')+delta+'（当前 '+s.board.trust+'）');

 s.board.warn=delta<0?((s.board.warn||0)+1):0;
 if(!s.board.fired&&(s.board.trust<=0||(s.board.warn>=3&&s.board.trust<=BOARD_WARN_TRUST))){
  s.board.fired=true;
  s.board.firedSeason=s.season;
  logEvent(s,'【董事会】信任度耗尽——'+s.teamName+' 董事会宣布与你解约，执教生涯结束（第 '+s.season+' 赛季）');
 }
 return {rank,delta,note};
}
function boardApplyEffect(s){

 if(s.mode==='player')return; // 选手不管工资帽
 if(s.mode==='coach')return; // 教练无市场/卖人权，砍帽只会被自动续约抽干资金 → 只走信任/解约
 s.board=s.board||{};
 const t=s.board.trust==null?60:s.board.trust;
 if(t<=BOARD_WARN_TRUST){
  const cut=Math.max(1,Math.round((s.wageCap||150)*0.1));
  s.wageCap=Math.max(50,(s.wageCap||150)-cut);
  logEvent(s,' 董事会介入：对战绩不满，压缩工资帽 '+cut+'万（本赛季上限 '+s.wageCap+'万/周）——请用更低的成本打出成绩');
  try{if(typeof playMoment==='function'&&t<40)playMoment(2,'董事会警告','信任度 '+t+' · 工资帽已压缩','alert');}catch(e){}
 }else if(t>=BOARD_FAVOR_TRUST){
  s.fund+=130;
  logEvent(s,' 董事会放权：追加运营预算 +130万（信任度 '+t+'）');
 }
}
function boardTierText(s){ // 面板用一句人话概括董事会态度
 const t=(s.board&&s.board.trust!=null)?s.board.trust:60;
 if(s.board&&s.board.fired)return '已解约';
 if(t>=BOARD_FAVOR_TRUST)return '高度信任';
 if(t>=60)return '满意';
 if(t>=40)return '观望';
 if(t>=BOARD_WARN_TRUST)return '不满';
 return '最后通牒';
}

const BOARD_TRUST_MIN=0,BOARD_TRUST_MAX=100;
function boardRelDelta(s,delta,note){
 if(!s||s.mode==='player')return 0;
 s.board=s.board||{trust:60,kpi:null,warn:0,fired:false,firedSeason:0,log:[]};
 const before=s.board.trust==null?60:s.board.trust;
 const d=clamp(Math.round(delta),-15,12);
 s.board.trust=clamp(before+d,BOARD_TRUST_MIN,BOARD_TRUST_MAX);
 if(note)logEvent(s,'【关系】'+note+'：信任度 '+(d>=0?'+':'')+d+'（当前 '+s.board.trust+'）');
 try{if(d>=5&&typeof playMoment==='function')playMoment(1,'俱乐部关系升温','信任度 '+s.board.trust,'gold');}catch(e){}
 return d;
}

 if((s.honors||[]).some(h=>h.season===s.season&&h.champion))pool.push({id:'parade',note:'夺冠游行反响热烈，俱乐部声望大涨',trust:5});
 if(trust>=85)pool.push({id:'favor',note:'管理层对你高度满意，放权信号明显',trust:1});
 if(trust<=30)pool.push({id:'heat',note:'董事会私下召开专题会，关注你的帅位',trust:-2});
 if(!pool.length){
  pool.push(
   {id:'day_ok',note:'例行管理层沟通顺畅',trust:1},
   {id:'day_noise',note:'媒体小作文扰动，公关连夜灭火',trust:-1},

  );

 return pick(pool);
}
function clubRelTick(s){
 if(!s||s.mode==='player')return;
 if(s.board&&s.board.fired)return;
 if(s.clubChoice)return; // 有未决关系事件：先处理

 }else{

 }
}
function applyClubChoice(s,idx){
 s=s||S;

 if(!opt){toast('选项无效');return false;}
 s.fund=Math.max(0,(s.fund||0)+(opt.fund||0));
 if(opt.morale)(s.players||[]).forEach(p=>{p.morale=clamp((p.morale||50)+(opt.morale||0),20,100);});
 boardRelDelta(s,opt.trust||0, (c.title||'关系事件')+'：你选择「'+opt.l+'」——'+(opt.note||''));

}

<script>
function initFans(s){ // 开档粉丝 = 底子 + 阵容人气（豪门起点高，自建从零起步）
 const pop=(s.players||[]).reduce((t,p)=>t+(p.popularity||0),0);
 s.fans=Math.round((s.selfBuilt?6:10)+pop/12);
 return s.fans;
}
const FAN_MILESTONES=[20,80,200]; // 与赞助商升级门槛对齐：突破即可洽谈更高级赞助
function addFans(s,n,why){
 if(!n)return s.fans||0;
 const before=s.fans==null?0:s.fans;
 const after=Math.max(0,Math.round((before+n)*10)/10);
 s.fans=after;
 if(why&&Math.abs(after-before)>=0.5)logEvent(s,' 粉丝 '+(after>=before?'+':'')+(Math.round((after-before)*10)/10)+'万（'+why+' · 当前 '+after+'万）');
 FAN_MILESTONES.forEach(m=>{
  if(before<m&&after>=m){
   const tier=SPONSORS.filter(x=>x.fans===m).map(x=>x.name).join('/');
   if(tier)logEvent(s,' 粉丝突破 '+m+' 万！可以洽谈「'+tier+'」级别的赞助商了');
  }
 });
 return after;
}
const FAN_CAP=600; // 粉丝计效上限（万）：所有商业系数共用同一个帽子，避免极端值把日流水顶穿
const fanEff=s=>Math.min(s.fans||0,FAN_CAP);
const fanMul=(s,div)=>1+fanEff(s)/div; // 粉丝加成

function idleMul(s){
 const d=(s&&s.idleDays)||0;
 return d>=12?0.15:d>=6?0.35:d>=3?0.55:1;
}

function dailyCommercialIncome(s){
 const sp=SPONSORS[clamp(s.sponsorLv||0,0,SPONSORS.length-1)]||SPONSORS[0];
 const inc=sp&&isFinite(sp.income)?sp.income:0;
 return Math.round((inc*fanMul(s,500)+Math.round(fanEff(s)*0.08))*idleMul(s));
}

function grantPrize(s,total,label){
 const club=Math.round(total*PRIZE_CLUB_SHARE);
 s.fund+=club;
 const roster=(s.players||[]).slice();
 if(roster.length)roster.forEach(p=>{
 p.morale=clamp((p.morale||50)+3,20,100);
 p.willingness=Math.min(100,(p.willingness||50)+2);
 });
 const each=roster.length?Math.round(total*PRIZE_PLAYER_SHARE/roster.length):0;
 logEvent(s,' '+label+'：总奖金 '+total+' 万——选手分成 70%（人均约 '+each+' 万：士气+3 · 签约意愿+2），俱乐部留成 30%（+'+club+' 万）');
}

function awardSplitFans(s,isChamp,isRunner){
 const pop=(s.players||[]).reduce((t,p)=>t+(p.popularity||0),0);
 let gain=pop/60;
 gain+=isChamp?8:(isRunner?5:(s.phase==='eliminated'?0:2));
 return addFans(s,Math.round(gain*10)/10,'赛段收官·'+splitLabel(s));
}

const DRESS_OVR_MIN=74; // 战力低于此值的替补没资格抱怨（板凳深度本来就是他的位置）
function dressingRoomCheck(s){
 const ls=rosterLineup(s);
 if(!ls.length)return 0;
 const ref=ls.reduce((t,p)=>t+(p.apps||0),0)/ls.length; // 首发场均出场：替补的参照基准
 let unhappy=0;
 (s.players||[]).filter(p=>!s.lineup.includes(p.id)).forEach(p=>{
 const st=playerStatus(p,s);
 if(p.retiring||st.loan||st.loanOut||st.kjia)return; // 下放 K甲/外租的选手有球可打，不按"坐板凳"记不满
 if(s.mode==='player'&&p.id===(s.career&&s.career.me))return; // 选手模式：你的不满由你自己写在生涯页（不重复记）
 const ovr=overall(p);
 if(ovr<DRESS_OVR_MIN)return;
 const gap=ref-(p.apps||0);
 if(ref>=3&&gap>=ref*0.6){ // 首发打满而他把板凳坐穿
 p.morale=clamp(p.morale-6,20,100);
 p.willingness=clamp((p.willingness==null?70:p.willingness)-8,0,100);
 unhappy++;
 logEvent(s,' 更衣室：'+p.name+'（战力 '+Math.round(ovr)+'）对出场时间公开不满（出场 '+(p.apps||0)+' 次 / 首发场均 '+ref.toFixed(1)+'）');
 if(p.willingness<=25&&!p.transferRequest){
 p.transferRequest=true;
 logEvent(s,' 转会风向：'+p.name+' 经纪人放话希望离队寻求出场——市场上他更容易被谈走');
 }
 }
 });

 if(s.captain&&!(s.players||[]).some(p=>p.id===s.captain)){
 logEvent(s,' 队长袖标空缺：原队长已不在阵中，可在阵容页重新任命');
 s.captain=null;
 }
 return unhappy;
}

function isVeteranMentor(p){
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 const st=playerStatus(p);
 return !st.retiring&&!st.loan&&p.age>=m.gold+1&&overall(p)>=70;
}
function isMentorRookie(p){
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 return !p.loan&&(p.age<=m.gold-1||p.age<=20);
}
function veteranMentors(s){
 s.mentorPairs=[];

 (s.players||[]).forEach(p=>{p.mentoredBy=null;p.mentoring=null;});
 const vets=(s.players||[]).filter(isVeteranMentor);
 const young=(s.players||[]).filter(isMentorRookie);
 const used=new Set();
 young.forEach(r=>{
 const cand=vets.filter(x=>!used.has(x.id)&&x.id!==r.id);
 const v=cand.find(x=>x.pos===r.pos)||cand[0];
 if(!v)return;
 used.add(v.id);
 s.mentorPairs.push({v:v.id,r:r.id,season:s.season});
 r.mentoredBy=v.id;v.mentoring=r.id;
 });
 return s.mentorPairs;
}
function mentorSeasonSettle(s){
 veteranMentors(s);
 (s.mentorPairs||[]).forEach(pair=>{
 const v=(s.players||[]).find(p=>p.id===pair.v);
 const r=(s.players||[]).find(p=>p.id===pair.r);
 if(!v||!r)return;
 const key=pick(['lane','farm','team','mind']);
 const gain=rnd(1,2);
 const attrN={lane:'对线',farm:'运营',team:'团战',mind:'心态'}[key];
 r.attrs[key]=clamp(r.attrs[key]+gain,40,99);
 r.morale=clamp(r.morale+4,20,100);
 v.popularity=Math.min(99,(v.popularity||0)+2);
 v.morale=clamp(v.morale+3,20,100);
 if(s.mode==='player'&&s.career){
 if(r.id===s.career.me){
 s.career.mentorName=v.name;
 logEvent(s,' 更衣室：老将 '+v.name+'（'+v.age+'岁）点拨你「'+attrN+'+'+gain+'」——新人成长有师父带');
 }
 if(v.id===s.career.me){
 s.career.mentoredCount=(s.career.mentoredCount||0)+1;
 logEvent(s,' 更衣室：你带训新人 '+r.name+'（'+r.age+'岁，'+attrN+'+'+gain+'）——名宿气质 +人气');
 }
 }else{
 logEvent(s,' 更衣室：'+v.name+'（'+v.age+'岁）带训新人 '+r.name+'（'+r.age+'岁）——'+attrN+'+'+gain);
 }
 });
}

function aiRosterFitTactic(s,opName){
 const roster=(typeof ensureAiRosters==='function'?ensureAiRosters(s,opName):null)||[];
 if(!roster.length)return null;
 const sum={lane:0,farm:0,team:0,mind:0};
 roster.forEach(p=>{Object.keys(sum).forEach(k=>{sum[k]+=(p.attrs&&p.attrs[k])||0;});});

 const keys=Object.keys(sum).sort((a,b)=>sum[b]-sum[a]);
 const top=keys[0];
 const t=TACTICS.find(x=>x.id===top);
 return t?t.id:null;
}
function aiChooseTactic(s,sr,opName){
 const brain=(typeof aiBrain==='function')?aiBrain(s,opName)
  :((typeof aiTierOf==='function'&&aiTierOf(s,opName)==='elite')?1.3:aiTierOf(s,opName)==='weak'?0.7:1);
 const playerTactic=(s.tactic&&s.tactic!=='balanced')?s.tactic:null;
 if(playerTactic){
  const counter=TACTICS.find(t=>t.beats===playerTactic);

  const pCounter=Math.max(0,Math.min(0.92,0.08+0.48*brain));
  if(counter&&Math.random()<pCounter){
   try{logEvent(s,' 对手教练组研究录像：'+opName+' 布置「'+counter.name+'」反制你的「'+tacticById(playerTactic).name+'」（难度系数 '+brain.toFixed(2)+'）');}catch(e){}
   return counter.id;
  }
 }
 const fit=aiRosterFitTactic(s,opName);

 const pFit=Math.max(0.15,Math.min(0.85,0.2+0.4*brain));
 if(fit&&Math.random()<pFit)return fit;
 return tacticById(pick(TACTICS).id).id;
}
function seriesTacticEdge(s,sr){
 if(!s.tactic||s.tactic==='balanced')return 0;
 const mine=tacticById(s.tactic);
 if(!sr._opTactic){
  const opName=sr.opName||null;
  sr._opTactic=(opName&&opName!==s.teamName&&typeof aiChooseTactic==='function')
   ?aiChooseTactic(s,sr,opName)
   :tacticById(pick(TACTICS).id).id;
 }
 const theirs=tacticById(sr._opTactic);
 sr._myTactic=mine.id;
 return theirs.beats===mine.id?-0.03:(mine.beats===theirs.id?0.03:0);
}

function applySeasonPatch(s,upN,downN){
 const cand=HEROES.filter(h=>h.pos&&h.pos.length);
 const up=(upN&&HEROES.find(h=>h.n===upN))||pick(cand);
 let down=(downN&&HEROES.find(h=>h.n===downN))||pick(cand),g=0;
 while(down.n===up.n&&g++<10)down=pick(cand);
 (s.players||[]).forEach(p=>{
 const hold=(p.sig===up.n)||(p.heroPool||[]).some(x=>x.n===up.n);
 const hurt=(p.sig===down.n)||(p.heroPool||[]).some(x=>x.n===down.n);
 if(hold){const k=pick(['lane','farm','team','mind']);p.attrs[k]=clamp(p.attrs[k]+2,40,99);}
 if(hurt){const k=pick(['lane','farm','team','mind']);p.attrs[k]=clamp(p.attrs[k]-2,40,99);}
 });
 logEvent(s,' 版本公告 '+gameYear(s)+' 赛季：「'+up.n+'」加强、「'+down.n+'」削弱——绝活选手的战力随之浮动，BP 优先级变了');
 s.patch={up:up.n,down:down.n,season:s.season};
 return s.patch;
}

<script>
const KJIA_DAYS=30;
const KJIA_MIN_RECALL=7; // 提前召回最少已练天数（不足则拒绝，防「下放第二天就拉回」）
const KJIA_AI_TEAMS=['K甲·苍穹','K甲·星火','K甲·沧澜','K甲·曜石','K甲·铁鳞','K甲·游隼','K甲·雾嶂'];
const KJIA_EVERY=2; // 每 2 天一轮（7 轮=14 天，转会期 7 天内先打 3 轮）
const KJIA_FILLER_NAMES=['冷峤','照野','束禾','闻鹿','栖迟','枕流','叩舷','扫雪','拾星','衔山','汲露','司南','执桨','引笛','泊岸','拓海','听澜','折桨','纵马','悬旌','负剑','摘星','衔烛','趁风'];
function kjiaMyName(s){return s.teamName+'二队';}
function kjiaSquad(s){ // 二队阵容 = K甲班底 + 下放选手（同一位置取战力高者出场，结算在 kjiaTeamPower）
 return ((s.kjia&&s.kjia.squad)||[]).concat((s.players||[]).filter(p=>p.kjia>0));
}
function kjiaTeamPower(s){ // 与 aiRosterPower 同刻度：五位置最强者求和 × 士气系数；次级联赛体系折算 ×0.9（无教练组）
 const r=kjiaSquad(s);
 if(!r.length)return 0;
 const best={};
 r.forEach(p=>{const v=playerPower(p,p.sig);if(best[p.pos]==null||v>best[p.pos])best[p.pos]=v;});
 let sum=0;POS_ORDER.forEach(pos=>{if(best[pos]!=null)sum+=best[pos];});
 const morale=clamp(r.reduce((t,p)=>t+(p.morale||80),0)/r.length/100,0.82,1.1);
 return Math.round(sum*morale*0.9);
}
function kjiaFiller(s,pos,used){ // 二队 K甲班底：低总值的常驻注册选手（下放的一队选手来了就顶替出场）
 const name=poolName(KJIA_FILLER_NAMES,used);used.add(name);
 const base=[0,1,2,3].map(()=>rnd(62,74));
 return genPlayer({id:'kjf_'+gameYear(s)+'_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:kjiaMyName(s),tags:['K甲'],
 base,skill:{n:'次级联赛',t:pick(['lane','farm','team','mind']),d:'K甲班底选手，等一个上调一队的机会'},
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,career:kjiaMyName(s)+' 班底选手，常年在次级联赛征战。'});
}
function initKjia(s){ // 每个赛段（春/夏）重开一届 K甲
 const my=kjiaMyName(s);
 const teams=[...KJIA_AI_TEAMS,my];
 const powers={};
 KJIA_AI_TEAMS.forEach((t,i)=>{powers[t]=i<3?rnd(360,392):rnd(328,388);}); // 苍穹/星火/沧澜为K甲豪门（与挑战者杯赛道强度对齐）

 const rounds=[];
 const arr=teams.slice(1);
 for(let r=0;r<teams.length-1;r++){
 const ring=[teams[0],...arr],pairs=[];
 for(let i=0;i<teams.length/2;i++){const a=ring[i],b=ring[teams.length-1-i];if(a&&b)pairs.push({a,b,r:null,ms:0,es:0});}
 rounds.push(pairs);
 arr.unshift(arr.pop());
 }
 const tables={};teams.forEach(t=>tables[t]={w:0,l:0,pts:0,pw:0});
 const used=typeof rookieUsedNames==='function'?rookieUsedNames(s):new Set((s.players||[]).map(p=>p.name));
 const squad=POS_ORDER.map(pos=>kjiaFiller(s,pos,used));
 s.kjia={teams,powers,rounds,rd:0,day:0,tables,results:[],squad,champ:null,my};
 return s.kjia;
}

function ensureKjia(s){
 if(!s)return null;
 const k=s.kjia;
 const ok=k&&typeof k==='object'&&Array.isArray(k.rounds)&&k.rounds.length>0&&k.tables&&typeof k.tables==='object'&&Array.isArray(k.teams)&&k.teams.length>0;
 if(!ok)return initKjia(s);
 if(typeof k.rd!=='number'||!(k.rd>=0))k.rd=0;
 if(typeof k.day!=='number'||!(k.day>=0))k.day=0;
 if(!Array.isArray(k.results))k.results=[];
 if(!Array.isArray(k.squad))k.squad=[];
 if(!k.powers||typeof k.powers!=='object')k.powers={};
 if(!k.my)k.my=kjiaMyName(s);
 (k.teams||[]).forEach(t=>{if(t&&!k.tables[t])k.tables[t]={w:0,l:0,pts:0,pw:0};});
 return k;
}
function kjiaRank(s){ // K甲积分榜名次（冠军=榜首）
 const k=ensureKjia(s);if(!k)return [];
 return Object.keys(k.tables||{}).sort((a,b)=>(k.tables[b].pts||0)-(k.tables[a].pts||0)||(k.tables[b].pw||0)-(k.tables[a].pw||0));
}
function kjiaPerform(s,demoted,won,m,round){ // 二队每场为下放选手结算 KDA/MVP/即时成长
 if(!demoted.length)return;
 const my=kjiaMyName(s);
 const opp=m.a===my?m.b:m.a;
 const myScore=m.a===my?m.ms:m.es,opScore=m.a===my?m.es:m.ms;
 let mvp=null,bs=-1;
 const rows=demoted.map(p=>{
 const k=rnd(1,9)+(won?1:0),d=rnd(0,5),a=rnd(0,10);
 const score=k*3+a*2-d*1.5+(won?6:2)+playerPower(p,p.sig)*0.5+rnd(0,3);
 const st=p.kjiaStats=p.kjiaStats||{apps:0,k:0,d:0,a:0,mvp:0,wins:0};
 st.apps++;st.k+=k;st.d+=d;st.a+=a;if(won)st.wins++;
 if(won&&Math.random()<0.3){const key=pick(['lane','farm','team','mind']);p.attrs[key]=clamp(p.attrs[key]+1,40,99);p.kjiaGain=(p.kjiaGain||0)+1;}
 if(score>bs){bs=score;mvp=p;}
 return {p,k,d,a};
 });
 if(mvp)mvp.kjiaStats.mvp++;
 rows.forEach(({p,k,d,a})=>{
 p.kjiaLog=p.kjiaLog||[];
 p.kjiaLog.unshift('第'+round+'轮 vs '+opp+' '+(won?'胜':'负')+' '+myScore+':'+opScore+' · '+k+'/'+d+'/'+a+(p===mvp?' · 单局MVP':''));
 p.kjiaLog=p.kjiaLog.slice(0,6);
 });
}
function kjiaNextRound(s){
 const k=ensureKjia(s);
 if(!k)return;
 const rd=k.rounds[k.rd];
 if(!rd||!rd.length){k.rd=Math.max(k.rd+1,0);if(k.rd>=k.rounds.length)finishKjiaSplit(s);return;}
 const my=k.my||kjiaMyName(s);
 const demoted=(s.players||[]).filter(p=>p.kjia>0);
 rd.forEach(m=>{
 if(!m||m.r)return; // 已赛/脏场次跳过，避免同轮重入双计积分
 const pwA=m.a===my?kjiaTeamPower(s):(k.powers[m.a]||300);
 const pwB=m.b===my?kjiaTeamPower(s):(k.powers[m.b]||300);
 let mw=0,ow=0;
 for(let i=1;i<=5&&mw<3&&ow<3;i++){if(Math.random()<winChance(pwA,pwB))mw++;else ow++;}
 m.ms=mw;m.es=ow;m.r=mw>ow?m.a:m.b;
 const ta=k.tables[m.a]||(k.tables[m.a]={w:0,l:0,pts:0,pw:0});
 const tb=k.tables[m.b]||(k.tables[m.b]={w:0,l:0,pts:0,pw:0});
 if(m.r===m.a){ta.w++;ta.pts++;tb.l++;}else{tb.w++;tb.pts++;ta.l++;}
 ta.pw+=mw;tb.pw+=ow; // 只累计一次净胜局（旧版 m.ms/mw 双计，积分榜净胜局翻倍）
 if(m.a===my||m.b===my)kjiaPerform(s,demoted,m.r===my,m,k.rd+1);
 });
 const rep=rd.map(m=>m.a+' '+(m.ms!=null?m.ms:'—')+':'+(m.es!=null?m.es:'—')+' '+m.b).join('；');
 k.results.unshift({round:k.rd+1,txt:rep});k.results=k.results.slice(0,10);
 logEvent(s,' K甲联赛（第'+(k.rd+1)+'轮）：'+rep);
 k.rd++;
 if(k.rd>=k.rounds.length)finishKjiaSplit(s);
}
function kjiaDayTick(s){ // 挂在 nextDay：日历推进 K甲轮次（旧档懒初始化，读档即有联赛）
 try{
 const k=ensureKjia(s);
 if(!k)return;
 if(k.rd>=k.rounds.length){

 if(k.champ){
 const champ=k.champ;
 logEvent(s,' K甲新一届开赛（上届冠军 '+champ+'）——二队赛程继续推进');
 initKjia(s);
 }
 return;
 }
 k.day++;
 if(k.day%KJIA_EVERY===0)kjiaNextRound(s);
 }catch(e){
 console.warn('kjiaDayTick fail',e);
 try{initKjia(s);}catch(e2){console.warn('kjia re-init fail',e2);}
 }
}
function finishKjiaSplit(s){
 const k=ensureKjia(s);if(!k||k.champ)return;
 const rank=kjiaRank(s);
 k.champ=rank[0];
 const myRank=rank.indexOf(k.my)+1;
 logEvent(s,' K甲联赛收官：'+k.champ+' 夺得本赛段冠军（'+k.my+' 名次：第'+myRank+'）');
 if(k.champ===k.my){
 grantPrize(s,13,'K甲夺冠奖金');addFans(s,2,'二队 K甲夺冠');
 (s.players||[]).filter(p=>p.kjia>0).forEach(p=>{p.morale=clamp(p.morale+5,20,100);});
 logEvent(s,' 二队 K甲夺冠！关注度上涨（粉丝+2万）——下放练级的价值兑现了');
 }
}
function sendKjia(s,id){

 if(id===undefined){id=s;s=S;}
 s=s||S;

 const me=(s.mode==='player'&&typeof myPlayer==='function')?myPlayer(s):null;
 const isSelf=!!(me&&me.id===id);
 if(!isSelf&&typeof denyIfBlocked==='function'&&denyIfBlocked('kjiaDown',s))return;
 const p=(s.players||[]).find(x=>x.id===id);
 if(!p){toast('选手不在阵中');return;}
 if(p.kjia){toast(p.name+' 已在 K甲锻炼（剩余 '+p.kjia+' 天）');return;}
 if(p.loanOut){toast(p.name+' 正租借在外，不能下放 K甲');return;}
 if(p.injury>0){toast(p.name+' 正在伤停，无法下放');return;}
 if(p.loan){toast(p.name+' 是租借选手，不能下放 K甲');return;}
 if(typeof natCamping==='function'&&natCamping(s,p)){toast(p.name+' 国家队集训中，不能下放');return;}
 if((s.listed||[]).some(x=>x.id===id)){toast(p.name+' 挂牌中（已有报价会一并作废），请先撤牌再下放');return;}
 s.players=s.players.filter(x=>x.id!==id||true); // 保留在册（仅离开首发）
 if(s.captain===id){s.captain=null;logEvent(s,' 队长 '+p.name+' 下放 K甲，袖标摘除');}
 const li=(s.lineup||[]).indexOf(id);
 if(li>=0)s.lineup.splice(li,1);
 p.kjia=KJIA_DAYS;
 logEvent(s,' 下放 K甲：'+p.name+'（'+POS[p.pos][0]+'）加入二队征战 K甲联赛 '+KJIA_DAYS+' 天——真实出战积累表现数据，「二队」页可查，归队时带成长回来');
 save();renderAll();
}
function kjiaDaysServed(p){return Math.max(0,KJIA_DAYS-(p.kjia||0));}
function kjiaGrantReturnGrowth(p,daysServed){ // 归队/召回结算成长；满期两项 +2~4，提前按进度缩档
 const keys=['lane','farm','team','mind'];
 let gain=0;
 const nAttrs=daysServed>=20?2:1;
 const dMax=daysServed>=KJIA_DAYS?4:(daysServed>=20?3:2);
 const dMin=daysServed>=KJIA_DAYS?2:1;
 for(let i=0;i<nAttrs;i++){
 const k=keys.splice(Math.floor(Math.random()*keys.length),1)[0];
 const d=rnd(dMin,dMax);
 p.attrs[k]=clamp(p.attrs[k]+d,40,99);
 gain+=d;
 }
 p.kjiaGain=(p.kjiaGain||0)+gain; // 成就「练级成功」依据（含 K甲场上的即时成长）
 return gain;
}
function kjiaReturnNote(p){ // 归队日志共用后缀
 const st=p.kjiaStats;
 return '（K甲累计出场 '+(st?st.apps:0)+' 场'+(st&&st.apps?' · 场均 '+Math.round(st.k/st.apps*10)/10+'/'+Math.round(st.d/st.apps*10)/10+'/'+Math.round(st.a/st.apps*10)/10:'')+'）';
}
function recallKjia(s,id){ // 提前召回：练满 KJIA_MIN_RECALL 天后可拉回一队，成长按已练天数折算
 if(id===undefined){id=s;s=S;}
 s=s||S;
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('kjiaRecall',s))return;
 if(s.mode==='player'){toast('选手生涯没有俱乐部人事权——召回由俱乐部运作');return;}
 const p=(s.players||[]).find(x=>x.id===id);
 if(!p){toast('选手不在阵中');return;}
 if(!(p.kjia>0)){toast(p.name+' 不在 K甲锻炼中');return;}
 const served=kjiaDaysServed(p);
 if(served<KJIA_MIN_RECALL){toast(p.name+' 至少练满 '+KJIA_MIN_RECALL+' 天才能召回（已练 '+served+' 天）');return;}
 const left=p.kjia;
 p.kjia=0;
 const gain=kjiaGrantReturnGrowth(p,served);
 logEvent(s,' 提前召回：'+p.name+' 结束 K甲锻炼（已练 '+served+'/'+KJIA_DAYS+' 天，提前 '+left+' 天），属性成长 +'+gain+kjiaReturnNote(p));
 toast(p.name+' 已召回一队（成长 +'+gain+'）');
 save();renderAll();
}
function kjiaTick(s){ // 每天结算一次；到期归队并成长（必须逐人倒计时，否则只有第一名会归队）
 (s.players||[]).slice().forEach(p=>{
 if(!p||!(p.kjia>0))return;
 p.kjia--;
 if(p.kjia>0)return;
 p.kjia=0;
 const gain=kjiaGrantReturnGrowth(p,KJIA_DAYS);
 logEvent(s,' K甲归队：'+p.name+' 锻炼归来，属性成长 +'+gain+kjiaReturnNote(p));
 });
}

function promoteKjiaPlayer(s,id){

 if(typeof denyIfBlocked==='function'&&denyIfBlocked('promoteRookie',s))return;
 if(id===undefined){id=s;s=S;}
 s=s||S;
 if(s.mode==='player'){toast('选手生涯没有俱乐部人事权——提拔由俱乐部运作');return;}
 if(!s.kjia||!s.kjia.squad){toast('本届 K甲尚未开赛');return;}
 const p=s.kjia.squad.find(x=>x.id===id);
 if(!p){toast('该选手不在二队班底');return;}
 if((p.age||0)<MATCH_MIN_AGE){toast(p.name+' 年仅 '+(p.age||'?')+' 岁，KPL 规定满 '+MATCH_MIN_AGE+' 岁才能上场比赛');return;}
 if(!rosterGuard(s))return; // 大名单 ≤10
 if(s.players.some(x=>x.id===id)){toast(p.name+' 已在一队');return;}
 s.kjia.squad=s.kjia.squad.filter(x=>x.id!==id);
 p.team=s.teamName;
 p.tags=(p.tags||[]).filter(t=>t!=='K甲');
 if(!p.tags.includes('K甲提拔'))p.tags.push('K甲提拔');
 p.contract=Math.max(1,p.contract||2);
 p.wage=Math.min(p.wage||wageOf(overall(p)),PLAYER_WAGE_MAX);
 s.players.push(p);

 if(!s.lineup.includes(p.id)&&!s.players.some(x=>x.id!==p.id&&x.pos===p.pos&&s.lineup.includes(x.id))){
 s.lineup.push(p.id);
 }
 logEvent(s,' K甲上调：'+p.name+'（'+POS[p.pos][0]+' · 总值'+overall(p)+' · '+p.age+'岁）从二队提拔进一线队');
 save();renderAll();
 toast(p.name+' 已提拔一线队！');
}

</script>
<script>
const DRAFT_SIZE=20;
const DRAFT_WAGE=3;
const DRAFT_CONTRACT=3;
const DRAFT_BID_TOP=60;   // 前 8 签起拍
const DRAFT_BID_REST=50;  // 后 8 签起拍
const DRAFT_BID_STEP=10;
const DRAFT_NAMES=['青禾','白榆','赤霄','玄同','临渊','望舒','既明','南声','未晞','朝雨','汀兰','疏影','照野','枕流','拾星','衔山','听澜','拓海','折桨','纵马'];
function draftOrder(s){
 const names=[...(s.leagueTeams&&s.leagueTeams.length?s.leagueTeams:AI_TEAMS.map(t=>t.name))];
 if(!names.includes(s.teamName))names.push(s.teamName);
 const pts=s.annualPts||{};
 const pw=n=>{
 if(n===s.teamName)return teamPower(s)||0;
 const t=AI_TEAMS.find(x=>x.name===n);
 return t?(t.seed||400):400;
 };
 return names.sort((a,b)=>{
 const pa=pts[a]||0,pb=pts[b]||0;
 if(pa!==pb)return pa-pb;
 return pw(a)-pw(b);
 });
}

function draftKjiaTier(s){
 try{
 const k=s.kjia;
 if(!k||!k.rounds)return {n:3,base:80};
 const rank=kjiaRank(s);
 const my=kjiaMyName(s);
 const i=rank.indexOf(my);
 if(k.champ===my)return {n:5,base:84}; // 二队夺冠：更多次级尖子
 if(i>=0&&i<3)return {n:4,base:82};
 if(i>=0&&i<6)return {n:3,base:80};
 return {n:2,base:78};
 }catch(e){return {n:3,base:80};}
}
function genDraftProspect(s,i,used,namePool){
 const name=poolName(namePool||DRAFT_NAMES.concat(KJIA_FILLER_NAMES),used);used.add(name);
 const pos=POS_ORDER[i%POS_ORDER.length];
 const kj=draftKjiaTier(s);
 let tier='camp';
 if(i<kj.n)tier='kjia';
 else if(i%5===4)tier='hot';
 const base=tier==='kjia'?rnd(kj.base,kj.base+6):(tier==='hot'?rnd(78,85):rnd(70,79));
 const tags=['选秀'];
 if(tier==='kjia')tags.push('K甲前三');
 if(tier==='hot')tags.push('热门新秀');
 if(tier==='camp')tags.push('训练营');
 const p=genPlayer({
 id:'drf_'+gameYear(s)+'_'+i+'_'+Math.random().toString(36).slice(2,6),
 name,pos,team:null,tags,
 base:[base,base,base,base],
 skill:{
 n:tier==='kjia'?'次级联赛尖子':(tier==='hot'?'选秀热门':'训练营结业'),
 t:pick(['lane','farm','team','mind']),
 d:tier==='kjia'?'K甲/次级联赛尖子，强度随二队本届名次浮动':(tier==='hot'?'训练营冲榜赛头名，天赋出众':'官方新秀训练营结业，等待俱乐部点名')
 },
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,
 career:tier==='kjia'?'次级联赛（K甲）突出选手，进入选秀大会。':'官方 KPL 新秀训练营结业，参加选秀大会。'
 });
 p.age=18;p.wage=DRAFT_WAGE;p.contract=DRAFT_CONTRACT;
 p.val=tier==='kjia'?115:(tier==='hot'?110:95);
 if(i%3===0&&AI_TEAMS.length){
 const src=pick(AI_TEAMS).name;
 p.fromClub=src;
 tags.push('青训出身');p.tags=tags;
 }
 return p;
}
function draftBlockedFor(s,team,p){
 return !!(p&&p.fromClub&&p.fromClub===team);
}
function draftTeamRosterCount(s,team){
 if(team===s.teamName)return (s.players||[]).filter(p=>!(p.kjia>0)).length; // 与 rosterFull 同口径
 try{return (ensureAiRosters(s,team)||[]).length;}catch(e){return 6;}
}
function draftPosNeed(s,team,pos){
 if(team===s.teamName){
 const inLine=(s.lineup||[]).some(id=>{const p=s.players.find(x=>x.id===id);return p&&p.pos===pos;});
 const bench=(s.players||[]).filter(p=>p.pos===pos&&!s.lineup.includes(p.id)).length;
 return (inLine?0:3)+Math.max(0,2-bench);
 }
 try{
 const r=ensureAiRosters(s,team)||[];
 return Math.max(0,2-r.filter(p=>p.pos===pos).length);
 }catch(e){return 1;}
}
function draftScore(p,team,s){
 let sc=overall(p)+draftPosNeed(s,team,p.pos)*8;
 if((p.tags||[]).includes('热门新秀'))sc+=6;
 if((p.tags||[]).includes('K甲前三'))sc+=10;
 if(draftBlockedFor(s,team,p))sc=-999;
 return sc;
}
function draftStillWant(s,team){
 return draftTeamRosterCount(s,team)<ROSTER_MAX;
}

function draftSlotPrice(slot){return slot<8?DRAFT_BID_TOP:DRAFT_BID_REST;}

function draftAiFund(s,team){
 const d=s.draft;
 if(!d)return rnd(400,1600);
 d.aiFund=d.aiFund||{};
 if(d.aiFund[team]==null)d.aiFund[team]=rnd(400,1600);
 return d.aiFund[team];
}

function draftTeamMaxBid(s,team,slot){
 if(!draftStillWant(s,team))return 0;
 const fund=team===s.teamName?(s.fund||0):draftAiFund(s,team);
 const need=POS_ORDER.reduce((t,pos)=>t+draftPosNeed(s,team,pos),0);
 const base=draftSlotPrice(slot);

 const tempBoost=(typeof isTempSeat==='function'&&isTempSeat(s,team))?1.25:1;
 return Math.min(Math.round(fund*0.25*tempBoost), Math.round((base+need*12)*tempBoost), Math.floor(fund));
}
function draftMaxAiBid(s,team,slot){return draftTeamMaxBid(s,team,slot);}

function draftRepair(s,d){
 if(!d||typeof d!=='object')return null;
 d.pool=Array.isArray(d.pool)?d.pool:[];
 d.log=Array.isArray(d.log)?d.log:[];
 d.picks=Array.isArray(d.picks)?d.picks:[];
 d.passed=(d.passed&&typeof d.passed==='object')?d.passed:{};
 d.aiFund=(d.aiFund&&typeof d.aiFund==='object')?d.aiFund:{};
 d.order=(Array.isArray(d.order)&&d.order.length)?d.order:draftOrder(s);
 const slot=Number(d.slot);
 d.slot=(Number.isFinite(slot)&&slot>=0)?Math.floor(slot):0;
 const bid=Number(d.bid);
 d.bid=(Number.isFinite(bid)&&bid>0)?bid:draftSlotPrice(d.slot);
 if(typeof d.leader!=='string')d.leader=null;
 if(d.phase!=='auction'&&d.phase!=='pick'&&d.phase!=='done')d.phase=d.picks.length?'done':'auction';

 if(d.phase==='pick'&&!d.pool.length)d.phase='done';

 if(d.done&&d.phase!=='done')d.phase='done';
 d.done=!!d.done||d.phase==='done';
 return d;
}
function initDraft(s,force){
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('draft',s))return;
 if(!s||!s.preseason)return null;
 if(s.mode&&s.mode!=='manager')return null;
 if(!force&&s.draft&&s.draft.season===s.season&&s.draft.split===s.split)return draftRepair(s,s.draft);

 const used=rookieUsedNames(s);
 const kj=draftKjiaTier(s);
 const namePool=shuffle([].concat(DRAFT_NAMES,KJIA_FILLER_NAMES,
  typeof ERA_GEN_NAMES!=='undefined'?ERA_GEN_NAMES:[],
  typeof ACADEMY_NAMES!=='undefined'?ACADEMY_NAMES:[],
  typeof ROOKIE_NAMES!=='undefined'?ROOKIE_NAMES:[]));
 const pool=[];
 for(let i=0;i<DRAFT_SIZE;i++)pool.push(genDraftProspect(s,i,used,namePool));
 const order=draftOrder(s);
 s.draft={
 season:s.season,split:s.split,pool,order,log:[],done:false,
 phase:'auction',slot:0,bid:draftSlotPrice(0),leader:null,passed:{},
 picks:[], // {slot,team,playerId}
 aiFund:{}, // 各队本场预算（摇一次，别每次评估都重掷）
 kjiaTier:kj
 };
 draftRepair(s,s.draft);
 draftAiAuction(s);
 return s.draft;
}
function draftAiAuction(s){ // AI 叫价直到轮到玩家或签位落定
 const d=s.draft;
 if(!d||d.done||d.phase!=='auction')return;
 let guard=0;
 while(d.phase==='auction'&&guard++<80){
  if(!d.pool.length){d.phase='done';d.done=true;break;}

  const candidates=d.order.filter(t=>!d.passed[t]&&draftStillWant(s,t));
  if(!candidates.length){

   if(d.leader)draftWinSlot(s,d.leader,d.bid);
   else{
    const free=d.order.find(t=>!d.picks.some(p=>p.team===t));
    if(free)draftWinSlot(s,free,0);
    else{d.done=true;d.phase='done';}
   }
   break;
  }

  if(d.leader&&candidates.length===1&&candidates[0]===d.leader){draftWinSlot(s,d.leader,d.bid);break;}

  let next=null;
  for(const t of candidates){if(t===d.leader)continue;next=t;break;}
  if(!next)break;
  if(next===s.teamName)break; // 等玩家
  const max=draftTeamMaxBid(s,next,d.slot);

  const needBid=d.leader?d.bid+DRAFT_BID_STEP:d.bid;
  if(max>=needBid){
   d.bid=d.leader?d.bid+DRAFT_BID_STEP:d.bid;
   d.leader=next;
   d.log.push(next+' 叫价 '+d.bid+'万（第'+(d.slot+1)+'签）');
  }else{
   d.passed[next]=true;
  }
 }
}
function draftWinSlot(s,team,cost){
 const d=s.draft;
 if(!d)return;

 const playerFull=(team===s.teamName)&&!draftStillWant(s,team);
 if(cost>0&&!playerFull){
 if(team===s.teamName)s.fund=Math.max(0,(s.fund||0)-cost);
 else if(d.aiFund&&d.aiFund[team]!=null)d.aiFund[team]=Math.max(0,d.aiFund[team]-cost);
 else if(d.aiFund)d.aiFund[team]=Math.max(0,(draftAiFund(s,team)-cost));
 d.log.push(team+' 以 '+cost+'万拍得第'+(d.slot+1)+'签');
 }else if(cost>0){
 d.log.push(team+' 拍得第'+(d.slot+1)+'签，但大名单已满（不扣款）');
 }else{
 d.log.push(team+' 顺位获得第'+(d.slot+1)+'签（无人竞拍）');
 }
 if(team===s.teamName){
 if(playerFull){
 d.picks.push({slot:d.slot,team,playerId:null});
 d.slot++;
 draftNextSlot(s);
 return;
 }
 d.phase='pick';
 return;
 }
 const p=draftAiPick(s,team);
 d.picks.push({slot:d.slot,team,playerId:p?p.id:null});
 d.slot++;
 draftNextSlot(s);
}
function draftNextSlot(s){
 const d=s.draft;
 if(!d)return;
 if(d.slot>=d.order.length||!d.pool.length){
 draftFinish(s);
 save();renderAll();
 return;
 }
 d.phase='auction';
 d.bid=draftSlotPrice(d.slot);
 d.leader=null;
 d.passed={};
 draftAiAuction(s);
}

function draftFinish(s){
 const d=s&&s.draft;
 if(!d)return;
 d.done=true;d.phase='done';
 if(!d.pool.length)d.log.push('新秀池已选空');
 logEvent(s,' 选秀大会收官：'+d.picks.filter(x=>x.playerId).length+' 人签约'+(d.pool.length?'（'+d.pool.length+' 人落选进自由市场）':''));
 (d.pool||[]).forEach(p=>{
 draftFaInit(p);
 try{(s.freeAgents=s.freeAgents||[]).push(p);}catch(e){}
 });
 d.pool=[];
}
function draftBidRaise(s){
 if(s===undefined)s=S;
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('draft',s||S))return;
 const d=(s||S).draft;
 if(!d||d.done||d.phase!=='auction')return;

 if(!Number.isFinite(d.bid))d.bid=draftSlotPrice(d.slot);
 if(!draftStillWant(s,s.teamName)){toast('大名单已满（'+ROSTER_MAX+' 人），无法再拍签位');return;}
 const max=draftTeamMaxBid(s,s.teamName,d.slot);
 const nxt=d.leader?d.bid+DRAFT_BID_STEP:d.bid;

 if(nxt>max){
 if(nxt>(s.fund||0))toast('资金不足（需 '+nxt+'万，现有 '+Math.floor(s.fund||0)+'万）');
 else toast('按本队签位预算/意愿封顶，上限 '+max+' 万（需 '+nxt+'万）');
 return;
 }
 if(s.fund<nxt){toast('资金不足（需 '+nxt+'万）');return;}
 d.bid=nxt;
 d.leader=s.teamName;
 delete d.passed[s.teamName];
 d.log.push(s.teamName+' 叫价 '+nxt+'万（第'+(d.slot+1)+'签）');

 draftAiAuction(s);
 save();renderAll();
}
function draftBidPass(s){
 if(s===undefined)s=S;
 const d=s.draft;
 if(!d||d.done||d.phase!=='auction')return;
 if(d.passed[s.teamName])return; // 已放弃，重复点不重复记账
 d.passed[s.teamName]=true;
 d.log.push(s.teamName+' 放弃第'+(d.slot+1)+'签竞拍');
 draftAiAuction(s);
 save();renderAll();
}

function draftAiPick(s,team){
 const d=s.draft;
 if(!d||!d.pool.length)return null;
 if(!draftStillWant(s,team)){d.log.push(team+' 大名单已满');return null;}
 let best=null,bs=-1e9;
 d.pool.forEach(p=>{
 const sc=draftScore(p,team,s);
 if(sc>bs){bs=sc;best=p;}
 });
 if(!best||bs<-900){d.log.push(team+' 无合适新秀，放弃点名');return null;}
 d.pool=d.pool.filter(x=>x.id!==best.id);
 best.team=team;
 if(team===s.teamName){

 if(typeof canSign==='function'){
  const chk=canSign(s,best,{actor:'player',checkWindow:false,checkMode:false});
  if(!chk.ok){
   d.log.push(s.teamName+' 点名失败（'+(chk.reason||'名单受限')+'）');
   return null;
  }
 }else if(typeof rosterFull==='function'&&rosterFull(s)){
  d.log.push(s.teamName+' 大名单已满，点名作废');
  return null;
 }
 if(s.players.some(x=>x.id===best.id)){d.log.push(best.name+' 已在一队，点名作废');return null;}
 s.players.push(best);
 if(!s.lineup.includes(best.id)&&!s.players.some(x=>x.id!==best.id&&x.pos===best.pos&&s.lineup.includes(x.id)))s.lineup.push(best.id);
 }else{
 draftRegisterAiPick(s,team,best);
 }
 d.log.push(team+' 选中 '+best.name+'（'+POS[best.pos][0]+' · 总值'+overall(best)+'）');
 logEvent(s,' 选秀大会：'+team+' 点名 '+best.name+'（'+best.age+'岁 · '+POS[best.pos][0]+(((best.tags||[]).includes('K甲前三'))?' · K甲前三':'')+'）');
 return best;
}

function draftRegisterAiPick(s,team,p){
 try{
  const map=aiRosterDefMap(s);
  map[team]=map[team]||[];

  const cur=ensureAiRosters(s,team)||[];
  const wouldGrow=cur.some(x=>x.pos===p.pos)?0:1; // 该位置已有人 → 注册后人数不变
  if(cur.length+wouldGrow>9){
   (s.freeAgents=s.freeAgents||[]).push(draftFaInit(p));
   d_logDraftOut(s,team,p);
   return;
  }

  const CAP=6; // def 注册上限（首发 5 + 1 个轮换/新秀位）；真实名册另由上面的 9 人硬上限兜住
  if(map[team].length>=CAP){
   const own=map[team].map(id=>defOf(s,id)).filter(d=>d&&d.pos===p.pos);
   const worst=own.map(d=>({d,o:overall(genSeasonPlayer(s,d))})).sort((a,b)=>a.o-b.o)[0];
   if(!worst||overall(p)<=worst.o){
    (s.freeAgents=s.freeAgents||[]).push(draftFaInit(p));
    d_logDraftOut(s,team,p);
    return;
   }
   map[team]=map[team].filter(id=>id!==worst.d.id);
   aiDetachDef(s,worst.d.id); // 全局除名（含青训营与各队缓存），避免同一人挂两队
   logEvent(s,' 选秀连锁：'+team+' 用新秀 '+p.name+' 顶替 '+worst.d.name+'（'+POS[worst.d.pos][0]+'）');
  }
  const attrs=p.attrs||{};
  const def={id:p.id,name:p.name,pos:p.pos,team:null,tags:p.tags||['选秀'],
   base:[attrs.lane||70,attrs.farm||70,attrs.team||70,attrs.mind||70],
   skill:p.skill,sig:p.sig,career:p.career||'',age0:18,ageFrom:s.season||1};
  (s.extraDefs=s.extraDefs||[]).push(def);
  map[team].push(def.id);
  s.aiRosters=s.aiRosters||{};
  delete s.aiRosters[team]; // 缓存失效 → 按新 def 重建，aiPower 同步刷新
  ensureAiRosters(s,team);
 }catch(e){}
}
function d_logDraftOut(s,team,p){
 const d=s.draft;
 if(d)d.log.push(team+' 阵容已满，'+p.name+' 未被注册（转自由市场）');
 logEvent(s,' 选秀大会：'+team+' 选中 '+p.name+' 但阵容无位，转入自由市场');
}

function draftFaInit(p){
 p.team=null;
 p.wage=Math.max(2,DRAFT_WAGE-1);
 p.freeAgent=true;
 p.signCost=Math.round(valueOf(overall(p))*0.58);
 p.willingness=rnd(70,100);
 return p;
}
function draftPick(s,id){
 if(id===undefined){id=s;s=S;} // onclick 传 id，先归一化再做权限判断
 s=s||S;
 if(typeof denyIfBlocked==='function'&&denyIfBlocked('draft',s))return;
 const d=s.draft;
 if(!d||d.done||d.phase!=='pick'){toast('当前不在点名阶段');return;}
 if(!rosterGuard(s)){ // 大名单已满：这一签作废（不能再走 draftNextSlot 原地重拍，否则签位卡在同一步）
  d.picks.push({slot:d.slot,team:s.teamName,playerId:null});
  d.log.push(s.teamName+' 大名单已满，第'+(d.slot+1)+'签作废');
  d.slot++;
  draftNextSlot(s);
  if(!d.done){save();renderAll();}
  return;
 }
 const p=d.pool.find(x=>x.id===id);
 if(!p){toast('该新秀已不在池中');return;}
 if(typeof canSign==='function'){
  const chk=canSign(s,p,{actor:'player',checkWindow:false,checkMode:false});
  if(!chk.ok){toast(chk.reason||('不能点名 '+p.name));return;}
 }
 if(draftBlockedFor(s,s.teamName,p)){
  toast(p.name+' 是本队青训出身——第一轮不能选自家，请用训练页「自留签」');
  return;
 }
 d.pool=d.pool.filter(x=>x.id!==id);
 if(s.players.some(x=>x.id===p.id)){d.log.push(p.name+' 已在一队，点名作废');return null;}
 p.team=s.teamName;
 s.players.push(p);
 if(!s.lineup.includes(p.id)&&!s.players.some(x=>x.id!==p.id&&x.pos===p.pos&&s.lineup.includes(x.id)))s.lineup.push(p.id);
 d.picks.push({slot:d.slot,team:s.teamName,playerId:p.id});
 d.log.push(s.teamName+' 选中 '+p.name+'（'+POS[p.pos][0]+' · 总值'+overall(p)+'）');
 logEvent(s,' 选秀大会：你选中 '+p.name+'（'+p.age+'岁 · '+POS[p.pos][0]+' · 总值'+overall(p)+'）');
 toast(' 选秀签下 '+p.name+'！');
 d.slot++;
 draftNextSlot(s);
 if(!d.done){save();renderAll();} // 以前这里既不复盘也不刷新：点完「点名签约」画面纹丝不动、还没落盘
}
function draftSkip(s){
 if(s===undefined)s=S;
 const d=s.draft;
 if(!d||d.done||d.phase!=='pick')return;
 d.picks.push({slot:d.slot,team:s.teamName,playerId:null});
 d.log.push(s.teamName+' 放弃点名');
 d.slot++;
 draftNextSlot(s);
 if(!d.done){save();renderAll();}
}

function reserveLeft(s){
 const max=(s&&s.reserveSlots!=null)?s.reserveSlots:2;
 const used=(s&&s.reserveUsed)||0;
 return Math.max(0,max-used);
}
function useReserveSlot(s){
 if(reserveLeft(s)<=0)return false;
 s.reserveUsed=(s.reserveUsed||0)+1;
 return true;
}

function draftForceFinish(s){
 const d=s&&s.draft;
 if(!d||d.done)return;
 draftRepair(s,d);
 if(d.done)return;
 const before=d.picks.filter(x=>x.playerId).length;
 let g=0;
 while(!d.done&&g++<60){

  d.passed[s.teamName]=true;
  if(d.phase==='pick'){                  // 卡在「轮到你点名」也要放掉
   d.picks.push({slot:d.slot,team:s.teamName,playerId:null});
   d.log.push(s.teamName+' 放弃点名（转会期结束）');
   d.slot++;
   draftNextSlot(s);
  }else if(d.phase==='auction'){
   draftAiAuction(s);
  }else break;
 }
 if(!d.done)draftFinish(s);               // 兜底：留下半场选秀等于半个池子蒸发
 logEvent(s,' 转会期结束：选秀大会自动收官（共 '+d.picks.filter(x=>x.playerId).length+' 人签约 · 你未点完的签位视为放弃，此前已签 '+before+' 人）');
}

function draftPanelHtml(){
 const s=S;
 if(!s.preseason||(s.transferWindow||0)<=0)return '';
 if(s.mode&&s.mode!=='manager'){
  return `<div class="panel"><h3>KPL 选秀大会 <span class="tag">俱乐部运作</span></h3>
  <div class="hint">选秀大会（竞拍签位 + 点名）由俱乐部管理层操作。你在${s.mode==='player'?'选手生涯':'教练生涯'}里${s.mode==='player'?'专注个人表现，表现好会被俱乐部/经纪签约':'可用转会页的引援申请/应急租借'}；点名入口只在经理模式的转会页。</div></div>`;
 }

 const d=draftRepair(s,s.draft)||initDraft(s);
 if(!d)return '';
 const kj=d.kjiaTier||draftKjiaTier(s);
 const taken=d.picks.filter(x=>x.playerId).length;
 const rosterCount=s=>(s.players||[]).filter(p=>!(p.kjia>0)).length;
  const rosterNow=rosterCount(s); // 与 rosterFull 同口径：K甲下放不占一线名额（显示 s.players.length 会把下放算成第 10 人）
 const myFull=!draftStillWant(s,s.teamName);   // 大名单满 → 既不能拍签也不能点名，界面必须说清楚
 const meAuction=d.phase==='auction'&&!d.done&&!d.passed[s.teamName]&&!myFull;
 const mePick=d.phase==='pick'&&!d.done;
 const alive=d.order.filter(t=>!d.passed[t]&&draftStillWant(s,t));
 let html=`<div class="panel ${foldCls('mdraft')}" data-fold="mdraft"><h3>KPL 选秀大会 <span class="tag">${d.done?'已收官':(d.phase==='auction'?'竞拍签位':'点名')} · 已签 ${taken} · 第${Math.min(d.slot+1,d.order.length)}签 · 大名单 ${rosterNow}/${ROSTER_MAX} · 自留签剩 ${reserveLeft(s)}</span></h3>
 <div class="hint" style="margin-bottom:8px">流程：先<strong>竞拍签位</strong>（前8签 ${DRAFT_BID_TOP}万起 / 第9签起 ${DRAFT_BID_REST}万起，加价 ${DRAFT_BID_STEP} 万；叫价受<strong>本队签位预算上限</strong>约束，玩家与 AI 同一口径），拍到再<strong>点名</strong>。池子=训练营+K甲突出者（本届二队名次影响 K甲前三档：${kj.n}人 · 底子${kj.base}+）。<strong>不能选自家青训</strong>；自家苗子用训练页自留签（每季2个）；大名单上限 ${ROSTER_MAX} 人。</div>`;
 if(!d.done&&d.phase==='auction'){
 html+=`<div class="match" style="border-color:var(--gold);margin-bottom:8px">
 <div class="vs"><div class="tname">第${d.slot+1}签</div><div class="power">起拍 ${draftSlotPrice(d.slot)}万</div></div>
 <div class="score" style="font-size:14px">当前 <b class="gold">${d.bid}</b>万${d.leader?' · '+d.leader:''}</div>
 <div class="vs" style="justify-content:flex-end"><div class="power">共 ${d.order.length} 签 · 未放弃 ${alive.length} 队</div></div>
 </div>`;
 if(meAuction){
 html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
 <button class="btn gold" onclick="draftBidRaise()"> 叫价 ${d.leader?d.bid+DRAFT_BID_STEP:d.bid}万</button>
 <button class="btn sm" onclick="draftBidPass()">放弃本签竞拍</button>
 </div>`;
 }else if(d.phase==='auction'){
 html+= myFull

 ?`<div class="hint" style="margin-bottom:8px;color:var(--red)">大名单已满（${rosterNow}/${ROSTER_MAX}）：无法再拍签。先去转会页卖掉或放走选手腾出位置，否则本届剩余签位全部由 AI 分配。</div>`
 :`<div class="hint" style="margin-bottom:8px">等待其他队叫价…（你已放弃或未轮到）</div>`;
 }
 }
 if(d.phase==='pick'&&!d.done&&mePick){
 html+=`<div class="hint" style="margin-bottom:8px"><b class="gold">轮到你点名</b>（第${d.slot+1}签）${d.pool.length?'':'——池子已空，只能放弃本签'}${myFull?`　<b class="red">但大名单已满（${rosterNow}/${ROSTER_MAX}），只能放弃本签</b>`:''}</div>`;
 }

 if(d.done&&myFull&&!d.picks.some(x=>x.team===s.teamName&&x.playerId)){
 html+=`<div class="hint" style="color:var(--red);margin-bottom:8px">本届选秀你未能参与：开始时大名单已满（${rosterNow}/${ROSTER_MAX}）。想选新秀请先在转会页卖掉或放走选手腾位置，下届选秀即可参与。</div>`;
 }
 if(d.pool.length&&(d.phase==='pick'||mePick||d.done===false)){
 const interactive=mePick;
 if(interactive){
 html+=`<div class="grid g4">${d.pool.map(p=>{
 const blocked=interactive&&draftBlockedFor(s,s.teamName,p);
 const card=pcard(p,interactive
 ?(blocked?`<div class="hint mt8">本队青训 · 不可选</div>`
 :`<button class="btn sm primary mt8" style="width:100%"> 点名签约</button>`)
 :'');

 return (interactive&&!blocked)
 ?`<div onclick="draftPick('${p.id}')" style="cursor:pointer" title="点击签约">${card}</div>`
 :card;
 }).join('')}</div>`;
 }else{

 const src=p=>{const t=(p.tags||[]).filter(x=>x!=='选秀'&&x!=='青训出身');return t.join('/')||'训练营';};
 html+=`<div class="hint" style="margin-bottom:6px">新秀池 ${d.pool.length} 人 · 轮到你点名时自动展开为可点卡片</div>
 <div style="max-height:220px;overflow-y:auto">${d.pool.map(p=>`<div class="match" style="margin-bottom:4px;padding:5px 8px">
 <div class="vs"><span class="tname" style="font-size:12px">${p.name} <span style="color:var(--dim);font-size:10px">(${POS[p.pos][0]} · ${p.age||18}岁${p.fromClub?' · '+p.fromClub+'青训':''})</span></span></div>
 <div class="power" style="font-size:10px">${src(p)}</div>
 <div class="score" style="font-size:12px;min-width:0">总值 ${overall(p)}</div>
 </div>`).join('')}</div>`;
 }
 }

 if(mePick)html+=`<button class="btn sm mt8" onclick="draftSkip()">放弃点名</button>`;
 if((d.log||[]).length){
 html+=`<div class="hint" style="margin-top:10px">大会记录：${d.log.slice(-10).map(l=>_escTxt(l)).join('<br>')}</div>`;
 }
 html+=`</div>`;
 return html;
}

</script>
<script>
const TEMP_SEAT_COUNT=2;
const TRANSFER_FREE_DAYS=4; // 7 天窗：前 4 自由交易，后 3 挂牌期
const YOUTH_DIRECT_ENTRY=2;

const TEMP_SEAT_TEAMS=['常山UUG','桐乡情久'];
const FIXED_SEAT_TEAMS=[
 '成都AG超玩会','重庆狼队','武汉eStarPro','北京WB','济南RW侠','广州TTG','杭州LGD.NBW','苏州KSG',
 '佛山DRG','南京Hero久竞','上海EDG.M','深圳DYG','北京JDG','长沙TES.A','上海RNG.M','西安WE'
];
function isFixedSeatTeam(n){return FIXED_SEAT_TEAMS.indexOf(n)>=0;}
function isTempSeatTeam(n){return TEMP_SEAT_TEAMS.indexOf(n)>=0;}
function transferPhase(s){ // 'free' | 'list' | null
 if(!s||!s.preseason||(s.transferWindow||0)<=0)return null;
 const total=(s.transferWindowStart||7);
 const used=total-(s.transferWindow||0);
 return used<TRANSFER_FREE_DAYS?'free':'list';
}
function transferPhaseLabel(s){
 const ph=transferPhase(s);
 if(ph==='free')return '自由交易期';
 if(ph==='list')return '挂牌期';
 return '';
}
function canFreeSign(s){ // 买断/自由市场直签是否开放
 return transferPhase(s)==='free';
}
function initTempSeats(s){
 if(!s)return;

 s.tempSeatFixed=s.tempSeatFixed||[];
 s.tempSeats=TEMP_SEAT_TEAMS.filter(n=>s.tempSeatFixed.indexOf(n)<0);
 while(s.tempSeats.length<TEMP_SEAT_COUNT){
  const incoming=KJIA_AI_TEAMS.find(n=>!AI_TEAMS.some(t=>t.name===n)&&s.tempSeats.indexOf(n)<0)
   ||('K甲·新军'+(typeof gameYear==='function'?gameYear(s):(s.season||1)));
  if(s.tempSeats.indexOf(incoming)<0)s.tempSeats.push(incoming); else break;
 }
 s.tempSeatLog=s.tempSeatLog||[];
}
function isTempSeat(s,team){
 return !!(s&&s.tempSeats&&s.tempSeats.includes(team));
}

function settleTempSeats(s){
 if(!s)return;
 initTempSeats(s);
 if(!s.tempSeats||!s.tempSeats.length)return;
 s.tempSeatFixed=s.tempSeatFixed||[];
 (s.titleHistory||[]).forEach(t=>{
  if(t&&t.champ&&isTempSeat(s,t.champ)&&s.tempSeatFixed.indexOf(t.champ)<0&&!isFixedSeatTeam(t.champ)){

   s.tempSeatFixed.push(t.champ);
   try{logEvent(s,' '+t.champ+' 夺得'+(t.event||'冠军')+'——下赛季保留 KPL 席位，免打席位赛（非固定席）');}catch(e){}
  }
 });
 s.tempSeats=s.tempSeats.filter(t=>!isFixedSeatTeam(t)&&s.tempSeatFixed.indexOf(t)<0);
 if(s.tempSeats.length<TEMP_SEAT_COUNT){
  TEMP_SEAT_TEAMS.forEach(n=>{
   if(s.tempSeats.length<TEMP_SEAT_COUNT&&s.tempSeats.indexOf(n)<0&&s.tempSeatFixed.indexOf(n)<0)s.tempSeats.push(n);
  });
 }
 const pts=s.annualPts||{};
 let worst=null,worstPts=Infinity;
 s.tempSeats.forEach(t=>{
  const p=pts[t]||0;
  if(p<worstPts){worstPts=p;worst=t;}
 });
 if(!worst||!s.tempSeats.length)return;
 if(s.tempSeatFixed.indexOf(worst)>=0)return;
 let incoming=null;
 try{
  const k=s.kjia;
  if(k&&k.champ&&k.champ!==kjiaMyName(s)&&!AI_TEAMS.some(t=>t.name===k.champ)){
   incoming=k.champ;
  }else if(k&&k.champ){
   const rank=kjiaRank(s)||[];
   incoming=rank.find(n=>n!==k.champ&&n!==kjiaMyName(s))||null;
  }
 }catch(e){}
 if(!incoming){
  incoming=KJIA_AI_TEAMS.find(n=>!AI_TEAMS.some(t=>t.name===n))||('K甲·新军'+gameYear(s));
 }
 s.tempSeats=s.tempSeats.filter(t=>t!==worst);
 if(incoming&&incoming!==s.teamName&&!isFixedSeatTeam(incoming)&&s.tempSeats.indexOf(incoming)<0&&s.tempSeatFixed.indexOf(incoming)<0)s.tempSeats.push(incoming);
 s.tempSeatLog=s.tempSeatLog||[];
 s.tempSeatLog.unshift(gameYear(s)+'：收回 '+worst+' 临时席 → '+incoming+' 顶上');
 s.tempSeatLog=s.tempSeatLog.slice(0,8);
 try{
  logEvent(s,' 临时席变动：'+worst+' 席位收回，'+incoming+' 获得下赛季 KPL 临时席位（固定席位不降级）');
 }catch(e){}
 if(worst===s.teamName){
  try{
   s.seatLost=true;
   logEvent(s,' 你的俱乐部临时席位被收回——降入 K甲。固定席位球队不会降级，升班马需用成绩保住席位');
  }catch(e){}
 }
 try{
  if(s.kjia&&s.kjia.champ===kjiaMyName(s)){
   logEvent(s,' 二队 K甲夺冠——俱乐部斩获临时席位资格赛话语权（关注度+）');
   addFans(s,1,'K甲夺冠·席位资格');
  }
 }catch(e){}
}
function tempSeatsPanelHtml(){
 const s=S;
 if(!s||!s.tempSeats||!s.tempSeats.length)return '';
 const atRisk=isTempSeat(s,s.teamName);
 let html=`<div class="panel"><h3>临时席位 <span class="tag">固定 16 + 临时 ${TEMP_SEAT_COUNT} · 只升不降</span></h3>
 <div class="hint" style="margin-bottom:8px"><b>升班马（常山UUG、桐乡情久）挂临时席</b>，年度成绩垫底会被收回，由 K甲/资格赛队伍顶上。老牌豪门（AG/狼队/eStar 等）是固定席，永不降级。${atRisk?'<b class="red">你执教的是升班马临时席——年度垫底有收回风险；夺冠可保留下赛季席位（免打席位赛，非固定席）。</b>':'你执教的俱乐部是固定席。'}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${s.tempSeats.map(t=>`<span class="tag" style="border-color:var(--gold)">${crest(null,t,14)} ${t} · 临时${t===s.teamName?'（你）':''}</span>`).join('')}</div>`;
 if((s.tempSeatFixed||[]).length){
  html+=`<div class="hint">夺冠保留下赛季席位（免打席位赛）：${s.tempSeatFixed.map(t=>_escTxt(t)).join('、')}</div>`;
 }
 if((s.tempSeatLog||[]).length){
  html+=`<div class="hint">近年变动：${s.tempSeatLog.slice(0,4).map(l=>_escTxt(l)).join('<br>')}</div>`;
 }
 html+=`</div>`;
 return html;
}

function youthDirectEntry(s){
 if(!s||s.mode!=='manager')return;
 if(s._youthDirectSeason===s.season&&s._youthDirectSplit===s.split)return;
 s.academy=s.academy||[];
 let n=0;
 while(n<YOUTH_DIRECT_ENTRY&&s.academy.length<6){
 try{
 const r=genRookie(s);
 s.academy.push(r);
 n++;
 }catch(e){break;}
 }
 if(n){
 s._youthDirectSeason=s.season;s._youthDirectSplit=s.split;
 try{logEvent(s,' 青训营直进 '+n+' 名新秀（官方直进名额 '+YOUTH_DIRECT_ENTRY+'）——培养后可用自留签晋升');}catch(e){}
 }
}

function freeSignBlockedReason(s){
 if(canFreeSign(s))return '';
 if(!s||!s.preseason)return '';
 return '已进入挂牌期（后 '+TRANSFER_FREE_DAYS+' 天）——只能挂牌/竞价/续约/租借，不能买断直签';
}

function transferOpsBlockedReason(s){
 if(!s||!s.players)return '尚未开局';
 if(s.mode==='coach')return '教练生涯：买断/出售由俱乐部打理——请用转会页「应急租借 / 引援申请」';
 if(s.mode==='player')return '选手生涯：不操作俱乐部买卖（由经纪与俱乐部处理）';
 return '';
}

const AI_ROSTER_MAX=5; // AI 队 def 名册上限（一队五位置）
function canSign(s,p,opts){
 if(!s||!p)return {ok:false,reason:'无效选手'};
 const o=opts||{};
 const actor=o.actor||'player';
 const name=p.name||'选手';
 const pid=p.id;
 const pos=p.pos;
 if(actor==='player'){
  if(typeof transferOpsBlockedReason==='function'){
   const mb=transferOpsBlockedReason(s);
   if(mb)return {ok:false,reason:mb};
  }
  if(typeof freeSignBlockedReason==='function'&&o.checkWindow!==false){
   const fb=freeSignBlockedReason(s);
   if(fb)return {ok:false,reason:fb};
  }
  if((s.players||[]).some(x=>x.id===pid))return {ok:false,reason:name+' 已在名单中'};
  if(typeof rosterFull==='function'&&rosterFull(s))
   return {ok:false,reason:'KPL 大名单上限 '+(typeof ROSTER_MAX!=='undefined'?ROSTER_MAX:10)+' 人'};
  const pst=(typeof playerStatus==='function')?playerStatus(p,s):null;
  if(pst&&pst.loanOut)return {ok:false,reason:name+' 租借在外，不能直接签约'};
  if(pst&&pst.kjia)return {ok:false,reason:name+' 正在 K甲锻炼'};
  return {ok:true,reason:''};
 }

 const team=o.team||s.teamName;
 const map=(typeof aiRosterDefMap==='function')?aiRosterDefMap(s):null;
 if(!map||!map[team])return {ok:true,reason:''}; // 无名册数据时不硬拦（时代/杯赛临时队）
 const arr=map[team];
 if(o.allowReplace!==true&&arr.length>=AI_ROSTER_MAX)
  return {ok:false,reason:team+' 名册已满（'+AI_ROSTER_MAX+'人）'};
 if(o.allowReplace!==true&&pos&&arr.some(id=>{
  const d=(typeof defOf==='function')?defOf(s,id):null;
  return d&&d.pos===pos;
 }))return {ok:false,reason:team+' 已有'+(POS&&POS[pos]?POS[pos][0]:pos)};
 if(pid&&arr.indexOf(pid)>=0&&o.allowReplace!==true)
  return {ok:false,reason:name+' 已在 '+team+' 名册'};
 return {ok:true,reason:''};
}
function canRelease(s,p,opts){
 if(!s||!p)return {ok:false,reason:'无效选手'};
 const o=opts||{};
 const name=p.name||'选手';
 if(typeof natCamping==='function'&&natCamping(s,p))
  return {ok:false,reason:name+' 国家队集训中，不能离队/出售'};
 if(p.loanOut)return {ok:false,reason:name+' 已在外租借'};
 if((p.kjia||0)>0)return {ok:false,reason:name+' K甲锻炼中，不能出售'};
 if(o.asSale&&p.loan)return {ok:false,reason:name+' 是租借选手，不能出售'};
 return {ok:true,reason:''};
}

function nLabel(p){return (p&&p.name)||'选手';}
function auditSave(s,opts){
 const silent=!!(opts&&opts.silent);
 const issues=[],repairs=[];
 if(!s)return {ok:true,issues,repairs};
 const players=s.players||[];
 const byId={};
 players.forEach(p=>{if(p&&p.id)byId[p.id]=p;});

 if(typeof aiRosterDefMap==='function'&&typeof aiDetachDef==='function'){
  const map=aiRosterDefMap(s);
  Object.keys(map).forEach(tn=>{
   if(tn===s.teamName)return;
   (map[tn]||[]).slice().forEach(pid=>{
    if(byId[pid]){
     issues.push('双挂：'+(byId[pid].name||pid)+' 同时在玩家名单与 '+tn+' AI 名册');
     aiDetachDef(s,pid);
     repairs.push('从 '+tn+' AI 名册移除 '+(byId[pid].name||pid));
    }
   });
  });

  const seen={};
  Object.keys(map).forEach(tn=>{
   map[tn]=(map[tn]||[]).filter(pid=>{
    if(seen[pid]&&seen[pid]!==tn){
     issues.push('AI 双挂：def '+pid+' 同时在 '+seen[pid]+' 与 '+tn);
     return false;
    }
    if(!seen[pid])seen[pid]=tn;
    return true;
   });
  });

  Object.keys(map).forEach(tn=>{
   if((map[tn]||[]).length>AI_ROSTER_MAX){
    issues.push('AI 超编：'+tn+' 名册 '+map[tn].length+' > '+AI_ROSTER_MAX);
    map[tn]=map[tn].slice(0,AI_ROSTER_MAX);
    repairs.push('截断 '+tn+' 名册至 '+AI_ROSTER_MAX);
   }
  });
 }

 const lineIds=new Set((s.lineup||[]).map(id=>id));
 (s.lineup||[]).slice().forEach(id=>{
  if(!byId[id]){
   issues.push('首发幽灵：'+id+' 不在名单');
   s.lineup=s.lineup.filter(x=>x!==id);
   if(s.pick){
    players.forEach(p=>{if(p.id===id&&s.pick[p.pos]!=null)delete s.pick[p.pos];});
   }
   repairs.push('从首发移除幽灵 '+id);
  }
 });

 const maxR=(typeof ROSTER_MAX!=='undefined')?ROSTER_MAX:10;
 if(players.length>maxR){
  issues.push('玩家名单超编：'+players.length+' > '+maxR);
  const ranked=players.slice().sort((a,b)=>{
   const oa=(typeof overall==='function')?overall(a):0;
   const ob=(typeof overall==='function')?overall(b):0;
   if(ob!==oa)return ob-oa;
   return (b.age||0)-(a.age||0); // 同总值留更年轻的
  });
  const keep=ranked.slice(0,maxR);
  const drop=ranked.slice(maxR);
  const keepIds=new Set(keep.map(p=>p.id));
  s.players=players.filter(p=>keepIds.has(p.id));
  s.lineup=(s.lineup||[]).filter(id=>keepIds.has(id));
  drop.forEach(p=>{
   s.freeAgents=s.freeAgents||[];
   if(!s.freeAgents.some(x=>x.id===p.id)){
    if(!(s.freeAgents||[]).some(x=>x.id===p.id))s.freeAgents.push({...p,team:null,willingness:Math.max(p.willingness||50,55),loanOut:null,kjia:0});
   }
   repairs.push(nLabel(p)+' 因名单超编转入自由市场');
  });
  try{logEvent(s,' 名单超编收敛：保留总值前 '+maxR+' 人，'+drop.length+' 人转入自由市场');}catch(e){}
 }

 players.forEach(p=>{
  if(!p)return;
  const n=p.name||p.id;
  const st=(typeof playerStatus==='function')?playerStatus(p,s):null;
  if(st&&st.loan&&st.loanOut){
   issues.push('状态冲突：'+n+' 同时 loan 与 loanOut');
   p.loanOut=null;repairs.push(n+' 清除 loanOut（保留 loan）');
  }
  if(st&&st.loanOut&&st.kjia){
   issues.push('状态冲突：'+n+' 同时租借与 K甲');
   p.kjia=0;repairs.push(n+' 清除 kjia（保留 loanOut）');
  }
  const listed=(s.listed||[]).some(x=>x.id===p.id);
  const busy=!!(st&&st.busy);
  if(listed&&busy){
   issues.push('挂牌冲突：'+n+' 挂牌但不在队可售状态');
   s.listed=s.listed.filter(x=>x.id!==p.id);
   s.bids=(s.bids||[]).filter(x=>x.id!==p.id);
   repairs.push(n+' 撤牌（不可售状态）');
  }
  const w=p.wage;
  if(typeof w!=='number'||!isFinite(w)||w<0){
   issues.push('工资非法：'+n+' wage='+w);
   repairs.push(n+' 工资待 scrubWages 重估');
  }
 });

 if(s.captain&&!byId[s.captain]){
  issues.push('队长幽灵：captain='+s.captain);
  s.captain=null;repairs.push('清空队长');
 }

 (s.offers||[]).slice().forEach(o=>{
  if(o&&o.pid&&!byId[o.pid]&&!(s.market||[]).some(x=>x.id===o.pid)){
   issues.push('报价幽灵：pid='+o.pid);
   s.offers=s.offers.filter(x=>x!==o);
   repairs.push('清除幽灵报价 '+o.pid);
  }
 });

 if(typeof s.fund!=='number'||!isFinite(s.fund)){
  issues.push('资金非法：fund='+s.fund);
  s.fund=0;repairs.push('fund 归零');
 }
 const report={ok:!issues.length,issues,repairs};
 s._lastAudit=report;
 if(!silent&&issues.length){
  try{
   logEvent(s,' 存档巡检：发现 '+issues.length+' 项不一致'+(repairs.length?'，已自动修复 '+repairs.length+' 项':'')+'（详情见控制台）');
  }catch(e){}
  try{console.warn('[auditSave]',issues,repairs);}catch(e){}
 }
 return report;
}

<script>
const matchWinner=m=>{
 if(!m)return null;
 if(m.r===m.a||m.r===m.b)return m.r;
 const a=Number(m.ms)||0,b=Number(m.es)||0;
 return a>=b?m.a:m.b;
};
const loserOf=m=>{const w=matchWinner(m);return w===m.a?m.b:m.a;};

const CHALLENGER_TEAMS=[['K甲·苍穹','K甲'],['K甲·星火','K甲'],['K甲·沧澜','K甲'],
 ['全国大赛·破晓','全国大赛'],['青训·晨曦','青训'],['高校·逐梦','高校'],['职工·匠心','职工'],

function genChallengerDef(s,i,teamName,band){
 const used=new Set();
 (s.extraDefs||[]).forEach(d=>used.add(d.name));
 Object.values(s.aiRosterDefs||{}).forEach(arr=>arr.forEach(id=>{const d=defOf(s,id);if(d)used.add(d.name);}));
 Object.values(s.challDefMap||{}).forEach(arr=>arr.forEach(id=>{const d=defOf(s,id);if(d)used.add(d.name);}));
 (s.players||[]).forEach(p=>used.add(p.name));

 const name=poolName(CHALLENGER_NAMES,used);
 used.add(name);
 const pos=POS_ORDER[i%5];

 const baseLv=band==='K甲'?75:band==='全球'?78:band==='主播'?68:65;
 const b=v=>clamp(v+rnd(-5,5),55,86);
 return {id:'ch'+gameYear(s)+'_'+i,name,pos,team:teamName,tags:['特权'],
 base:[b(baseLv),b(baseLv-1),b(baseLv),b(baseLv-1)],
 skill:{n:'挑战者祝福',t:pick(['lane','farm','team','mind']),d:'低赛道挑战 KPL 时的体系优势'},
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,career:'挑战者杯'+band+'赛道选手，'+(band==='K甲'?'K甲职业队':'来自'+band+'赛道')+'。'};
}
function setupChallenger(s){
 const p=ensureLeagueChampion(s); // 玩家止步/季后赛未补完时先 AI 打出冠军，否则赛历卡死
 if(!p){logEvent(s,' 挑战者杯暂缓：本赛季冠军尚未产生');return;}
 const champ=p.final.r,runner=p.final.r===p.final.a?p.final.b:p.final.a;

 s.challDefMap={};
 let ni=0;
 CHALLENGER_TEAMS.forEach(([tn,band])=>{
 const ids=[];
 for(let k=0;k<5;k++){const def=genChallengerDef(s,ni++,tn,band);(s.extraDefs=s.extraDefs||[]).push(def);ids.push(def.id);}
 s.challDefMap[tn]=ids;
 });

 const league18=(s.leagueTeams&&s.leagueTeams.length)?s.leagueTeams.slice():AI_TEAMS.map(t=>t.name);
 const chPool=CHALLENGER_TEAMS.map(x=>x[0]);
 const rest=shuffle([...league18,...chPool].filter(t=>t!==champ&&t!==runner)); // 30 队（玩家=春冠时不重复计入）
 const teams=[champ,...rest.slice(0,15),runner,...rest.slice(15)]; // 32 队，种子分列 idx0/idx16 两个半区
 s.challenger={stage:'single',r1:[],r2:null,po:null,final:null,champ:null,teams};
 for(let i=0;i<16;i++)s.challenger.r1.push({a:teams[i],b:teams[31-i],r:null}); // 单败首轮 BO5
 setPhase(s,'challenger',{who:'setupChallenger',force:true});
 logEvent(s,' '+gameYear(s)+' 挑战者杯开幕（32队·八大赛道）！'+champ+'（1号种子）与 '+runner+'（2号种子）分列两半区');
 const myIn=teams.includes(s.teamName);
 if(!myIn){simCup('challenger',s);finishChallenger(s);return;}
 save();renderAll();
}
function challengerStep(s){
 const c=s.challenger;if(!c)return;
 const P=(m,slot,label,bo)=>playCupMatch(s,m,slot,label,bo);
 if(c.stage==='single'){
 for(let i=0;i<16;i++){const m=c.r1[i];if(!m.r){P(m,'ch_r1_'+(i+1),'挑战者杯·32强',KPL.BO5);return;}}
 if(!c.r2){c.r2=[];for(let i=0;i<8;i++)c.r2.push({a:c.r1[i*2].r,b:c.r1[i*2+1].r,r:null});}
 for(let i=0;i<8;i++){const m=c.r2[i];if(!m.r){P(m,'ch_r2_'+(i+1),'挑战者杯·16强',KPL.BO7);return;}}
 c.stage='po';
 c.po=buildCup8(shuffle(c.r2.map(m=>m.r)));
 logEvent(s,' 挑战者杯 8 强双败开启（BO7）：'+c.r2.map(m=>m.r).join('、'));
 save();renderAll();
 return;
 }
 challengerPoStep(s);
}

function cup8PoStep(s,p,cfg){
 const P=(m,suf,label)=>playCupMatch(s,m,cfg.prefix+suf,cfg.label+label,KPL.BO7);
 for(let i=0;i<4;i++)if(!p.wb1[i].r){P(p.wb1[i],'wb1_'+(i+1),'·胜者组首轮');return;}
 for(let i=0;i<2;i++){const m=p.lb1[i];if(m.a===null)m.a=loserOf(p.wb1[i*2]);if(m.b===null)m.b=loserOf(p.wb1[i*2+1]);if(!m.r){P(m,'lb1_'+(i+1),'·败者组首轮');return;}}
 for(let i=0;i<2;i++){const m=p.wb2[i];if(m.a===null)m.a=p.wb1[i*2].r;if(m.b===null)m.b=p.wb1[i*2+1].r;if(!m.r){P(m,'wb2_'+(i+1),'·胜者组半决赛');return;}}
 for(let i=0;i<2;i++){const m=p.lb2[i];if(m.a===null)m.a=p.lb1[i].r;if(m.b===null)m.b=loserOf(p.wb2[i]);if(!m.r){P(m,'lb2_'+(i+1),'·败者组第二轮');return;}}
 if(p.wf.a===null){const _b0=p.wb2&&p.wb2[0],_b1=p.wb2&&p.wb2[1];if(_b0&&_b1){p.wf.a=_b0.r;p.wf.b=_b1.r;}}
 if(!p.wf.r){P(p.wf,'wf','·胜者组决赛');return;}
 if(p.lbs.a===null){const _c0=p.lb2&&p.lb2[0],_c1=p.lb2&&p.lb2[1];if(_c0&&_c1){p.lbs.a=_c0.r;p.lbs.b=_c1.r;}}
 if(!p.lbs.r){P(p.lbs,'lbs','·败者组半决赛');return;}
 if(p.lbf.a===null){p.lbf.a=loserOf(p.wf);p.lbf.b=p.lbs.r;}
 if(!p.lbf.r){P(p.lbf,'lbf','·败者组决赛');return;}
 const fin=cfg.finalMatch();
 if(fin.a===null)fin.a=p.wf.r;
 if(fin.b===null)fin.b=p.lbf.r;
 if(!fin.r){playCupMatch(s,fin,cfg.finalSlot,cfg.finalLabel,cfg.finalBo);return;}
 cfg.onFinish();

function challengerPoStep(s){

function finishChallenger(s){

 let prize=0;
 if(c.champ===s.teamName)prize=500;
 else if(runner===s.teamName)prize=250;
 else if(c.po.lbf.r&&loserOf(c.po.lbf)===s.teamName)prize=133;
 else if(c.po.lbs.r&&loserOf(c.po.lbs)===s.teamName)prize=67;
 else if((c.po.lb2||[]).some(m=>m.r&&loserOf(m)===s.teamName)||(c.po.lb1||[]).some(m=>m.r&&loserOf(m)===s.teamName))prize=67;
 if(prize)grantPrize(s,prize,'挑战者杯奖金');
 if(c.champ===s.teamName||runner===s.teamName){
 s.honors=s.honors||[];
 s.honors.push({season:s.season,title:gameYear(s)+' 挑战者杯 '+(c.champ===s.teamName?'冠军':'亚军'),champion:c.champ===s.teamName,roster:titleRoster(s)});
 s.honors=s.honors.slice(-20);
 noteCoachHonor(s,gameYear(s)+' 挑战者杯 冠军',c.champ===s.teamName);
 }
 if(c.champ===s.teamName)registerChampCore(s,gameYear(s)+' 挑战者杯'); // 冠军班底羁绊
 else if(c.champ)registerAiChampCore(s,c.champ);
 awardFMVP(s,c.champ,gameYear(s)+' 挑战者杯');

 s.yearStages=s.yearStages||[];
 const chPlace=c.champ===s.teamName?'冠军':runner===s.teamName?'亚军'
 :(c.po.lbf.r&&loserOf(c.po.lbf)===s.teamName)?'四强'
 :((c.po.lbs.r&&loserOf(c.po.lbs)===s.teamName)||c.po.lb2.concat(c.po.lb1).some(m=>m.r&&loserOf(m)===s.teamName))?'八强'

 :c.r1.some(m=>m.r&&loserOf(m)===s.teamName)?'32强':'参赛';
 s.yearStages.push({ev:'挑战者杯',place:chPlace});
 try{gcDefs(s);}catch(e){}

 startSplit(s,'summer'); // 挑杯收官 → 夏季赛转会期
}
