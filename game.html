<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者电竞经理 · KPL 篇</title>
<style>
/* ============================================================
   王者电竞经理 · 设计系统 v3 「NEON ARENA」电竞转播风
   暗夜蓝底 + 霓虹青/紫双色 · 切角 HUD 几何 · 发光强调
   青=主色/信息 · 紫=次强调 · 金=仅奖赏 · 红=负面 · 绿=正面
   数字用 Bahnschrift（DIN 风，系统自带离线可用）
   ============================================================ */
:root{
  --bg:#04060d; --surface:rgba(13,19,34,.92); --surface2:#0d1526; --raise:#152038; --sunken:#060a13;
  --line:#1d2a47; --line2:#2f4270;
  --txt:#eaf2ff; --dim:#8fa0c4; --faint:#5a6a92;
  --accent:#00e5ff; --accent-deep:#0090c8; --accent2:#8b5cff;
  --gold:#ffc84a; --red:#ff4d6b; --green:#00e09c;
  --r:#8b9bbb; --sr:#4da3ff; --ssr:#ffc84a;
  --card2:#0d1526; --cyan:var(--accent);
  --glow:drop-shadow(0 0 8px rgba(0,229,255,.45));
  --grad-a:linear-gradient(90deg,var(--accent),var(--accent2) 60%,transparent);
  --grad-btn:linear-gradient(135deg,#00e5ff,#0090ff);
  --grad-gold:linear-gradient(135deg,#ffd95e,#ff9d2e);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  background:
    radial-gradient(900px 480px at 12% -8%,rgba(0,229,255,.09),transparent 60%),
    radial-gradient(820px 460px at 105% 14%,rgba(139,92,255,.10),transparent 62%),
    radial-gradient(700px 700px at 50% 120%,rgba(0,229,255,.05),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(70,95,160,.055) 31px 32px),
    repeating-linear-gradient(90deg,transparent 0 31px,rgba(70,95,160,.055) 31px 32px),
    var(--bg);
  color:var(--txt);
  font-family:Bahnschrift,"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:14px;line-height:1.55;min-height:100vh;padding-bottom:56px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent-deep),var(--accent2));border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(0,229,255,.25)}
.wrap{max-width:1060px;margin:0 auto;padding:16px 18px}
.ic{flex:none;vertical-align:-2px}
svg.ic{display:inline-block}

/* ===== 切角工具 ===== */
.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

/* ===== Header ===== */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;
  background:linear-gradient(180deg,rgba(17,26,46,.92),rgba(11,16,30,.9));
  border:1px solid var(--line2);border-radius:4px;position:sticky;top:10px;z-index:50;
  backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.5),0 1px 0 rgba(0,229,255,.25) inset}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2) 45%,transparent 85%)}
.logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(139,92,255,.16));
  border:1px solid var(--accent-deep);flex:none;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  filter:drop-shadow(0 0 6px rgba(0,229,255,.35))}
.hd-name{font-size:17px;font-weight:800;letter-spacing:1px;line-height:1.25;text-transform:uppercase}
.hd-name small{display:block;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;align-items:center;gap:7px;background:rgba(13,21,38,.9);border:1px solid var(--line);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  padding:6px 11px;min-width:0}
.stat .ic{color:var(--faint)}
.stat b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.5px}
.stat small{font-size:10px;color:var(--faint);white-space:nowrap;letter-spacing:1px}
.stat.gold b{color:var(--gold);text-shadow:0 0 10px rgba(255,200,74,.4)} .stat.red b{color:var(--red)} .stat.green b{color:var(--green)}
.stat.gold .ic{color:var(--gold)} .stat.red .ic{color:var(--red)} .stat.green .ic{color:var(--green)}
.hd-btn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--line2);
  color:var(--dim);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  padding:7px 11px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;letter-spacing:.5px}
.hd-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(0,229,255,.06)}

/* ===== Nav ===== */
nav{display:flex;gap:4px;margin:14px 0;padding:4px;background:rgba(11,17,32,.9);border:1px solid var(--line);
  border-radius:4px;flex-wrap:wrap;box-shadow:0 4px 20px rgba(0,0,0,.35)}
nav button{flex:1;min-width:88px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 6px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--dim);cursor:pointer;font-size:13px;font-weight:700;transition:.15s;letter-spacing:1px}
nav button .ic{color:var(--faint);transition:.15s}
nav button:hover{color:var(--txt);background:rgba(47,66,112,.25)}
nav button.on{background:linear-gradient(180deg,rgba(0,229,255,.14),rgba(0,229,255,.03));
  color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(0,229,255,.5)}
nav button.on .ic{color:var(--accent);filter:drop-shadow(0 0 5px rgba(0,229,255,.6))}
section.page{display:none}
section.page.on{display:block;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ===== Cards / panels ===== */
.panel{background:linear-gradient(180deg,rgba(19,28,50,.72),rgba(12,18,33,.94) 90px);
  border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px;
  position:relative;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2) 38%,transparent 78%);opacity:.8}
.panel h3{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;margin-bottom:13px;letter-spacing:1px}
.panel h3 .h-ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(139,92,255,.18));color:var(--accent);flex:none;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  box-shadow:0 0 10px rgba(0,229,255,.25) inset}
.panel h3 .h-ic .ic{width:14px;height:14px}
.panel h3 .tag{font-size:10px;background:var(--surface2);border:1px solid var(--line2);color:var(--dim);
  padding:2px 9px;font-weight:600;letter-spacing:1px;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g5{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2{grid-template-columns:1fr}.stats .stat{min-width:62px}}

/* ===== 双栏仪表盘（桌面端主列+侧栏，压缩页面长度） ===== */
.page-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.page-cols>.col{min-width:0}
.page-cols>.col>.panel:last-child{margin-bottom:0}
@media(max-width:1000px){.page-cols{grid-template-columns:1fr}}

/* ===== 面板折叠（点标题收起/展开，偏好存 localStorage） ===== */
.panel.collapsible>h3{cursor:pointer;user-select:none}
.panel.collapsible>h3::after{content:"▸";margin-left:auto;color:var(--faint);font-size:12px;transition:transform .18s;transform:rotate(90deg)}
.panel.collapsed>h3::after{transform:rotate(0)}
.panel.collapsed>*:not(h3){display:none}
.panel.collapsed{padding-bottom:12px}

/* ===== Player card ===== */
.pcard{background:linear-gradient(180deg,var(--raise),var(--surface2) 70%);
  border:1px solid var(--line);border-radius:4px;padding:13px;position:relative;
  transition:.15s;overflow:hidden}
.pcard::before{content:"";position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--line2);transition:.15s}
.pcard:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pcard .p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pcard .p-name{font-weight:800;font-size:15px;letter-spacing:.5px}
.pcard .p-pos{font-size:10px;font-weight:800;padding:2px 8px;background:rgba(0,229,255,.12);color:var(--accent);letter-spacing:1px;
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.pcard .p-rarity{font-size:10px;font-weight:800;letter-spacing:2px}
.pcard .p-tag{font-size:9px;margin-left:3px;background:rgba(139,92,255,.16);color:#b3a0ff;padding:1px 5px;border-radius:3px;letter-spacing:0}
.pcard .p-hero{font-size:11px;color:var(--dim);margin-bottom:4px}
.pcard .p-hero b{color:var(--txt)}
.pcard .p-disc{float:right;font-size:9px;background:rgba(255,77,107,.16);color:var(--red);padding:1px 6px;border-radius:3px;letter-spacing:0}
.pcard .p-hero-pick{border:1px solid var(--accent);background:rgba(0,229,255,.07);box-shadow:0 0 12px rgba(0,229,255,.15) inset}
.pcard .p-skill{font-size:11px;color:var(--dim);margin:6px 0;line-height:1.5;min-height:32px}
.pcard .p-skill b{color:var(--dim)}
.pcard .attr{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11px;color:var(--faint);margin-bottom:8px}
.pcard .attr i{font-style:normal;color:var(--txt);float:right;font-weight:700;font-variant-numeric:tabular-nums}
.pcard .p-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);border-top:1px solid var(--line);padding-top:7px}
.pcard .p-foot b{color:var(--txt);font-variant-numeric:tabular-nums}
.pcard.r{--rc:var(--r)} .pcard.r .p-rarity{color:var(--r)}
.pcard.r::before{background:linear-gradient(180deg,var(--r),transparent)}
.pcard.sr{--rc:var(--sr)} .pcard.sr .p-rarity{color:var(--sr)}
.pcard.sr::before{background:linear-gradient(180deg,var(--sr),transparent)}
.pcard.ssr{--rc:var(--ssr)} .pcard.ssr .p-rarity{color:var(--ssr);text-shadow:0 0 10px rgba(255,200,74,.55)}
.pcard.ssr::before{background:linear-gradient(180deg,var(--gold),rgba(255,157,46,.25) 70%,transparent)}
.pcard.ssr{border-color:rgba(255,200,74,.4)}
.pcard .p-hp{position:absolute;top:8px;right:8px;font-size:9px;color:var(--red)}
.pcard .p-salary{color:var(--gold)}
.pcard .bench-mark{position:absolute;top:8px;left:8px;font-size:9px;background:var(--raise);color:var(--dim);padding:1px 7px;border-radius:3px}
.pcard button{margin-top:8px;width:100%;padding:7px;border:1px solid var(--line2);
  background:var(--raise);color:var(--txt);cursor:pointer;font-size:12px;font-weight:700;transition:.15s;letter-spacing:.5px;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.pcard button:hover{border-color:var(--accent);color:var(--accent)}
.pcard button.primary{background:var(--grad-btn);border-color:transparent;color:#031018;filter:drop-shadow(0 0 7px rgba(0,229,255,.35))}
.pcard button.primary:hover{color:#031018;filter:drop-shadow(0 0 12px rgba(0,229,255,.6))}
.pcard button.danger{color:var(--red)}
.pcard button.danger:hover{border-color:var(--red);background:rgba(255,77,107,.08);color:var(--red)}
.pcard button:disabled{opacity:.4;cursor:not-allowed}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;
  border:1px solid var(--line2);background:linear-gradient(180deg,var(--raise),var(--surface2));color:var(--txt);
  cursor:pointer;font-size:13px;font-weight:700;transition:.15s;letter-spacing:1px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.07)}
.btn.primary{background:var(--grad-btn);border-color:transparent;color:#031018;filter:drop-shadow(0 0 8px rgba(0,229,255,.4))}
.btn.primary:hover{filter:drop-shadow(0 0 14px rgba(0,229,255,.65));color:#031018}
.btn.gold{background:var(--grad-gold);border-color:transparent;color:#2b1d05;filter:drop-shadow(0 0 8px rgba(255,170,60,.4))}
.btn.gold:hover{filter:drop-shadow(0 0 14px rgba(255,170,60,.65));color:#2b1d05}
.btn.danger{color:var(--red);border-color:rgba(255,77,107,.45)}
.btn.danger:hover{border-color:var(--red);background:rgba(255,77,107,.08);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.sm{padding:5px 13px;font-size:12px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}

/* ===== Match / league ===== */
.match{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);
  border:1px solid var(--line);border-radius:4px;padding:11px 15px;margin-bottom:9px;transition:.15s;position:relative}
.match:hover{border-color:var(--line2)}
.match .vs{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.match .vs .tname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match .vs .power{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.match .score{font-size:20px;font-weight:800;color:var(--dim);min-width:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.match.win{border-color:rgba(0,224,156,.45);box-shadow:0 0 14px rgba(0,224,156,.12) inset}
.match.win .score{color:var(--green);text-shadow:0 0 12px rgba(0,224,156,.5)}
.match.lose{border-color:rgba(255,77,107,.4)}
.match.lose .score{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--faint);font-size:11px;font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);letter-spacing:2px}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.me td{background:linear-gradient(90deg,rgba(0,229,255,.10),rgba(0,229,255,.02));font-weight:700}
.tbl tr.me td:first-child{border-left:2px solid var(--accent)}
.logbox{background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:6px 14px;max-height:320px;
  overflow-y:auto;font-size:12.5px;line-height:1.9}
.logbox div{border-bottom:1px dashed var(--line)}
.logbox div:last-child{border-bottom:none}
.logbox .win{color:var(--green)} .logbox .lose{color:var(--red)} .logbox .info{color:var(--dim)} .logbox .gold{color:var(--gold)}
.event-card{border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--surface2);border-radius:4px;padding:11px 14px;margin-bottom:9px}
.event-card .et{font-weight:800;color:var(--accent);font-size:12px;margin-bottom:4px;letter-spacing:1px}
.event-card p{font-size:13px;color:var(--txt);line-height:1.7}
.event-card .opt{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

/* ===== misc ===== */
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.dim{color:var(--dim)} .gold{color:var(--gold)} .cyan{color:var(--accent)} .red{color:var(--red)} .green{color:var(--green)}
.hint{font-size:11px;color:var(--dim);line-height:1.65}
.progress{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}
.pbar{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim)}
.pbar .progress{flex:1;margin-top:0}
.modal-bg{position:fixed;inset:0;background:rgba(2,4,10,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:linear-gradient(180deg,rgba(19,28,50,.96),rgba(10,15,28,.97));border:1px solid var(--line2);border-radius:4px;padding:22px;
  max-width:560px;width:100%;min-width:0;max-height:88vh;overflow-y:auto;
  position:relative;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 40px rgba(0,229,255,.08)}
.modal::before,.modal::after{content:"";position:absolute;width:22px;height:22px;pointer-events:none}
.modal::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.modal::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent2);border-right:2px solid var(--accent2)}
.modal.wide{max-width:720px}
.modal h2{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:17px;font-weight:800;letter-spacing:1px}
.modal h2 .h-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(139,92,255,.18));color:var(--accent);flex:none;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.modal h2 .tag{font-size:10px;background:var(--surface2);border:1px solid var(--line2);color:var(--dim);
  padding:2px 9px;font-weight:600;margin-left:auto;letter-spacing:1px;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--raise),var(--surface2));border:1px solid var(--accent-deep);
  color:var(--txt);padding:10px 20px;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 18px rgba(0,229,255,.25);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.league-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;margin-top:10px;
  border:1px solid rgba(255,200,74,.55);background:linear-gradient(135deg,rgba(255,200,74,.12),rgba(255,157,46,.05));color:var(--gold);
  cursor:pointer;font-size:14px;font-weight:800;transition:.15s;letter-spacing:2px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  animation:pulseGold 2.6s ease-in-out infinite}
.league-btn:hover{background:rgba(255,200,74,.2)}
@keyframes pulseGold{0%,100%{filter:drop-shadow(0 0 4px rgba(255,170,60,.25))}50%{filter:drop-shadow(0 0 12px rgba(255,170,60,.55))}}
.banner{background:linear-gradient(180deg,rgba(19,28,50,.8),rgba(11,16,30,.94));
  border:1px solid var(--line2);border-radius:4px;padding:15px 18px;margin-bottom:14px;
  display:flex;align-items:center;gap:13px;flex-wrap:wrap;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 0 14px rgba(0,229,255,.5)}
.banner .big{font-size:19px;font-weight:800;letter-spacing:1.5px}

function winChance(my,opp){return 1/(1+Math.pow(10,(opp-my)/220));}

function slotKey(){return SAVE_KEY+(curSlot>1?'_'+curSlot:'');}
function b64e(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}
function b64d(s){const bin=atob(s);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
let S=null; // 全局状态

function newState(teamName,icon){

    players:[],lineup:[],market:[],

  };
}
function rosterAll(s){return s.players;}
function rosterLineup(s){return s.lineup.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);}
function rosterBench(s){return s.players.filter(p=>!s.lineup.includes(p.id));}
function moraleAll(s,v){s.players.forEach(p=>p.morale=clamp(p.morale+v,20,100));}
/* 选手当前选用英雄（未 BP 时默认招牌） */
function pickedHero(s,p){return (s.pick&&s.pick[p.pos])||p.sig;}
function heroOf(heroId){return HEROES.find(x=>x.n===heroId)||null;}
function heroAtPos(heroId,pos){const h=heroOf(heroId);return h&&h.pos.includes(pos)?h:null;}
function playerPower(p,heroId){
  const a=p.attrs;
  let pow=a.lane*0.25+a.farm*0.25+a.team*0.3+a.mind*0.2;
  const sk=p.skill;
  if(sk.t==='lane')pow+=a.lane*0.12*0.25;
  if(sk.t==='farm')pow+=a.farm*0.12*0.25;
  if(sk.t==='team')pow+=a.team*0.12*0.3;
  if(sk.t==='mind')pow+=a.mind*0.12*0.2;
  // 英雄加成：按熟练度（绝活+8% / 熟练+4% / 一般0% / 生疏-8%），版本热门再 +2%
  const h=heroId?heroAtPos(heroId,p.pos):null;
  if(h){
    pow*=1+HERO_LV[heroLv(p,heroId)].b;
    if(h.hot)pow*=1.02;
  }
  // 带伤：按伤情剩几天打折（10% ~ 30%），随恢复逐渐回稳
  if(p.injury>0)pow*=1-0.1*Math.min(p.injury,3);
  // 体力：低于 60 开始衰减（0 体力约 -24%）；每小局 -8、每日自然恢复 +10、休息 +55
  const eng=(p.energy==null)?100:p.energy;
  if(eng<60)pow*=1-(60-eng)*0.004;
  return Math.round(pow);
}
/* AI 队战力：与 teamPower 同刻度（五位置最强者求和 × 士气系数）。
   体力由 playerPower 实时读取：构建时=满体力（联赛模拟用），系列赛中用实时值（逐局衰减）。
   AI 无玩家侧教练/羁绊，用 AI_STAFF 折算职业队平均教练班底水平。 */
const AI_STAFF=1.06;
function aiRosterPower(roster){
  if(!roster||!roster.length)return 0;
  const best={};
  roster.forEach(p=>{
    const v=playerPower(p,p.sig);
    if(best[p.pos]==null||v>best[p.pos])best[p.pos]=v;
  });
  let sum=0,cnt=0,mSum=0;
  POS_ORDER.forEach(pos=>{if(best[pos]!=null){sum+=best[pos];cnt++;}});
  if(!cnt)return 0;
  roster.forEach(p=>mSum+=(p.morale||80));
  const morale=clamp(mSum/roster.length/100,0.82,1.1);
  return Math.round(sum*morale*AI_STAFF);
}
/* picks 可选：BP 进行中实时结算用（未选位置回退招牌）；缺省走 S.pick */
function teamPower(s,picks){
  const ls=rosterLineup(s);
  if(!ls.length)return 0;
  const ph=p=>(picks&&picks[p.pos])||pickedHero(s,p);
  let pow=ls.reduce((t,p)=>t+playerPower(p,ph(p)),0);
  const mAvg=ls.reduce((t,p)=>t+p.morale,0)/ls.length;
  pow*=clamp(mAvg/100,0.82,1.1);
  activeBonds(s).forEach(b=>pow*=1+b.bonus/100);
  // 主教练加成：全队战力% + 侧重属性额外加成
  if(s.coach){
    const c=s.coach;
    const w={lane:0.25,farm:0.25,team:0.3,mind:0.2}[c.style];
    const attrSum=ls.reduce((t,p)=>t+p.attrs[c.style],0);
    pow+=attrSum*c.styleBonus/100*w;
    pow*=1+c.bonus/100;
  }
  // 连胜/连败手感：±2%/场，上限 ±10%
  if(s.streak)pow*=1+clamp(s.streak,-5,5)*0.02;
  return Math.round(pow);
}
function activeBonds(s){
  const ls=rosterLineup(s),cnt={};
  ls.forEach(p=>{if(p.team)cnt[p.team]=(cnt[p.team]||0)+1;});
  const act=[];
  for(const t in cnt){
    const def=TEAM_BONDS[t];
    if(!def)continue;
    if(cnt[t]>=def.full)act.push({bonus:def.bonusFull,desc:def.descFull});
    else if(cnt[t]>=def.min)act.push({bonus:def.bonusMin,desc:def.descMin});
  }
  return act;
}
function weeklyWage(s){
  let sum=s.players.reduce((t,p)=>t+p.wage,0);
  if(s.coach)sum+=s.coach.wage;
  return sum;
}
function save(){try{localStorage.setItem(slotKey(),JSON.stringify(S));}catch(e){console.warn('save fail',e);}}
function migrateSave(){
  if(!S)return;
  S.aiRosters={}; // 名册更新后重建对手阵容
  // 修复旧版 0:0 模拟（KPL.BO5 未定义）造成的错误积分：回滚后按新逻辑重算
  if(typeof phaseGroups==='function'&&S.tables&&S.aiSchedule){
    phaseGroups(S).forEach(g=>{
      (S.aiSchedule[g]||[]).forEach(m=>{
        if(!(m.r&&m.r.mw===0&&m.r.ow===0))return;
        const ta=(S.tables[g]||{})[m.a],tb=(S.tables[g]||{})[m.b];
        if(ta&&tb){tb.w=Math.max(0,tb.w-1);tb.pts=Math.max(0,tb.pts-1);ta.l=Math.max(0,ta.l-1);}
        const r=simSeriesResult(S,m.a,m.b,KPL.BO5);
        m.r={w:r.win?m.a:m.b,mw:r.mw,ow:r.ow};
        if(ta&&tb){
          if(r.win){ta.w++;ta.pts++;tb.l++;}
          else{tb.w++;tb.pts++;ta.l++;}
          ta.pw+=r.mw;tb.pw+=r.ow;
        }
      });
    });
  }
  S.series=S.series||null;
  if(S.series&&!S.series.side)S.series.side='blue';
  S.pick=S.pick||{};
  S.coach=S.coach||null;
  S.coachMarket=S.coachMarket||[];
  S.honors=S.honors||[];
  if(!S.wageCap)S.wageCap=90;
  if(!S.seedPower)S.seedPower=280;
  if(!S.streak)S.streak=0;
  if(S.preseason==null)S.preseason=false; // 旧档迁移：默认已过转会期
  if(!S.transferWindow)S.transferWindow=0;
  S.transferList=S.transferList||[];
  // 旧档非卖品意愿=100 → 动态化（85-100 初始区间）
  (S.transferList||[]).forEach(p=>{if(p.untouchable&&p.willingness===100)p.willingness=rnd(85,100);});
  S.listed=S.listed||[];
  S.bids=S.bids||[];
  S.history=S.history||[];
  S.academy=S.academy||[];
  S.retiredCoaches=S.retiredCoaches||[];
  S.hosts=S.hosts||[];
  S.freeAgents=S.freeAgents||[];
  S.extraDefs=S.extraDefs||[]; // AI 转会生态：新星 def（aiRosterDefs 懒初始化自 AI_ROSTERS）
  S.retiredDefs=S.retiredDefs||[];
  // 总值化迁移：教练/名宿旧档 rarity → rating 评分（选手总值实时计算，无需迁移）
  const R2RATE={SSR:90,SR:80,R:70};
  [S.coach].concat(S.coachMarket||[],S.retiredCoaches||[]).forEach(c=>{
    if(c&&c.rating==null&&c.rarity)c.rating=R2RATE[c.rarity]||80;
  });
  // 旧赛制存档（无 groups）→ 重置为 KPL 2025 新赛制（保留队伍/资金/教练）
  if(!S.groups||!S.groups.G1){
    S.phase='r1';S.matchIdx=0;
    S.groups={};S.tables={};S.aiPower={};S.card=null;S.playoff=null;S.eliminated=[];
    S.stage='regular';S.champion=false;
  }
  if(!S.phase)S.phase='r1';
  S.players.forEach(p=>{
    if(p.injury==null)p.injury=0;
    if(p.mvp==null)p.mvp=0;
    if(p.retiring==null)p.retiring=false;
    if(p.age==null)p.age=ageByPos(p.pos,false);
    if(!p.sig)p.sig=(HEROES.find(h=>h.pos[0]===p.pos)||{}).n||null;
    if(!p.career){const def=PLAYER_POOL.find(d=>d.id===p.id);if(def)p.career=def.career||'';}
    // 英雄池：字符串→对象；补全本职+摇摆位英雄，并清掉异位置英雄（旧档的储备/错位英雄统一洗掉）
    if(!p.heroPool||typeof p.heroPool[0]==='string'){
      const old=(p.heroPool||[]).map(h=>typeof h==='string'?h:h.n);
      p.heroPool=old.map(n=>({n,lv:n===p.sig?3:2}));
    }
    if(p.sig&&!p.heroPool.some(x=>x.n===p.sig))p.heroPool.unshift({n:p.sig,lv:3});
    HEROES.filter(h=>h.pos.includes(p.pos)).forEach(h=>{if(!p.heroPool.some(x=>x.n===h.n))p.heroPool.push({n:h.n,lv:2});});
    p.heroPool=p.heroPool.filter(x=>{const h=heroOf(x.n);return h&&h.pos.includes(p.pos);});
  });
}
function ensureSeason(s){
  // 启动/读档后确保赛制状态完整（新档 initGroups 在 createTeam 调用；旧档迁移后这里补）
  if(!s.groups||!s.groups.G1){
    s.stage='regular';
    initGroups(s);
    logEvent(s,'🔄 赛制升级为 KPL 2025 官方赛制（18队 · S/A/B 三组）');
    save();
  }
}

/* ================= 选手年龄体系（真实 KPL 生命周期） =================
   出道18-19（青训17跟训）→ 黄金期 → 下滑期 → 退役
   打野/射手寿命最短（24退役）· 对抗/中路中等（26退役）· 辅助最长（31退役，27-28仍可首发） */
const AGE_MODEL={
  jg:{gold:21,decline:22,retire:24,decay:2}, // 打野：吃手速反应，23岁后难首发，24退役
  ad:{gold:21,decline:22,retire:24,decay:2}, // 射手（发育路）：同上
  top:{gold:22,decline:23,retire:26,decay:1},// 对抗路：操作+意识，24-25下滑，26+极少首发
  mid:{gold:22,decline:23,retire:26,decay:1},// 中路：同上
  sup:{gold:24,decline:25,retire:31,decay:1},// 游走：靠大局观指挥，寿命最长，27-28仍有首发
};
function ageByPos(pos,isRookie){
  if(isRookie)return rnd(16,17); // 青训跟训
  if(pos==='sup')return rnd(19,22); // 辅助出道/在位年限更久
  if(pos==='jg'||pos==='ad')return rnd(18,20); // 野射出道早
  return rnd(18,21);
}
/* 年龄阶段标签 */
function ageStage(p){
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  if(p.age>=m.retire)return '🚫已退役';
  if(p.age>=m.retire-1)return '⚠️即将退役';
  if(p.age>m.gold)return '🧓下滑期';
  return '💪黄金期';
}
/* 选手生成（含位置化年龄） */

<script>
function genPlayer(def){
  const keys=['lane','farm','team','mind'];
  const attrs={};
  keys.forEach((k,i)=>{attrs[k]=clamp((def.base?def.base[i]:70)+rnd(-1,1),40,99);});
  const o=overall({pos:def.pos,attrs}); // 总值：身价/工资/人气全部由它出
  // 主播选手工资减半（有直播收入），K甲新秀工资更便宜
  let wage=wageOf(o);
  if(def.tags&&def.tags.includes('🎤'))wage=Math.max(2,Math.round(wage*0.5));
  if(def.tags&&def.tags.includes('🌱'))wage=Math.max(2,Math.round(wage*0.7));
  // 英雄池：招牌(绝活lv3) + 本职及摇摆位全会(熟练lv2) —— 只含本位置可用英雄，BP 候选与档案展示一致
  const heroPool=[{n:def.sig,lv:3}];
  HEROES.filter(h=>h.pos.includes(def.pos)&&h.n!==def.sig).forEach(h=>heroPool.push({n:h.n,lv:2}));
  return {id:def.id,name:def.name,pos:def.pos,team:def.team||null,tags:def.tags||[],
    attrs,skill:def.skill,sig:def.sig,heroPool,career:def.career||'',wage,energy:ENERGY_MAX,morale:rnd(75,92),injury:0,
    mvp:0,retiring:false,
    // 传奇老将：最后一舞（退役前1-2年），普通选手按位置出道年龄
    age:(def.team==='传奇')?(AGE_MODEL[def.pos]||AGE_MODEL.mid).retire-rnd(1,2):ageByPos(def.pos,def.tags&&def.tags.includes('🌱')),
    // 商业价值（代言收入）与转会意愿（0=想走 100=死忠）
    popularity:Math.round((o>=90?rnd(38,65):o>=80?rnd(16,34):rnd(5,14))*(def.tags&&def.tags.includes('🎤')?1.5:1)),
    willingness:rnd(45,90)};
}
/* 英雄熟练度：绝活+8% / 熟练+4% / 一般0% / 生疏-8% */
const HERO_LV={
  3:{n:'绝活',b:0.08,cls:'lv3',desc:'招牌英雄，如臂使指'},
  2:{n:'熟练',b:0.04,cls:'lv2',desc:'掌握精熟，稳定发挥'},
  1:{n:'一般',b:0,cls:'lv1',desc:'能拿出手，但没绝活'},  
  0:{n:'生疏',b:-0.08,cls:'lv0',desc:'不擅长，容易打崩'},
};
function heroLv(p,heroId){const h=(p.heroPool||[]).find(x=>x.n===heroId);return h?h.lv:1;}
/* 英雄熟练度：绝活+8% / 熟练+4% / 一般0% / 生疏-8% */
function buyPlayer(s,p){
  const cost=Math.round(valueOf(overall(p))*(p.discount||1));
  if(s.fund<cost){toast('资金不足');return false;}
  if(s.players.some(x=>x.id===p.id)){toast('已拥有该选手');return false;}
  if(weeklyWage(s)+p.wage>s.wageCap){toast('❌ 联盟注册被驳回：签下 '+p.name+' 后周薪 '+(weeklyWage(s)+p.wage)+'万 超出工资帽 '+s.wageCap+'万，请先出售或裁减选手');return false;}
  s.fund-=cost;p.acqCost=cost;s.players.push(p); // acqCost：买入价锚定（转售保护用）
  s.market=s.market.filter(x=>x.id!==p.id); // 签约后从市场移除
  logEvent(s,`🤝 从转会市场签约 ${p.name}（总值${overall(p)}·${POS[p.pos][0]}）${p.discount?'（特惠'+Math.round(p.discount*10)+'折）':''}`);
  save();renderAll();return true;
}

/* ================= 自由球员 / 青训名字池 =================
   与 18 队注册名单隔离，保证任何情况下联盟内一人一队 */
const ACADEMY_NAMES=['弈秋','观澜','听松','照夜','惊蛰','谷雨','芒种','白秋','霜降','立夏','惊鸿照','初霁','疏桐','晚晴','归舟','远山','泊烟','沉璧','映雪','疏星','垂柳','鸣蝉','宿雨','斜阳','烟渚','兰舟','竹杖','芒鞋','蓑衣','钓叟','渔火','枫桥','钟声','客船','碧水','东流'];
function genFreeAgentDef(pos,band,usedNames){

  if(usedNames)usedNames.add(name);

  const BAND={star:[85,92],mid:[74,82],low:[66,73]}[band]||[74,82];
  const base=[0,1,2,3].map(()=>rnd(BAND[0],BAND[1]));
  const sk=pick([['lane','对线属性额外+10%'],['farm','运营属性额外+10%'],['team','团战属性额外+10%'],['mind','心态属性额外+10%']]);
  const skilln={lane:'线霸',farm:'运营',team:'团战',mind:'大心脏'}[sk[0]];
  const sig=pick(HEROES.filter(h=>h.pos[0]===pos)).n;
  return {id:'fa_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:[],
    base,skill:{n:skilln+'体系',t:sk[0],d:sk[1]},sig,
    career:'自由球员，曾在次级联赛历练，'+rnd(18,22)+'岁，等待 KPL 机会。'};
}

<script>
/* 生成 AI 战队阵容（BP 界面可见对手选手与招牌英雄） */
function ensureAiRosters(s,teamName){
  s.aiRosters=s.aiRosters||{};
  if(s.aiRosters[teamName])return s.aiRosters[teamName];
  const map=aiRosterDefMap(s);
  const ids=map[teamName];
  if(!ids)return [];
  s.aiPower=s.aiPower||{};
  const ownedIds=new Set(s.players.map(p=>p.id));
  const ownedNames=new Set(s.players.map(p=>p.name));
  const roster=ids.map(pid=>{
    const def=defOf(s,pid);
    if(!def)return null;
    if(s.retiredDefs&&s.retiredDefs.includes(pid))return null; // 已退役：空位由青训递补
    if(ownedIds.has(def.id)||ownedNames.has(def.name))return null; // 已被玩家签走：不再出现在对手阵中
    const p=genSeasonPlayer(s,def);
    return p;
  }).filter(Boolean).filter(p=>p.age<(AGE_MODEL[p.pos]||AGE_MODEL.mid).retire); // 到龄退役，空位由青训递补
  // 空位用本队青训递补，保证 5 人且与玩家不重名
  ['top','jg','mid','ad','sup'].forEach(pos=>{
    if(roster.some(p=>p.pos===pos))return;
    const usedNames=new Set([...ownedNames,...roster.map(p=>p.name)]);
    const p=genSeasonPlayer(s,genAcademyDef(pos,usedNames,s.season));
    roster.push(p);
  });
  s.aiRosters[teamName]=roster;
  s.aiPower[teamName]=aiRosterPower(roster); // AI 战力=真实阵容结算（与玩家 teamPower 同刻度）
  return roster;
}
/* AI 选手随赛季年龄成长/衰减（与玩家 newSeason 同规则），联赛会随赛季演化 */
function ageDrift(p){
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  const key=pick(['lane','farm','team','mind']);
  if(p.age<=m.gold)p.attrs[key]=clamp(p.attrs[key]+1,55,99);
  else if(p.age<m.retire)p.attrs[key]=clamp(p.attrs[key]-rnd(1,m.decay),40,99);
}
/* 从原始定义重建选手：年龄逐年推进到当前赛季，成长/衰减逐年结算
   （修复旧版年龄一次跳 N-1 岁但只结算 1 年成长的问题，黄金期选手会真实变强） */
function genSeasonPlayer(s,def){
  const p=genPlayer(def);
  for(let i=0;i<s.season-1;i++){p.age++;ageDrift(p);}
  return p;
}
/* 青训递补选手定义（不占用联盟注册名额，与玩家、各队均不重名）
   底子随赛季水涨船高（每赛季+2，封顶+14）：明星到龄退役后联盟战力不至于塌方 */
function genAcademyDef(pos,usedNames,season){
  const name=(typeof ACADEMY_NAMES!=='undefined'?ACADEMY_NAMES:[]).find(n=>!usedNames.has(n))||('青训'+Math.floor(Math.random()*90+10));
  const cands=HEROES.filter(h=>h.pos[0]===pos);
  const boost=Math.min(2*((season||1)-1),14);
  const b=v=>clamp(v+boost,40,99);
  return {id:'ac_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:['🌱'],
    base:[b(68),b(68),b(70),b(72)],skill:{n:'青训体系',t:'team',d:'团战属性额外+8%'},
    sig:pick(cands.length?cands:HEROES).n,career:'本队青训营提拔，阶梯赛历练稳定。'};
}
/* ================= AI 转会生态 =================
   AI 阵容以「选手定义(def)」持久化在 s.aiRosterDefs（初始=AI_ROSTERS），每赛季转会期：
   退役结算 → 缺位补强 → 明星流转 → 新星出道。真实选手在联盟内流转，
   玩家始终有明星可挖；青训递补只做兜底，联盟不再随退役塌方。 */
function aiRosterDefMap(s){
  if(!s.aiRosterDefs){
    s.aiRosterDefs={};
    for(const tn in AI_ROSTERS)s.aiRosterDefs[tn]=AI_ROSTERS[tn].p.slice();
  }
  return s.aiRosterDefs;
}
function defOf(s,pid){return PLAYER_POOL.find(d=>d.id===pid)||(s.extraDefs||[]).find(d=>d.id===pid)||null;}
function aiDetachDef(s,pid){ // def 被玩家签走：从所有 AI 队除名，原队转会期自动补强
  if(!defOf(s,pid))return;
  const map=aiRosterDefMap(s);
  for(const tn in map)map[tn]=map[tn].filter(id=>id!==pid);
}
function aiAttachDef(s,pid,teamName){ // def 流入某 AI 队（位置与名额合法才接收）
  const def=defOf(s,pid);
  if(!def)return;
  const map=aiRosterDefMap(s);
  const arr=map[teamName];
  if(!arr||arr.length>=5)return;
  if(arr.some(id=>{const d=defOf(s,id);return d&&d.pos===def.pos;}))return;
  aiDetachDef(s,pid);
  arr.push(pid);
}
/* 新星出道：生成一名新秀 def 进入联盟流转（补真实选手的退役折损） */
function genStarDef(s,usedNames){
  const pos=pick(POS_ORDER);
  const name=ACADEMY_NAMES.find(n=>!usedNames.has(n))||('新星'+s.season+'_'+Math.floor(Math.random()*90+10));
  usedNames.add(name);
  const sk=pick([['lane','线霸体系','对线属性额外+10%'],['farm','运营体系','运营属性额外+10%'],
                 ['team','团战体系','团战属性额外+10%'],['mind','大心脏体系','心态属性额外+10%']]);
  return {id:'ns_'+s.season+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:['🌱'],
    base:[rnd(74,84),rnd(74,84),rnd(74,84),rnd(74,84)],
    skill:{n:sk[1],t:sk[0],d:sk[2]},sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,
    career:'赛季'+s.season+'从青训营出道的新生代，天赋肉眼可见。'};
}
/* AI 转会期（newSeason 内调用）：联盟生态推进 */
function aiTransferWindow(s){
  const map=aiRosterDefMap(s);
  s.extraDefs=s.extraDefs||[];
  s.retiredDefs=s.retiredDefs||[];
  const teams=Object.keys(map).filter(tn=>tn!==s.teamName);
  const roll={}; // def 当前赛季估值（窗口内缓存，避免同 def 多次随机重掷）
  const ovrOf=def=>roll[def.id]||(roll[def.id]=overall(genSeasonPlayer(s,def)));
  // ① 退役结算：到龄选手离开联盟（转型教练/主播进入名宿市场）
  teams.forEach(tn=>{
    map[tn]=map[tn].filter(pid=>{
      const def=defOf(s,pid);
      if(!def)return false;
      if(s.retiredDefs.includes(pid))return false;
      const p=genSeasonPlayer(s,def);
      const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
      if(p.age>=m.retire){
        s.retiredDefs.push(pid);
        retireToCoach(s,p);
        logEvent(s,'🎖️ '+p.name+'（'+p.age+'岁）宣布退役，'+tn+' 腾出'+POS[p.pos][0]+'位置');
        return false;
      }
      return true;
    });
  });
  // ② 自由池：未被任何 AI 队签下的 def（原版无队选手、被放走的老将、待业新星）
  const assigned=new Set();
  teams.forEach(tn=>map[tn].forEach(id=>assigned.add(id)));
  let freePool=PLAYER_POOL.concat(s.extraDefs).filter(d=>!assigned.has(d.id)&&!s.retiredDefs.includes(d.id)).slice();
  // ③ 缺位补强：弱队优先，按位置签自由池最强者
  const order=teams.slice().sort((a,b)=>(s.aiPower[a]||400)-(s.aiPower[b]||400));
  order.forEach(tn=>{
    let guard=0;
    while(map[tn].length<5&&guard++<6){
      const have=new Set(map[tn].map(id=>defOf(s,id)).filter(Boolean).map(d=>d.pos));
      const need=POS_ORDER.find(pos=>!have.has(pos));
      if(!need)break;
      const cands=freePool.filter(d=>d.pos===need);
      if(!cands.length)break;
      const def=cands.sort((a,b)=>ovrOf(b)-ovrOf(a))[0];
      freePool=freePool.filter(d=>d!==def);
      map[tn].push(def.id);
      logEvent(s,'🤝 转会：'+def.name+' 加盟 '+tn+'（'+POS[def.pos][0]+'）');
    }
  });
  // ④ 明星流转：每队有五成概率用自由池明显更强的同位置选手换下一名首发
  order.forEach(tn=>{
    if(Math.random()>=0.5||map[tn].length<5||!freePool.length)return;
    let best=null;
    map[tn].forEach(pid=>{
      const def=defOf(s,pid);
      if(!def)return;
      const cur=ovrOf(def);
      freePool.forEach(d=>{
        if(d.pos!==def.pos)return;
        const gain=ovrOf(d)-cur;
        if(gain>=4&&(!best||gain>best.gain))best={gain,pid,def,out:def};
      });
    });
    if(best){
      const out=best.out;
      freePool=freePool.filter(d=>d!==best.def);
      map[tn]=map[tn].map(id=>id===best.pid?best.def.id:id);
      freePool.push(out);
      logEvent(s,'🔄 转会：'+best.def.name+' 加盟 '+tn+'，'+out.name+' 离队寻找下家');
    }
  });
  // ⑤ 新星出道：每赛季 2-3 名新秀进入联盟（对冲各位置退役潮，优先补缺位，否则待业进自由市场）
  const used=new Set(PLAYER_POOL.concat(s.extraDefs).map(d=>d.name).concat(s.players.map(p=>p.name)));
  const births=rnd(2,3);
  for(let i=0;i<births;i++){
    const def=genStarDef(s,used);
    s.extraDefs.push(def);
    const tn=order.find(t=>map[t].length<5&&!map[t].some(id=>{const d=defOf(s,id);return d&&d.pos===def.pos;}));
    if(tn){map[tn].push(def.id);logEvent(s,'🌟 新星出道：'+def.name+'（'+POS[def.pos][0]+'）加盟 '+tn);}
    else{logEvent(s,'🌟 新星出道：'+def.name+'（'+POS[def.pos][0]+'）进入自由市场');}
  }
}
/* 构建转会市场：各 AI 队选手（含非卖品与意愿） */
function buildTransferMarket(s){
  s.transferList=[];
  const U=new Set(); // 非卖品按原队设定（建队核心走到哪都是队魂）
  for(const tn in AI_ROSTERS)AI_ROSTERS[tn].u.forEach(id=>U.add(id));
  const map=aiRosterDefMap(s);
  for(const tn in map){
    if(tn===s.teamName)continue;
    map[tn].forEach(pid=>{
      if(s.players.some(x=>x.id===pid))return; // 玩家已拥有
      if((s.retiredDefs||[]).includes(pid))return; // 已退役
      const def=defOf(s,pid);
      if(!def)return;
      const p=genSeasonPlayer(s,def); // 与 AI 名册同规则：年龄逐年推进+成长结算
      p.ownerTeam=tn;
      p.untouchable=U.has(pid);
      // 达到位置退役年龄（野射24/对抗中26/辅助31）：不进买断池，老将转向名宿市场（教练/主播）
      const am=AGE_MODEL[p.pos]||AGE_MODEL.mid;
      if(p.age>=am.retire){retireToCoach(s,p);return;}
      if(p.age>am.gold)p.aging=true; // 已过黄金期：买来即巅峰末期
      // 非卖品并非永远忠诚：意愿随年龄衰减（30岁+大幅松动，队魂也会离队）
      if(p.untouchable){
        const decay=p.age>=30?rnd(30,45):p.age>=27?rnd(12,22):rnd(0,8);
        p.willingness=clamp(rnd(85,100)-decay,25,100);
      }
      s.transferList.push(p);
    });
  }
  s.transferList.sort((a,b)=>overall(b)-overall(a));
  // 自由球员：26 年自由市场（真实 KPL 选手轮换上架，签一人少一人）+ 各队无球可打的替补
  s.freeAgents=[];
  const seenFA=new Set();
  shuffle(FA_2026.filter(d=>!s.players.some(x=>x.id===d.id)&&!(s.retiredDefs||[]).includes(d.id))).slice(0,3).forEach(def=>{
    seenFA.add(def.id);
    const p=genSeasonPlayer(s,def);
    p.signCost=Math.round(valueOf(overall(p))*0.7); // 真实选手身价 7 折直签
    p.freeAgent=true;
    p.willingness=rnd(70,95); // 合同到期，寻求下家
    s.freeAgents.push(p);
  });
  while(s.freeAgents.length<3){
    const pos=pick(POS_ORDER);
    const assigned=new Set(); // 各 AI 队在册 def：真正的无球可打者才能进自由市场
    const dmap=aiRosterDefMap(s);
    for(const tn in dmap){if(tn===s.teamName)continue;dmap[tn].forEach(id=>assigned.add(id));}
    const pool=PLAYER_POOL.concat(s.extraDefs||[]).filter(d=>d.pos===pos&&!seenFA.has(d.id)
      &&!assigned.has(d.id)&&!(s.retiredDefs||[]).includes(d.id)&&!s.players.some(x=>x.id===d.id));
    if(!pool.length)break;
    const def=pick(pool);
    seenFA.add(def.id);
    const p=genSeasonPlayer(s,def);
    p.signCost=Math.round(valueOf(overall(p))*0.58); // 无球可打，按身价 58 折直签
    p.freeAgent=true;
    p.willingness=rnd(70,100); // 无球可打，想走
    s.freeAgents.push(p);
  }
  s.freeAgents.sort((a,b)=>overall(b)-overall(a));
}
/* 买断费：基础价（总值曲线） × 战力加成 × 意愿系数（意愿低=更难挖） */
function buyoutPrice(p){
  const base=valueOf(overall(p));
  const powBonus=1+Math.max(0,(playerPower(p,p.sig)-55)/200);
  const wilMult=p.willingness>=60?1:p.willingness>=30?1.5:2.2;
  return Math.round(base*powBonus*wilMult);
}
/* 非卖品强挖：2.5倍溢价，成功率=意愿缺口，失败意愿-10（多次尝试终能打动） */
function untouchablePrice(p){return Math.round(buyoutPrice(p)*2.5);}
function raidChance(p){return clamp((100-p.willingness)/100,0.02,0.8);}
/* ================= FC26 式转会谈判 =================
   玩家报「转会费+年薪」组合报价 → 对方评估 → 最多 3 轮拉锯：
   每轮被拒后对方给出明确还价，接受还价即成交；超轮次或强挖失败则谈判破裂。
   工资帽在签约时校验（联盟注册规则），超帽直接拒签。 */
function negoWageDemand(p){
  return Math.max(2,Math.round(p.wage*(1.15+(100-p.willingness)/120)));
}
function negoAskFee(p){
  return p.untouchable?untouchablePrice(p):buyoutPrice(p);
}
function negoCapCheck(s,p){
  if(weeklyWage(s)+p.wage>s.wageCap){
    toast('❌ 联盟注册被驳回：签下 '+p.name+' 后周薪 '+(weeklyWage(s)+p.wage)+'万 超出工资帽 '+s.wageCap+'万，请先出售或裁减选手');
    return false;
  }
  return true;
}
function negoComplete(s,p,fee){
  const from=p.ownerTeam,isFA=p.freeAgent;
  delete p.ownerTeam;delete p.untouchable;delete p.freeAgent;delete p.signCost;
  if(fee!=null)p.acqCost=fee; // 买入价锚定（自由球员记 0，转售按保底价压）
  s.players.push(p);
  aiDetachDef(s,p.id); // 从 AI 阵容除名（若为 def）：原队下个转会期自动补强
  if(isFA)s.freeAgents=(s.freeAgents||[]).filter(x=>x.id!==p.id);
  s.transferList=(s.transferList||[]).filter(x=>x.id!==p.id);
  s.aiRosters={}; // 玩家签走任何选手后重建全部对手名册（自由球员也可能是他人首发，防同一名选手出现在两队）
}
function openNegotiation(s,pid){
  const p=s.transferList.find(x=>x.id===pid)||(s.freeAgents||[]).find(x=>x.id===pid);
  if(!p){toast('该选手不在转会市场');return;}
  if(s.players.some(x=>x.id===pid)){toast('已拥有该选手');return;}
  window._nego={s,pid,round:1,
    freeAgent:!!p.freeAgent,
    askFee:p.freeAgent?0:negoAskFee(p),
    askWage:negoWageDemand(p)};
  renderNego();
}
function negoRow(label,value,extra){return `<div style="display:flex;justify-content:space-between;padding:3px 0"><span style="color:var(--dim)">${label}</span><b>${value}${extra||''}</b></div>`;}
function renderNego(){

  const s=n.s,p=s.transferList.find(x=>x.id===n.pid)||(s.freeAgents||[]).find(x=>x.id===n.pid);

  const cur=weeklyWage(s);
  let html=`<h2>🤝 转会谈判 <span class="tag">第 ${n.round}/3 轮</span></h2>
  <div class="match" style="margin:10px 0;padding:10px 12px">
    <div class="center" style="margin-bottom:6px"><b style="font-size:16px;color:${ovrColor(overall(p))}">${p.name}</b>

    ${negoRow('现效力',p.freeAgent?'自由球员（无球可打）':p.ownerTeam||'—')}

    ${p.untouchable?`<div class="hint" style="color:var(--red)">🔒 非卖品：需 ${n.askFee}万 溢价强挖，每轮谈判有失败风险</div>`:''}
  </div>
  <div class="hint" style="margin-bottom:8px">报价需同时满足「转会费 ≥ 心理价位」和「年薪 ≥ 期望」，也可压价试探——但每被拒一轮，对方要价上涨，第 3 轮仍不满足则谈判破裂（意愿-10）。</div>
  ${n.msg?`<div class="event-card" style="margin-bottom:10px">${n.msg}</div>`:''}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <label style="flex:1;min-width:120px">转会费(万)<input id="nego-fee" type="number" class="hd-in" value="${n.freeAgent?0:Math.round(n.askFee*0.8)}" ${n.freeAgent?'disabled':''} style="width:100%;margin-top:4px"></label>
    <label style="flex:1;min-width:120px">年薪(万)<input id="nego-wage" type="number" class="hd-in" value="${n.askWage}" style="width:100%;margin-top:4px"></label>
  </div>
  <div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="btn" onclick="negoQuit()">🚪 放弃</button>
    ${!n.freeAgent?`<button class="btn" onclick="negoFillAsk()">🎯 满足要价</button>`:''}
    <button class="btn primary" onclick="negoSubmit()">📤 递交报价</button>
  </div>`;
  $('#app-modal-body').innerHTML=html;
  $('#app-modal').classList.add('on');
}
function negoFillAsk(){
  const n=window._nego;if(!n)return;
  // 意愿低的选手需要溢价才肯加盟（1.3 倍转会费），“满足要价”直接给出可成交的数
  const mult=(n.s.transferList.find(x=>x.id===n.pid)||{}).willingness<30?1.3:1;
  $('#nego-fee').value=Math.round(n.askFee*mult);$('#nego-wage').value=n.askWage;
}
function negoQuit(){
  window._nego=null;closeModal('app-modal');toast('已退出谈判');
}
function negoSubmit(){
  const n=window._nego;if(!n)return;
  const s=n.s,p=s.transferList.find(x=>x.id===n.pid)||(s.freeAgents||[]).find(x=>x.id===n.pid);
  if(!p){window._nego=null;closeModal('app-modal');toast('谈判对象已失效（被他人签走或市场刷新）');return;}
  const fee=n.freeAgent?0:Math.max(0,parseInt($('#nego-fee').value,10)||0);
  const wage=Math.max(1,parseInt($('#nego-wage').value,10)||0);
  if(!n.freeAgent&&fee>s.fund){n.msg='💸 俱乐部资金不足（现有 '+fmt(s.fund)+'万，报价 '+fee+'万）。';renderNego();return;}
  // 非卖品强挖：每轮都掷成功率，失败=本轮破裂且要价上涨
  if(p.untouchable&&Math.random()>raidChance(p)){
    p.willingness=clamp(p.willingness-10,5,100);
    n.askFee=Math.round(n.askFee*1.15);n.askWage=negoWageDemand(p);
    n.round++;
    logEvent(s,'❌ 强挖 '+p.name+' 被拒（'+(p.ownerTeam||'原俱乐部')+' 态度强硬，意愿-10）');
    if(n.round>3){negoBreak(s,p,'强挖多次未果');return;}
    n.msg='🚫 '+p.ownerTeam+' 拒绝放人！对方态度更加强硬（意愿降至 '+p.willingness+'，要价已上调）。';
    renderNego();return;
  }
  // 评估：转会费/年薪是否达到逐轮上涨的要价
  const feeOk=n.freeAgent||fee>=n.askFee;
  const wageOk=wage>=n.askWage;
  const willingOk=p.willingness>=30||fee>=n.askFee*1.3; // 意愿低但要价给足也能打动
  if(feeOk&&wageOk&&willingOk){
    if(!negoCapCheck(s,p))return; // 工资帽驳回，谈判可继续
    if(!n.freeAgent)s.fund-=fee;
    p.wage=wage;
    negoComplete(s,p,n.freeAgent?0:fee);
    logEvent(s,(n.freeAgent?'⚪ 签下自由球员 ':'💰 转会达成！')+' '+p.name+' 加盟 '+s.teamName+(n.freeAgent?'（年薪 '+wage+'万）':'（转会费 '+fee+'万 · 年薪 '+wage+'万）'));
    if(fee>=300)logEvent(s,'💣 重磅转会！联盟震动');
    window._nego=null;closeModal('app-modal');
    save();renderAll();toast('🎉 谈判成功！'+p.name+' 加盟');
    return;
  }
  // 被拒：给还价，要价上涨
  n.round++;
  n.askFee=n.freeAgent?0:Math.round(n.askFee*(feeOk?1:1.12));
  n.askWage=Math.round(n.askWage*(wageOk?1:1.1));
  const why=[];
  if(!feeOk)why.push('转会费低于心理价位');
  if(!wageOk)why.push('年薪不够');
  if(!willingOk)why.push('本人无意加盟');
  if(n.round>3){negoBreak(s,p,why.join('、'));return;}
  n.msg='🚫 对方摇头：'+why.join('、')+'。<br>📩 经纪人放话——'+(n.freeAgent?'':'转会费至少 <b style="color:var(--gold)">'+n.askFee+'万</b>，')+'年薪 <b style="color:var(--gold)">'+n.askWage+'万</b> 才考虑。';
  renderNego();
}
function negoBreak(s,p,reason){
  p.willingness=clamp(p.willingness-10,5,100);
  logEvent(s,'❌ 与 '+p.name+' 的谈判破裂（'+reason+'），选手意愿-10');
  window._nego=null;closeModal('app-modal');
  save();renderAll();toast('谈判破裂：'+p.name+' 不为所动');
}

/* ================= 卖方谈判（FC26 式：多家俱乐部竞价，你抬价/递要价/接受） =================
   与买方对称：意向俱乐部数量由总值/人气决定，预算按俱乐部身价；
   三轮内递交心理要价——要价≤对方预算则接受、接近预算则给最终报价、过高直接退出；
   任何时候可接受某个报价；「回收商」一口价永远兜底（原秒卖价）。
   转售保护：刚买入未打满 5 场的选手，报价被压在买入价九折内（杜绝低价买高价卖的套利）。 */
function sellAskPrice(p){
  const base=Math.round(valueOf(overall(p))*0.92);
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  const ageF=p.age<=m.gold?1.1:p.age>=m.retire-1?0.7:0.9; // 黄金期溢价，临近退役打折
  const popF=1+(p.popularity||0)/250; // 人气=商业价值
  const valF=(p.val||100)/100; // 比赛表现浮动：状态火热溢价、持续低迷打折（70%~150%）
  return Math.round(base*ageF*popF*valF);
}
/* 表现状态标签（身价浮动可视化） */
function perfLabel(p){
  const v=p.val||100;
  return v>=125?'🔥火热':v>=110?'↗走高':v>=95?'—稳定':v>=80?'↘下滑':'❄️低迷';
}
/* 转售上限：有买入记录且出场<5 时返回价格上限，否则 null（无限制） */
function sellCeiling(p){
  if(p.acqCost==null||(p.caps||0)>=5)return null;
  const anchor=(p.acqCost||0)>0?p.acqCost:Math.round(valueOf(overall(p))*0.65);
  return Math.round(anchor*0.9);
}
function openSellNego(s,pid){
  const p=s.players.find(x=>x.id===pid);
  if(!p)return;
  if((s.listed||[]).some(x=>x.id===pid)){toast('该选手已挂牌，请先撤牌或等待报价');return;}
  const ask=sellAskPrice(p);
  const cap=sellCeiling(p);
  let cnt=overall(p)>=88?rnd(2,3):overall(p)>=78?rnd(1,2):(Math.random()<0.6?1:0); // 总值/人气决定意向俱乐部数
  if((p.popularity||0)>50)cnt++;
  const pool=AI_TEAMS.filter(t=>t.name!==s.teamName).slice();
  const clubs=[];
  for(let i=0;i<cnt&&pool.length;i++){
    const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const wealth=0.85+(t.power/640)*0.5; // 豪门预算更足
    let max=Math.round(ask*wealth*rnd(90,115)/100);
    if(cap!=null)max=Math.min(max,cap);
    clubs.push({name:t.name,max,bid:Math.round(max*rnd(60,78)/100),status:'active'});
  }
  window._sellNego={s,pid,round:1,ask,lock:cap!=null,lockCaps:Math.min(p.caps||0,4),
    lowball:Math.round(valueOf(overall(p))*0.65),
    clubs,
    msg:clubs.length?'收到 '+clubs.length+' 家俱乐部的初步报价：可直接接受、对某家逐轮抬价，或统一递交心理要价。':'暂无俱乐部感兴趣——可去挂牌等报价，或接受回收商一口价。'};
  renderSellNego();
}
function renderSellNego(){
  const n=window._sellNego;if(!n)return;
  const s=n.s,p=s.players.find(x=>x.id===n.pid);
  if(!p){window._sellNego=null;return;}
  const rows=n.clubs.map((c,i)=>{
    const badge=c.status==='agreed'?'<span class="green">✅ 接受你的要价</span>'
      :c.status==='final'?'<span style="color:var(--gold)">最终报价 · 不再抬</span>'
      :c.status==='walked'?'<span class="red">已退出</span>'
      :'<span style="color:var(--dim)">有意向</span>';
    const btn=c.status==='walked'?'':`<button class="btn sm primary" style="margin:0;min-width:56px" onclick="sellAcceptClub(${i})">接受</button>`;
    return `<div class="match" style="margin-bottom:6px;padding:8px 10px">
      <div class="vs"><span class="tname" style="font-size:13px">${c.name}</span><div class="power" style="font-size:10px">${badge}</div></div>
      <div class="score" style="font-size:13px;min-width:0">${c.bid}万</div>
      ${btn}
    </div>`;
  }).join('');
  const lowballRow=`<div class="match" style="margin-bottom:6px;padding:8px 10px">
    <div class="vs"><span class="tname" style="font-size:13px">回收商</span><div class="power" style="font-size:10px"><span style="color:var(--dim)">一口价打包带走</span></div></div>
    <div class="score" style="font-size:13px;min-width:0">${n.lowball}万</div>
    <button class="btn sm" style="margin:0;min-width:56px" onclick="sellAcceptClub(-1)">接受</button>
  </div>`;
  const html=`<h2><span class="h-ic">${ic('coin')}</span>出售谈判 <span class="tag">${p.name} · 第 ${Math.min(n.round,3)}/3 轮</span></h2>
  <div class="hint" style="margin-bottom:8px">${POS[p.pos][1]} · 总值${overall(p)} · ${p.age}岁 · 战力 ${playerPower(p,p.sig)} · 人气 ${p.popularity||0} · 表现 <b class="${(p.val||100)>=110?'green':(p.val||100)<90?'red':''}">${perfLabel(p)} ${p.val||100}%</b><br>心理要价随比赛表现浮动（火热最高 +50%、低迷最低 -30%）；要价≤预算即成交、接近预算给最终报价、太高直接吓跑；三轮后未成交只剩回收商。</div>
  ${rows}${lowballRow}
  ${n.lock?`<div class="hint" style="margin:8px 0;color:var(--gold)">🔒 新援保护期：${p.name} 尚未代表球队打满 5 场（当前 ${n.lockCaps}/5），俱乐部报价压在买入价九折内——先让他上场，打满后恢复真实身价。</div>`:''}
  ${n.msg?`<div class="hint" style="margin:8px 0;color:var(--cyan)">${n.msg}</div>`:''}
  <div style="display:flex;gap:8px;align-items:center;margin:10px 0">
    <span style="font-size:12px;color:var(--dim);white-space:nowrap">心理要价</span>
    <input id="sell-ask" type="number" value="${n.ask}" style="flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px">
    <button class="btn primary" onclick="sellSubmitAsk()">📨 递交要价</button>
  </div>
  <div class="center" style="display:flex;gap:8px;justify-content:center">
    <button class="btn" onclick="sellQuit()">🚪 停止出售</button>
  </div>`;
  $('#app-modal-body').innerHTML=html;
  $('#app-modal').classList.add('on');
}
function sellSubmitAsk(){
  const n=window._sellNego;if(!n)return;
  const A=Math.max(1,parseInt($('#sell-ask').value,10)||0);
  n.ask=A;n.round++;
  let agreed=0,finals=0,left=0;
  n.clubs.forEach(c=>{
    if(c.status!=='active')return;
    if(A<=c.max){c.bid=A;c.status='agreed';agreed++;}
    else if(A<=c.max*1.25){c.bid=c.max;c.status='final';finals++;}
    else{c.status='walked';left++;}
  });
  if(n.round>3){
    n.clubs.forEach(c=>{if(c.status==='active'){c.bid=c.max;c.status='final';}});
    n.msg='📩 最后通牒：三轮报价结束，仍在谈的俱乐部给出了最终报价——接受或放弃。';
  }else if(agreed){
    n.msg='✅ '+agreed+' 家俱乐部接受你的要价，点「接受」即可成交！';
  }else if(finals){
    n.msg='📩 '+finals+' 家俱乐部给出了最终报价，再抬价他们就退出了'+(left?'，另有 '+left+' 家已离场':'')+'。';
  }else{
    n.msg='😅 要价太高，俱乐部都在观望或离场……';
  }
  renderSellNego();
}
function sellAcceptClub(i){
  const n=window._sellNego;if(!n)return;
  const s=n.s;
  let team,fee;
  if(i<0){team='回收商';fee=n.lowball;}
  else{
    const c=n.clubs[i];
    if(!c||c.status==='walked'){toast('该俱乐部已退出谈判');return;}
    team=c.name;fee=c.bid;
  }
  const p=s.players.find(x=>x.id===n.pid);
  if(!p)return;
  const wasStarter=s.lineup.includes(p.id);
  completeSale(s,p,fee,team);
  if(wasStarter&&!s.players.some(x=>x.pos===p.pos))toast('⚠️ '+POS[p.pos][0]+'位置已无人，记得补签');
  window._sellNego=null;closeModal('app-modal');
  save();renderAll();toast(p.name+' 已售出（'+fee+'万）');
}
function sellQuit(){
  window._sellNego=null;closeModal('app-modal');toast('已停止出售，选手留队');
}
/* 成交共用：转会费入账 + 名册/首发/挂牌清理 */
function completeSale(s,p,fee,team){
  s.fund+=fee;
  s.players=s.players.filter(x=>x.id!==p.id);
  if(s.lineup.includes(p.id))s.lineup=s.lineup.filter(x=>x!==p.id);
  if(s.pick)delete s.pick[p.pos];
  s.listed=(s.listed||[]).filter(x=>x.id!==p.id);
  s.bids=(s.bids||[]).filter(x=>x.id!==p.id);
  aiAttachDef(s,p.id,team); // 买入方 AI 队在册（若为 def），下赛季起为他出战
  logEvent(s,'💰 '+p.name+' 转会至 '+team+'（转会费 '+fee+'万）');
  if(fee>=300)logEvent(s,'💣 重磅转会！联盟震动');
}

/* 玩家挂牌 / 撤牌 */
function listPlayer(s,pid){
  const p=s.players.find(x=>x.id===pid);
  if(!p)return;
  if(s.lineup.includes(pid)){toast('请先将该选手移出首发');return;}
  if((s.listed||[]).some(x=>x.id===pid)){toast('该选手已在挂牌名单');return;}
  const price=Math.round(valueOf(overall(p))*(p.willingness>=60?0.8:1.1));
  s.listed=[...(s.listed||[]),{id:pid,price}];
  toast(p.name+' 已挂牌（'+price+'万）'+(p.willingness>=60?'，本人愿意转会':'，本人不太愿意'));
  logEvent(s,'📋 '+p.name+' 进入转会市场（挂牌 '+price+'万）');
  save();renderAll();
}
function delistPlayer(s,pid){
  s.listed=(s.listed||[]).filter(x=>x.id!==pid);
  s.bids=(s.bids||[]).filter(x=>x.id!==pid);
  toast('已撤牌');
  save();renderAll();
}
/* 转会期内每天 AI 队可能报价 */
function aiBidTick(s){
  (s.listed||[]).forEach(item=>{
    if((s.bids||[]).some(b=>b.id===item.id))return;
    if(Math.random()<0.3){
      const team=pick(AI_TEAMS.filter(t=>t.name!==s.teamName));
      const p=s.players.find(x=>x.id===item.id);
      let bid=Math.round(item.price*(0.85+Math.random()*0.35));
      if(p){const cap=sellCeiling(p);if(cap!=null)bid=Math.min(bid,cap);} // 挂牌报价同样受转售保护
      s.bids=[...(s.bids||[]),{id:item.id,team:team.name,bid}];
      if(p)toast('📩 '+team.name+' 对 '+p.name+' 报价 '+bid+'万！');
    }
  });
  // 联盟内部重磅转会：非卖品意愿松动后被豪门挖走（队魂也会离队）——真实变更其 AI 队在册
  if(Math.random()<0.15){
    const candidates=(s.transferList||[]).filter(p=>p.untouchable&&p.willingness<75);
    if(candidates.length){
      const p=pick(candidates);
      const buyer=pick(AI_TEAMS.filter(t=>t.name!==p.ownerTeam&&t.name!==s.teamName));
      const price=untouchablePrice(p);
      aiAttachDef(s,p.id,buyer.name);
      logEvent(s,'💣 重磅转会！'+p.name+' 以 '+price+'万 转会至 '+buyer.name+'（非卖品破例放行）');
      s.transferList=s.transferList.filter(x=>x.id!==p.id);
    }
  }
}
function acceptBid(s,id){
  const b=(s.bids||[]).find(x=>x.id===id);
  const p=s.players.find(x=>x.id===id);
  if(!b||!p)return;
  completeSale(s,p,b.bid,b.team);
  save();renderAll();toast('转会完成！');
}
function rejectBid(s,id){
  s.bids=(s.bids||[]).filter(x=>x.id!==id);
  save();renderAll();toast('已拒绝报价');
}
function endTransferWindow(s){
  s.listed=[];
  s.bids=[];
  s.transferList=[];
}
/* ================= 赛前转会期（开局/新赛季先组队，再开赛） =================
   转会期内：转会市场全开放（买断/挂牌/自由市场刷新免费/顶星供给增加），
   不能打比赛；天数用完自动结束，也可随时提前结束。 */
function endPreseason(s){
  if(!confirm('确定结束转会期？剩余天数作废，阵容锁定后联赛正式开始'))return;
  autoFillLineup(s);
  const miss=POS_ORDER.filter(pos=>!s.players.some(p=>p.pos===pos));
  if(miss.length){toast('❌ '+miss.map(pos=>POS[pos][0]).join('、')+' 位置无人，无法开始联赛，请先签约选手');return;}
  s.preseason=false;
  s.transferWindow=0;
  endTransferWindow(s);
  logEvent(s,'📋 转会期结束！'+s.teamName+' 赛季'+s.season+'阵容锁定，联赛正式开始');
  logEvent(s,'⚔️ 首战在即：俱乐部页开赛，每场赛前可调整首发、BP 中可换替补');
  save();renderAll();
  toast('联赛正式开始！去俱乐部页查看赛程');
}
/* 刷新自由市场：转会窗内每日首次免费（可重复刷但按 5 万/次收费） */
function refreshMarket(s){
  const inWindow=s.transferWindow>0;
  const free=inWindow&&!s.marketRefreshed;
  if(!free){
    if(s.fund<5){toast('资金不足（刷新需 5 万）');return;}
    s.fund-=5;
  }
  const usedNames=new Set(s.players.map(p=>p.name));
  s.market=[];
  for(let i=0;i<6;i++){
    const roll=Math.random();
    const band=inWindow?(roll<0.2?'star':roll<0.6?'mid':'low'):(roll<0.1?'star':roll<0.5?'mid':'low'); // 转会窗内顶星供给增加
    s.market.push(genPlayer(genFreeAgentDef(pick(POS_ORDER),band,usedNames)));
  }
  s.marketRefreshed=true;
  // 教练市场：随机 3 名候选教练（与现任不重复）
  s.coachMarket=s.coachMarket||[];
  const coachSeen=new Set();
  if(s.coach)coachSeen.add(s.coach.id);
  let cGuard=0;
  while(s.coachMarket.length<3&&cGuard++<40){
    const c=pick(COACH_POOL);
    if(coachSeen.has(c.id))continue;
    coachSeen.add(c.id);s.coachMarket.push({...c});
  }
  s.coachMarket.sort((a,b)=>(b.rating||0)-(a.rating||0));
  save();renderAll();
  toast(free?'转会窗内免费刷新（每日首次）':'市场已刷新（-5万）');
}
/* 签约主教练：已有教练时直接换帅（旧帅离任） */
function signCoach(s,c){
  if(!c){toast('教练信息无效，请先刷新市场');return;}
  if(s.fund<c.cost){toast('资金不足（签约费 '+c.cost+'万）');return;}
  if(s.coach&&s.coach.id===c.id){toast('该教练已是你队主教练');return;}
  s.fund-=c.cost;
  s.coachMarket=(s.coachMarket||[]).filter(x=>x.id!==c.id); // 已执教教练移出市场
  if(s.coach)logEvent(s,'🔁 换帅！'+s.coach.name+' 离任，'+c.name+' 出任主教练');
  else logEvent(s,'🤝 签约主教练 '+c.name+'（'+(c.rating||80)+'评分·'+COACH_STYLE[c.style]+'型）');
  s.coach={...c};
  save();renderAll();toast(c.name+' 执教！全队战力+'+c.bonus+'%');
}
/* 解雇主教练：无教练期间全队无教练加成 */
function fireCoach(s){
  if(!s.coach){toast('当前没有主教练');return;}
  logEvent(s,'👋 '+s.coach.name+' 与俱乐部解约离任');
  s.coach=null;
  save();renderAll();
}
</script>
<script>

/* ================= 训练 ================= */
function doTrain(s,pid,attr){
  const p=s.players.find(x=>x.id===pid);
  if(!p)return;
  if(s.trained){toast('本日已进行过行动');return;}
  if(p.energy<10){toast(`${p.name} 体力不足`);return;}
  if(s.fund<8){toast('资金不足（训练需 8万）');return;}
  s.fund-=8;p.energy-=10;s.trained=true;
  const gain=1+rnd(0,1);
  p.attrs[attr]=clamp(p.attrs[attr]+gain,40,99);
  p.morale=clamp(p.morale-2,20,100);
  logEvent(s,`📈 训练完成：${p.name} 的「${TRAIN_ITEMS.find(t=>t.k===attr).n}」提升 ${gain} 点`);
  save();renderAll();
}
function doRest(s){
  if(s.trained){toast('本日已进行过行动');return;}
  s.trained=true;
  s.players.forEach(p=>{p.energy=clamp(p.energy+55,0,ENERGY_MAX);p.morale=clamp(p.morale+4,20,100);if(p.injury>0)p.injury=Math.max(0,p.injury-2);});
  logEvent(s,'😴 全队休息一天，体力和士气得到恢复');
  save();renderAll();
}
/* 英雄特训：优先提升熟练度（生疏→一般→熟练→绝活），全部满级则学新英雄（生疏） */
function doHeroTrain(s,pid){
  const p=s.players.find(x=>x.id===pid);
  if(!p)return;
  if(s.trained){toast('本日已进行过行动');return;}
  if(p.energy<15){toast(`${p.name} 体力不足`);return;}
  if(s.fund<15){toast('资金不足（英雄特训需 15万）');return;}
  // 找熟练度最低的英雄提升
  const upgradable=(p.heroPool||[]).filter(h=>h.lv<3);
  let msg;
  if(upgradable.length){
    upgradable.sort((a,b)=>a.lv-b.lv);
    const t=upgradable[0];
    t.lv++;
    msg=`🎮 英雄特训：${p.name} 的「${t.n}」熟练度提升至「${HERO_LV[t.lv].n}」！`;
  }else{
    if((p.heroPool||[]).length>=80){toast('英雄池已满（上限80）且全部满级');return;}
    const src=HEROES.filter(h=>h.pos.includes(p.pos)).map(h=>h.n).filter(h=>!p.heroPool.some(x=>x.n===h));
    if(!src.length){toast('该位置可学的英雄都学完了');return;}
    const h=pick(src);
    p.heroPool.push({n:h,lv:0});
    msg=`🎮 英雄特训：${p.name} 学会了新英雄「${h}」（生疏）！`;
  }
  s.fund-=15;p.energy-=15;s.trained=true;
  p.morale=clamp(p.morale-2,20,100);
  logEvent(s,msg);
  save();renderAll();
}

/* ================= 青训体系 ================= */
const ROOKIE_NAMES=['小沐','阿泽','子辰','昊然','清扬','星野','无眠','逐梦','南风','初见','慕白','亦辰'];
let _rkSeq=0;
function genRookie(){
  _rkSeq++;
  const pos=pick(POS_ORDER);
  const potential=rnd(2,5);
  const attrs={};
  ['lane','farm','team','mind'].forEach(k=>{attrs[k]=clamp(rnd(42,58)+(potential>=4?rnd(0,5):0),40,70);});
  const mainPool=HEROES.filter(h=>h.pos[0]===pos).map(h=>h.n);
  const sig=pick(mainPool);
  const heroPool=[{n:sig,lv:2}];
  const cand=[...new Set(mainPool)].filter(h=>h!==sig);
  for(let i=0;i<3&&cand.length;i++){heroPool.push({n:cand.splice(Math.floor(Math.random()*cand.length),1)[0],lv:1});}
  const name=pick(ROOKIE_NAMES)+'_'+_rkSeq;
  return {id:'rk'+_rkSeq,name,pos,team:null,tags:['🌱'],
    attrs,skill:{n:'潜力新星',t:pick(['lane','farm','team','mind']),d:'成长型选手，潜力可期'},
    sig,heroPool,career:'🎓 青训出品 · 未来之星',wage:rnd(2,4),energy:ENERGY_MAX,morale:rnd(70,90),injury:0,
    mvp:0,retiring:false,age:rnd(16,17),popularity:rnd(3,8),willingness:rnd(60,90),potential,isRookie:true};
}
function recruitRookie(s){
  if(s.fund<30){toast('招募青训需 30万');return;}
  s.fund-=30;
  const r=genRookie();
  s.academy=[...(s.academy||[]),r];
  logEvent(s,'🎓 青训营招募新秀 '+r.name+'（'+POS[r.pos][0]+' · 潜力'+r.potential+'⭐）');
  save();renderAll();toast('新秀 '+r.name+' 加入青训营');
}
function trainRookie(s,id){
  if(s.academyTrained){toast('今日已培养过青训选手');return;}
  const r=(s.academy||[]).find(x=>x.id===id);
  if(!r)return;
  if(s.fund<10){toast('青训培养需 10万');return;}
  s.fund-=10;
  s.academyTrained=true;
  // 潜力越高成长越快
  const gain=1+rnd(0,2)+(r.potential>=4?1:0);
  const key=pick(['lane','farm','team','mind']);
  r.attrs[key]=clamp(r.attrs[key]+gain,40,95);
  r.morale=clamp(r.morale-3,20,100);
  logEvent(s,'🎓 青训培养：'+r.name+' 的'+(POS[r.pos][1]+POS[r.pos][0])+'属性 +'+gain+'（潜力'+r.potential+'⭐）');
  save();renderAll();
}
function rookieReady(r){
  return ['lane','farm','team','mind'].reduce((t,k)=>t+r.attrs[k],0)>=300;
}
function promoteRookie(s,id){
  const r=(s.academy||[]).find(x=>x.id===id);
  if(!r)return;
  if(!rookieReady(r)){toast(r.name+' 尚未达到晋升标准（四维总和需≥300）');return;}
  if(r.age<18){toast(r.name+' 年仅 '+r.age+' 岁，KPL 规定满 18 岁才能上场比赛——再等一年');return;}
  s.academy=s.academy.filter(x=>x.id!==id);
  r.isRookie=false;
  r.tags=['🌱'];
  s.players.push(r);
  if(!s.lineup.includes(r.id)&&!s.players.some(p=>p.id!==r.id&&p.pos===r.pos&&s.lineup.includes(p.id))){
    // 该位置空缺时直接进首发
    s.lineup.push(r.id);
  }
  logEvent(s,'🚀 '+r.name+'（'+r.age+'岁）从青训晋升一线队！');
  save();renderAll();toast(r.name+' 晋升一线队！');
}

/* ================= 位置改造 =================
   现实中职业选手会转型换位置；游戏内用于解决特定位置断档。
   重构英雄池：新旧位置通用英雄保留熟练度，招牌不通用则重立，属性不变。 */
function convertPos(s,pid,newPos){
  const p=s.players.find(x=>x.id===pid);
  if(!p)return;
  if(p.pos===newPos){toast('已经是该位置');return;}
  const cost=30;
  if(s.fund<cost){toast('位置改造需要 '+cost+'万');return;}
  if(s.lineup.includes(pid)&&s.lineup.some(id=>{
    const o=s.players.find(x=>x.id===id);return o&&o.id!==pid&&o.pos===newPos;
  })){toast(POS[newPos][0]+' 首发已有选手，请先将其换下再改造');return;}
  s.fund-=cost;
  const oldPos=p.pos;
  const oldPool=new Map(p.heroPool.map(h=>[h.n,h.lv]));
  p.pos=newPos;
  if(!heroOf(p.sig).pos.includes(newPos)){
    p.sig=pick(HEROES.filter(h=>h.pos[0]===newPos)).n; // 招牌不通用则重立
  }
  const newPool=[{n:p.sig,lv:3}];
  const add=(n,lv)=>{if(!newPool.some(x=>x.n===n))newPool.push({n,lv});};
  HEROES.filter(h=>h.pos.includes(newPos)&&h.n!==p.sig).forEach(h=>add(h.n,oldPool.has(h.n)?oldPool.get(h.n):2));
  p.heroPool=newPool;
  logEvent(s,'🔄 '+p.name+' 位置改造：'+POS[oldPos][0]+' → '+POS[newPos][0]+'（'+cost+'万）');
  save();renderAll();toast(p.name+' 已转型 '+POS[newPos][0]);
}
function doConvertPos(){
  const pid=$('#conv-player').value;
  const newPos=$('#conv-pos').value;
  if(!pid){toast('请选择选手');return;}
  convertPos(S,pid,newPos);
}
</script>
<script>

/* ================= 比赛与联赛（KPL 2025 官方赛制） =================
   常规赛4阶段：第一轮(3组单循环BO5)→第二轮(S/A/B)→卡位赛(BO7含巅峰对决)→第三轮(S/A单循环BO5)
   季后赛：S组6队(前4进胜者组)+A组前4 → 10队 BO7 双败淘汰，总决赛第7局巅峰对决
   常规赛胜者积1分；2026起奖金按胜小局数结算 */
const PHASE_NAME={r1:'常规赛·第一轮',r2:'常规赛·第二轮',card:'卡位赛',r3:'常规赛·第三轮',playoff:'季后赛',champion:'赛季结束',eliminated:'赛季结束'};
function logLevel(txt){
  if(/冠军|王朝|夺得总冠军/.test(txt))return 'gold';
  if(/惜败|败|负|😔|拖欠工资|淘汰|无缘/.test(txt))return 'lose';
  if(/胜|击败|获胜|晋级|卡位/.test(txt))return 'win';
  if(/💰|💸|🎁|🤝|🎉|🚀|赞助|奖|🎫/.test(txt))return 'gold';
  return 'info';
}
function logEvent(s,txt){s.eventLog.unshift({txt,t:Date.now(),level:logLevel(txt)});s.eventLog=s.eventLog.slice(0,120);}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function powerOf(s,name){
  if(name===s.teamName)return teamPower(s);
  ensureAiRosters(s,name); // 懒建真实阵容并写入 aiPower（与玩家同刻度）
  return s.aiPower[name]||450;
}
function phaseGroups(s){
  if(s.phase==='r1')return ['G1','G2','G3'];
  if(s.phase==='r2')return ['S','A','B'];
  if(s.phase==='r3')return ['S','A'];
  return [];
}
function myGroup(s){
  for(const g of phaseGroups(s)){if(s.groups[g]&&s.groups[g].includes(s.teamName))return g;}
  return null;
}
function sortGroup(s,g){
  const table=s.tables[g]||{};
  return (s.groups[g]||[]).slice().sort((a,b)=>{
    const ta=table[a]||{pts:0,pw:0},tb=table[b]||{pts:0,pw:0};
    if(ta.pts!==tb.pts)return tb.pts-ta.pts;
    return tb.pw-ta.pw;
  });
}
/* 初始化分组：玩家新队进 G3（第一轮抽签组），其余按战力蛇形分 G1/G2/G3 */
function initGroups(s){
  // 玩家执教的俱乐部从 AI 池移除（如选 AG 则 AI 中没有 AG）
  let aiList=AI_TEAMS.filter(t=>t.name!==s.teamName);
  // 自建队不在 AI 名单中：自动顶替最弱队席位（KPL 18 队固定）
  if(aiList.length>17)aiList=aiList.filter(t=>t.name!=='常山UUG');
  // 分组按真实阵容战力（与玩家 teamPower 同刻度），豪门进 G1、弱旅进 G3
  const all=aiList.map(t=>{
    const r=ensureAiRosters(s,t.name);
    return {name:t.name,power:r.length?aiRosterPower(r):t.power};
  });
  all.push({name:s.teamName,power:s.seedPower||teamPower(s)}); // 玩家种子=开局真实战力
  all.sort((a,b)=>b.power-a.power);
  s.leagueTeams=all.map(x=>x.name); // 联盟 18 队注册名录（联盟页/榜单用）
  const g1=all.slice(0,6).map(x=>x.name);
  const g2=all.slice(6,12).map(x=>x.name);
  const g3=all.slice(12,18).map(x=>x.name);
  s.groups={G1:g1,G2:g2,G3:g3};
  s.phase='r1';
  s.aiPower={};
  aiList.forEach(t=>{
    const r=s.aiRosters[t.name];
    s.aiPower[t.name]=r&&r.length?aiRosterPower(r):t.power;
  });
  initTables(s);
  genRoundSchedule(s);
  s.card=null;s.playoff=null;s.eliminated=[];
}
function initTables(s){
  s.tables={};
  phaseGroups(s).forEach(g=>{
    s.tables[g]={};
    s.groups[g].forEach(n=>{s.tables[g][n]={w:0,l:0,pts:0,pw:0};});
  });
}
/* 生成玩家所在组单循环赛程（5场） */
function genRoundSchedule(s){
  const g=myGroup(s);
  const opps=(s.groups[g]||[]).filter(n=>n!==s.teamName);
  shuffle(opps);
  s.schedule=opps.map((op,i)=>({round:i+1,opp:op,result:null,myScore:0,opScore:0}));
  s.matchIdx=0;
  buildGroupSchedule(s);
}
/* 全联盟赛程：每组单循环（6队→5轮×3场），玩家的场次留给真人打，其余由 AI 逐轮模拟 */
function buildGroupSchedule(s){
  s.aiSchedule={};
  phaseGroups(s).forEach(g=>{
    const teams=(s.groups[g]||[]).slice();
    // 舍转法：固定首队，其余轮转，生成 5 轮 × 3 场
    const n=teams.length,rounds=[];
    const arr=teams.slice(1);
    for(let r=0;r<n-1;r++){
      const pairs=[];
      const ring=[teams[0],...arr];
      for(let i=0;i<n/2;i++){
        const a=ring[i],b=ring[n-1-i];
        if(a&&b)pairs.push([a,b]);
      }
      rounds.push(pairs);
      arr.unshift(arr.pop());
    }
    s.aiSchedule[g]=[];
    rounds.forEach((pairs,ri)=>{
      pairs.forEach(([a,b])=>{
        if(a===s.teamName||b===s.teamName)return; // 玩家场次不模拟
        s.aiSchedule[g].push({round:ri+1,a,b,r:null});
      });
    });
  });
}
/* 模拟玩家已打到的轮次为止、所有组内尚未进行的 AI 场次，并更新积分表 */
function simulateAiRound(s,upToRound){
  if(!s.aiSchedule||!phaseGroups(s).some(g=>s.aiSchedule[g]))buildGroupSchedule(s); // 老存档懒构建
  const reports=[];
  phaseGroups(s).forEach(g=>{
    (s.aiSchedule[g]||[]).forEach(m=>{
      if(m.round>upToRound||m.r)return;
      const r=simSeriesResult(s,m.a,m.b,KPL.BO5);
      m.r={w:r.win?m.a:m.b,mw:r.mw,ow:r.ow};
      const ta=(s.tables[g]||{})[m.a],tb=(s.tables[g]||{})[m.b];
      if(!ta||!tb)return;
      if(r.win){ta.w++;ta.pts++;tb.l++;}
      else{tb.w++;tb.pts++;ta.l++;}
      ta.pw+=r.mw;tb.pw+=r.ow;
      if(m.round===upToRound)reports.push(g+'组：'+m.a+' '+r.mw+':'+r.ow+' '+m.b);
    });
  });
  if(reports.length)logEvent(s,'📰 联赛战报（第'+upToRound+'轮）：'+reports.slice(0,6).join('；'));
}
/* AI 系列赛（BO5/BO7 模拟，返回局数） */
function simSeriesResult(s,a,b,bo){
  let mw=0,ow=0;
  const need=Math.ceil(bo/2);
  const aEff=powerOf(s,a)*(1+dynastyStreak(s,b)*0.02); // 王朝反制①：对方连冠 → 我方研究加成
  const bEff=powerOf(s,b)*(1+dynastyStreak(s,a)*0.02);
  for(let i=1;i<=bo&&mw<need&&ow<need;i++){
    const w=Math.random()<winChance(aEff,bEff);
    if(w)mw++;else ow++;
  }
  return {win:mw>ow,mw,ow};
}
/* ===== 阶段推进 ===== */
function advancePhase(s){
  simulateAiRound(s,99); // 兜底补完本阶段未模拟的 AI 场次
  if(s.phase==='r1'){
    const sTeams=[],aTeams=[],bTeams=[];
    ['G1','G2','G3'].forEach(grp=>{
      const rank=sortGroup(s,grp);
      sTeams.push(rank[0],rank[1]);
      aTeams.push(rank[2],rank[3]);
      bTeams.push(rank[4],rank[5]);
    });
    s.groups={S:sTeams,A:aTeams,B:bTeams};
    s.phase='r2';
    initTables(s);
    genRoundSchedule(s);
    const g=myGroup(s);
    logEvent(s,'📊 第一轮结束！'+s.teamName+' 进入'+(g==='S'?'S组':g==='A'?'A组':'B组')+'（第二轮）');
  }else if(s.phase==='r2'){
    s.phase='card';
    setupCard(s);
  }else if(s.phase==='r3'){
    buildPlayoff(s);
  }
  save();renderAll();
}
/* ===== 卡位赛（BO7 含巅峰对决） ===== */
function setupCard(s){
  const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A'),bRank=sortGroup(s,'B');
  s.card={matches:[
    {a:sRank[4],b:aRank[1],r:null,winTo:'S'}, // S5 vs A2
    {a:sRank[5],b:aRank[0],r:null,winTo:'S'}, // S6 vs A1
    {a:aRank[4],b:bRank[1],r:null,winTo:'A'}, // A5 vs B2
    {a:aRank[5],b:bRank[0],r:null,winTo:'A'}, // A6 vs B1
  ],idx:0};
  s.eliminated=[...(s.eliminated||[]),...bRank.slice(2)]; // B3-B6 淘汰
  const myR=bRank.indexOf(s.teamName);
  if(myGroup(s)==='B'&&myR>=2){
    s.phase='eliminated';
    logEvent(s,'😢 第二轮 B 组排名 3-6，无缘本赛季后续比赛');
    // 联盟照常打完本赛季：补完卡位赛与季后赛，产生冠军（王朝统计/连冠反制需要）
    s.card.matches.forEach(m=>{if(!m.r){const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;}});
    s.card.idx=s.card.matches.length;
    finishCard(s);
    save();renderAll();
    return;
  }
  const playerIn=s.card.matches.some(m=>m.a===s.teamName||m.b===s.teamName);
  logEvent(s,'🎫 卡位赛（BO7·含巅峰对决）即将开始！');
  if(!playerIn){
    s.card.matches.forEach(m=>{const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;});
    s.card.idx=s.card.matches.length;
    finishCard(s);
    return;
  }
  save();renderAll();
}
function playCardNext(s){
  const m=s.card.matches[s.card.idx];
  if(!m){finishCard(s);return;}
  if(m.a===s.teamName||m.b===s.teamName){
    const opName=m.a===s.teamName?m.b:m.a;
    // 系列赛中断恢复：不重置比分
    if(s.series&&s.series.stage==='card'){
      showPreMatch('卡位赛（BO7·含巅峰对决）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
      return;
    }
    s.series={used:[],usedOpp:[],mw:0,ow:0,max:7,stage:'card',cardMatch:m,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'card',opName)};s.seriesAuto=false;
    resetOppEnergy(s,opName);
    showPreMatch('卡位赛（BO7·含巅峰对决）vs '+opName+' · 第1局');
  }else{
    const r=simSeriesResult(s,m.a,m.b,KPL.BO7);
    m.r=r.win?m.a:m.b;
    logEvent(s,'🎫 卡位赛：'+m.a+' vs '+m.b+'，'+m.r+' 晋级');
    s.card.idx++;
    save();renderAll();
    playCardNext(s);
  }
}
function finishCard(s){
  const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
  const sNew=[sRank[0],sRank[1],sRank[2],sRank[3]];
  const aNew=[aRank[2],aRank[3]];
  (s.card.matches||[]).forEach(m=>{
    if(!m.r){const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;}
    if(m.winTo==='S'){sNew.push(m.r);aNew.push(m.r===m.a?m.b:m.a);}
    else aNew.push(m.r);
  });
  s.groups={S:sNew,A:aNew};
  const alive=new Set([...sNew,...aNew]);
  s.eliminated=AI_TEAMS.map(t=>t.name).filter(n=>!alive.has(n));
  if(!alive.has(s.teamName)){
    s.phase='eliminated';
    logEvent(s,'😢 卡位赛未能突围，本赛季止步');
    buildPlayoff(s); // 联盟照常打完季后赛，产生本赛季冠军（王朝统计/连冠反制需要）
    save();renderAll();
    return;
  }
  s.phase='r3';
  initTables(s);
  genRoundSchedule(s);
  logEvent(s,'🏁 卡位赛结束！'+s.teamName+' 进入第三轮'+(myGroup(s)==='S'?'S组':'A组'));
  save();renderAll();
}
/* ===== 季后赛（10队双败淘汰 BO7） ===== */
function buildPlayoff(s){
  // 旧版残留的 simulateGroupAI 调用已删：r3 的 AI 场次由 simulateAiRound 逐轮模拟 + advancePhase 兜底补完，此处重跑会重复计分（且该函数在重构时已丢失导致进季后赛必崩）
  const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
  if(!sRank.length){s.phase='eliminated';save();renderAll();return;}
  s.playoff={
    wb:[{a:sRank[0],b:sRank[3],r:null},{a:sRank[1],b:sRank[2],r:null}], // 胜者组R1: S1vS4,S2vS3
    lb:[{a:aRank[0],b:aRank[3],r:null},{a:aRank[1],b:aRank[2],r:null}], // 败者组R1: A1vA4,A2vA3
    lb2:[{a:sRank[4],b:null,r:null},{a:sRank[5],b:null,r:null}], // S5/S6 直进败者组R2
    lb3:[{a:null,b:null,r:null},{a:null,b:null,r:null}], // 败者组R3: 胜者组R1败者 vs 败者组R2胜者
    wf:{a:null,b:null,r:null}, // 胜者组决赛
    lb4:{a:null,b:null,r:null}, // 败者组半决赛: lb3两胜者
    lbf:{a:null,b:null,r:null}, // 败者组决赛: wf败者 vs lb4胜者
    final:{a:null,b:null,r:null},champ:null
  };
  s.phase=(s.phase==='eliminated')?s.phase:'playoff'; // 玩家已出局时保留"止步"状态
  const inPlayoff=s.groups.S.includes(s.teamName)||aRank.slice(0,4).includes(s.teamName);
  logEvent(s,'🏆 季后赛开启！10强 BO7 双败淘汰');
  if(!inPlayoff){
    logEvent(s,'😢 未能晋级季后赛，本赛季止步');
    let guard=0;
    while(!s.playoff.final.r&&guard<20){playoffStep(s);guard++;}
    return;
  }
  save();renderAll();
}
function playoffStep(s){
  const p=s.playoff;
  if(!p)return;
  for(let i=0;i<2;i++){const m=p.wb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'wb'+(i+1));return;}}
  for(let i=0;i<2;i++){const m=p.lb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb'+(i+1));return;}}
  for(let i=0;i<2;i++){
    const m=p.lb2[i];
    if(m.b===null&&p.lb[i].r)m.b=p.lb[i].r;
    if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb2_'+(i+1));return;}
  }
  if(p.wf.a===null){p.wf.a=p.wb[0].r;p.wf.b=p.wb[1].r;}
  if(p.wf.r===null&&p.wf.a&&p.wf.b){playPoMatch(s,p.wf,'胜者组决赛');return;}
  for(let i=0;i<2;i++){
    const m=p.lb3[i];
    if(m.a===null)m.a=p.wb[i].r===p.wb[i].a?p.wb[i].b:p.wb[i].a;
    if(m.b===null&&p.lb2[i].r)m.b=p.lb2[i].r;
    if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb3_'+(i+1));return;}
  }
  if(p.lb4.a===null){p.lb4.a=p.lb3[0].r;p.lb4.b=p.lb3[1].r;}
  if(p.lb4.r===null&&p.lb4.a&&p.lb4.b){playPoMatch(s,p.lb4,'败者组半决赛');return;}
  // 败者组决赛：胜者组决赛败者 vs 败者组半决赛胜者（双败制关键）
  if(p.lbf.a===null){p.lbf.a=p.wf.r===p.wf.a?p.wf.b:p.wf.a;p.lbf.b=p.lb4.r;}
  if(p.lbf.r===null&&p.lbf.a&&p.lbf.b){playPoMatch(s,p.lbf,'败者组决赛');return;}
  if(p.final.a===null){p.final.a=p.wf.r;p.final.b=p.lbf.r;}
  if(p.final.r===null&&p.final.a&&p.final.b){playPoMatch(s,p.final,'总决赛');return;}
  if(p.final.r){
    p.champ=p.final.r;
    s.titleHistory=(s.titleHistory||[]).concat([{season:s.season,champ:p.final.r}]).slice(-12); // 王朝统计（连冠反制用）
    if(s.phase!=='eliminated')s.phase='champion'; // 玩家提前出局时：补完的联盟赛季不覆盖"止步"状态
    s.champion=p.final.r===s.teamName;
    if(s.champion){
      recordSeason(s);
      // 夺冠人气暴涨：全队商业价值提升（代言收入增加）
      s.players.forEach(p=>p.popularity=Math.min(99,(p.popularity||0)+5));
      logEvent(s,'📈 夺冠带来巨大曝光！全队选手人气+5，代言收入提升');
    }
    leaguePayout(s,s.champion?'冠军':'亚军');
    logEvent(s,'赛季'+s.season+'总冠军：'+p.final.r+'！'+(s.champion?'你就是冠军！':'下赛季再战！'));
    save();renderAll();
  }
}
function playPoMatch(s,m,slot){
  if(m.a===s.teamName||m.b===s.teamName){
    const opName=m.a===s.teamName?m.b:m.a;
    // 系列赛中断恢复：不重置比分
    if(s.series&&s.series.stage==='po'){
      showPreMatch((slot==='总决赛'?'总决赛':'季后赛')+'（BO7·含巅峰对决）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
      return;
    }
    s.series={used:[],usedOpp:[],mw:0,ow:0,max:7,stage:'po',poSlot:slot,poMatch:m,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'playoff',opName)};s.seriesAuto=false;
    resetOppEnergy(s,opName);
    showPreMatch((slot==='总决赛'?'总决赛':'季后赛')+'（BO7·含巅峰对决）vs '+opName+' · 第1局');
    return;
  }
  const r=simSeriesResult(s,m.a,m.b,KPL.BO7);
  m.r=r.win?m.a:m.b;
  logEvent(s,'📺 季后赛（'+slot+'）：'+m.a+' '+(r.win?'胜':'负')+' '+m.b+'，'+m.r+' 晋级');
  save();renderAll();
  playoffStep(s);
}
function startPlayoff(){playoffStep(S);}
/* 联盟分润：赛季末按季后赛名次分成（KPL 联盟承诺俱乐部分润不低于工资帽） */
function leaguePayout(s,place){
  const map={'冠军':500,'亚军':300,'四强':150,'八强':80};
  const amt=map[place];
  if(amt){s.fund+=amt;logEvent(s,'🏦 联盟分润（'+place+'）：'+amt+'万');}
}
/* 季后赛出局名次判定 */
function poPlace(slot,isFinal){
  if(isFinal)return '亚军';
