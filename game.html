<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141416">
<title>王者电竞经理 · KPL 篇</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ============================================================
   王者电竞经理 · 设计系统 v4 「TOUCHLINE」FM 经理模式风
   原则：像经营工具，不像转播大屏——
   中性深灰底 · 细边框 · 无渐变无发光 · 单一强调色 · 表格优先
   蓝=主色/信息 · 金=金钱与荣誉 · 红=负面 · 绿=正面
   ============================================================ */
:root{
  --bg:#141416; --surface:#1d1d20; --surface2:#1d1d20; --raise:#242428; --sunken:#101012;
  --line:#2a2a2e; --line2:#3a3a40;
  --txt:#e6e6e9; --dim:#9a9aa2; --faint:#6f6f77;
  --accent:#5c8af5; --accent-deep:#3d6bd6; --accent2:#5c8af5;
  --gold:#d9a441; --red:#d95d5d; --green:#4ba368;
  --r:#9a9aa2; --sr:#5c8af5; --ssr:#d9a441;
  --card2:#1d1d20; --cyan:var(--accent);
  --grad-a:none; --grad-btn:none; --grad-gold:none;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  background:radial-gradient(1100px 480px at 50% -8%,rgba(92,138,245,.075),transparent 62%),var(--bg);
  color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:14px;line-height:1.55;min-height:100vh;padding-bottom:20px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(92,138,245,.3)}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 20px}
.ic{flex:none;vertical-align:-2px}
svg.ic{display:inline-block}
.cut{border-radius:3px}

/* ===== Header ===== */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;position:sticky;top:8px;z-index:50}
.logo{display:flex;align-items:center;justify-content:center;flex:none}
.hd-name{font-size:16px;font-weight:700;line-height:1.3}
.hd-name small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);
  border-radius:3px;padding:5px 10px;min-width:0}
.stat .ic{color:var(--faint)}
.stat b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:10px;color:var(--faint);white-space:nowrap}
.stat.gold b{color:var(--gold)} .stat.red b{color:var(--red)} .stat.green b{color:var(--green)}
.stat.gold .ic{color:var(--gold)} .stat.red .ic{color:var(--red)} .stat.green .ic{color:var(--green)}
.hd-btn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--line2);
  color:var(--dim);border-radius:3px;padding:6px 10px;cursor:pointer;font-size:12px;transition:.15s}
.hd-btn:hover{color:var(--txt);border-color:var(--accent);background:rgba(92,138,245,.08)}

/* ===== Nav（桌面：顶部页签；移动：底部标签栏） ===== */
nav{display:flex;gap:2px;margin:12px 0;padding:0;background:var(--surface);border:1px solid var(--line);
  border-radius:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:72px;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 8px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
nav button .ic{color:var(--faint)}
nav button:hover{color:var(--txt);background:var(--raise)}
nav button.on{color:var(--txt);border-bottom-color:var(--accent);background:var(--raise)}
nav button.on .ic{color:var(--accent)}
section.page{display:none}
section.page.on{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ===== Cards / panels ===== */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0) 56px),var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px;
  position:relative}
.panel h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:11px;letter-spacing:.2px}
.panel h3 .h-ic{display:none}
.panel h3 .tag{font-size:10px;background:var(--raise);border:1px solid var(--line);color:var(--dim);
  padding:1px 8px;border-radius:10px;font-weight:400}
.grid{display:grid;gap:10px}
.g5{grid-template-columns:repeat(5,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g5{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2{grid-template-columns:1fr}.stats .stat{min-width:62px}}

/* ===== 双栏仪表盘（桌面端主列+侧栏） ===== */
.page-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;align-items:start}
.page-cols>.col{min-width:0}
.page-cols>.col>.panel:last-child{margin-bottom:0}
@media(max-width:1000px){.page-cols{grid-template-columns:1fr}}

/* ===== 面板折叠（点标题收起/展开，偏好存 localStorage） ===== */
.panel.collapsible>h3{cursor:pointer;user-select:none}
.panel.collapsible>h3::after{content:"▸";margin-left:auto;color:var(--faint);font-size:12px;transition:transform .18s;transform:rotate(90deg)}
.panel.collapsed>h3::after{transform:rotate(0)}
.panel.collapsed>*:not(h3){display:none}
.panel.collapsed{padding-bottom:12px}

/* ===== Player card ===== */
.pcard{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:11px 12px;position:relative;transition:.15s}
.pcard::before{content:none}
.pcard:hover{border-color:var(--line2)}
.pcard .p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pcard .p-name{font-weight:700;font-size:14px}
.pcard .p-pos{font-size:10px;font-weight:700;padding:1px 7px;background:rgba(92,138,245,.14);color:var(--accent);border-radius:2px}
.pcard .p-rarity{font-size:11px;font-weight:400;color:var(--dim)}
.pcard .p-tag{font-size:10px;margin-left:3px;background:var(--sunken);color:var(--dim);padding:1px 5px;border-radius:2px}
.pcard .p-hero{font-size:11px;color:var(--dim);margin-bottom:3px}
.pcard .p-hero b{color:var(--txt)}
.pcard .p-disc{float:right;font-size:10px;background:rgba(217,93,93,.14);color:var(--red);padding:1px 6px;border-radius:2px}
.pcard .p-hero-pick{border-color:var(--accent);background:rgba(92,138,245,.06)}
.pcard .p-skill{font-size:11px;color:var(--dim);margin:5px 0;line-height:1.5;min-height:32px}
.pcard .p-skill b{color:var(--dim)}
.pcard .attr{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--faint);margin-bottom:7px}
.pcard .attr i{font-style:normal;color:var(--txt);float:right;font-weight:700;font-variant-numeric:tabular-nums}
.pcard .p-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);border-top:1px solid var(--line);padding-top:6px}
.pcard .p-foot b{color:var(--txt);font-variant-numeric:tabular-nums}
.pcard.r{--rc:var(--r)} .pcard.r .p-rarity{color:var(--r)}
.pcard.sr{--rc:var(--sr)} .pcard.sr .p-rarity{color:var(--sr)}
.pcard.ssr{--rc:var(--ssr)} .pcard.ssr .p-rarity{color:var(--ssr)}
.pcard.ssr{border-color:rgba(217,164,65,.45)}
.pcard .p-hp{position:absolute;top:7px;right:8px;font-size:10px;color:var(--red)}
.pcard .p-salary{color:var(--gold)}
.pcard .bench-mark{position:absolute;top:7px;left:8px;font-size:10px;background:var(--sunken);color:var(--dim);padding:1px 7px;border-radius:2px}
.pcard button{margin-top:7px;width:100%;padding:7px;border:1px solid var(--line2);
  background:transparent;color:var(--txt);cursor:pointer;font-size:12px;font-weight:600;transition:.15s;border-radius:3px}
.pcard button:hover{border-color:var(--accent);color:var(--accent)}
.pcard button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pcard button.primary:hover{background:var(--accent-deep);color:#fff}
.pcard button.danger{color:var(--red)}
.pcard button.danger:hover{border-color:var(--red);background:rgba(217,93,93,.08);color:var(--red)}
.pcard button:disabled{opacity:.4;cursor:not-allowed}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 18px;
  border:1px solid var(--line2);background:var(--raise);color:var(--txt);
  cursor:pointer;font-size:13px;font-weight:600;transition:.15s;border-radius:3px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,#6b97ff,#5483ec);border-color:#6b97ff;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 2px 8px rgba(92,138,245,.22)}
.btn.primary:hover{background:linear-gradient(180deg,#7aa2ff,#5c8af5);border-color:#7aa2ff;color:#fff}
.btn.gold{background:linear-gradient(180deg,#e5b455,#d9a441);border-color:#e0ac47;color:#1d1505;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 8px rgba(217,164,65,.18)}
.btn.gold:hover{background:#c8942f;border-color:#c8942f;color:#1d1505}
.btn.danger{color:var(--red);border-color:rgba(217,93,93,.5)}
.btn.danger:hover{border-color:var(--red);background:rgba(217,93,93,.08);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:12px}

/* ===== Match / league ===== */
.match{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:8px;transition:.15s}
.match:hover{border-color:var(--line2)}
.match .vs{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.match .vs .tname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match .vs .power{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.match .score{font-size:18px;font-weight:700;color:var(--dim);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.match.win{border-color:rgba(75,163,104,.5)}
.match.win .score{color:var(--green)}
.match.lose{border-color:rgba(217,93,93,.4)}
.match.lose .score{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--faint);font-size:11px;font-weight:400;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.me td{background:rgba(92,138,245,.08);font-weight:600}
.tbl tr.me td:first-child{border-left:2px solid var(--accent)}
.logbox{background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:6px 13px;max-height:320px;
  overflow-y:auto;font-size:12.5px;line-height:1.9}
.logbox div{border-bottom:1px dashed var(--line)}
.logbox div:last-child{border-bottom:none}
.logbox .win{color:var(--green)} .logbox .lose{color:var(--red)} .logbox .info{color:var(--dim)} .logbox .gold{color:var(--gold)}
.event-card{border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--surface);border-radius:3px;padding:10px 13px;margin-bottom:8px}
.event-card .et{font-weight:700;color:var(--accent);font-size:12px;margin-bottom:3px}
.event-card p{font-size:13px;color:var(--txt);line-height:1.7}
.event-card .opt{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

/* ===== misc ===== */
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.dim{color:var(--dim)} .gold{color:var(--gold)} .cyan{color:var(--accent)} .red{color:var(--red)} .green{color:var(--green)}
.hint{font-size:11px;color:var(--dim);line-height:1.65}
.progress{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.pbar .progress{flex:1;margin-top:0}
.modal-bg{position:fixed;inset:0;background:rgba(8,8,10,.78);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:20px;
  max-width:560px;width:100%;min-width:0;max-height:88vh;overflow-y:auto;position:relative}
.modal.wide{max-width:720px}
.modal h2{display:flex;align-items:center;gap:8px;margin-bottom:13px;font-size:16px;font-weight:700}
.modal h2 .h-ic{display:none}
.modal h2 .tag{font-size:10px;background:var(--raise);border:1px solid var(--line);color:var(--dim);
  padding:1px 8px;border-radius:10px;font-weight:400;margin-left:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--raise);border:1px solid var(--line2);border-left:2px solid var(--accent);
  color:var(--txt);padding:9px 18px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;border-radius:3px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.league-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;margin-top:10px;
  border:1px solid var(--gold);background:rgba(217,164,65,.1);color:var(--gold);
  cursor:pointer;font-size:14px;font-weight:700;transition:.15s;border-radius:3px}
.league-btn:hover{background:rgba(217,164,65,.18)}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner::before{content:none}
.banner .big{font-size:18px;font-weight:700}
.sponsor{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 13px;margin-bottom:8px}
.sponsor .s-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  background:var(--raise);border:1px solid var(--line2);color:var(--accent);font-weight:700;font-size:13px;border-radius:3px}
.sponsor .s-name{font-weight:700;font-size:13px}
.sponsor .s-desc{font-size:11px;color:var(--dim)}
.sponsor .s-price{margin-left:auto;font-weight:700;color:var(--gold);font-size:13px}
footer{background:transparent;border-top:1px solid var(--line);
  text-align:center;padding:10px;font-size:11px;color:var(--faint)}
.club-card{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:10px;text-align:center;transition:.15s}
.club-card:hover{border-color:var(--accent)}
.pack-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:60px;min-height:48px;
  background:var(--raise);border:1px solid var(--line2);color:var(--txt);cursor:pointer;padding:8px 10px;transition:.15s;border-radius:3px}
.pack-btn:hover{border-color:var(--accent);color:var(--accent)}
.ic-pick{cursor:pointer}

/* ===== BP 台 ===== */
.bp-board{display:flex;gap:10px;align-items:stretch;margin:8px 0}
.bp-col{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0;position:relative}
.bp-col::before{content:none}
.bp-col.blue::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.bp-col.red::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--red)}
.bp-col-hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-col-hd .side-dot{width:8px;height:8px;flex:none;border-radius:2px}
.bp-col.blue .side-dot{background:var(--accent)}
.bp-col.red .side-dot{background:var(--red)}
.bp-col-hd small{font-weight:400;font-size:10px;color:var(--faint);margin-left:auto}
.bp-bans{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}
.bp-picks{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bp-slot{background:var(--sunken);border:1px solid var(--line);border-radius:3px;min-height:46px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 3px;text-align:center;overflow:hidden}
.bp-slot b{font-size:10.5px;font-weight:600;line-height:1.3;max-width:100%;color:var(--faint);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.bp-slot small{font-size:9px;color:var(--faint)}
.bp-slot.ban{min-height:32px;border-style:dashed}
.bp-slot.ban.filled{border-style:solid;background:rgba(217,93,93,.1);border-color:rgba(217,93,93,.45)}
.bp-slot.ban.filled b{color:var(--red);text-decoration:line-through}
.bp-slot.pick.filled{border-color:var(--line2);background:var(--raise)}
.bp-slot.pick.filled b{color:var(--txt)}
.bp-slot.pick.filled small{color:var(--dim)}
.bp-slot.pick.blind b{color:var(--faint)}
.bp-center{width:118px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center}
.bp-phase{font-size:12px;font-weight:700;color:var(--gold)}
.bp-stepnum{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.bp-stepbar{width:74px;height:3px;background:var(--sunken);overflow:hidden}
.bp-stepbar i{display:block;height:100%;background:var(--gold);transition:width .2s}
.bp-used{font-size:9px;color:var(--faint);max-height:72px;overflow-y:auto;line-height:1.6;padding-right:2px}
.bp-hero-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:228px;overflow-y:auto;padding:2px}
.bp-hero{flex:1 1 96px;max-width:150px;background:var(--raise);border:1px solid var(--line);color:var(--txt);border-radius:3px;
  padding:7px 9px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.12s;text-align:center}
.bp-hero small{display:block;font-size:9px;color:var(--faint);font-weight:400;margin-top:2px}
.bp-hero:hover{border-color:var(--accent)}
.bp-hero.pos{flex:1 1 108px;display:flex;flex-direction:column;align-items:center;gap:1px}
.bp-hero.rec{border-color:var(--accent);background:rgba(92,138,245,.08)}
.bp-hero.rec small{color:var(--accent)}
.bp-hero.sel{border-color:var(--gold);background:rgba(217,164,65,.1)}
.bp-hero.sel small{color:var(--gold)}
.bp-hero:active{transform:scale(.97)}
.bp-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin:6px 0 2px}
.bp-flow .f-step{display:flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);background:var(--raise);white-space:nowrap;border-radius:2px}
.bp-flow .f-step.cur{border-color:var(--gold);color:var(--gold)}
.bp-flow .f-step.off{opacity:.45}
.bp-opp{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:8px}

/* ===== 触控反馈 ===== */
.btn:active,.hd-btn:active,nav button:active,.pcard button:active,.club-card:active{transform:scale(.97)}

/* ===== 开场（仅首次进入，克制淡入） ===== */
#intro-overlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:var(--bg);
  animation:introFade .7s ease .7s forwards}
#intro-overlay .intro-inner{text-align:center;animation:introZoom .8s ease both}
#intro-overlay .intro-ico{font-size:44px;line-height:1;color:var(--accent);font-weight:700}
#intro-overlay .intro-name{font-size:20px;font-weight:700;margin-top:12px}

function radarSvg(p,size){ // 四维雷达（对线/运营/团战/心态，刻度 0-99）
 const z=size||76,cx=z/2,cy=z/2,r=z/2-13;

 const poly='<polygon points="'+vs.map((v,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="rgba(92,138,245,.25)" stroke="#5c8af5" stroke-width="1.5"/>';
 let dots='';vs.forEach((v,i)=>{const xy=pt(i,v);dots+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="2" fill="#8FB3F0"/>';});

const POS_W={top:{lane:.35,farm:.2,team:.25,mind:.2},jg:{lane:.15,farm:.4,team:.3,mind:.15},
 mid:{lane:.3,farm:.2,team:.3,mind:.2},ad:{lane:.3,farm:.35,team:.2,mind:.15},

function overall(p){
 const w=POS_W[p.pos]||{lane:.25,farm:.25,team:.3,mind:.2},a=p.attrs;
 return clamp(Math.round(a.lane*w.lane+a.farm*w.farm+a.team*w.team+a.mind*w.mind),1,99);
}
function ovrColor(o){return o>=90?'#ffb84d':o>=80?'#5aa7ff':'#7d93b8';}
function ovrCls(o){return o>=90?'ssr':o>=80?'sr':'r';} // 复用旧卡面色阶样式
const _curve=(pts,o)=>{
 if(o<=pts[0][0])return pts[0][1];
 for(let i=1;i<pts.length;i++)if(o<=pts[i][0]){
 const A=pts[i-1],B=pts[i];return Math.round(A[1]+(B[1]-A[1])*(o-A[0])/(B[0]-A[0]));
 }
 return pts[pts.length-1][1];
};

/* ================= 比赛模拟（Elo 胜率） =================
 分母 220：削弱纯战力碾压（BP/选人/版本强势才能真正左右胜负，弱队靠 BP 有翻盘空间） */
function winChance(my,opp){return 1/(1+Math.pow(10,(opp-my)/220));}

/* ================= 成就系统（生涯里程碑） =================
 巡检挂在 save() 上：每次状态落盘时统一评估，条件全部由当前状态可推导
 （冠军史 titleHistory / 荣誉室 honors / FMVP 名人堂 / 名册 / 资金 / 连胜），
 解锁一次永久入册 s.achieved（id→解锁年份）。测试/旧档免迁移：缺字段懒补。 */
/* ================= 战术板（系列赛倾向） =================
 选战术 = 改变四维在战力里的权重（总和恒为 1）：把自己阵容的强项放大、弱项缩小，
 因此没有"最优战术"，只有"最适合你阵容的战术"。克制关系 ±3% 只在比赛模拟里生效。
 S.tacticW 只在玩家设置了战术时存在——平衡门禁的模拟不设置，故门禁数值不受影响。 */
const BASE_W={lane:0.25,farm:0.25,team:0.3,mind:0.2};
const TACTICS=[
 {id:'balanced',name:'均衡运营',desc:'标准权重：不偏科，适合阵容全面的队伍',w:BASE_W,beats:null},

 {id:'team',name:'团战致胜',desc:'侧重团战配合（team .45）：抱团推进，一波定胜负',w:{lane:0.2,farm:0.2,team:0.45,mind:0.15},beats:'farm'},
 {id:'lane',name:'线优压制',desc:'侧重对线强度（lane .42）：三线全优滚雪球',w:{lane:0.42,farm:0.18,team:0.25,mind:0.15},beats:'team'},

];
function tacticById(id){return TACTICS.find(t=>t.id===id)||TACTICS[0];}

/* ================= 开局剧本（难度档） =================
 给"从头开始"加变量：同一套规则下初始条件不同，董事会达标难度也随之变化。
 剧本只改开局初始值，不动物价/赛制/战力公式——平衡门禁跑的是固定档位阵容，不受影响。 */
const SCENARIOS=[
 {id:'normal',name:'常规开档',hard:false,desc:'初始资金 8000万 · 工资帽 900万/周 · 标准挑战',
  apply:s=>{}},
 {id:'debt',name:'财政危机',hard:true,desc:'负债累累接手：初始资金 2000万 · 工资帽 700万，只能靠成绩翻身',
  apply:s=>{s.fund=2000;s.wageCap=700;}},
 {id:'exodus',name:'核心出走',hard:true,desc:'队内王牌季前被挖走，开局即空一个位置，必须去市场补人',
  apply:s=>dropBestPlayer(s)},
 {id:'cap',name:'工资帽紧缩',hard:true,desc:'联盟新政：工资帽 540万/周，豪华阵容养不起，只能靠青训与规划',
  apply:s=>{s.wageCap=540;}},
 {id:'cursed',name:'无冠魔咒',hard:true,desc:'常年无冠、士气低落：全队属性 -4 · 初始士气 50，等你破咒',
  apply:s=>{s.players.forEach(p=>{['lane','farm','team','mind'].forEach(k=>p.attrs[k]=clamp(p.attrs[k]-4,40,99));});}},
];
function scenarioById(id){return SCENARIOS.find(s=>s.id===id)||SCENARIOS[0];}
/* 核心出走：队内战力最高者被挖走（人已离队，不返还资金） */
function dropBestPlayer(s){
 if(!(s.players||[]).length)return null;
 const best=s.players.slice().sort((a,b)=>overall(b)-overall(a))[0];
 s.players=s.players.filter(p=>p!==best);
 s.lineup=(s.lineup||[]).filter(id=>id!==best.id);
 if(s.pick)delete s.pick[best.pos];
 return best;
}

function checkAchievements(s){
 if(!s)return;
 s.achieved=s.achieved||{};
 const unlock=s.achieved;
 ACHIEVEMENTS.forEach(a=>{
 if(unlock[a.id])return;
 let ok=false;
 try{ok=a.test(s);}catch(e){ok=false;}
 if(!ok)return;
 unlock[a.id]=gameYear(s);
 try{toast(' 成就解锁：'+a.name+'（'+a.desc+'）');logEvent(s,' 成就解锁「'+a.name+'」——'+a.desc);}catch(e){}
 });
}

/* ================= 历代联盟（2K 经典球队式：选一个时代开档扮演） =================
   KPL_ERAS：每个时代=一套完整联盟（18 队 + 阵容 + 教练 + 羁绊 + 执教模板）。
   真实明星选手按史实收录（阵容经公开赛事报道核实）；年代久远、阵容无从考证的席位
   由 genEraDef 生成「时代轮换选手」（游戏化演绎，career 注明）。installEra 在开局/读档时
   把默认联盟整体替换为该时代联盟，引擎赛制沿用现行年度赛历（游戏化演绎）。 */
/* ================= 名字池与组合命名（供自由球员 / 青训 / 时代轮换选手共用） =================
   池是有限的：ACADEMY_NAMES 36 个 + ERA_GEN_NAMES 48 个，囤人 30+ 或未来时代空位变多就会耗尽。
   旧版耗尽后兜底成「新人47」「新援12」这种占位名，故统一走 combName()：
   两字组合（20×20=400）→ 三字组合（8000），且**按固定顺序扫描、不引入随机**，
   保证 genEraDef 这类要求"重复安装产出完全相同 def"的路径仍然确定性。 */
const ROOKIE_NAMES=['小沐','阿泽','子辰','昊然','清扬','星野','无眠','逐梦','南风','初见','慕白','亦辰'];
/* 电竞 ID 风格组名：字库两两组合（如 洛野/白柒/江辞），避免「清扬_2」式自增后缀 */
const RK_A=['阿','小','白','苏','陆','沈','顾','洛','叶','凌','夜','莫','江','温','秦','池','祁','许','林','常'];
const RK_B=['川','野','辞','屿','柒','晏','深','迟','昭','眠','遥','笙','秋','策','尘','澜','溪','澈','泠','桉'];
function combName(used){
 for(const a of RK_A)for(const b of RK_B){const n=a+b;if(!used||!used.has(n))return n;}
 for(const a of RK_A)for(const b of RK_B)for(const c of RK_B){const n=a+b+c;if(!used||!used.has(n))return n;}
 return '选手'+(used?used.size:0); // 理论不可达（8400 个组合）；真到了也不能生成 undefined
}
/* 取偏好池中第一个未被占用的名字，池尽回退 combName。
   固定顺序扫描（find）不引入随机——开档名单的多样性由调用方 shuffle 名字池决定 */
function poolName(pool,used){
 if(!used)return pick(pool);
 const hit=pool.find(n=>!used.has(n));
 return hit||combName(used);
}

const ERA_GEN_NAMES=['临渊','栖梧','暮雪','孤舟','野渡','春潮','夏蝉','秋鸿','冬凌','朝雾','晚风','晨曦','夜阑','子规','青竹','翠微','苍梧','白鹭','闻笛','枕星','及锋','问渠','观棋','烂柯','折柳','吹角','连营','点兵','扬鞭','踏歌','放鹤','归鸿','拂衣','枕戈','听潮','望北','溯洄','宛在','水湄','蒹葭','既白','饮冰','怀瑾','佩瑜','其琛','维桢','令仪','令德'];
/* 时代轮换选手生成：确定性 id（g<时代>_<队>_<位置>）+ 确定性属性（id 哈希播种）
   ——重复安装/读档重装必须产出完全相同的 def，否则存档重载后 AI 战力会漂移 */
function genEraDef(eraId,team,pos,used){
 const key='g'+eraId+'_'+team.replace(/\./g,'')+'_'+pos; // 队名去点号（RNG.M→RNGM），保证 id 稳定可引用
 const exist=PLAYER_POOL.find(d=>d.id===key);
 if(exist)return exist;
 let name=poolName(ERA_GEN_NAMES.concat(ACADEMY_NAMES),used); // 池尽回退 combName（原为「新援N」）
 used.add(name);
 let h=5381;for(let i=0;i<key.length;i++)h=((h*33)^key.charCodeAt(i))>>>0;
 const rv=()=>{h=((h*1103515245)+12345)>>>0;return (h>>>16)%1000/1000;};
 const band=70+Math.floor(rv()*10); // 时代轮换/草根基准 70-79
 const base=[0,1,2,3].map(()=>clamp(band+Math.floor(rv()*9)-4,40,99));
 const skK=['lane','farm','team','mind'][Math.floor(rv()*4)];
 const sk={lane:['线霸体系','对线属性额外+8%'],farm:['运营体系','运营属性额外+8%'],team:['团战体系','团战属性额外+8%'],mind:['大心脏体系','心态属性额外+8%']}[skK];
 const cands=HEROES.filter(x=>x.pos[0]===pos);
 const def={id:key,name,pos,team,tags:[],base,skill:{n:sk[0],t:skK,d:sk[1]},
  sig:cands[Math.floor(rv()*cands.length)].n,
  career:eraId+'年效力于'+team+'的轮换选手（阵容演绎）。'};
 PLAYER_POOL.push(def); // 注册进选手池：defOf/defIndex 才能解析该 id
 return def;
}

 // 3→4：董事会/信任度 + 开局剧本（旧档补默认值：中性信任度 60、执教生涯从零计、剧本按常规）

function rosterAll(s){return s.players;}
function rosterLineup(s){return s.lineup.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);}

function myPlayer(s){return (s&&s.mode==='player'&&s.career)?s.players.find(p=>p.id===s.career.me)||null:null;} // 选手生涯：我扮演的选手
/* 夺冠阵容快照：冠军/亚军入册时记录当时的首发名单（荣誉室可回看"这冠是谁打下来的"） */
function titleRoster(s){
 try{return rosterLineup(s).map(p=>p.name).join('、')||'—';}catch(e){return '';}
}
function moraleAll(s,v){s.players.forEach(p=>p.morale=clamp(p.morale+v,20,100));}

function pickedHero(s,p){return (s.pick&&s.pick[p.pos])||p.sig;}

function heroAtPos(heroId,pos){const h=heroOf(heroId);return h&&h.pos.includes(pos)?h:null;}
/* 当前战术权重：玩家在战术板选了战术就用它的权重（四维总和恒 1），否则用标准权重。
 S.tacticW 只由战术板写入——平衡门禁的模拟不设置，战力体系对门禁保持原样。 */
function tacticWeights(){
 const t=(typeof S!=='undefined'&&S&&S.tacticW)?S.tacticW:null;
 return t||BASE_W;
}
function playerPower(p,heroId){
 const a=p.attrs;
 const w=tacticWeights();
 let pow=a.lane*w.lane+a.farm*w.farm+a.team*w.team+a.mind*w.mind;
 const sk=p.skill;
 if(sk.t==='lane')pow+=a.lane*0.12*w.lane;
 if(sk.t==='farm')pow+=a.farm*0.12*w.farm;
 if(sk.t==='team')pow+=a.team*0.12*w.team;
 if(sk.t==='mind')pow+=a.mind*0.12*w.mind;
 // 英雄加成：按熟练度（绝活+8% / 熟练+4% / 一般0% / 生疏-8%），版本热门再 +2%
 const h=heroId?heroAtPos(heroId,p.pos):null;
 if(h){
 pow*=1+HERO_LV[heroLv(p,heroId)].b;
 if(h.hot)pow*=1.02;
 }
 // 带伤：按伤情剩几天打折（10% ~ 30%），随恢复逐渐回稳
 if(p.injury>0)pow*=1-0.1*Math.min(p.injury,3);
 // 体力：低于 60 开始衰减（0 体力约 -24%）；每小局 -8、每日自然恢复 +10、休息 +55
 const eng=(p.energy==null)?100:p.energy;
 if(eng<60)pow*=1-(60-eng)*0.004;

}
/* AI 队战力：与 teamPower 同刻度（五位置最强者求和 × 士气系数）。

 （豪门名帅/草根平淡），每个赛季转会期 AI 队会从名宿市场挖角更好的教练（与玩家抢人）；
 无记录的队按职业队平均班底 +6% 折算（旧版 AI_STAFF 等价值，旧档懒初始化兼容）。 */
function aiCoachState(s){
 if(!s.aiCoaches){
 s.aiCoaches={};
 (typeof CLUB_TEMPLATES!=='undefined'?CLUB_TEMPLATES:[]).forEach(t=>{
 const c=COACH_POOL.find(x=>x.id===t.coach);
 if(c)s.aiCoaches[t.name]={id:c.id,name:c.name,rating:c.rating,bonus:c.bonus,styleBonus:c.styleBonus,style:c.style};
 });
 }

}
function aiCoachBonus(s,tn){return (s&&s.aiCoaches&&s.aiCoaches[tn])?s.aiCoaches[tn].bonus:6;}
function aiRosterPower(roster,s,tn){
 if(!roster||!roster.length)return 0;
 const best={};
 roster.forEach(p=>{
 if(p.injury>0)return; // 伤停必须休息：不计入战力（青训递补顶替出战）
 const v=playerPower(p,p.sig);
 if(best[p.pos]==null||v>best[p.pos])best[p.pos]=v;
 });
 let sum=0,cnt=0,mSum=0;
 POS_ORDER.forEach(pos=>{if(best[pos]!=null){sum+=best[pos];cnt++;}});
 if(!cnt)return 0;
 roster.forEach(p=>mSum+=(p.morale||80));
 const morale=clamp(mSum/roster.length/100,0.82,1.1);
 return Math.round(sum*morale*(1+aiCoachBonus(s,tn)/100));
}
/* picks 可选：BP 进行中实时结算用（未选位置回退招牌）；缺省走 S.pick */
function teamPower(s,picks){
 const ls=rosterLineup(s);
 if(!ls.length)return 0;
 const ph=p=>(picks&&picks[p.pos])||pickedHero(s,p);
 let pow=ls.reduce((t,p)=>t+playerPower(p,ph(p)),0);
 const mAvg=ls.reduce((t,p)=>t+p.morale,0)/ls.length;
 pow*=clamp(mAvg/100,0.82,1.1);
 activeBonds(s).forEach(b=>pow*=1+b.bonus/100);
 // 主教练加成：全队战力% + 侧重属性额外加成
 if(s.coach){
 const c=s.coach;
 const w={lane:0.25,farm:0.25,team:0.3,mind:0.2}[c.style];
 const attrSum=ls.reduce((t,p)=>t+p.attrs[c.style],0);
 pow+=attrSum*c.styleBonus/100*w;
 pow*=1+c.bonus/100;
 }
 // 助教组（上限2人）：与主教练加成叠加，幅度较小
 if(s.assistants&&s.assistants.length){
 s.assistants.forEach(a=>{
 const w={lane:0.25,farm:0.25,team:0.3,mind:0.2}[a.style]; const attrSum=ls.reduce((t,p)=>t+p.attrs[a.style],0);
 pow+=attrSum*a.styleBonus/100*w;
 pow*=1+a.bonus/100;
 });
 }
 // 连胜/连败手感：±2%/场，上限 ±10%
 if(s.streak)pow*=1+clamp(s.streak,-5,5)*0.02;

 if(s.captain&&ls.some(p=>p.id===s.captain))pow*=1.02;

}
function activeBonds(s){
 const ls=rosterLineup(s),cnt={};
 ls.forEach(p=>{if(p.team)cnt[p.team]=(cnt[p.team]||0)+1;});
 const act=[];
 for(const t in cnt){
 const def=TEAM_BONDS[t];
 if(!def)continue;
 if(cnt[t]>=def.full)act.push({bonus:def.bonusFull,desc:def.descFull});
 else if(cnt[t]>=def.min)act.push({bonus:def.bonusMin,desc:def.descMin});
 }

}

function seasonShapeOk(s){

function migrateSave(){

/* ================= 选手年龄体系（真实 KPL 生命周期） =================
 出道18-19（青训17跟训）→ 黄金期 → 下滑期 → 退役
 打野/射手寿命最短（24退役）· 对抗/中路中等（26退役）· 辅助最长（31退役，27-28仍可首发） */
const AGE_MODEL={
 jg:{gold:21,decline:22,retire:24,decay:2}, // 打野：吃手速反应，23岁后难首发，24退役
 ad:{gold:21,decline:22,retire:24,decay:2}, // 射手（发育路）：同上
 top:{gold:22,decline:23,retire:26,decay:1},// 对抗路：操作+意识，24-25下滑，26+极少首发
 mid:{gold:22,decline:23,retire:26,decay:1},// 中路：同上
 sup:{gold:24,decline:25,retire:31,decay:1},// 游走：靠大局观指挥，寿命最长，27-28仍有首发
};
function ageByPos(pos,isRookie){
 if(isRookie)return rnd(16,17); // 青训跟训
 if(pos==='sup')return rnd(19,22); // 辅助出道/在位年限更久
 if(pos==='jg'||pos==='ad')return rnd(18,20); // 野射出道早
 return rnd(18,21);
}
/* 年龄阶段标签 */
function ageStage(p){
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age>=m.retire)return '已退役';
 if(p.age>=m.retire-1)return '即将退役';
 if(p.age>m.gold)return '下滑期';
 return '黄金期';
}

<script>
function genPlayer(def){
 const keys=['lane','farm','team','mind'];
 const attrs={};
 keys.forEach((k,i)=>{attrs[k]=clamp((def.base?def.base[i]:70)+rnd(-1,1),40,99);});
 const o=overall({pos:def.pos,attrs}); // 总值：身价/工资/人气全部由它出
 // 主播选手工资减半（有直播收入），K甲新秀工资更便宜
 let wage=wageOf(o);
 if(def.tags&&def.tags.includes('主播'))wage=Math.max(2,Math.round(wage*0.5));
 if(def.tags&&def.tags.includes('青训'))wage=Math.max(2,Math.round(wage*0.7));
 // 英雄池：招牌(绝活lv3) + 本职及摇摆位全会(熟练lv2) —— 只含本位置可用英雄，BP 候选与档案展示一致
 const heroPool=[{n:def.sig,lv:3}];
 HEROES.filter(h=>h.pos.includes(def.pos)&&h.n!==def.sig).forEach(h=>heroPool.push({n:h.n,lv:2}));
 return {id:def.id,name:def.name,pos:def.pos,team:def.team||null,tags:def.tags||[],
 attrs,skill:def.skill,sig:def.sig,heroPool,career:def.career||'',wage,energy:ENERGY_MAX,morale:rnd(75,92),injury:0,
 mvp:0,retiring:false,contract:rnd(2,3), // 合同年限：到期后需续约（转会期处理）
 // 传奇老将：最后一舞（退役前1-2年），普通选手按位置出道年龄
 age:(def.team==='传奇')?(AGE_MODEL[def.pos]||AGE_MODEL.mid).retire-rnd(1,2):ageByPos(def.pos,def.tags&&def.tags.includes('青训')),
 // 商业价值（代言收入）与转会意愿（0=想走 100=死忠）
 popularity:Math.round((o>=90?rnd(38,65):o>=80?rnd(16,34):rnd(5,14))*(def.tags&&def.tags.includes('主播')?1.5:1)),
 willingness:rnd(45,90)};
}
/* 英雄熟练度：绝活+8% / 熟练+4% / 一般0% / 生疏-8% */
const HERO_LV={
 3:{n:'绝活',b:0.08,cls:'lv3',desc:'招牌英雄，如臂使指'},
 2:{n:'熟练',b:0.04,cls:'lv2',desc:'掌握精熟，稳定发挥'},
 1:{n:'一般',b:0,cls:'lv1',desc:'能拿出手，但没绝活'}, 
 0:{n:'生疏',b:-0.08,cls:'lv0',desc:'不擅长，容易打崩'},
};
function heroLv(p,heroId){const h=(p.heroPool||[]).find(x=>x.n===heroId);return h?h.lv:1;}
/* 英雄熟练度：绝活+8% / 熟练+4% / 一般0% / 生疏-8% */
function buyPlayer(s,p){
 const cost=Math.round(valueOf(overall(p))*(p.discount||1));
 if(s.fund<cost){toast('资金不足');return false;}
 if(s.players.some(x=>x.id===p.id)){toast('已拥有该选手');return false;}
 if(weeklyWage(s)+p.wage>s.wageCap){
 const {over,tax}=overCapTax(s,p.wage);
 if(!confirm(' 超帽签约：签下 '+p.name+' 后周薪 '+(weeklyWage(s)+p.wage)+'万（帽 '+s.wageCap+'万），超出 '+over+'万/周 需每周缴纳 60% 奢侈税（'+tax+'万/周）。\n多花钱可以，确定签下？'))return false;
 }
 s.fund-=cost;p.acqCost=cost;s.players.push(p); // acqCost：买入价锚定（转售保护用）
 if(p.contract==null)p.contract=2; // 签约即给合同年限
 s.market=s.market.filter(x=>x.id!==p.id); // 签约后从市场移除
 recordTransfer(s,'in',p,cost,'自由市场',p.discount?'市场特惠签约':'市场签约'); // 年度回顾·转会台账
 logEvent(s,` 从转会市场签约 ${p.name}（总值${overall(p)}·${POS[p.pos][0]}）${p.discount?'（特惠'+Math.round(p.discount*10)+'折）':''}`);
 try{SFX.gold();}catch(_){}
 save();renderAll();return true;
}

/* ================= 自由球员 / 青训名字池 =================
 与 18 队注册名单隔离，保证任何情况下联盟内一人一队 */
const ACADEMY_NAMES=['弈秋','观澜','听松','照夜','惊蛰','谷雨','芒种','白秋','霜降','立夏','惊鸿照','初霁','疏桐','晚晴','归舟','远山','泊烟','沉璧','映雪','疏星','垂柳','鸣蝉','宿雨','斜阳','烟渚','兰舟','竹杖','芒鞋','蓑衣','钓叟','渔火','枫桥','钟声','客船','碧水','东流'];
function genFreeAgentDef(pos,band,usedNames){

 const name=poolName(ACADEMY_NAMES,usedNames);
 if(usedNames)usedNames.add(name);
 // 档位即四维基准：star≈顶星(88+) / mid≈主力(78) / low≈轮换(69)，总值由 base 直出

 const base=[0,1,2,3].map(()=>rnd(BAND[0],BAND[1]));
 const sk=pick([['lane','对线属性额外+10%'],['farm','运营属性额外+10%'],['team','团战属性额外+10%'],['mind','心态属性额外+10%']]);

 const sig=pick(HEROES.filter(h=>h.pos[0]===pos)).n;
 return {id:'fa_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:null,tags:[],

 career:'自由球员，曾在次级联赛历练，'+rnd(18,22)+'岁，等待 KPL 机会。'};

<script>
/* 生成 AI 战队阵容（BP 界面可见对手选手与招牌英雄） */
function ensureAiRosters(s,teamName){
 s.aiRosters=s.aiRosters||{};
 if(s.aiRosters[teamName])return s.aiRosters[teamName];
 const map=aiRosterDefMap(s);
 const ids=map[teamName]||(s.ewcDefMap||{})[teamName]; // ewcDefMap：EWC 海外队选手（杯赛期间可正常 BP/结算）
 if(!ids)return [];
 s.aiPower=s.aiPower||{};
 const ownedIds=new Set(s.players.map(p=>p.id));
 const ownedNames=new Set(s.players.map(p=>p.name));
 const roster=ids.map(pid=>{
 const def=defOf(s,pid);
 if(!def)return null;
 if(s.retiredDefs&&s.retiredDefs.includes(pid))return null; // 已退役：空位由青训递补
 if(ownedIds.has(def.id)||ownedNames.has(def.name))return null; // 已被玩家签走：不再出现在对手阵中
 const p=genSeasonPlayer(s,def);
 return p;
 }).filter(Boolean).filter(p=>p.age<(AGE_MODEL[p.pos]||AGE_MODEL.mid).retire); // 到龄退役，空位由青训递补
 // 空位用本队青训递补，保证 5 人；查重必须看全局（玩家+青训营+市场+其他 AI 队缓存），
 // 否则 A/B 两队各自补青训会挑到同一个名字（跨队重名 bug）
 ['top','jg','mid','ad','sup'].forEach(pos=>{
 if(roster.some(p=>p.pos===pos))return;
 const usedNames=rookieUsedNames(s);
 roster.forEach(p=>usedNames.add(p.name));
 const p=genSeasonPlayer(s,genAcademyDef(pos,usedNames,s.season));
 roster.push(p);
 });
 s.aiRosters[teamName]=roster;
 s.aiPower[teamName]=aiRosterPower(roster,s,teamName); // AI 战力=真实阵容结算（与玩家 teamPower 同刻度）
 if(s.challDefMap&&s.challDefMap[teamName])s.aiPower[teamName]=Math.round(s.aiPower[teamName]*1.05); // 挑战者的祝福：低赛道队 vs KPL +5%（玩家对局同规则）
 return roster;
}
/* AI 选手随赛季年龄成长/衰减（与玩家 newSeason 同规则），联赛会随赛季演化
 黄金期每年 +1~2 点（原固定 +1 追不上玩家的训练速度，AI 会原地踏步） */
function ageDrift(p){
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age<=m.gold){
 const gk=pick(['lane','farm','team','mind']);
 p.attrs[gk]=clamp(p.attrs[gk]+rnd(2,3),55,99);
 }else if(p.age<m.retire){
 const key=pick(['lane','farm','team','mind']);
 p.attrs[key]=clamp(p.attrs[key]-rnd(1,m.decay),40,99);
 }
}
/* 从原始定义重建选手：年龄逐年推进到当前赛季，成长/衰减逐年结算
 （修复旧版年龄一次跳 N-1 岁但只结算 1 年成长的问题，黄金期选手会真实变强） */
function genSeasonPlayer(s,def){
 const p=genPlayer(def);
 for(let i=0;i<s.season-1;i++){p.age++;ageDrift(p);}
 return p;

 超帽不拒签：允许超工资帽签约，超出部分每周缴纳 60% 奢侈税（发薪日结算，经营页可见）。 */
function negoWageDemand(p){
 return Math.max(2,Math.round(p.wage*(1.15+(100-(p.willingness||0))/120)*(p.transferRequest?0.9:1)));
}
function negoAskFee(p){
 return p.untouchable?untouchablePrice(p):buyoutPrice(p);
}
function overCapTax(s,extraWage){
 const over=Math.max(0,weeklyWage(s)+(extraWage||0)-s.wageCap);
 return {over,tax:Math.round(over*0.6)};
}
function negoCapCheck(s,p){
 const {over,tax}=overCapTax(s,p.wage);
 if(over<=0)return true;
 return confirm(' 超帽签约：签下 '+p.name+' 后周薪 '+(weeklyWage(s)+p.wage)+'万（帽 '+s.wageCap+'万），超出 '+over+'万/周 需每周缴纳 60% 奢侈税（'+tax+'万/周）。\n多花钱可以，确定签下？');
}
function negoComplete(s,p,fee){
 const from=p.ownerTeam,isFA=p.freeAgent;
 delete p.ownerTeam;delete p.untouchable;delete p.freeAgent;delete p.signCost;
 if(fee!=null)p.acqCost=fee; // 买入价锚定（自由球员记 0，转售按保底价压）
 if(p.contract==null)p.contract=2; // 签约即给合同年限
 s.players.push(p);
 aiDetachDef(s,p.id); // 从 AI 阵容除名（若为 def）：原队下个转会期自动补强
 if(isFA)s.freeAgents=(s.freeAgents||[]).filter(x=>x.id!==p.id);
 s.transferList=(s.transferList||[]).filter(x=>x.id!==p.id);
 s.aiRosters={}; // 玩家签走任何选手后重建全部对手名册（自由球员也可能是他人首发，防同一名选手出现在两队）
}
function openNegotiation(s,pid){
 const p=s.transferList.find(x=>x.id===pid)||(s.freeAgents||[]).find(x=>x.id===pid);
 if(!p){toast('该选手不在转会市场');return;}
 if(s.players.some(x=>x.id===pid)){toast('已拥有该选手');return;}
 window._nego={s,pid,round:1,
 freeAgent:!!p.freeAgent,
 askFee:p.freeAgent?0:negoAskFee(p),
 askWage:negoWageDemand(p)};
 renderNego();
}

function renderNego(){

 ${negoRow('期望年薪',n.askWage+'万')}

 ${p.untouchable?`<div class="hint" style="color:var(--red)"> 非卖品：需 ${n.askFee}万 溢价强挖，每轮谈判有失败风险</div>`:''}
 </div>
 <div class="hint" style="margin-bottom:8px">报价需同时满足「转会费 ≥ 心理价位」和「年薪 ≥ 期望」，也可压价试探——但每被拒一轮，对方要价上涨，第 3 轮仍不满足则谈判破裂（意愿-10）。</div>
 ${n.msg?`<div class="event-card" style="margin-bottom:10px">${n.msg}</div>`:''}

 <label style="flex:1;min-width:120px">年薪(万)<input id="nego-wage" type="number" class="hd-in" value="${n.askWage}" style="width:100%;margin-top:4px"></label>

function negoFillAsk(){
 const n=window._nego;if(!n)return;
 // 意愿低的选手需要溢价才肯加盟（1.3 倍转会费），“满足要价”直接给出可成交的数
 const mult=(n.s.transferList.find(x=>x.id===n.pid)||{}).willingness<30?1.3:1;
 $('#nego-fee').value=Math.round(n.askFee*mult);$('#nego-wage').value=n.askWage;
}
function negoQuit(){

function negoSubmit(){
 const n=window._nego;if(!n)return;
 const s=n.s,p=s.transferList.find(x=>x.id===n.pid)||(s.freeAgents||[]).find(x=>x.id===n.pid);
 if(!p){window._nego=null;closeModal('app-modal');toast('谈判对象已失效（被他人签走或市场刷新）');return;}
 const fee=n.freeAgent?0:Math.max(0,parseInt($('#nego-fee').value,10)||0);
 const wage=Math.max(1,parseInt($('#nego-wage').value,10)||0);
 if(!n.freeAgent&&fee>s.fund){n.msg=' 俱乐部资金不足（现有 '+fmtWan(s.fund)+'，报价 '+fmtWan(fee)+'）。';renderNego();return;}
 // 非卖品强挖：每轮都掷成功率，失败=本轮破裂且要价上涨
 if(p.untouchable&&Math.random()>raidChance(p)){
 p.willingness=clamp(p.willingness-10,5,100);
 n.askFee=Math.round(n.askFee*1.15);n.askWage=negoWageDemand(p);
 n.round++;
 logEvent(s,' 强挖 '+p.name+' 被拒（'+(p.ownerTeam||'原俱乐部')+' 态度强硬，意愿-10）');
 if(n.round>3){negoBreak(s,p,'强挖多次未果');return;}
 n.msg=' '+p.ownerTeam+' 拒绝放人！对方态度更加强硬（意愿降至 '+p.willingness+'，要价已上调）。';
 renderNego();return;
 }
 // 评估：转会费/年薪是否达到逐轮上涨的要价
 const feeOk=n.freeAgent||fee>=n.askFee;
 const wageOk=wage>=n.askWage;
 const willingOk=p.willingness>=30||fee>=n.askFee*1.3; // 意愿低但要价给足也能打动
 if(feeOk&&wageOk&&willingOk){
 if(!negoCapCheck(s,p))return; // 超帽需确认（奢侈税），取消则留在谈判
 if(!n.freeAgent)s.fund-=fee;
 p.wage=wage;
 const fromTeam=n.freeAgent?'自由球员':(p.ownerTeam||'原俱乐部');
 negoComplete(s,p,n.freeAgent?0:fee);
 recordTransfer(s,'in',p,n.freeAgent?0:fee,fromTeam,n.freeAgent?'自由球员直签':'转会买断');
 logEvent(s,(n.freeAgent?' 签下自由球员 ':' 转会达成！')+' '+p.name+' 加盟 '+s.teamName+(n.freeAgent?'（年薪 '+wage+'万）':'（转会费 '+fee+'万 · 年薪 '+wage+'万）'));
 if(fee>=300)logEvent(s,' 重磅转会！联盟震动');
 window._nego=null;closeModal('app-modal');
 try{SFX.gold();}catch(_){}
 save();renderAll();toast(' 谈判成功！'+p.name+' 加盟');
 return;
 }
 // 被拒：给还价，要价上涨
 n.round++;
 n.askFee=n.freeAgent?0:Math.round(n.askFee*(feeOk?1:1.12));
 n.askWage=Math.round(n.askWage*(wageOk?1:1.1));
 const why=[];
 if(!feeOk)why.push('转会费低于心理价位');
 if(!wageOk)why.push('年薪不够');
 if(!willingOk)why.push('本人无意加盟');
 if(n.round>3){negoBreak(s,p,why.join('、'));return;}
 n.msg=' 对方摇头：'+why.join('、')+'。<br> 经纪人放话——'+(n.freeAgent?'':'转会费至少 <b style="color:var(--gold)">'+n.askFee+'万</b>，')+'年薪 <b style="color:var(--gold)">'+n.askWage+'万</b> 才考虑。';
 renderNego();
}
function negoBreak(s,p,reason){
 p.willingness=clamp(p.willingness-10,5,100);
 logEvent(s,' 与 '+p.name+' 的谈判破裂（'+reason+'），选手意愿-10');
 window._nego=null;closeModal('app-modal');
 save();renderAll();toast('谈判破裂：'+p.name+' 不为所动');
}

/* ================= 卖方谈判（FC26 式：多家俱乐部竞价，你抬价/递要价/接受） =================
 与买方对称：意向俱乐部数量由总值/人气决定，预算按俱乐部身价；
 三轮内递交心理要价——要价≤对方预算则接受、接近预算则给最终报价、过高直接退出；
 任何时候可接受某个报价；「回收商」一口价永远兜底（原秒卖价）。
 转售保护：刚买入未打满 5 场的选手，报价被压在买入价九折内（杜绝低价买高价卖的套利）。 */
function sellAskPrice(p){
 const base=Math.round(valueOf(overall(p))*0.92);
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 const ageF=p.age<=m.gold?1.1:p.age>=m.retire-1?0.7:0.9; // 黄金期溢价，临近退役打折
 const popF=1+(p.popularity||0)/250; // 人气=商业价值
 const valF=(p.val||100)/100; // 比赛表现浮动：状态火热溢价、持续低迷打折（70%~150%）
 return Math.round(base*ageF*popF*valF);
}
/* 表现状态标签（身价浮动可视化） */
function perfLabel(p){
 const v=p.val||100;
 return v>=125?'火热':v>=110?'↗走高':v>=95?'—稳定':v>=80?'↘下滑':'低迷';
}
/* 转售上限：有买入记录且出场<5 时返回价格上限，否则 null（无限制） */
function sellCeiling(p){
 if(p.acqCost==null||(p.caps||0)>=5)return null;
 const anchor=(p.acqCost||0)>0?p.acqCost:Math.round(valueOf(overall(p))*0.65);
 return Math.round(anchor*0.9);
}
function openSellNego(s,pid){
 const p=s.players.find(x=>x.id===pid);
 if(!p)return;
 if(p.loan){toast('租借选手不属于俱乐部，不能出售');return;}
 if(typeof natCamping==='function'&&natCamping(s,p)){toast(p.name+' 正在国家队集训（缺席夏季赛），不能出售');return;}
 if(p.natFill){toast(p.name+' 是亚运集训期的借调顶位，归还青训前不能出售');return;}
 if(p.kjia>0){toast(p.name+' 正在 K甲锻炼（剩余 '+p.kjia+' 天），归队后再操作转会');return;}
 if((s.listed||[]).some(x=>x.id===pid)){toast('该选手已挂牌，请先撤牌或等待报价');return;}
 const ask=sellAskPrice(p);
 const cap=sellCeiling(p);
 let cnt=overall(p)>=88?rnd(2,3):overall(p)>=78?rnd(1,2):(Math.random()<0.6?1:0); // 总值/人气决定意向俱乐部数
 if((p.popularity||0)>50)cnt++;
 const pool=AI_TEAMS.filter(t=>t.name!==s.teamName).slice();
 const clubs=[];
 for(let i=0;i<cnt&&pool.length;i++){
 const t=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
 const wealth=0.85+(t.power/640)*0.5; // 豪门预算更足
 let max=Math.round(ask*wealth*rnd(90,115)/100);
 if(cap!=null)max=Math.min(max,cap);
 clubs.push({name:t.name,max,bid:Math.round(max*rnd(60,78)/100),status:'active'});
 }
 window._sellNego={s,pid,round:1,ask,lock:cap!=null,lockCaps:Math.min(p.caps||0,4),
 lowball:Math.round(valueOf(overall(p))*0.65),
 clubs,
 msg:clubs.length?'收到 '+clubs.length+' 家俱乐部的初步报价：可直接接受、对某家逐轮抬价，或统一递交心理要价。':'暂无俱乐部感兴趣——可去挂牌等报价，或接受回收商一口价。'};
 renderSellNego();
}

 const rows=n.clubs.map((c,i)=>{

 <div class="score" style="font-size:13px;min-width:0">${c.bid}万</div>
 ${btn}
 </div>`;
 }).join('');
 const lowballRow=`<div class="match" style="margin-bottom:6px;padding:8px 10px">
 <div class="vs"><span class="tname" style="font-size:13px">回收商</span><div class="power" style="font-size:10px"><span style="color:var(--dim)">一口价打包带走</span></div></div>
 <div class="score" style="font-size:13px;min-width:0">${n.lowball}万</div>
 <button class="btn sm" style="margin:0;min-width:56px" onclick="sellAcceptClub(-1)">接受</button>
 </div>`;
 const html=`<h2>出售谈判 <span class="tag">${p.name} · 第 ${Math.min(n.round,3)}/3 轮</span></h2>
 <div class="hint" style="margin-bottom:8px">${POS[p.pos][1]} · 总值${overall(p)} · ${p.age}岁 · 战力 ${playerPower(p,p.sig)} · 人气 ${p.popularity||0} · 表现 <b class="${(p.val||100)>=110?'green':(p.val||100)<90?'red':''}">${perfLabel(p)} ${p.val||100}%</b><br>心理要价随比赛表现浮动（火热最高 +50%、低迷最低 -30%）；要价≤预算即成交、接近预算给最终报价、太高直接吓跑；三轮后未成交只剩回收商。</div>
 ${rows}${lowballRow}
 ${n.lock?`<div class="hint" style="margin:8px 0;color:var(--gold)"> 新援保护期：${p.name} 尚未代表球队打满 5 场（当前 ${n.lockCaps}/5），俱乐部报价压在买入价九折内——先让他上场，打满后恢复真实身价。</div>`:''}
 ${n.msg?`<div class="hint" style="margin:8px 0;color:var(--cyan)">${n.msg}</div>`:''}
 <div style="display:flex;gap:8px;align-items:center;margin:10px 0">
 <span style="font-size:12px;color:var(--dim);white-space:nowrap">心理要价</span>
 <input id="sell-ask" type="number" value="${n.ask}" style="flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px">
 <button class="btn primary" onclick="sellSubmitAsk()"> 递交要价</button>
 </div>
 <div class="center" style="display:flex;gap:8px;justify-content:center">
 <button class="btn" onclick="sellQuit()"> 停止出售</button>
 </div>`;
 $('#app-modal-body').innerHTML=html;
 $('#app-modal').classList.add('on');
}
function sellSubmitAsk(){
 const n=window._sellNego;if(!n)return;
 const A=Math.max(1,parseInt($('#sell-ask').value,10)||0);
 n.ask=A;n.round++;
 let agreed=0,finals=0,left=0;
 n.clubs.forEach(c=>{
 if(c.status!=='active')return;
 if(A<=c.max){c.bid=A;c.status='agreed';agreed++;}
 else if(A<=c.max*1.25){c.bid=c.max;c.status='final';finals++;}
 else{c.status='walked';left++;}
 });
 if(n.round>3){
 n.clubs.forEach(c=>{if(c.status==='active'){c.bid=c.max;c.status='final';}});
 n.msg=' 最后通牒：三轮报价结束，仍在谈的俱乐部给出了最终报价——接受或放弃。';
 }else if(agreed){
 n.msg=' '+agreed+' 家俱乐部接受你的要价，点「接受」即可成交！';
 }else if(finals){
 n.msg=' '+finals+' 家俱乐部给出了最终报价，再抬价他们就退出了'+(left?'，另有 '+left+' 家已离场':'')+'。';
 }else{
 n.msg=' 要价太高，俱乐部都在观望或离场……';
 }
 renderSellNego();
}
function sellAcceptClub(i){
 const n=window._sellNego;if(!n)return;
 const s=n.s;
 let team,fee;
 if(i<0){team='回收商';fee=n.lowball;}
 else{
 const c=n.clubs[i];
 if(!c||c.status==='walked'){toast('该俱乐部已退出谈判');return;}
 team=c.name;fee=c.bid;
 }
 const p=s.players.find(x=>x.id===n.pid);
 if(!p)return;
 const wasStarter=s.lineup.includes(p.id);
 completeSale(s,p,fee,team);
 if(wasStarter&&!s.players.some(x=>x.pos===p.pos))toast(' '+POS[p.pos][0]+'位置已无人，记得补签');
 window._sellNego=null;closeModal('app-modal');
 save();renderAll();toast(p.name+' 已售出（'+fee+'万）');
}
function sellQuit(){
 window._sellNego=null;closeModal('app-modal');toast('已停止出售，选手留队');
}
/* 成交共用：转会费入账 + 名册/首发/挂牌清理 */
function completeSale(s,p,fee,team){
 recordTransfer(s,'out',p,fee,team,'转会出售'); // 年度回顾·转会台账
 s.fund+=fee;
 s.maxSale=Math.max(s.maxSale||0,fee); // 单笔出售纪录（成就「天价交易」）
 s.players=s.players.filter(x=>x.id!==p.id);
 if(s.lineup.includes(p.id))s.lineup=s.lineup.filter(x=>x!==p.id);
 if(s.pick)delete s.pick[p.pos];
 s.listed=(s.listed||[]).filter(x=>x.id!==p.id);
 s.bids=(s.bids||[]).filter(x=>x.id!==p.id);
 // 兜底注册 def：市场/自由签来的选手（genFreeAgentDef）没有 def 存档，出售时必须补建，
 // 否则买入方 AI 队「查无此人」，选手直接从联盟蒸发（转会市场/对手阵容都找不到）
 if(!defOf(s,p.id)){
 (s.extraDefs=s.extraDefs||[]).push({
 id:p.id,name:p.name,pos:p.pos,team:p.team||null,tags:p.tags||[],
 base:[p.attrs.lane,p.attrs.farm,p.attrs.team,p.attrs.mind],skill:p.skill,sig:p.sig,
 career:p.career||''});
 }
 const attached=aiAttachDef(s,p.id,team); // 买入方 AI 队在册（若为 def），下赛季起为他出战
 const tl=(s.transferList||[]).find(x=>x.id===p.id);
 if(tl){tl.ownerTeam=team;tl.untouchable=false;} // 转会市场条目同步归属新东家
 else if(!attached){
 // 买家阵容已满（5人/位置被占）时无法即时入册：把他挂进转会市场归属买家，
 // 保证随时找得到，下个转会期 AI 会按缺位补强把他签进阵容
 const entry={...p,ownerTeam:team,untouchable:false,willingness:Math.max(p.willingness||60,70)};
 delete entry.signCost;delete entry.freeAgent;
 (s.transferList=s.transferList||[]).push(entry);
 }

}

function aiBidTick(s){
 (s.listed||[]).forEach(item=>{
 if((s.bids||[]).some(b=>b.id===item.id))return;
 if(Math.random()<0.3){
 const team=pick(AI_TEAMS.filter(t=>t.name!==s.teamName));

 let bid=Math.round(item.price*(0.85+Math.random()*0.35));
 if(p){const cap=sellCeiling(p);if(cap!=null)bid=Math.min(bid,cap);} // 挂牌报价同样受转售保护
 s.bids=[...(s.bids||[]),{id:item.id,team:team.name,bid}];
 if(p)toast(' '+team.name+' 对 '+p.name+' 报价 '+bid+'万！');
 }
 });
 // 联盟内部重磅转会：非卖品意愿松动后被豪门挖走（队魂也会离队）——真实变更其 AI 队在册
 if(Math.random()<0.15){
 const candidates=(s.transferList||[]).filter(p=>p.untouchable&&p.willingness<75);
 if(candidates.length){
 const p=pick(candidates);
 const buyer=pick(AI_TEAMS.filter(t=>t.name!==p.ownerTeam&&t.name!==s.teamName));
 const price=untouchablePrice(p);
 aiAttachDef(s,p.id,buyer.name);
 logEvent(s,' 重磅转会！'+p.name+' 以 '+price+'万 转会至 '+buyer.name+'（非卖品破例放行）');
 s.transferList=s.transferList.filter(x=>x.id!==p.id);
 }
 }
 // 转会窗内 AI 补强：每天有概率有 AI 队签走一名自由球员——
 // 缺位的队直接认领；满编的队用更强的自由球员顶替弱首发（被顶替者流入自由市场）
 if(Math.random()<0.3&&(s.freeAgents||[]).length){
 const fa=pick(s.freeAgents);
 const map=aiRosterDefMap(s);
 const faOvr=overall(fa);
 const buyers=[];
 Object.keys(map).forEach(tn=>{
 if(tn===s.teamName)return;
 const cur=map[tn].map(id=>defOf(s,id)).filter(Boolean);
 const atPos=cur.find(d=>d.pos===fa.pos);
 if(!atPos){if(cur.length<5)buyers.push({tn,replace:null});}
 else if(faOvr-overall(genSeasonPlayer(s,atPos))>=3)buyers.push({tn,replace:atPos}); // 明显更强才动首发
 });
 const buyer=buyers.sort((a,b)=>(s.aiPower[a.tn]||400)-(s.aiPower[b.tn]||400))[0]; // 弱旅优先
 s.freeAgents=s.freeAgents.filter(x=>x.id!==fa.id);
 if(buyer){
 if(buyer.replace){
 aiDetachDef(s,buyer.replace.id); // 旧首发除名：下个转会期进自由池流转
 logEvent(s,' 转会动态：'+buyer.replace.name+' 被 '+buyer.tn+' 放弃，流入自由市场');
 }
 const def=defOf(s,fa.id);
 if(def&&!s.retiredDefs.includes(def.id)&&!(s.extraDefs||[]).some(x=>x.id===def.id))s.extraDefs.push(def);
 aiAttachDef(s,fa.id,buyer.tn); // 名册缓存失效：该选手立即为买方出战
 logEvent(s,' 转会动态：'+fa.name+'（'+POS[fa.pos][0]+'）以自由身加盟 '+buyer.tn+(buyer.replace?'，顶替 '+buyer.replace.name:''));
 }else{
 logEvent(s,' 转会动态：'+fa.name+' 被海外联赛球队签走，退出自由市场');
 }
 }
}

/* ================= 合同续约系统 =================
 赛季末合同到期 → 转会期处理：续约 2 年（签字费=身价 18%×表现系数）或放走（进自由市场）。
 转会窗结束仍未处理的自动续约 1 年（防误伤主力，想放走需主动点"不续约"）。 */
const RENEW_YEARS=2;
function renewCost(p){
 const f=(p.val||100)>=125?1.25:(p.val||100)<90?0.75:1; // 表现火热更贵、低迷更便宜
 return Math.max(100,Math.round(sellAskPrice(p)*0.18*f));
}
function renewPlayer(s,pid,years,offerWage){
 const p=s.players.find(x=>x.id===pid);
 if(!p||p.loan||(p.contract||0)>1){toast('该选手合同未到期');return;}
 const y=Math.min(4,Math.max(1,years||RENEW_YEARS));
 const cost=renewCostN(p,y);
 if(s.fund<cost){toast('资金不足（续约签字费 '+cost+'万）');return;}
 s.fund-=cost;
 const nw=offerWage?Math.round(offerWage):Math.round(wageOf(overall(p))*((p.val||100)/100)); // 报价成交按谈定周薪，否则按表现重定
 if(nw>p.wage)logEvent(s,' '+p.name+' 续约涨薪：'+p.wage+'万 → '+nw+'万/周（表现好值得加薪）');
 else if(nw<p.wage)logEvent(s,' '+p.name+' 接受降薪续约：'+p.wage+'万 → '+nw+'万/周');
 p.wage=Math.max(1,nw);
 p.contract=y;
 p.morale=clamp(p.morale+6,20,100);
 p.willingness=Math.min(100,(p.willingness||50)+10);
 logEvent(s,' 与 '+p.name+' 完成续约（'+y+' 年 · 签字费 '+cost+'万 · 周薪 '+nw+'万）');
 s.expiring=(s.expiring||[]).filter(x=>x!==pid);
 save();renderAll();toast(p.name+' 续约 '+y+' 年！');
}
/* ================= 续约谈判（合同可谈，非固定价） =================
 年限 1-4 年自由谈：锁得越久经纪人要价越高（长约溢价），
 老将/闹情绪选手会抬价；报价低于心理价位会被拒，最多三轮，谈崩伤士气。 */
function renewAskWage(p,years){
 let w=wageOf(overall(p))*((p.val||100)/100);
 w*=1+0.09*((years||2)-1);
 const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
 if(p.age>=m.gold)w*=1.05;
 if((p.morale||50)<40)w*=1.05;
 return Math.max(5,Math.round(w/5)*5);
}
function renewCostN(p,years){return Math.max(50,Math.round(renewCost(p)*(0.55+0.45*((years||2)-1))));}

/* ================= 赛前转会期（开局/新赛季先组队，再开赛） =================

function endPreseason(s){

/* 跳过剩余转会期：每天自动训练核心选手 + 培养青训（不浪费天数），AI 报价照常走，
 天数走完后自动结束转会期并开赛（与 endPreseason 的阵容校验一致） */
function skipTransferWindow(s){
 const left=s.transferWindow||0;
 if(left<=0){toast('当前不在转会期');return;}
 if(!confirm('跳过剩余 '+left+' 天转会期？期间每天自动：\n· 训练一名核心选手（练最弱属性，80万/次）\n· 培养一名青训（潜力优先，100万/次）\n资金不足的天数自动跳过；AI 报价照常进行。'))return;
 autoFillLineup(s);
 const miss=POS_ORDER.filter(pos=>!s.players.some(p=>p.pos===pos));
 if(miss.length){toast(' '+miss.map(pos=>POS[pos][0]).join('、')+' 位置无人，无法开赛，请先签约选手');return;}
 let guard=0;
 while(s.transferWindow>0&&guard++<30){
 if(!s.trained)autoDoTrain(s);
 if(!s.academyTrained)autoTrainRookie(s);
 const bidsBefore=(s.bids||[]).length;
 nextDay(s); // 内部处理 AI 报价 / 转会窗关闭自动开赛 / 发薪 / 随机事件
 // 挂牌选手被 AI 报价：暂停跳过、保留剩余天数，优先去谈判（接受/拒绝/撤牌）
 if((s.bids||[]).length>bidsBefore){
 logEvent(s,' 转会期出现新报价，跳过流程暂停——请到转会市场处理（接受/拒绝/撤牌）');
 save();renderAll();
 toast(' 有 AI 报价！已暂停跳过，去转会市场谈判');
 goPage('market');
 return;
 }
 }

 save();renderAll();
 toast('转会期跳过完成，联赛开始！');
}

 if(!p)return;
 const key=['lane','farm','team','mind'].sort((a,b)=>p.attrs[a]-p.attrs[b])[0]; // 练最弱属性

/* 刷新自由市场：转会窗内每日首次免费（可重复刷但按 5 万/次收费） */function refreshMarket(s){
 const inWindow=s.transferWindow>0;
 const free=inWindow&&!s.marketRefreshed;
 if(!free){
 if(s.fund<50){toast('资金不足（刷新需 50 万）');return;}
 s.fund-=50;
 }
 const usedNames=rookieUsedNames(s); // 全局查重：市场生成的选手不与联盟任何人重名
 s.market=[];
 for(let i=0;i<6;i++){
 const roll=Math.random();
 const band=inWindow?(roll<0.2?'star':roll<0.6?'mid':'low'):(roll<0.1?'star':roll<0.5?'mid':'low'); // 转会窗内顶星供给增加
 const np=genPlayer(genFreeAgentDef(pick(POS_ORDER),band,usedNames));
 if(Math.random()<0.15)np.discount=0.8; // 特惠上架（15% 概率 8 折，对应市场页划线价/特惠标签）
 s.market.push(np);
 }
 s.marketRefreshed=true;
 // 教练市场：随机 3 名候选教练（与现任不重复）
 s.coachMarket=s.coachMarket||[];
 const coachSeen=new Set();
 if(s.coach)coachSeen.add(s.coach.id);
 let cGuard=0;
 while(s.coachMarket.length<3&&cGuard++<40){
 const c=pick(COACH_POOL);
 if(coachSeen.has(c.id))continue;
 coachSeen.add(c.id);s.coachMarket.push({...c});
 }
 s.coachMarket.sort((a,b)=>(b.rating||0)-(a.rating||0));
 save();renderAll();
 toast(free?'转会窗内免费刷新（每日首次）':'市场已刷新（-5万）');
}
/* 签约主教练：已有教练时直接换帅（旧帅离任） */
function signCoach(s,c){

 if(s.fund<c.cost){toast('资金不足（签约费 '+c.cost+'万）');return;}
 if(s.coach&&s.coach.id===c.id){toast('该教练已是你队主教练');return;}
 s.fund-=c.cost;
 s.coachMarket=(s.coachMarket||[]).filter(x=>x.id!==c.id); // 已执教教练移出市场
 if(s.coach)logEvent(s,' 换帅！'+s.coach.name+' 离任，'+c.name+' 出任主教练');
 else logEvent(s,' 签约主教练 '+c.name+'（'+(c.rating||80)+'评分·'+COACH_STYLE[c.style]+'型）');
 s.coach={...c};
 save();renderAll();toast(c.name+' 执教！全队战力+'+c.bonus+'%');
}
/* 解雇主教练：无教练期间全队无教练加成 */
function fireCoach(s){
 if(!s.coach){toast('当前没有主教练');return;}
 logEvent(s,' '+s.coach.name+' 与俱乐部解约离任');
 s.coach=null;

/* ================= 租借系统（非转会期唯一的人员流动方式） =================
 转会窗关闭时不能买卖选手，但可以向其他战队租借替补：支付租金（身价 15%），
 租借 21 天，到期自动归队；非卖品不可租，同时最多租 2 人；租借期间原队出青训递补。 */
const LOAN_DAYS=21;
function untouchableSet(){
 const U=new Set();
 for(const tn in AI_ROSTERS)AI_ROSTERS[tn].u.forEach(id=>U.add(id));
 return U;
}
function loanRent(p){return Math.max(80,Math.round(valueOf(overall(p))*0.15));}
function loanCandidates(s){
 const U=untouchableSet();
 const map=aiRosterDefMap(s);
 const out=[];
 for(const tn in map){
 if(tn===s.teamName)continue;
 (ensureAiRosters(s,tn)||[]).forEach(p=>{
 if(U.has(p.id))return; // 非卖品：队魂不外借
 out.push({p,from:tn,rent:loanRent(p)});
 });
 }
 return out.sort((a,b)=>overall(b.p)-overall(a.p));
}
function loanPlayer(s,teamName,pid){
 if(s.transferWindow>0){toast('转会窗内可以直接买断，无需租借');return;}
 if((s.players||[]).filter(p=>p.loan).length>=2){toast('租借名额已满（最多同时租借 2 人）');return;}
 const p=(ensureAiRosters(s,teamName)||[]).find(x=>x.id===pid);
 if(!p){toast('该选手不在租借名单');return;}
 if(untouchableSet().has(p.id)){toast(p.name+' 是非卖品，不外借');return;}
 const rent=loanRent(p);
 if(s.fund<rent){toast('资金不足（租金 '+rent+'万）');return;}
 s.fund-=rent;
 p.loan={from:teamName,days:LOAN_DAYS};
 s.players.push(p);
 aiDetachDef(s,p.id); // 原队除名（真实 def）：租借期内原队青训递补
 s.aiRosters={}; // 名册缓存失效
 logEvent(s,' 租借达成：'+p.name+'（'+POS[p.pos][0]+' · 总值'+overall(p)+'）从 '+teamName+' 租借 '+LOAN_DAYS+' 天，租金 '+rent+'万');
 save();renderAll();toast(p.name+' 租借加盟！'+LOAN_DAYS+' 天后自动归队');
}
function tickLoans(s){
 (s.players||[]).slice().forEach(p=>{
 if(!p.loan)return;
 p.loan.days--;
 if(p.loan.days<=0){
 const from=p.loan.from;
 logEvent(s,' 租借到期：'+p.name+' 返回 '+from);
 s.players=s.players.filter(x=>x.id!==p.id);
 const li=s.lineup.indexOf(p.id);
 if(li>=0)s.lineup.splice(li,1);
 if(s.pick)delete s.pick[p.pos];
 aiAttachDef(s,p.id,from); // 真实 def 回归原队（ac_ 递补则自然消散）
 s.aiRosters={};
 }
 });
}
/* ================= 赛中转会报价（打出名堂的选手收到其他队 offer） =================
 赛季进行中（非转会期），表现火热的选手会被其他俱乐部盯上——留人/放人/抬价三选：
 留人花工资（涨薪 ~8% 表达诚意，士气与忠诚上升）；放人收钱但得罪粉丝与更衣室；
 抬价约半数买家接受、部分给最终报价、也可能直接离场。报价 3 天不答复自动过期。
 与董事会/更衣室的联动是天然发生的：留人推高周薪（工资帽/奢侈税压力），
 放人削弱阵容（KPI 风险）并让队友寒心。引擎只在 nextDay 生成与过期 offer——
 门禁模拟不结算真实比赛表现（val 只在 gamePerform 更新），不会触发本系统。 */
const OFFER_TTL=3; // 报价有效期（天）
function eligibleForOffer(s,p){
 if(!p||p.loan||p.kjia>0)return false;
 if(typeof natCamping==='function'&&natCamping(s,p))return false; // 国家队集训缺席，不接 offer
 if((p.val||100)<112)return false; // 表现门槛：打出名堂（火热≥112%）
 return true;
}
function inSeasonOfferTick(s){
 if(s.transferWindow>0)return; // 转会期走挂牌竞价，不重复
 s.offers=s.offers||[];
 const before=s.offers.length;
 s.offers=s.offers.filter(o=>o.expire>s.day);
 if(s.offers.length<before)logEvent(s,' 有俱乐部的赛中报价到期无人答复，买家转向了其他目标');
 if(s.offers.length>=2)return; // 同时最多挂 2 份，避免刷屏
 const onlyMe=(s.mode==='player')?(s.career&&s.career.me):null; // 选手模式：只盯我自己的表现
 (s.players||[]).forEach(p=>{
 if(s.offers.length>=2)return;
 if(onlyMe&&p.id!==onlyMe)return;
 if(s.offers.some(o=>o.pid===p.id))return;
 if(!eligibleForOffer(s,p))return;
 if((p._offerCd||0)>s.day)return;
 // 概率随火热程度上浮（火热顶星 ~6%/天，刚过门槛 ~1.5%/天）
 const heat=(p.val||100)-100;
 if(Math.random()>=clamp(0.015+heat*0.0012,0.015,0.06))return;
 const fee=Math.round(buyoutPrice(p)*(0.95+Math.random()*0.4)); // 95%~135% 身价
 // 买家偏好：身价越高越可能是豪门在挖（取 AI 队前半段的强队池）
 const pool=AI_TEAMS.filter(t=>t.name!==s.teamName);
 const buyer=pick(pool.slice(0,Math.max(6,Math.round(pool.length*(overall(p)>=88?0.5:1)))));
 s.offers.push({pid:p.id,name:p.name,team:buyer.name,fee,expire:s.day+OFFER_TTL,status:'open'});
 p._offerCd=s.day+20; // 同一选手 20 天内不再被报价
 logEvent(s,' 赛中报价：'+buyer.name+' 开价 '+fee+'万 买断 '+p.name+'（表现引起联盟关注，俱乐部页 '+OFFER_TTL+' 天内答复）');
 });
}
/* 放人结算共用：转会费入账 + 粉丝失望 + 队友寒心（sold 触发的两条系统联动） */
function sellViaOffer(s,p,fee,team){
 const pop=p.popularity||0;
 const wasStarter=s.lineup.includes(p.id);
 completeSale(s,p,fee,team);
 const fanHit=clamp(Math.round(pop/12),1,5);
 addFans(s,-fanHit,team+' 挖走 '+p.name);
 s.players.forEach(x=>x.morale=clamp(x.morale-4,20,100));
 if(wasStarter)logEvent(s,' '+POS[p.pos][0]+'位置出现空缺——转会市场签人 / 训练页提拔青训，二选一');
 return fanHit;
}
function respondOffer(s,idx,action){
 s.offers=s.offers||[];
 const o=s.offers[idx];
 if(!o)return;
 if(s.mode==='player'){ // 选手生涯：只有自己的报价可回应——留队=涨薪续约，接受=赛段间转会
 if(o.pid!==(s.career&&s.career.me)){toast('那是队友的报价，经纪人不是你');return;}
 const p=s.players.find(x=>x.id===o.pid);
 if(!p){s.offers.splice(idx,1);save();renderAll();return;}
 if(action==='keep'){
 const raise=Math.max(2,Math.round(p.wage*0.08));
 p.wage+=raise;
 p.morale=clamp(p.morale+5,20,100);
 p.willingness=clamp((p.willingness==null?70:p.willingness)+5,0,100);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 留队：回绝 '+o.team+'，俱乐部给 '+p.name+' 涨薪至 '+p.wage+'万/周（士气+5 · 忠诚+5）');
 toast(p.name+' 留队！周薪 +'+raise+'万');
 }else if(action==='sell'){
 s.career.pendingMove={team:o.team,fee:o.fee};
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 转会达成意向：你接受 '+o.team+' 的报价（'+o.fee+'万）——当前赛段继续为 '+s.teamName+' 出战，赛段结束正式加盟');
 toast(' 转会意向达成：赛段结束后加盟 '+o.team);
 }else{toast('选手报价只有「留队」与「接受」两个选项');return;}
 save();renderAll();
 return;
 }
 const p=s.players.find(x=>x.id===o.pid);
 if(!p){s.offers.splice(idx,1);save();renderAll();return;}
 if(action==='keep'){ // 留人：回绝报价 + 涨薪表达诚意
 const raise=Math.max(2,Math.round(p.wage*0.08));
 p.wage+=raise;
 p.morale=clamp(p.morale+5,20,100);
 p.willingness=clamp((p.willingness==null?70:p.willingness)+5,0,100);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 logEvent(s,' 留人：回绝 '+o.team+' 的报价，给 '+p.name+' 涨薪至 '+p.wage+'万/周（士气+5 · 忠诚+5）——工资帽压力自负');
 toast(p.name+' 留队！周薪 +'+raise+'万');
 }else if(action==='sell'){ // 放人：接受报价
 const fanHit=sellViaOffer(s,p,o.fee,o.team);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 toast(p.name+' 已转会 '+o.team+'（+'+o.fee+'万 · 粉丝-'+fanHit+'万）');
 }else if(action==='counter'){ // 抬价：+20~35% 反报价 → 成交 / 最终报价 / 离场
 if(o.status==='final'){toast('对方已给出最终报价：接受成交或留人');return;}
 const ask=Math.round(o.fee*(1.2+Math.random()*0.15));
 const roll=Math.random();
 if(roll<0.55){
 logEvent(s,' 抬价成功：'+o.team+' 接受 '+ask+'万 要价——'+p.name+' 加价成交（原报价 '+o.fee+'万）');
 sellViaOffer(s,p,ask,o.team);
 s.offers=s.offers.filter(x=>x.pid!==p.id);
 toast(p.name+' 加价转会 '+o.team+'（+'+ask+'万）');
 }else if(roll<0.85){
 o.status='final';o.fee=ask;
 logEvent(s,' '+o.team+' 给出最终报价 '+ask+'万：接受成交或留人，不再抬价');
 }else{
 s.offers=s.offers.filter(x=>x.pid!==o.pid);
 p.morale=clamp(p.morale-4,20,100);
 logEvent(s,' '+o.team+' 觉得被抬价羞辱，退出谈判——'+p.name+' 留队但情绪受影响（士气-4）');
 }
 }
 save();renderAll();
}

/* ================= 转会台账（年度回顾·转会记录数据源） =================
 所有涉及本俱乐部的永久性人员流动统一入册：买入（市场/谈判/自由签）/ 卖出（谈判成交/
 挂牌竞价/赛中报价）/ 到期放走。租借与续约不入册（临时/合同行为，另见对应面板）。 */
function recordTransfer(s,dir,p,fee,team,note){
 try{
 s.transfers=s.transfers||[];
 s.transfers.unshift({yr:gameYear(s),season:s.season,dir,name:p.name,pos:p.pos||'mid',

 s.transfers=s.transfers.slice(0,80);
 }catch(e){}
}

/* 英雄特训：优先提升熟练度（生疏→一般→熟练→绝活），全部满级则学新英雄（生疏） */

/* ================= 青训体系 ================= */
/* 名字池（ROOKIE_NAMES / RK_A / RK_B）与 combName() 已上移到 data.js（供自由球员/时代选手共用） */
let _rkSeq=0;
/* 收集当前档位已占用的选手名（含市场/挂牌/自由球员/AI阵容缓存），保证新秀名唯一 */
function rookieUsedNames(s){
 const used=new Set();
 [s.players,s.academy].forEach(l=>(l||[]).forEach(p=>p&&p.name&&used.add(p.name)));
 ['market','transferList','freeAgents'].forEach(k=>(s[k]||[]).forEach(p=>p&&p.name&&used.add(p.name)));
 Object.values(s.aiRosters||{}).forEach(r=>(r||[]).forEach(p=>p&&p.name&&used.add(p.name)));
 (s.extraDefs||[]).forEach(d=>d&&d.name&&used.add(d.name)); // 联盟新星 def 的名字也要占位，否则青训会撞名

function genRookieName(s){

 let guard=0;
 while(guard++<60){

 if(!used.has(n)){used.add(n);return n;}
 }
 return combName(used); // 兜底改为确定性扫描，保证不重名（旧版随机三字仍可能撞名）

 const sig=pick(mainPool);

 for(let i=0;i<3&&cand.length;i++){heroPool.push({n:cand.splice(Math.floor(Math.random()*cand.length),1)[0],lv:1});}
 const name=s?genRookieName(s):(pick(ROOKIE_NAMES)+'·'+_rkSeq);
 return {id:'rk'+_rkSeq,name,pos,team:null,tags:['青训'],
 attrs,skill:{n:'潜力新星',t:pick(['lane','farm','team','mind']),d:'成长型选手，潜力可期'},
 sig,heroPool,career:' 青训出品 · 未来之星',wage:rnd(2,4),energy:ENERGY_MAX,morale:rnd(70,90),injury:0,
 mvp:0,retiring:false,age:rnd(16,17),popularity:rnd(3,8),willingness:rnd(60,90),potential,isRookie:true,contract:2};

/* ================= 位置改造 =================
 现实中职业选手会转型换位置；游戏内用于解决特定位置断档。
 重构英雄池：新旧位置通用英雄保留熟练度，招牌不通用则重立，属性不变。 */
function convertPos(s,pid,newPos){

 if(!p)return;
 if(p.pos===newPos){toast('已经是该位置');return;}

 if(s.fund<cost){toast('位置改造需要 '+cost+'万');return;}
 if(s.lineup.includes(pid)&&s.lineup.some(id=>{
 const o=s.players.find(x=>x.id===id);return o&&o.id!==pid&&o.pos===newPos;
 })){toast(POS[newPos][0]+' 首发已有选手，请先将其换下再改造');return;}
 s.fund-=cost;
 const oldPos=p.pos;
 const oldPool=new Map(p.heroPool.map(h=>[h.n,h.lv]));
 p.pos=newPos;
 if(!heroOf(p.sig).pos.includes(newPos)){
 p.sig=pick(HEROES.filter(h=>h.pos[0]===newPos)).n; // 招牌不通用则重立
 }
 const newPool=[{n:p.sig,lv:3}];
 const add=(n,lv)=>{if(!newPool.some(x=>x.n===n))newPool.push({n,lv});};
 HEROES.filter(h=>h.pos.includes(newPos)&&h.n!==p.sig).forEach(h=>add(h.n,oldPool.has(h.n)?oldPool.get(h.n):2));
 p.heroPool=newPool;
 logEvent(s,' '+p.name+' 位置改造：'+POS[oldPos][0]+' → '+POS[newPos][0]+'（'+cost+'万）');
 save();renderAll();toast(p.name+' 已转型 '+POS[newPos][0]);
}
function doConvertPos(){
 const pid=$('#conv-player').value;

 if(!pid){toast('请选择选手');return;}
 convertPos(S,pid,newPos);
}

<script>

/* ================= 比赛与联赛（KPL 2025 官方赛制） =================
 常规赛4阶段：第一轮(3组单循环BO5)→第二轮(S/A/B)→卡位赛(BO7含巅峰对决)→第三轮(S/A单循环BO5)

const PHASE_NAME={r1:'常规赛·第一轮',r2:'常规赛·第二轮',card:'卡位赛',r3:'常规赛·第三轮',playoff:'季后赛',champion:'赛季结束',eliminated:'赛季结束',challenger:'挑战者杯',ewc:'EWC 电竞世界杯',asiad:'亚运会',annual:'KPL 年度总决赛'};
const isAsiadYear=s=>gameYear(s)%4===2; // 亚运会四年一届（2026 名古屋 / 2030 / 2034…），夏赛后、年总前举行
/* ================= 年度赛历（春季赛 → EWC 电竞世界杯 → 夏季赛 → KPL 年度总决赛） =================
 真实 KPL 年历建模：一年两个联赛赛段（春/夏，赛制相同），夏季赛前穿插 EWC 国际杯赛
 （春季冠亚军分别以 KPL冠军 / 英雄亚冠ACL 身份直邀 8 强），年末年度积分前 12 打年总
 （擂台赛→突围赛→淘汰赛，冠军捧圣龙杯）。年度积分（官方规则）：

const SPLIT_NAME={spring:'春季赛',summer:'夏季赛'};
const ANNUAL_PTS={spring:{p1:100,p2:80,p34:60,p56:40,p78:20,p910:10,p1112:5,p1318:0},
 summer:{p1:120,p2:100,p34:80,p56:50,p78:30,p910:20,p1112:10,p1318:0}};
const gameYear=s=>2025+(s.season||1); // 赛季序号=年份偏移：season1 = 2026年
const splitLabel=s=>gameYear(s)+' '+(SPLIT_NAME[s.split]||'春季赛');
function leaguePayout(s,place){
 const map={'冠军':5000,'亚军':3000,'四强':1500,'八强':800};
 const amt=map[place];
 if(amt){s.fund+=amt;logEvent(s,' 联盟分润（'+place+'）：'+amt+'万');}
}
function logLevel(txt){
 if(/成就解锁|冠军|王朝|捧杯|FMVP|名人堂|亚运/.test(txt))return 'gold';
 // "败/负"必须带语境词：裸匹配会把「S/A/B → 卡位赛 → 双败季后赛」这类赛制说明判成败绩
 if(/惜败|落败|战败|不敌|淘汰|无缘|拖欠工资|负 /.test(txt))return 'lose';
 if(/胜 |击败|获胜|晋级/.test(txt))return 'win'; // 不写"卡位"：赛制说明里的"卡位赛"会被误染成胜绩色
 if(/赞助|奖金|分润|收入|涨薪|代言|曝光|返还|找回/.test(txt))return 'gold';
 return 'info';
}
/* 事件分类：互斥分区（荣誉成就 > 比赛战报 > 转会财政 > 其他动态）
 每条日志只归一类，四类合计=全部——不会出现"点财政看到的全是比赛战报"这种重叠。
 旧版在渲染层拿正则猜分类、且用 level==='gold' 当荣誉门槛，而 gold 在 logLevel 里

const LOG_CATS=[
 {k:'honor',n:'荣誉成就',re:/总冠军|夺冠|捧杯|FMVP|王朝|名人堂|成就解锁|亚运|征召|荣耀|卫冕/},
 {k:'match',n:'比赛战报',re:/常规赛|季后赛|卡位赛|挑战者杯|电竞世界杯|EWC|年度总决赛|圣龙杯|联赛战报|连胜|连败|伤停|受伤/},
 {k:'fund', n:'转会财政',re:/赞助|奖金|分润|收入|资金|薪|代言|转会|签约|签下|挂牌|特惠|预算|工资帽/},
];
function logCat(txt){
 const t=String(txt==null?'':txt);
 if(/赛制|版本更新|经济体系升级/.test(t))return 'other'; // 说明性文案：既不是比赛也不是账目
 for(const c of LOG_CATS){if(c.re.test(t))return c.k;}

function logEvent(s,txt){s.eventLog.unshift({txt,t:Date.now(),level:logLevel(txt),cat:logCat(txt)});s.eventLog=s.eventLog.slice(0,120);}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function powerOf(s,name){
 if(name===s.teamName)return teamPower(s);
 ensureAiRosters(s,name); // 懒建真实阵容并写入 aiPower（与玩家同刻度）
 return s.aiPower[name]||450;
}
function phaseGroups(s){
 if(s.phase==='r1')return ['G1','G2','G3'];
 if(s.phase==='r2')return ['S','A','B'];
 if(s.phase==='r3')return ['S','A'];
 return [];
}
function myGroup(s){
 for(const g of phaseGroups(s)){if(s.groups[g]&&s.groups[g].includes(s.teamName))return g;}
 return null;
}
function sortGroup(s,g){
 const table=s.tables[g]||{};
 return (s.groups[g]||[]).slice().sort((a,b)=>{
 const ta=table[a]||{pts:0,pw:0},tb=table[b]||{pts:0,pw:0};
 if(ta.pts!==tb.pts)return tb.pts-ta.pts;
 return tb.pw-ta.pw;
 });
}
/* 初始化分组：玩家新队进 G3（第一轮抽签组），其余按战力蛇形分 G1/G2/G3 */
function initGroups(s){
 // 玩家执教的俱乐部从 AI 池移除（如选 AG 则 AI 中没有 AG）
 let aiList=AI_TEAMS.filter(t=>t.name!==s.teamName);
 // 自建队不在 AI 名单中：自动顶替最弱队席位（KPL 18 队固定）
 if(aiList.length>17)aiList=aiList.filter(t=>t.name!=='常山UUG');
 // 分组按真实阵容战力（与玩家 teamPower 同刻度），豪门进 G1、弱旅进 G3
 const all=aiList.map(t=>{
 const r=ensureAiRosters(s,t.name);
 return {name:t.name,power:r.length?aiRosterPower(r,s,t.name):t.power};
 });
 all.push({name:s.teamName,power:s.seedPower||teamPower(s)}); // 玩家种子=开局真实战力
 all.sort((a,b)=>b.power-a.power);
 s.leagueTeams=all.map(x=>x.name); // 联盟 18 队注册名录（联盟页/榜单用）
 const g1=all.slice(0,6).map(x=>x.name);
 const g2=all.slice(6,12).map(x=>x.name);
 const g3=all.slice(12,18).map(x=>x.name);
 s.groups={G1:g1,G2:g2,G3:g3};
 s.phase='r1';
 s.aiPower={};
 aiList.forEach(t=>{
 const r=s.aiRosters[t.name];
 s.aiPower[t.name]=r&&r.length?aiRosterPower(r,s,t.name):t.power;
 });
 initTables(s);
 genRoundSchedule(s);
 s.card=null;s.playoff=null;s.eliminated=[];
}
function initTables(s){
 s.tables={};
 phaseGroups(s).forEach(g=>{
 s.tables[g]={};
 s.groups[g].forEach(n=>{s.tables[g][n]={w:0,l:0,pts:0,pw:0};});
 });
}
/* 生成玩家所在组单循环赛程（5场） */
function genRoundSchedule(s){
 const g=myGroup(s);
 const opps=(s.groups[g]||[]).filter(n=>n!==s.teamName);
 shuffle(opps);
 s.schedule=opps.map((op,i)=>({round:i+1,opp:op,result:null,myScore:0,opScore:0}));
 s.matchIdx=0;
 buildGroupSchedule(s);
}
/* 全联盟赛程：每组单循环（6队→5轮×3场），玩家的场次留给真人打，其余由 AI 逐轮模拟 */
function buildGroupSchedule(s){
 s.aiSchedule={};
 phaseGroups(s).forEach(g=>{
 const teams=(s.groups[g]||[]).slice();
 // 舍转法：固定首队，其余轮转，生成 5 轮 × 3 场
 const n=teams.length,rounds=[];
 const arr=teams.slice(1);
 for(let r=0;r<n-1;r++){
 const pairs=[];
 const ring=[teams[0],...arr];
 for(let i=0;i<n/2;i++){
 const a=ring[i],b=ring[n-1-i];
 if(a&&b)pairs.push([a,b]);
 }
 rounds.push(pairs);
 arr.unshift(arr.pop());
 }
 s.aiSchedule[g]=[];
 rounds.forEach((pairs,ri)=>{
 pairs.forEach(([a,b])=>{
 if(a===s.teamName||b===s.teamName)return; // 玩家场次不模拟
 s.aiSchedule[g].push({round:ri+1,a,b,r:null});
 });
 });
 });
}
/* 模拟玩家已打到的轮次为止、所有组内尚未进行的 AI 场次，并更新积分表 */
function simulateAiRound(s,upToRound){
 if(!s.aiSchedule||!phaseGroups(s).some(g=>s.aiSchedule[g]))buildGroupSchedule(s); // 老存档懒构建
 const reports=[];
 phaseGroups(s).forEach(g=>{
 (s.aiSchedule[g]||[]).forEach(m=>{
 if(m.round>upToRound||m.r)return;
 const r=simSeriesResult(s,m.a,m.b,KPL.BO5);
 m.r={w:r.win?m.a:m.b,mw:r.mw,ow:r.ow};
 const ta=(s.tables[g]||{})[m.a],tb=(s.tables[g]||{})[m.b];
 if(!ta||!tb)return;
 if(r.win){ta.w++;ta.pts++;tb.l++;}
 else{tb.w++;tb.pts++;ta.l++;}
 ta.pw+=r.mw;tb.pw+=r.ow;
 if(m.round===upToRound)reports.push(g+'组：'+m.a+' '+r.mw+':'+r.ow+' '+m.b);
 });
 });
 if(reports.length)logEvent(s,' 联赛战报（第'+upToRound+'轮）：'+reports.slice(0,6).join('；'));
}
/* AI 系列赛（BO5/BO7 模拟，返回局数） */
function simSeriesResult(s,a,b,bo){
 let mw=0,ow=0;
 const need=Math.ceil(bo/2);
 const aEff=powerOf(s,a)*(1+dynastyStreak(s,b)*0.02); // 王朝反制①：对方连冠 → 我方研究加成
 const bEff=powerOf(s,b)*(1+dynastyStreak(s,a)*0.02);
 for(let i=1;i<=bo&&mw<need&&ow<need;i++){
 const w=Math.random()<winChance(aEff,bEff);
 if(w)mw++;else ow++;
 }
 return {win:mw>ow,mw,ow};
}
/* ===== 阶段推进 ===== */
function advancePhase(s){
 simulateAiRound(s,99); // 兜底补完本阶段未模拟的 AI 场次
 if(s.phase==='r1'){
 const sTeams=[],aTeams=[],bTeams=[];
 ['G1','G2','G3'].forEach(grp=>{
 const rank=sortGroup(s,grp);
 sTeams.push(rank[0],rank[1]);
 aTeams.push(rank[2],rank[3]);
 bTeams.push(rank[4],rank[5]);
 });
 s.groups={S:sTeams,A:aTeams,B:bTeams};
 s.phase='r2';
 initTables(s);
 genRoundSchedule(s);
 const g=myGroup(s);
 logEvent(s,' 第一轮结束！'+s.teamName+' 进入'+(g==='S'?'S组':g==='A'?'A组':'B组')+'（第二轮）');
 }else if(s.phase==='r2'){
 s.phase='card';
 setupCard(s);
 }else if(s.phase==='r3'){
 buildPlayoff(s);
 }
 save();renderAll();
}
/* ===== 卡位赛（BO7 含巅峰对决） ===== */
function setupCard(s){
 const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A'),bRank=sortGroup(s,'B');
 s.card={matches:[
 {a:sRank[4],b:aRank[1],r:null,winTo:'S'}, // S5 vs A2
 {a:sRank[5],b:aRank[0],r:null,winTo:'S'}, // S6 vs A1
 {a:aRank[4],b:bRank[1],r:null,winTo:'A'}, // A5 vs B2
 {a:aRank[5],b:bRank[0],r:null,winTo:'A'}, // A6 vs B1
 ],idx:0};
 s.eliminated=[...(s.eliminated||[]),...bRank.slice(2)]; // B3-B6 淘汰
 const myR=bRank.indexOf(s.teamName);
 if(myGroup(s)==='B'&&myR>=2){
 s.phase='eliminated';
 logEvent(s,' 第二轮 B 组排名 3-6，无缘本赛季后续比赛');
 // 联盟照常打完本赛季：补完卡位赛与季后赛，产生冠军（王朝统计/连冠反制需要）
 s.card.matches.forEach(m=>{if(!m.r){const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;}});
 s.card.idx=s.card.matches.length;
 finishCard(s);
 save();renderAll();
 return;
 }
 const playerIn=s.card.matches.some(m=>m.a===s.teamName||m.b===s.teamName);
 logEvent(s,' 卡位赛（BO7·含巅峰对决）即将开始！');
 if(!playerIn){
 s.card.matches.forEach(m=>{const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;});
 s.card.idx=s.card.matches.length;
 finishCard(s);
 return;
 }
 save();renderAll();
}
function playCardNext(s){
 const m=s.card.matches[s.card.idx];
 if(!m){finishCard(s);return;}
 if(m.a===s.teamName||m.b===s.teamName){
 const opName=m.a===s.teamName?m.b:m.a;
 if(s.mode==='player'){ // 选手生涯：教练指挥，自动打卡位赛
 const sr=playerAutoSeries(s,opName,KPL.BO7);
 const myWin=sr.mw>sr.ow;
 m.r=myWin?s.teamName:opName;
 s._lastMvps=(sr.mvpIds||[]).slice();
 rosterLineup(s).forEach(p=>{p.apps=(p.apps||0)+1;});
 logEvent(s,' 卡位赛：'+s.teamName+' '+(myWin?'晋级':'遗憾落败')+' '+sr.mw+':'+sr.ow);
 (s.history=s.history||[]).unshift({yr:gameYear(s),opp:opName,stage:'卡位赛',score:sr.mw+':'+sr.ow,win:myWin,logs:sr.logs,peak:sr.max>=7&&sr.mw+sr.ow===sr.max});
 s.history=s.history.slice(0,20);
 save();renderAll();
 s.card.idx++;
 if(s.card.idx>=s.card.matches.length)finishCard(s);
 else playCardNext(s);
 return;
 }
 // 系列赛中断恢复：不重置比分
 if(s.series&&s.series.stage==='card'){
 showPreMatch('卡位赛（BO7·含巅峰对决）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
 return;
 }
 s.series={used:[],usedOpp:[],mw:0,ow:0,max:7,stage:'card',cardMatch:m,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'card',opName)};s.seriesAuto=false;
 resetOppEnergy(s,opName);
 showPreMatch('卡位赛（BO7·含巅峰对决）vs '+opName+' · 第1局');
 }else{
 const r=simSeriesResult(s,m.a,m.b,KPL.BO7);
 m.r=r.win?m.a:m.b;
 logEvent(s,' 卡位赛：'+m.a+' vs '+m.b+'，'+m.r+' 晋级');

 }
}
function finishCard(s){
 const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
 const sNew=[sRank[0],sRank[1],sRank[2],sRank[3]];
 const aNew=[aRank[2],aRank[3]];
 (s.card.matches||[]).forEach(m=>{
 if(!m.r){const r=simSeriesResult(s,m.a,m.b,KPL.BO7);m.r=r.win?m.a:m.b;}
 if(m.winTo==='S'){sNew.push(m.r);aNew.push(m.r===m.a?m.b:m.a);}
 else aNew.push(m.r);
 });
 s.cardLosers=(s.card.matches||[]).map(m=>m.r===m.a?m.b:m.a); // 卡位赛败者：年度积分按 11-12 名档计
 s.groups={S:sNew,A:aNew};
 const alive=new Set([...sNew,...aNew]);
 s.eliminated=AI_TEAMS.map(t=>t.name).filter(n=>!alive.has(n));
 if(!alive.has(s.teamName)){
 s.phase='eliminated';
 logEvent(s,' 卡位赛未能突围，本赛季止步');
 buildPlayoff(s); // 联盟照常打完季后赛，产生本赛季冠军（王朝统计/连冠反制需要）
 save();renderAll();
 return;
 }
 s.phase='r3';
 initTables(s);
 genRoundSchedule(s);
 logEvent(s,' 卡位赛结束！'+s.teamName+' 进入第三轮'+(myGroup(s)==='S'?'S组':'A组'));
 save();renderAll();
}
/* ===== 季后赛（10队双败淘汰 BO7） ===== */
function buildPlayoff(s){
 // 旧版残留的 simulateGroupAI 调用已删：r3 的 AI 场次由 simulateAiRound 逐轮模拟 + advancePhase 兜底补完，此处重跑会重复计分（且该函数在重构时已丢失导致进季后赛必崩）
 const sRank=sortGroup(s,'S'),aRank=sortGroup(s,'A');
 if(!sRank.length){s.phase='eliminated';save();renderAll();return;}
 s.playoff={
 wb:[{a:sRank[0],b:sRank[3],r:null},{a:sRank[1],b:sRank[2],r:null}], // 胜者组R1: S1vS4,S2vS3
 lb:[{a:aRank[0],b:aRank[3],r:null},{a:aRank[1],b:aRank[2],r:null}], // 败者组R1: A1vA4,A2vA3
 lb2:[{a:sRank[4],b:null,r:null},{a:sRank[5],b:null,r:null}], // S5/S6 直进败者组R2
 lb3:[{a:null,b:null,r:null},{a:null,b:null,r:null}], // 败者组R3: 胜者组R1败者 vs 败者组R2胜者
 wf:{a:null,b:null,r:null}, // 胜者组决赛
 lb4:{a:null,b:null,r:null}, // 败者组半决赛: lb3两胜者
 lbf:{a:null,b:null,r:null}, // 败者组决赛: wf败者 vs lb4胜者
 final:{a:null,b:null,r:null},champ:null
 };
 s.phase=(s.phase==='eliminated')?s.phase:'playoff'; // 玩家已出局时保留"止步"状态
 const inPlayoff=s.groups.S.includes(s.teamName)||aRank.slice(0,4).includes(s.teamName);
 logEvent(s,' 季后赛开启！10强 BO7 双败淘汰');
 if(!inPlayoff){
 logEvent(s,' 未能晋级季后赛，本赛季止步');
 let guard=0;
 while(!s.playoff.final.r&&guard<20){playoffStep(s);guard++;}
 return;
 }
 save();renderAll();
}
function playoffStep(s){
 const p=s.playoff;
 if(!p)return;
 for(let i=0;i<2;i++){const m=p.wb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'wb'+(i+1));return;}}
 for(let i=0;i<2;i++){const m=p.lb[i];if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb'+(i+1));return;}}
 for(let i=0;i<2;i++){
 const m=p.lb2[i];
 if(m.b===null&&p.lb[i].r)m.b=p.lb[i].r;
 if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb2_'+(i+1));return;}
 }
 if(p.wf.a===null){p.wf.a=p.wb[0].r;p.wf.b=p.wb[1].r;}
 if(p.wf.r===null&&p.wf.a&&p.wf.b){playPoMatch(s,p.wf,'胜者组决赛');return;}
 for(let i=0;i<2;i++){
 const m=p.lb3[i];
 if(m.a===null)m.a=p.wb[i].r===p.wb[i].a?p.wb[i].b:p.wb[i].a;
 if(m.b===null&&p.lb2[i].r)m.b=p.lb2[i].r;
 if(m.r===null&&m.a&&m.b){playPoMatch(s,m,'lb3_'+(i+1));return;}
 }

function payWage(s){

 }
 if(endorse>0)logEvent(s,' 选手代言收入 '+endorse+'万（人气变现）');
 if(s.fund<0){
 s.fund=Math.max(0,s.fund);
 s.players.forEach(p=>p.morale=clamp(p.morale-15,20,100));

/* ================= 王朝反制（连冠≥2 触发） =================
 现实中反制王朝的三板斧：对手研究录像（BP 吃亏）、版本针对体系、联盟财政条款。
 ①对阵连冠队伍，研究方有效战力 +2%/连冠季（上限+6%，AI 互赛同规则）
 ②连冠队伍工资帽成长减半 ③新赛季版本针对：核心选手属性/士气/状态受挫 */
function dynastyStreak(s,teamName){
 // 一年有春/夏两个冠军，按时间顺序（追加序）数连续夺冠次数
 const hist=s.titleHistory||[];
 let streak=0;
 for(let i=hist.length-1;i>=0;i--){
 if(hist[i].champ===teamName)streak++;else break;
 }
 return Math.min(streak,3);
}
/* ================= 赛季最佳阵容（一阵/二阵） =================
 按位置评选：排序分=招牌战力×状态系数（权重减半：火热可越级入选，但不虚高 20 分）；
 展示的「评分」用 OVR 总值（1-99，与全游戏刻度一致），表现另用状态标签表达；
 新赛季开启时入册 s.awards（历届），联盟页实时展示当期评选 */
function allStarScore(p){return playerPower(p,p.sig)*(1+((p.val||100)-100)/250);}
function allStarTeams(s){
 const pool=s.players.map(p=>({p,team:s.teamName}));
 (s.leagueTeams||[]).forEach(n=>{
 if(n===s.teamName)return;
 (ensureAiRosters(s,n)||[]).forEach(p=>pool.push({p,team:n}));
 });
 const t1=[],t2=[];
 POS_ORDER.forEach(pos=>{
 const two=pool.filter(x=>x.p.pos===pos).sort((a,b)=>allStarScore(b.p)-allStarScore(a.p)).slice(0,2);
 if(two[0])t1.push({p:two[0].p,team:two[0].team});
 if(two[1])t2.push({p:two[1].p,team:two[1].team});
 });
 return {t1,t2};
}
/* 赛季收官：最佳阵容入册 + 公告（newSeason 顶部调用，用刚结束赛季的阵容快照） */

 s.awards=s.awards||[];
 if(s.awards.some(a=>a.season===s.season))return;
 const {t1,t2}=allStarTeams(s);
 s.awards.unshift({season:s.season,
 first:t1.map(x=>({pos:x.p.pos,name:x.p.name,team:x.team,ovr:overall(x.p)})),
 second:t2.map(x=>({pos:x.p.pos,name:x.p.name,team:x.team,ovr:overall(x.p)}))});
 s.awards=s.awards.slice(0,10);
 if(s.mode==='player'&&s.career&&t1.some(x=>x.p.id===s.career.me)){
 s.career.allstar=(s.career.allstar||0)+1;
 logEvent(s,' 你入选了赛季最佳阵容一阵——生涯履历再添一笔');
 }
 logEvent(s,' KPL 赛季最佳阵容揭晓：一阵——'+t1.map(x=>POS[x.p.pos][1]+' '+x.p.name+'（'+x.team+'）').join('、'));
 logEvent(s,' 二阵——'+t2.map(x=>POS[x.p.pos][1]+' '+x.p.name+'（'+x.team+'）').join('、'));

/* ================= 董事会与信任度（单机经营的压力与终局） =================

function myAnnualRank(s){ // 本队年度积分排名（从 1 起）；本队不在名录时返回 null

function boardKpiTarget(prevRank,s){ // 豪门保前4 / 争冠组保前8 / 其余保前12（进年总线）

function setBoardKpi(s){

 const prev=s.managerCareer.lastRank||null;

function boardSettle(s){

function leaguePlacements(s){

 place[p.final.r]='p1';place[loserOf(p.final)]='p2';
 place[loserOf(p.lbf)]='p34';place[loserOf(p.lb4)]='p34';
 [p.lb3[0],p.lb3[1]].forEach(m=>place[loserOf(m)]='p56');
 [p.lb2[0],p.lb2[1]].forEach(m=>place[loserOf(m)]='p78');
 [p.lb[0],p.lb[1]].forEach(m=>place[loserOf(m)]='p910');

/* ================= 粉丝与商业（成绩 → 粉丝 → 收入 的正循环） =================

 并作为赞助商升级门槛——把原先互不相干的三条线（选手人气 / 赞助商 / 代言）缝成一个环。

function initFans(s){ // 开档粉丝 = 底子 + 阵容人气（豪门起点高，自建从零起步）

}
const FAN_MILESTONES=[20,80,200]; // 与赞助商升级门槛对齐：突破即可洽谈更高级赞助
function addFans(s,n,why){

 const before=s.fans==null?0:s.fans;
 const after=Math.max(0,Math.round((before+n)*10)/10);
 s.fans=after;
 if(why&&Math.abs(after-before)>=0.5)logEvent(s,' 粉丝 '+(after>=before?'+':'')+(Math.round((after-before)*10)/10)+'万（'+why+' · 当前 '+after+'万）');

 });

/* 赛季版本大改：两名英雄一加强一削弱，持有者属性微调（影响招牌价值与 BP 优先级）。
