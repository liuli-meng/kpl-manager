const KJIA_FILLER_NAMES=['冷峤','照野','束禾','闻鹿','栖迟','枕流','叩舷','扫雪','拾星','衔山','汲露','司南','执桨','引笛','泊岸','拓海','听澜','折桨','纵马','悬旌','负剑','摘星','衔烛','趁风'];
function kjiaMyName(s){return s.teamName+'二队';}
function kjiaSquad(s){ // 二队阵容 = K甲班底 + 下放选手（同一位置取战力高者出场，结算在 kjiaTeamPower）
 return ((s.kjia&&s.kjia.squad)||[]).concat((s.players||[]).filter(p=>p.kjia>0));
}
function kjiaTeamPower(s){ // 与 aiRosterPower 同刻度：五位置最强者求和 × 士气系数；次级联赛体系折算 ×0.9（无教练组）
 const r=kjiaSquad(s);
 if(!r.length)return 0;
 const best={};
 r.forEach(p=>{const v=playerPower(p,p.sig);if(best[p.pos]==null||v>best[p.pos])best[p.pos]=v;});
 let sum=0;POS_ORDER.forEach(pos=>{if(best[pos]!=null)sum+=best[pos];});
 const morale=clamp(r.reduce((t,p)=>t+(p.morale||80),0)/r.length/100,0.82,1.1);
 return Math.round(sum*morale*0.9);
}
function kjiaFiller(s,pos,used){ // 二队 K甲班底：低总值的常驻注册选手（下放的一队选手来了就顶替出场）
 const name=poolName(KJIA_FILLER_NAMES,used);used.add(name);
 const base=[0,1,2,3].map(()=>rnd(62,74));
 return genPlayer({id:'kjf_'+gameYear(s)+'_'+pos+'_'+Math.random().toString(36).slice(2,7),name,pos,team:kjiaMyName(s),tags:['K甲'],
 base,skill:{n:'次级联赛',t:pick(['lane','farm','team','mind']),d:'K甲班底选手，等一个上调一队的机会'},
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,career:kjiaMyName(s)+' 班底选手，常年在次级联赛征战。'});
}
function initKjia(s){ // 每个赛段（春/夏）重开一届 K甲
 const my=kjiaMyName(s);
 const teams=[...KJIA_AI_TEAMS,my];
 const powers={};
 KJIA_AI_TEAMS.forEach((t,i)=>{powers[t]=i<3?rnd(360,392):rnd(328,388);}); // 苍穹/星火/沧澜为K甲豪门（与挑战者杯赛道强度对齐）
 // 舍转法单循环：8 队 7 轮 × 4 场（与 buildGroupSchedule 同一算法）
 const rounds=[];
 const arr=teams.slice(1);
 for(let r=0;r<teams.length-1;r++){
 const ring=[teams[0],...arr],pairs=[];
 for(let i=0;i<teams.length/2;i++){const a=ring[i],b=ring[teams.length-1-i];if(a&&b)pairs.push({a,b,r:null,ms:0,es:0});}
 rounds.push(pairs);
 arr.unshift(arr.pop());
 }
 const tables={};teams.forEach(t=>tables[t]={w:0,l:0,pts:0,pw:0});
 const used=new Set((s.players||[]).map(p=>p.name));
 const squad=POS_ORDER.map(pos=>kjiaFiller(s,pos,used));
 s.kjia={teams,powers,rounds,rd:0,day:0,tables,results:[],squad,champ:null,my};
 return s.kjia;
}
function kjiaRank(s){ // K甲积分榜名次（冠军=榜首）
 const k=s.kjia;if(!k)return [];
 return Object.keys(k.tables).sort((a,b)=>k.tables[b].pts-k.tables[a].pts||k.tables[b].pw-k.tables[a].pw);
}
function kjiaPerform(s,demoted,won,m,round){ // 二队每场为下放选手结算 KDA/MVP/即时成长
 if(!demoted.length)return;
 const my=kjiaMyName(s);
 const opp=m.a===my?m.b:m.a;
 const myScore=m.a===my?m.ms:m.es,opScore=m.a===my?m.es:m.ms;
 let mvp=null,bs=-1;
 const rows=demoted.map(p=>{
 const k=rnd(1,9)+(won?1:0),d=rnd(0,5),a=rnd(0,10);
 const score=k*3+a*2-d*1.5+(won?6:2)+playerPower(p,p.sig)*0.5+rnd(0,3);
 const st=p.kjiaStats=p.kjiaStats||{apps:0,k:0,d:0,a:0,mvp:0,wins:0};
 st.apps++;st.k+=k;st.d+=d;st.a+=a;if(won)st.wins++;
 if(won&&Math.random()<0.3){const key=pick(['lane','farm','team','mind']);p.attrs[key]=clamp(p.attrs[key]+1,40,99);p.kjiaGain=(p.kjiaGain||0)+1;}
 if(score>bs){bs=score;mvp=p;}
 return {p,k,d,a};
 });
 if(mvp)mvp.kjiaStats.mvp++;
 rows.forEach(({p,k,d,a})=>{
 p.kjiaLog=p.kjiaLog||[];
 p.kjiaLog.unshift('第'+round+'轮 vs '+opp+' '+(won?'胜':'负')+' '+myScore+':'+opScore+' · '+k+'/'+d+'/'+a+(p===mvp?' · 单局MVP':''));
 p.kjiaLog=p.kjiaLog.slice(0,6);
 });
}
function kjiaNextRound(s){
 const k=s.kjia;
 const rd=k.rounds[k.rd];
 const my=k.my;
 const demoted=(s.players||[]).filter(p=>p.kjia>0);
 rd.forEach(m=>{
 const pwA=m.a===my?kjiaTeamPower(s):k.powers[m.a];
 const pwB=m.b===my?kjiaTeamPower(s):k.powers[m.b];
 let mw=0,ow=0;
 for(let i=1;i<=5&&mw<3&&ow<3;i++){if(Math.random()<winChance(pwA,pwB))mw++;else ow++;}
 m.ms=mw;m.es=ow;m.r=mw>ow?m.a:m.b;
 const ta=k.tables[m.a],tb=k.tables[m.b];
 if(m.r===m.a){ta.w++;ta.pts++;tb.l++;}else{tb.w++;tb.pts++;ta.l++;}
 ta.pw+=mw;tb.pw+=ow;
 if(m.a===my||m.b===my)kjiaPerform(s,demoted,m.r===my,m,k.rd+1);
 });
 const rep=rd.map(m=>m.a+' '+m.ms+':'+m.es+' '+m.b).join('；');
 k.results.unshift({round:k.rd+1,txt:rep});k.results=k.results.slice(0,10);
 logEvent(s,' K甲联赛（第'+(k.rd+1)+'轮）：'+rep);
 k.rd++;
 if(k.rd>=k.rounds.length)finishKjiaSplit(s);
}
function kjiaDayTick(s){ // 挂在 nextDay：日历推进 K甲轮次（旧档懒初始化，读档即有联赛）
 if(!s.kjia)initKjia(s);
 if(s.kjia.rd>=s.kjia.rounds.length)return; // 本赛段已收官，等下个赛段重开
 s.kjia.day++;
 if(s.kjia.day%KJIA_EVERY===0)kjiaNextRound(s);
}
function finishKjiaSplit(s){
 const k=s.kjia;if(!k||k.champ)return;
 const rank=kjiaRank(s);
 k.champ=rank[0];
 const myRank=rank.indexOf(k.my)+1;
 logEvent(s,' K甲联赛收官：'+k.champ+' 夺得本赛段冠军（'+k.my+' 名次：第'+myRank+'）');
 if(k.champ===k.my){
 s.fund+=80;addFans(s,2,'二队 K甲夺冠');
 (s.players||[]).filter(p=>p.kjia>0).forEach(p=>{p.morale=clamp(p.morale+5,20,100);});
 logEvent(s,' 二队 K甲夺冠！次级联赛奖金 +80万、关注度上涨（粉丝+2万）——下放练级的价值兑现了');
 }
}
function sendKjia(s,id){
 const p=(s.players||[]).find(x=>x.id===id);
 if(!p){toast('选手不在阵中');return;}
 if(p.kjia){toast(p.name+' 已在 K甲锻炼（剩余 '+p.kjia+' 天）');return;}
 if(p.injury>0){toast(p.name+' 正在伤停，无法下放');return;}
 if(p.loan){toast(p.name+' 是租借选手，不能下放 K甲');return;}
 if((s.listed||[]).some(x=>x.id===id)){toast(p.name+' 挂牌中（已有报价会一并作废），请先撤牌再下放');return;}
 s.players=s.players.filter(x=>x.id!==id||true); // 保留在册（仅离开首发）
 if(s.captain===id){s.captain=null;logEvent(s,' 队长 '+p.name+' 下放 K甲，袖标摘除');}
 const li=(s.lineup||[]).indexOf(id);
 if(li>=0)s.lineup.splice(li,1);
 p.kjia=KJIA_DAYS;
 logEvent(s,' 下放 K甲：'+p.name+'（'+POS[p.pos][0]+'）加入二队征战 K甲联赛 '+KJIA_DAYS+' 天——真实出战积累表现数据，「二队」页可查，归队时带成长回来');
 save();renderAll();
}
function kjiaTick(s){ // 每天结算一次；到期归队并成长
 (s.players||[]).forEach(p=>{
 if(!p.kjia)return;
 p.kjia--;
 if(p.kjia>0)return;
 p.kjia=0;
 const keys=['lane','farm','team','mind'];
 let gain=0;
 for(let i=0;i<2;i++){const k=keys.splice(Math.floor(Math.random()*keys.length),1)[0];const d=rnd(2,4);p.attrs[k]=clamp(p.attrs[k]+d,40,99);gain+=d;}
 p.kjiaGain=(p.kjiaGain||0)+gain; // 成就「练级成功」依据（含 K甲场上的即时成长）
 const st=p.kjiaStats;
 logEvent(s,' K甲归队：'+p.name+' 锻炼归来，属性成长 +'+gain+'（K甲累计出场 '+(st?st.apps:0)+' 场'+(st?' · 场均 '+Math.round(st.k/st.apps*10)/10+'/'+Math.round(st.d/st.apps*10)/10+'/'+Math.round(st.a/st.apps*10)/10:'')+'）');
 });
}
const PLACEMENT_TXT={p1:'冠军',p2:'亚军',p34:'四强',p56:'5-6名',p78:'7-8名',p910:'9-10名',p1112:'11-12名',p1318:'13-18名'};
function awardAnnualPts(s){
 const pts=ANNUAL_PTS[s.split]||ANNUAL_PTS.spring;
 const place=leaguePlacements(s);
 Object.keys(place).forEach(t=>{s.annualPts[t]=(s.annualPts[t]||0)+(pts[place[t]]||0);});
 s.yearStages=s.yearStages||[];
 s.yearStages.push({ev:s.split==='spring'?'春季赛':'夏季赛',place:PLACEMENT_TXT[place[s.teamName]||'p1318']}); // 成绩曲线
 logEvent(s,' 年度积分入账：'+s.teamName+' 目前累计 '+(s.annualPts[s.teamName]||0)+' 分（'+(s.split==='spring'?'春':'夏')+'季赛·前12进年总）');
}
/* ===== FMVP：冠军队总决赛最有价值选手（人气+10 · 身价+8，记入荣誉室） ===== */
function awardFMVP(s,champ,event){
 try{
 s.fmvpHonor=s.fmvpHonor||[];
 let winner=null;
 if(champ===s.teamName){
 const cnt={};(s._lastMvps||[]).forEach(id=>cnt[id]=(cnt[id]||0)+1); // 总决赛各局 MVP 票数优先
 winner=s.players.slice().sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||overall(b)-overall(a))[0];
 }else{
 const r=ensureAiRosters(s,champ)||[];
 winner=r.slice().sort((a,b)=>overall(b)-overall(a))[0];
 }
 if(!winner)return;
 s.fmvpHonor.unshift({year:gameYear(s),event,name:winner.name,team:champ});
 s.fmvpHonor=s.fmvpHonor.slice(0,12);
 if(champ===s.teamName){
 winner.popularity=Math.min(99,(winner.popularity||0)+10);
 winner.val=clamp((winner.val||100)+8,70,150);
 if(s.mode==='player'&&s.career&&winner.id===s.career.me){s.career.fmvp=(s.career.fmvp||0)+1;logEvent(s,' 这是你的 FMVP——生涯荣誉室再添一笔');}
 logEvent(s,' FMVP：'+winner.name+' 当选 '+event+' 总决赛最有价值选手——FMVP 专属皮肤安排！（人气+10 · 身价+8）');
 }else logEvent(s,' FMVP：'+champ+' 的 '+winner.name+' 当选 '+event+' 总决赛最有价值选手');
 }catch(e){}
}
/* ===== 年度赛历推进（赛季结束按钮统一入口）：春→EWC→夏→年总→下一年 ===== */
function calendarNextLabel(s){
 if(s.split==='spring')return ' 前往挑战者杯（32队 · KPL全员）';
 if(isAsiadYear(s)&&!s.agDone)return ' 出征亚运会（中国代表队征召）';
 return annualRank(s).slice(0,12).includes(s.teamName)?' 前往 KPL 年度总决赛':' 年度收官 · 开启新赛季';
}
function advanceCalendar(s){
 if(s.split==='spring'){setupChallenger(s);return;} // 春 → 挑战者杯 → EWC → 夏 → 年总
 if(isAsiadYear(s)&&!s.agDone){setupAsianGames(s);return;} // 亚运年：夏 → 亚运会 → 年总
 setupAnnual(s); // 内部判定是否晋级（未晋级自动补完 AI 赛程并年度轮换）
}
/* ================= 挑战者杯（2026 KPL 春季赛后最高关注度杯赛） =================
 真实赛制简化建模：32 队（18 KPL 全员 + 14 挑战者：K甲/全国大赛/青训/高校/职工/主播/全球七大赛道）
 → 单败淘汰 32→16（BO5）→16→8（BO7），春季赛冠军/亚军为一二号种子分半区
 → 8 强双败淘汰（BO7）→ 决赛 BO9（第9局巅峰对决）
 「挑战者的祝福」：低赛道队伍 vs KPL 时战力 +5%（ensureAiRosters 统一结算，玩家对局同样生效）
 年总积分：冠军85 / 亚军60 / 第3名40 / 第4名20 / 5-6名10；冠军 300 万奖金 + FMVP。 */
const CHALLENGER_TEAMS=[['K甲·苍穹','K甲'],['K甲·星火','K甲'],['K甲·沧澜','K甲'],
 ['全国大赛·破晓','全国大赛'],['青训·晨曦','青训'],['高校·逐梦','高校'],['职工·匠心','职工'],
 ['主播·不夜城','主播'],['主播·山海','主播'],['主播·云隐','主播'],['主播·听风','主播'],
 ['全球·NOVA Esports','全球'],['全球·Gen.G Esports','全球'],['全球·Twisted Minds','全球']];
const CHALLENGER_NAMES=['梓墨','暖阳','清融','一诺','无畏','飞牛','百兽','小胖','九尾','梦岚','小义','今屿','星痕','向鱼','妖刀','帆帆','阿豆','坦然','花海','易峥','子阳','柠栀','江城','星宇','小落','奕星','凌云','破军','惊鸿','破晓','远航','守望','砺锋','青锋','北辰','南屿','苍穹','逐梦','晨曦','听风','云起'];
function genChallengerDef(s,i,teamName,band){
 const used=new Set();
 (s.extraDefs||[]).forEach(d=>used.add(d.name));
 Object.values(s.aiRosterDefs||{}).forEach(arr=>arr.forEach(id=>{const d=defOf(s,id);if(d)used.add(d.name);}));
 Object.values(s.challDefMap||{}).forEach(arr=>arr.forEach(id=>{const d=defOf(s,id);if(d)used.add(d.name);}));
 (s.players||[]).forEach(p=>used.add(p.name));
 // 挑战者池只有 41 个名字，却要给 14 队 ×5=70 人命名——从前两名开始就撞名。
 // 旧写法 `CHALLENGER_NAMES[i%length]` + 序号兜底，导致每届固定出现「挑战者42…70」；
  // 现改为 poolName：优先用赛道人名池，池尽走 combName 组合名（不出现占位名）
 const name=poolName(CHALLENGER_NAMES,used);
 used.add(name);
 const pos=POS_ORDER[i%5];
 // 赛道强度：K甲≈75 / 全球≈78 / 主播≈68 / 次级（全国/青训/高校/职工）≈65
 const baseLv=band==='K甲'?75:band==='全球'?78:band==='主播'?68:65;
 const b=v=>clamp(v+rnd(-5,5),55,86);
 return {id:'ch'+gameYear(s)+'_'+i,name,pos,team:teamName,tags:['特权'],
 base:[b(baseLv),b(baseLv-1),b(baseLv),b(baseLv-1)],
 skill:{n:'挑战者祝福',t:pick(['lane','farm','team','mind']),d:'低赛道挑战 KPL 时的体系优势'},
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,career:'挑战者杯'+band+'赛道选手，'+(band==='K甲'?'K甲职业队':'来自'+band+'赛道')+'。'};
}
function setupChallenger(s){
 const p=s.playoff;
 const champ=p.final.r,runner=p.final.r===p.final.a?p.final.b:p.final.a;
 // 挑战者队选手 def（挂 s.challDefMap；ensureAiRosters 兜底，BP/体力/战力全流程可用）
 s.challDefMap={};
 let ni=0;
 CHALLENGER_TEAMS.forEach(([tn,band])=>{
 const ids=[];
 for(let k=0;k<5;k++){const def=genChallengerDef(s,ni++,tn,band);(s.extraDefs=s.extraDefs||[]).push(def);ids.push(def.id);}
 s.challDefMap[tn]=ids;
 });
 // 32 队：18 KPL（当前联盟 18 队名录，含玩家）+ 14 挑战者；春冠/春亚为一二号种子，分列左右半区（32→16 不提前相遇）
 const league18=(s.leagueTeams&&s.leagueTeams.length)?s.leagueTeams.slice():AI_TEAMS.map(t=>t.name);
 const chPool=CHALLENGER_TEAMS.map(x=>x[0]);
 const rest=shuffle([...league18,...chPool].filter(t=>t!==champ&&t!==runner)); // 30 队（玩家=春冠时不重复计入）
 const teams=[champ,...rest.slice(0,15),runner,...rest.slice(15)]; // 32 队，种子分列 idx0/idx16 两个半区
 s.challenger={stage:'single',r1:[],r2:null,po:null,final:null,champ:null,teams};
 for(let i=0;i<16;i++)s.challenger.r1.push({a:teams[i],b:teams[31-i],r:null}); // 单败首轮 BO5
 s.phase='challenger';
 logEvent(s,' '+gameYear(s)+' 挑战者杯开幕（32队·八大赛道）！'+champ+'（1号种子）与 '+runner+'（2号种子）分列两半区');
 const myIn=teams.includes(s.teamName);
 if(!myIn){simCup('challenger',s);finishChallenger(s);return;}
 save();renderAll();
}
function challengerStep(s){
 const c=s.challenger;if(!c)return;
 const P=(m,slot,label,bo)=>playCupMatch(s,m,slot,label,bo);
 if(c.stage==='single'){
 for(let i=0;i<16;i++){const m=c.r1[i];if(!m.r){P(m,'ch_r1_'+(i+1),'挑战者杯·32强',KPL.BO5);return;}}
 if(!c.r2){c.r2=[];for(let i=0;i<8;i++)c.r2.push({a:c.r1[i*2].r,b:c.r1[i*2+1].r,r:null});}
 for(let i=0;i<8;i++){const m=c.r2[i];if(!m.r){P(m,'ch_r2_'+(i+1),'挑战者杯·16强',KPL.BO7);return;}}
 c.stage='po';
 c.po=buildCup8(shuffle(c.r2.map(m=>m.r)));
 logEvent(s,' 挑战者杯 8 强双败开启（BO7）：'+c.r2.map(m=>m.r).join('、'));
 save();renderAll();
 return;
 }
 challengerPoStep(s);
}
function challengerPoStep(s){
 const c=s.challenger;const p=c.po;if(!p)return;
 const loserOf=m=>m.r===m.a?m.b:m.a;
 const P=(m,slot,label,bo)=>playCupMatch(s,m,slot,label,bo);
 for(let i=0;i<4;i++)if(!p.wb1[i].r){P(p.wb1[i],'chpo_wb1_'+(i+1),'挑杯·胜者组首轮',KPL.BO7);return;}
 for(let i=0;i<2;i++){const m=p.lb1[i];if(m.a===null)m.a=loserOf(p.wb1[i*2]);if(m.b===null)m.b=loserOf(p.wb1[i*2+1]);if(!m.r){P(m,'chpo_lb1_'+(i+1),'挑杯·败者组首轮',KPL.BO7);return;}}
 for(let i=0;i<2;i++){const m=p.wb2[i];if(m.a===null)m.a=p.wb1[i*2].r;if(m.b===null)m.b=p.wb1[i*2+1].r;if(!m.r){P(m,'chpo_wb2_'+(i+1),'挑杯·胜者组半决赛',KPL.BO7);return;}}
 for(let i=0;i<2;i++){const m=p.lb2[i];if(m.a===null)m.a=p.lb1[i].r;if(m.b===null)m.b=loserOf(p.wb2[i]);if(!m.r){P(m,'chpo_lb2_'+(i+1),'挑杯·败者组第二轮',KPL.BO7);return;}}
 if(p.wf.a===null){p.wf.a=p.wb2[0].r;p.wf.b=p.wb2[1].r;}
 if(!p.wf.r){P(p.wf,'chpo_wf','挑杯·胜者组决赛',KPL.BO7);return;}
 if(p.lbs.a===null){p.lbs.a=p.lb2[0].r;p.lbs.b=p.lb2[1].r;}

function setupAsianGames(s){

 for(const t of AI_TEAMS){const q=ensureAiRosters(s,t.name).find(p=>p.name===n);if(q)return q;}

 }).filter(Boolean);
 }
 if(squad.length<5)squad=agSelectSquad(s); // 兜底：名单残缺（退役/异常）按当前最强补

 s.aiPower=s.aiPower||{};
 s.aiPower['中国代表队']=myPow;
 AG_NATIONS.forEach(([n,pw])=>{s.aiPower[n]=pw+(gameYear(s)-2026)*3;}); // 海外对手逐年小幅变强

 for(let r=0;r<6;r++){

 for(let i=0;i<6;i++)ms.push({a:s.annual.masters[i],b:s.annual.elites[(i+r)%6],r:null});
 s.annual.rounds.push(ms);
 }
 s.phase='annual';
 const myRank=all.indexOf(s.teamName);
 if(myRank<0||myRank>=12){
 logEvent(s,' 年度积分 '+(s.annualPts[s.teamName]||0)+' 分（第'+(myRank+1)+'），无缘年度总决赛（前12）——春夏赛季继续攒分');
 simCup('annual',s); // AI 自动补完全部年总赛程（内部收尾走年度轮换）

 }
 logEvent(s,' '+gameYear(s)+' KPL 年度总决赛开幕！你队以年度积分 '+s.annualPts[s.teamName]+' 分（第'+(myRank+1)+'名）进入'+(myRank<6?'大师组':'精英组'));
 save();renderAll();
}
function arenaStandings(s){
 const M={},E={};
 s.annual.masters.forEach(t=>M[t]={pts:0,pw:0});
 s.annual.elites.forEach(t=>E[t]={pts:0,pw:0});
 s.annual.rounds.flat().forEach(m=>{
 if(!m.r)return;
 const aWin=m.r===m.a,ms=m.ms==null?4:m.ms,es=m.es==null?0:m.es;
 const wT=aWin?M:E,lT=aWin?E:M;
 wT[m.r].pts++;wT[m.r].pw+=aWin?ms:es;
 lT[aWin?m.b:m.a].pw+=aWin?es:ms;
 });
 return {M,E};
}
function annualStep(s){ // 年总推进分派（finishSeries cup 分支 / AI 场次递归入口）
 const a=s.annual;if(!a)return;
 if(a.stage==='arena')annualArenaNext(s);
 else if(a.stage==='breakthrough')annualBrkNext(s);
 else if(a.stage==='po')annualPoStep(s);
}
function startAnnualArena(s){
 const a=s.annual;
 const rd=a.rounds[a.roundIdx];
 if(!rd){finishArena(s);return;}
 const my=rd.find(m=>m.a===s.teamName||m.b===s.teamName);
 if(!my){finishArena(s);return;}
 playCupMatch(s,my,'arena_r'+(a.roundIdx+1),'年总·擂台赛 第'+(a.roundIdx+1)+'轮',KPL.BO5);
}
function annualArenaNext(s){
 const a=s.annual;
 const rd=a.rounds[a.roundIdx];
 if(!rd){finishArena(s);return;}
 // 本轮 AI 场次补完（玩家场次已由 finishSeries 写入 m.r/ms/es）
 rd.forEach(m=>{
 if(m.r)return;
 const r=simSeriesResult(s,m.a,m.b,KPL.BO5);
 m.r=r.win?m.a:m.b;m.ms=r.mw;m.es=r.ow;
 });
 const rep=rd.filter(m=>!(m.a===s.teamName||m.b===s.teamName)).slice(0,3).map(m=>m.a+' '+m.ms+':'+m.es+' '+m.b).join('；');
 if(rep)logEvent(s,' 擂台赛第'+(a.roundIdx+1)+'轮：'+rep);
 a.roundIdx++;

function finishArena(s){
 const st=arenaStandings(s);
 const rankOf=(tbl,teams)=>teams.slice().sort((x,y)=>tbl[y].pts-tbl[x].pts||tbl[y].pw-tbl[x].pw);
 const mRank=rankOf(st.M,s.annual.masters),eRank=rankOf(st.E,s.annual.elites);
 s.annual.mRank=mRank;s.annual.eRank=eRank;
 logEvent(s,' 擂台赛收官！大师组前四直进淘汰赛：'+mRank.slice(0,4).join('、')+'；精英组第1名 '+eRank[0]+' 直进淘汰赛');
 s.annual.stage='breakthrough';
 // 突围赛：大师5/6 与 精英2-5 六队 BO7 单败（高顺位种子错开：M5vE5、M6vE4、E2vE3）
 s.annual.brk=[{a:mRank[4],b:eRank[4],r:null},{a:mRank[5],b:eRank[3],r:null},{a:eRank[1],b:eRank[2],r:null}];
 logEvent(s,' 突围赛对阵：'+s.annual.brk.map(m=>m.a+' vs '+m.b).join('；')+'（胜者进淘汰赛 · 精英组第6名 '+eRank[5]+' 遗憾出局）');
 const myBrk=s.annual.brk.some(m=>m.a===s.teamName||m.b===s.teamName);
 if(!myBrk){let g=0;while(s.annual.stage==='breakthrough'&&g++<10)annualBrkNext(s);}

}
function annualBrkNext(s){
 const a=s.annual;if(!a.brk)return;
 for(let i=0;i<3;i++){const m=a.brk[i];if(!m.r){playCupMatch(s,m,'brk'+(i+1),'年总·突围赛',KPL.BO7);return;}}

function finishBreakthrough(s){

 if(!eight.includes(s.teamName)){
 let g=0;while(s.annual.po&&!s.annual.po.champ&&g++<30)annualPoStep(s); // 内部终局时自动 finishAnnual→年度轮换
 return;
 }

/* 8 队双败淘汰 bracket（BO7，种子 1v8/4v5/2v7/3v6 落位）——年总淘汰赛 / 挑战者杯 8 强共用 */
function buildCup8(teams){
 return {
 wb1:[{a:teams[0],b:teams[7],r:null},{a:teams[3],b:teams[4],r:null},{a:teams[1],b:teams[6],r:null},{a:teams[2],b:teams[5],r:null}],
 wb2:[{a:null,b:null,r:null},{a:null,b:null,r:null}],wf:{a:null,b:null,r:null},
 lb1:[{a:null,b:null,r:null},{a:null,b:null,r:null}],lb2:[{a:null,b:null,r:null},{a:null,b:null,r:null}],
 lbs:{a:null,b:null,r:null},lbf:{a:null,b:null,r:null},final:{a:null,b:null,r:null},champ:null};
}
function annualPoStep(s){
 const p=s.annual.po;if(!p)return;
 const loserOf=m=>m.r===m.a?m.b:m.a;
 const P=(m,slot,label)=>playCupMatch(s,m,slot,label,KPL.BO7);
 for(let i=0;i<4;i++)if(!p.wb1[i].r){P(p.wb1[i],'apo_wb1_'+(i+1),'年总·胜者组首轮');return;}
 for(let i=0;i<2;i++){const m=p.lb1[i];if(m.a===null)m.a=loserOf(p.wb1[i*2]);if(m.b===null)m.b=loserOf(p.wb1[i*2+1]);if(!m.r){P(m,'apo_lb1_'+(i+1),'年总·败者组首轮');return;}}
 for(let i=0;i<2;i++){const m=p.wb2[i];if(m.a===null)m.a=p.wb1[i*2].r;if(m.b===null)m.b=p.wb1[i*2+1].r;if(!m.r){P(m,'apo_wb2_'+(i+1),'年总·胜者组半决赛');return;}}
 for(let i=0;i<2;i++){const m=p.lb2[i];if(m.a===null)m.a=p.lb1[i].r;if(m.b===null)m.b=loserOf(p.wb2[i]);if(!m.r){P(m,'apo_lb2_'+(i+1),'年总·败者组第二轮');return;}}
 if(p.wf.a===null){p.wf.a=p.wb2[0].r;p.wf.b=p.wb2[1].r;}
 if(!p.wf.r){P(p.wf,'apo_wf','年总·胜者组决赛');return;}
 if(p.lbs.a===null){p.lbs.a=p.lb2[0].r;p.lbs.b=p.lb2[1].r;}
 if(!p.lbs.r){P(p.lbs,'apo_lbs','年总·败者组半决赛');return;}
 if(p.lbf.a===null){p.lbf.a=loserOf(p.wf);p.lbf.b=p.lbs.r;}
 if(!p.lbf.r){P(p.lbf,'apo_lbf','年总·败者组决赛');return;}
 if(p.final.a===null){p.final.a=p.wf.r;p.final.b=p.lbf.r;}
 if(!p.final.r){P(p.final,'apo_final','年总·总决赛');return;}
 finishAnnual(s,true);
}
function finishAnnual(s,silent){
 const p=s.annual&&s.annual.po;
 if(p&&p.final.r&&!p.champ){
 p.champ=p.final.r;
 const loserOf=m=>m.r===m.a?m.b:m.a;
 const runner=loserOf(p.final);
 s.titleHistory=(s.titleHistory||[]).concat([{season:s.season,split:s.split,event:'年总',champ:p.champ}]).slice(-16);
 logEvent(s,' '+gameYear(s)+' KPL 年度总决赛落幕：'+p.champ+' 捧起圣龙杯！'+(p.champ===s.teamName?'年度至尊荣耀！':''));
 let prize=0; // 年总奖金（真实 2000 万级冠军奖，游戏内取 800 万）

 else if(runner===s.teamName)prize=4000;
 else if([p.lbf,p.lbs].some(m=>m.r&&loserOf(m)===s.teamName))prize=2500;
 else if(p.lb2.concat(p.lb1).some(m=>m.r&&loserOf(m)===s.teamName))prize=1200;
 if(prize){s.fund+=prize;logEvent(s,' 年度总决赛奖金：+'+prize+'万');}
 if(p.champ===s.teamName||runner===s.teamName){
 s.honors=s.honors||[];
 s.honors.push({season:s.season,title:gameYear(s)+' KPL年度总决赛 '+(p.champ===s.teamName?'冠军':'亚军'),champion:p.champ===s.teamName,roster:titleRoster(s)});
 s.honors=s.honors.slice(-20);
 }
 awardFMVP(s,p.champ,gameYear(s)+' KPL 年度总决赛');
 s.champion=p.champ===s.teamName;

 }
 // 成绩曲线：年总名次入档
 s.yearStages=s.yearStages||[];
 if(p&&p.final.r){
 const loserOf=m=>m.r===m.a?m.b:m.a; // 块内局部（冠军结算分支的同名工具）
 const myPlace=p.champ===s.teamName?'冠军':loserOf(p.final)===s.teamName?'亚军'
 :[p.lbf,p.lbs].some(m=>m.r&&loserOf(m)===s.teamName)?'四强'
 :p.lb2.concat(p.lb1).some(m=>m.r&&loserOf(m)===s.teamName)?'八强':'参赛';
 s.yearStages.push({ev:'KPL年度总决赛',place:myPlace});
 }else s.yearStages.push({ev:'KPL年度总决赛',place:'未晋级'});
 /* 赛季末结算：经理/教练走董事会评价；选手走个人赛季结算（冠军/FMVP 由荣誉室自然累计） */
 if(s.mode==='player')playerYearSettle(s);
 else boardSettle(s);
 if(s.mode==='coach')coachPoach(s); // 教练带队出色 → 豪门挖角邀约
 buildYearReview(s); // 年度回顾快照：成绩曲线/转会记录/董事会评价/关键战役（必须在 newSeason 前）
 newSeason(s); // 年度轮换：年龄/合同/退役结算 → 下一年春季赛
}
/* ================= 选手生涯 / 教练生涯（引擎侧） ================= */
function playerYearSettle(s){ // 选手模式年度结算：本赛季个人数据入册生涯履历
 const me=myPlayer(s);
 if(!me||!s.career)return;
 const rec={season:s.season,year:gameYear(s),team:s.teamName,apps:me.apps||0,caps:me.caps||0,
 kda:me.caps?[me.kTotal,me.dTotal,me.aTotal].map(x=>Math.round(x/me.caps*10)/10).join('/'):null,
 mvp:me.mvp||0,ovr:overall(me),val:me.val||100,wage:me.wage,

 s.career.seasons.unshift(rec);
 s.career.seasons=s.career.seasons.slice(0,15);
 s.career.titles+=rec.titles;
 me.kTotal=0;me.dTotal=0;me.aTotal=0;me.caps=0;me.mvp=0; // 本赛季计数清零（生涯履历已快照）
 logEvent(s,'【赛季结算】'+rec.year+'：'+rec.team+' · 出场 '+rec.apps+' 次'+(rec.kda?' · 场均 '+rec.kda:'')+' · 总值 '+rec.ovr+' · '+(rec.titles?rec.titles+' 冠':'无冠'));

function applyPlayerMove(s){ // 选手赛段间转会：把 pendingMove 落地为新东家阵容
 const mv=s.career&&s.career.pendingMove;
 if(!mv)return;
 const me=myPlayer(s);
 s.career.pendingMove=null;
 if(!me)return;

 s.teamName=tmpl.name;s.icon=tmpl.icon;

 me.team=tmpl.name;
 me.wage=Math.max(me.wage,Math.max(5,Math.round(mv.fee/50))); // 报价越高，薪资待遇越好
 me.contract=2;me.morale=clamp(me.morale+8,20,100);me.val=clamp((me.val||100)+4,70,150);
 s.coach={...COACH_POOL.find(c=>c.id===tmpl.coach)};
 s.lineup=[]; // 新东家首发由教练按战力重排（coachPickLineup）
 s.seedPower=teamPower(s)||300;
 logEvent(s,' 转会完成：'+me.name+' 正式加盟 '+tmpl.name+'（转会费 '+mv.fee+'万 · 年薪 '+me.wage+'万/周）——首发位置要重新证明');

function coachAutoSquad(s){ // 教练模式：俱乐部自动续约与引援（你只管排人用兵）
 (s.expiring||[]).slice().forEach(pid=>{
 const p=s.players.find(x=>x.id===pid);
 if(p&&!p.loan)p.contract=(p.contract||0)+1; // 俱乐部统一续约一年
 });
 s.expiring=[];
 let need=POS_ORDER.filter(pos=>!s.players.some(p=>p.pos===pos));
 const u=new Set(s.players.map(p=>p.name));

 while((s.players.length<7||need.length)&&g++<10){
 const pos=need.length?need[0]:pick(POS_ORDER);
 const def=genFreeAgentDef(pos,s.players.length<6?'mid':'low',u);
 const p=genPlayer(def);
 p.contract=2;
 s.players.push(p);
 logEvent(s,' 俱乐部引援：签下自由球员 '+p.name+'（'+POS[pos][0]+' · 总值 '+overall(p)+'）');
 if(need.length&&s.players.some(x=>x.pos===need[0]))need.shift();

function coachPoach(s){ // 执教出色 → 豪门邀约（俱乐部页回应；接受=换队执教，履历入册）
 if(s.board&&s.board.fired)return;

 if(rank&&rank<=4&&trust>=70&&Math.random()<0.45){

 }

/* ================= 年度回顾（赛季回顾页数据源） =================
 年度轮换前调用（finishAnnual 内）：把刚结束这一年的 成绩曲线（各赛段名次）、
 转会台账、董事会评价、关键战役（复盘里的巅峰对决/总决赛/突围赛）、成就与经营快照
 定格成一份回顾，压入 s.yearReviews（俱乐部页提示查看，经营页可回看历届）。 */
function buildYearReview(s){
 const year=gameYear(s);
 const boardEntry=((s.board&&s.board.log)||[]).find(b=>b.season===s.season)||null;
 const stages=(s.yearStages||[]).slice();
 const honors=(s.honors||[]).filter(h=>h.season===s.season).map(h=>({title:h.title,champion:h.champion}));
 const keys=(s.history||[]).filter(h=>h.yr===year&&(h.peak||/总决赛|突围|擂台/.test(h.stage)))
 .slice(0,6).map(h=>({opp:h.opp,stage:h.stage,score:h.score,win:h.win,peak:h.peak}));
 const transfers=(s.transfers||[]).filter(t=>t.yr===year);
 const achieved=Object.keys(s.achieved||{}).filter(id=>s.achieved[id]===year)
 .map(id=>{const a=ACHIEVEMENTS.find(x=>x.id===id);return a?a.name:id;});
 s.yearReviews=s.yearReviews||[];
 const review={year,season:s.season,team:s.teamName,stages,honors,transfers,keys,achieved,
 board:boardEntry?{rank:boardEntry.rank,target:boardEntry.target,delta:boardEntry.delta,note:boardEntry.note,trust:boardEntry.trust}:null,
 annualPts:(s.annualPts||{})[s.teamName]||0,annualRank:myAnnualRank(s),
 fund:s.fund,fans:Math.round(s.fans||0)};
 s.yearReviews.unshift(review);
 s.yearReviews=s.yearReviews.slice(0,10);
 s._reviewNew=year; // 俱乐部页提示条：查看后清除
 logEvent(s,' 年度回顾已生成：'+year+' 赛季总结（成绩曲线/转会记录/董事会评价/关键战役）——俱乐部页可查看');
 return review;
}
/* ================= 杯赛通用流程（EWC / 挑战者杯 / 年总共用） ================= */
const BO_TXT=bo=>bo===5?'BO5 全局BP':bo===9?'BO9·第9局巅峰对决':'BO7·含巅峰对决';
function playCupMatch(s,m,slot,label,bo){
 if(m.a===s.teamName||m.b===s.teamName){
 const opName=m.a===s.teamName?m.b:m.a;
 if(s.mode==='player'){ // 选手生涯：教练指挥，自动打完整场杯赛系列赛
 const sr=playerAutoSeries(s,opName,bo);
 const myWin=sr.mw>sr.ow;
 m.r=myWin?s.teamName:opName;
 if(m.a===s.teamName){m.ms=sr.mw;m.es=sr.ow;}else{m.ms=sr.ow;m.es=sr.mw;}
 s._lastMvps=(sr.mvpIds||[]).slice(); // 决赛 FMVP 评选用
 rosterLineup(s).forEach(p=>{p.apps=(p.apps||0)+1;});
 logEvent(s,' '+label+'：'+s.teamName+' '+(myWin?'胜':'负')+' '+opName+' '+sr.mw+':'+sr.ow+(myWin?'，晋级':'，止步'));
 (s.history=s.history||[]).unshift({yr:gameYear(s),opp:opName,stage:label,score:sr.mw+':'+sr.ow,win:myWin,logs:sr.logs,peak:sr.max>=7&&sr.mw+sr.ow===sr.max});
 s.history=s.history.slice(0,20);
 save();renderAll();
 if(s.phase==='ewc')ewcStep(s);
 else if(s.phase==='challenger')challengerStep(s);
 else annualStep(s);
 return;
 }
 if(s.series&&s.series.stage==='cup'&&s.series.cupSlot===slot){
 showPreMatch(label+'（'+BO_TXT(bo)+'）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
 return;
 }
 s.series={used:[],usedOpp:[],mw:0,ow:0,max:bo,stage:'cup',cupSlot:slot,cupMatch:m,cupLabel:label,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'playoff',opName)};s.seriesAuto=false;
 resetOppEnergy(s,opName);
 showPreMatch(label+'（'+BO_TXT(bo)+'）vs '+opName+' · 第1局');
 return;
 }
 const r=simSeriesResult(s,m.a,m.b,bo);
 m.r=r.win?m.a:m.b;m.ms=r.mw;m.es=r.ow;
 logEvent(s,' '+label+'：'+m.a+' '+(r.win?'胜':'负')+' '+m.b+'，'+m.r+' 晋级');
 save();renderAll();
 if(s.phase==='ewc')ewcStep(s);
 else if(s.phase==='challenger')challengerStep(s);
 else annualStep(s); // 年总各阶段推进（擂台 AI 场次不走此路径，突围/淘汰赛走此分派）
}
function simCup(kind,s){ // 玩家未晋级：AI 自动补完杯赛
 let guard=0;
 if(kind==='ewc'){while(s.ewc&&!s.ewc.champ&&guard++<20)ewcStep(s);}
 else if(kind==='challenger'){while(s.challenger&&!s.challenger.champ&&guard++<60)challengerStep(s);}
 else{while(s.annual&&(s.annual.stage!=='po'||!s.annual.po.champ)&&guard++<80)annualStep(s);}
}
function startCup(s){ // 杯赛 UI 入口（进行下一场 / 快进）
 if(s.phase==='ewc'){ewcStep(s);return;}
 if(s.phase==='challenger'){challengerStep(s);return;}
 if(s.phase==='annual'){
 const a=s.annual;
 if(a.stage==='arena')startAnnualArena(s);
 else if(a.stage==='breakthrough')annualBrkNext(s);
 else annualPoStep(s);
 }
}
/* 选手退役去向：转教练（战力加成）或转型主播（人气收入），进入"退役名宿"市场 */
function retireToCoach(s,p){
 s.retiredCoaches=s.retiredCoaches||[];

/* 签约退役名宿（教练 or 主播） */

function hireAssistant(s,id){

/* 签约自由球员（无球可打流向市场的选手） */
function signFreeAgent(s,id){
 const p=(s.freeAgents||[]).find(x=>x.id===id);
 if(!p)return;

 if(s.fund<p.signCost){toast('资金不足（签约费 '+p.signCost+'万）');return;}
 if(weeklyWage(s)+p.wage>s.wageCap){

 }
 s.fund-=p.signCost;
 p.acqCost=p.signCost; // 买入价锚定（转售保护用）
 if(p.contract==null)p.contract=2; // 签约即给合同年限
 s.freeAgents=s.freeAgents.filter(x=>x.id!==id);
 s.players.push(p);
 recordTransfer(s,'in',p,p.signCost,'自由球员','自由市场直签'); // 年度回顾·转会台账
 logEvent(s,' 自由市场签下 '+p.name+'（无球可打选手 · 签约费 '+p.signCost+'万）');
 save();renderAll();toast(p.name+' 加盟！');
}

<script>

/* ================= KPL 选边系统（红蓝方） =================
 季后赛/卡位赛首局：常规赛排名更高者选边；常规赛首局：抛硬币
 第 2-6 局：败方选边（自由选蓝/红）；BO7 第 7 局巅峰对决：第 6 局败方选边
 蓝方=先ban先选一抢；红方=counter位后手克制（本局战力+2%） */
function groupOfTeam(s,n){
 // 检查所有可能的组（含季后赛阶段，phaseGroups 在 playoff 时为空）
 for(const g of ['S','A','B','G1','G2','G3']){if(s.groups[g]&&s.groups[g].includes(n))return g;}
 return 'G3';
}
function sidePriority(s,a,b){
 const order={S:0,A:1,B:2,G1:0,G2:1,G3:2};
 const gA=groupOfTeam(s,a),gB=groupOfTeam(s,b);
 if(order[gA]!==order[gB])return order[gA]<order[gB]?a:b;
 const tA=(s.tables[gA]||{})[a]||{pts:0,pw:0},tB=(s.tables[gB]||{})[b]||{pts:0,pw:0};
 if(tA.pts!==tB.pts)return tA.pts>tB.pts?a:b;
 return tA.pw>=tB.pw?a:b;
}
/* 首局选边：常规赛抛硬币；卡位/季后赛排名高者拥有选边权 */
function firstSide(s,stage,opName){
 if(stage==='regular'||!stage)return Math.random()<0.5?'blue':'red';
 const hi=sidePriority(s,s.teamName,opName);
 if(hi===s.teamName)return Math.random()<0.5?'blue':'red';
 return Math.random()<0.6?'red':'blue'; // AI 偏好红方 counter
}
function aiPickSide(s){return Math.random()<0.5?'red':'blue';}
/* 败方选边弹窗（玩家拥有选边权时） */
function showSideChoice(nextTitle){
 $('#app-modal-body').innerHTML=`
 <h2>败方选边</h2>
 <div class="hint" style="text-align:center;margin-bottom:14px">上一局落败，按 KPL 规则败方拥有下一局选边权（自由选蓝/红，非强制互换）</div>
 <div style="display:flex;gap:10px;justify-content:center">
 <button class="btn primary" style="flex:1" onclick="setSide('blue')">蓝方 · 先ban先选<br><small style="color:var(--dim)">第一轮主动权 · 一抢版本强势</small></button>
 <button class="btn gold" style="flex:1" onclick="setSide('red')">红方 · 后手counter<br><small style="color:var(--dim)">第二轮针对性选人 · 克制对方</small></button>
 </div>`;
 $('#app-modal').classList.add('on');
 window._sideNext=nextTitle||'';
}
function setSide(side){
 if(S.series)S.series.side=side;
 closeModal('app-modal');
 openBP(window._sideNext||'',playGame);
}

/* ================= BP 有效战力结算（BP 影响胜负的核心） =================
 有效战力 = 基础战力 × BP 修正，双方对称可对赌：
 · 我方 BAN：禁掉「对方池内英雄」每个 -2%（BAN 空气只 -0.5%）→ 最高 -8%
 · 对方 BAN：禁掉「我方首发池内英雄」每个 -1%（叠加我方被迫换人的熟练度损失）
 · 版本强势（）：我方由英雄加成内置；对方每选一个 +2% 补齐对称
 · 红方后手 counter +2%（蓝方优势=先手一抢，已体现在选人顺序）
 · 巅峰对决：盲选无 BAN，不吃任何修正 */
function bpEffective(v){
 const myLs=rosterLineup(S);
 let my=teamPower(S,v.myPicks||null);
 // 对方战力：有真实阵容时实时结算（与玩家同刻度、含体力衰减），否则退回静态值
 let op=(v.opRoster&&v.opRoster.length)?aiRosterPower(v.opRoster,S,v.opName):powerOf(S,v.opName);
 const notes=[];
 if(!v.isPeak){
 let banCut=0;
 (v.myBans||[]).forEach(h=>{
 const real=(v.opRoster||[]).some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.usedOpp||[]).includes(h); // 对方本系列赛已用：BAN不到，只算池外价
 banCut+=real?0.02:0.005;
 });
 if(banCut){op*=1-banCut;notes.push('我方 BAN×'+(v.myBans||[]).length+' 对方-'+Math.round(banCut*100)+'%');}
 let myCut=0;
 (v.oppBans||[]).forEach(h=>{
 const real=myLs.some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.used||[]).includes(h);
 myCut+=real?0.01:0.002;
 });
 if(myCut){my*=1-myCut;notes.push('对方 BAN×'+(v.oppBans||[]).length+' 我方-'+Math.round(myCut*100)+'%');}
 const hot=Object.values(v.oppPicks||{}).filter(h=>heroOf(h)&&heroOf(h).hot).length;
 if(hot){op*=1+hot*0.02;notes.push('对方×'+hot+' +'+(hot*2)+'%');}
 if(v.side==='red'){my*=1.02;notes.push('红方counter+2%');}
 else{op*=1.02;notes.push('对方counter+2%');}
 // 王朝反制①：对阵连冠队伍，研究方有效战力 +2%/连冠季（上限+6%）
 const mySt=dynastyStreak(S,S.teamName),opSt=dynastyStreak(S,v.opName);
 if(mySt){op*=1+mySt*0.02;notes.push('对手研究我方'+mySt+'连冠 +'+(mySt*2)+'%');}
 if(opSt){my*=1+opSt*0.02;notes.push('我方研究对方'+opSt+'连冠 +'+(opSt*2)+'%');}
 }
 return {my:Math.round(my),op:Math.round(op),notes};
}
/* BP 台实时结算：我方未选位置按当前可选最优估算，对方按其池内最优可用估算 */
function bpEffPreview(d){
 const myPicks={...d.myPicks};
 myOpenPositions(d).forEach(pos=>{
 const best=bestHeroFor(d,pos,myCandidates(d,pos));
 if(best)myPicks[pos]=best;
 });
 const taken=takenSet(d),oppPicks={...d.oppPicks};
 (d.oppRoster||[]).forEach(p=>{
 if(p.injury>0)return; // 伤员不计入对方可选估算
 if(oppPicks[p.pos])return;
 let best=null,bp=-1;
 (p.heroPool||[]).forEach(x=>{
 const h=heroOf(x.n);
 if(h&&h.pos.includes(p.pos)&&!taken.has(x.n)&&!(d.usedOpp||[]).includes(x.n)){const pw=playerPower(p,x.n);if(pw>bp){bp=pw;best=x.n;}}
 });
 if(best)oppPicks[p.pos]=best;
 });
 return bpEffective({myPicks,myBans:d.myBans,oppPicks,oppBans:d.oppBans,side:d.sr.side,isPeak:d.isPeak,opName:d.sr.opName,opRoster:d.oppRoster,used:d.used,usedOpp:d.usedOpp});
}

/* ================= KPL 官方 BP 引擎（两段式征召 · 逐手交互） =================
 官方每局流程（蓝方视角，红方镜像）：
 ① 第一轮 BAN：蓝1 → 红1 → 蓝1 → 红1（各2个）
 ② 第一轮 PICK：蓝1 → 红2 → 蓝2 → 红1（各3人）
 ③ 第二轮 BAN：红1 → 蓝1 → 红1 → 蓝1（再各2个，共4个）
 ④ 第二轮 PICK：红1 → 蓝2 → 红1（各2人，满5人）
 系列赛全局 BP：己方本系列赛用过的英雄不能再选；
 BO7 打至 3:3 进入第 7 局「巅峰对决」：无 BAN、双方盲选、不受全局 BP 限制。 */
function kplDraftSteps(){
 return [ // {s:蓝/红, t:ban/pick, n:连选手数} —— 共 8 ban + 10 pick = 18 手
 {s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},
 {s:'B',t:'pick',n:1},{s:'R',t:'pick',n:2},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
 {s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},
 {s:'R',t:'pick',n:1},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
 ];
}
function expandSteps(sr,isPeak){
 if(isPeak)return [{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'}];
 const myIsBlue=(sr.side!=='red');
 const steps=[];
 kplDraftSteps().forEach(st=>{
 const mine=(st.s==='B')===myIsBlue;
 for(let i=0;i<st.n;i++)steps.push({side:mine?'M':'O',type:st.t});
 });
 return steps; // 18 手，side: M=我方 O=对方
}
/* 首发缺位时从替补席同位置自动递补（退役/转会后防呆）；伤停/国家队集训必须休息：
 无健康替补时位置空缺，由 lineupNoGo 在开赛入口统一拦截（签替补/提拔青训是玩家决策） */
function natBusy(s,p){return !!(p&&(p.injury>0||(typeof natCamping==='function'&&natCamping(s,p))));}
/* 当前首发里无法出战的位置（无人/伤停/集训）——openBP 与 autoPlayNext 共用同一判定 */
function lineupNoGo(s){
 return POS_ORDER.filter(pos=>{
 const p=rosterLineup(s).find(x=>x.pos===pos);
 return !p||natBusy(s,p);
 });
}
function noGoDetail(s,noGo){
 return noGo.map(pos=>{
 const p=rosterLineup(s).find(x=>x.pos===pos);
 return POS[pos][0]+(p?(p.natCamp?'（'+p.name+' 国家队集训）':'（'+p.name+' 伤停'+p.injury+'天）'):'（无人）');
 }).join('、');
}
function autoFillLineup(s){
 POS_ORDER.forEach(pos=>{
 const cur=s.lineup.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);
 const inPos=cur.find(p=>p.pos===pos);
 if(inPos&&natBusy(s,inPos)){ // 伤员/集训自动下场
 const cands=s.players.filter(p=>!s.lineup.includes(p.id)&&p.pos===pos&&!natBusy(s,p))
 .sort((a,b)=>playerPower(b,b.sig)-playerPower(a,a.sig)); // 替补择优上场
 const fit=cands[0];
 if(fit){
 s.lineup[s.lineup.indexOf(inPos.id)]=fit.id;
 logEvent(s,' '+inPos.name+(inPos.natCamp?' 国家队集训中，缺席夏季赛；':' 伤停（还剩'+inPos.injury+'天），')+fit.name+' 顶替首发（'+POS[pos][0]+'）');
 return;
 }
 if(inPos.natCamp){ // 集训缺席且无替补：强制下场留空位（开赛拦截——签替补是正式策略，不再凭空借调青训）
 s.lineup.splice(s.lineup.indexOf(inPos.id),1);
 logEvent(s,' '+inPos.name+' 国家队集训中且无替补可顶——'+POS[pos][0]+'空缺！转会市场签一名替补，否则该位置无法出战');
 return;
 }
 // 伤停无替补：留在首发（伤员自动下场后会无人可换），留给 openBP 拦截
 }
 if(!cur.some(p=>p.pos===pos)){
 const cands=s.players.filter(p=>!s.lineup.includes(p.id)&&p.pos===pos&&!natBusy(s,p))
 .sort((a,b)=>playerPower(b,b.sig)-playerPower(a,a.sig));
 const bench=cands[0];
 if(bench){s.lineup.push(bench.id);logEvent(s,' '+bench.name+' 递补进入首发（'+POS[pos][0]+'）');}
 }
 });
}
/* 系列赛开始：对手阵容体力回满（体力衰减只在系列赛内逐局累积，跨系列赛恢复；AI 互比用构建值）
 伤病对称：AI 也会伤停（以缺阵系列赛数计），伤员由本队青训递补顶替——追打伤停队是合法战术 */
function resetOppEnergy(s,opName){
 ensureAiRosters(s,opName);
 const r=s.aiRosters[opName]||[];
 r.forEach(p=>{p.energy=ENERGY_MAX;});
 if(!s.aiInj)s.aiInj={};
 const inj=s.aiInj[opName]=s.aiInj[opName]||{};
 r.forEach(p=>{
 if(p.id.startsWith('ac_'))return; // 递补青训不再受伤
 if(inj[p.id]>0){
 inj[p.id]--;
 }else if(Math.random()<0.06){
 inj[p.id]=rnd(1,2); // 缺席 1-2 个系列赛
 logEvent(s,' 对方 '+p.name+' 赛前训练受伤，将缺阵 '+inj[p.id]+' 个系列赛');
 }
 });
 POS_ORDER.forEach(pos=>{
 const real=r.filter(p=>p.pos===pos&&!p.id.startsWith('ac_'));
 const sick=real.some(p=>inj[p.id]>0);
 const fill=r.find(p=>p.pos===pos&&p.id.startsWith('ac_'));
 if(sick&&!fill){
 const usedNames=rookieUsedNames(s); // 全局查重：避免与玩家/其他 AI 队青训重名
 r.forEach(x=>usedNames.add(x.name));
 const f=genPlayer(genAcademyDef(pos,usedNames,s.season));
 r.push(f);
 const who=real.find(p=>inj[p.id]>0);
 logEvent(s,' '+opName+' 青训 '+f.name+' 顶替伤停的 '+who.name+'（'+POS[pos][0]+'）');
 }else if(real.length&&!sick&&fill){
 r.splice(r.indexOf(fill),1); // 伤愈且有健康主力在位：递补退场
 // 注意：real 为空（该位置真实选手被玩家买走/租走）时不能删递补——他是顶空缺的，不是顶伤员的
 }
 });
 s.aiPower[opName]=aiRosterPower(r,s,opName);
}
function openBP(title,onConfirm){
 autoFillLineup(S);
 const ls=rosterLineup(S);
 const noGo=lineupNoGo(S);
 if(noGo.length){
 const detail=noGoDetail(S,noGo);
 toast(' '+detail+' 无法出战：签约替补顶位（转会市场）/ 青训晋升 / 休息等伤愈');
 return;
 }
 const sr=S.series;
 const isPeak=sr&&sr.max>=7&&sr.mw+sr.ow===sr.max-1; // 巅峰对决：BO7 3:3 / BO9 4:4
 window._draft={
 onConfirm,sr,ls,title,isPeak,
 used:(sr&&!isPeak&&sr.used)?sr.used.slice():[],
 usedOpp:(sr&&!isPeak&&sr.usedOpp)?sr.usedOpp.slice():[],
 steps:expandSteps(sr,isPeak),idx:0,
 myBans:[],oppBans:[],myPicks:{},oppPicks:{},curPos:null,
 oppRoster:isPeak?[]:(ensureAiRosters(S,sr.opName)||[]),
 };
 renderBP();
}
/* 当前是否轮到我方（自动处理对方所有连续手） */
function draftAction(d){
 while(d.idx<d.steps.length&&d.steps[d.idx].side==='O'){
 aiDraftStep(d);d.idx++;
 }
 if(d.idx>=d.steps.length)return {type:'done'};
 const st=d.steps[d.idx];
 return {type:st.type,side:'M'};
}
/* ---------- 可选英雄/禁用候选 ---------- */
function takenSet(d){
 return new Set([...d.used,...d.myBans,...d.oppBans,...Object.values(d.myPicks),...Object.values(d.oppPicks)]);
}
function myCandidates(d,pos){
 const p=(d.ls||[]).find(x=>x.pos===pos);
 if(!p)return [];
 const taken=takenSet(d);
 const cand=p.heroPool.filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n));
 if(cand.length)return cand;
 // 职业选手兜底：池内英雄全被 BAN/选完时，可临时拿出该位置任意英雄（生疏-8%，赛后进池）
 return HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)).map(h=>({n:h.n,lv:0}));
}
/* 临时掏的英雄写入选手英雄池（生疏），保证战力结算与展示一致 */
function ensureHeroInPool(p,hero){
 if(p&&!p.heroPool.some(x=>x.n===hero))p.heroPool.push({n:hero,lv:0});
}
function banCandidates(d){
 const taken=takenSet(d);
 return HEROES.map(h=>h.n).filter(n=>!taken.has(n));
}
function myOpenPositions(d){
 return POS_ORDER.filter(pos=>!(pos in d.myPicks)&&d.ls.some(x=>x.pos===pos));
}
function bestHeroFor(d,pos,avail){
 const p=(d.ls||[]).find(x=>x.pos===pos);
 if(!p||!avail.length)return null;
 let best=avail[0].n,bp=-1;
 avail.forEach(h=>{const pw=playerPower(p,h.n)+(heroOf(h.n)&&heroOf(h.n).hot?1.5:0);if(pw>bp){bp=pw;best=h.n;}});
 return best;
}
/* 威胁值：某英雄对某方阵容的威胁 = 该方能玩此英雄的选手最高战力
 我方 BAN 时看 'opp'（禁掉对面的强点）；对方 AI BAN 时看 'me' */
function threatOf(d,h,side){
 if(side==='opp'&&(d.usedOpp||[]).includes(h))return null; // 对方本系列赛已用：本局选不了，无威胁
 if(side!=='opp'&&(d.used||[]).includes(h))return null; // 我方已用同理
 const roster=side==='opp'?(d.oppRoster||[]):d.ls;
 let bp=null;
 roster.forEach(p=>{
 if(p.injury>0)return; // 伤员无法出战，不构成威胁
 if((p.heroPool||[]).some(x=>x.n===h)&&heroOf(h)&&heroOf(h).pos.includes(p.pos)){
 const pw=playerPower(p,h);if(bp==null||pw>bp)bp=pw;
 }
 });
 return bp;
}
/* 我方 BAN 推荐：对方已用的英雄本局选不了，BAN 它=浪费（结算只按池外 -0.5% 计），排到最后 */
function banScore(d,h){
 const oppUsed=(d.usedOpp||[]).includes(h);
 return (threatOf(d,h,'opp')||0)+((heroOf(h).hot&&!oppUsed)?2:0)+(oppUsed?-1:0);
}
function bestBanFor(d){
 let best=null,bs=-1;
 banCandidates(d).forEach(h=>{const v=banScore(d,h);if(v>bs){bs=v;best=h;}});
 return best;
}
/* ---------- AI 逐手决策 ---------- */
function aiDraftStep(d){
 const st=d.steps[d.idx];
 if(st.type==='ban'){
 // 对方 AI 禁用：禁掉我方阵容威胁最大的英雄（跳过自己本系列赛已用的——本局也选不了）
 const avail=banCandidates(d).filter(h=>!((d.usedOpp||[]).includes(h)));
 let best=null,bs=-1;
 avail.forEach(h=>{
 const th=threatOf(d,h,'me')||0;
 const score=th+(heroOf(h).hot?2:0)+(Math.random()*1.5);
 if(score>bs){bs=score;best=h;}
 });
 if(best)d.oppBans.push(best);
 return;
 }
 // AI 选人：挑剩余位置中（选手×英雄）战力最高的一手，稍带保护招牌倾向；伤员跳过
 let bestPos=null,bestHero=null,bs=-1;
 POS_ORDER.forEach(pos=>{
 if(pos in d.oppPicks)return;
 const p=(d.oppRoster||[]).find(x=>x.pos===pos&&x.injury<=0);
 if(!p)return;
 const taken=takenSet(d),oppUsed=d.usedOpp||[]; // 全局BP：对方本系列赛己方用过的也不能再选
 let cand=(p.heroPool||[]).filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n));
 if(!cand.length)cand=HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n)).map(h=>({n:h.n,lv:0})); // 兜底：临时掏
 cand.forEach(h=>{
 const pw=playerPower(p,h.n);
 let score=pw+(heroOf(h.n).hot?1.2:0)+(h.n===p.sig?0.8:0)+Math.random();
 if(score>bs){bs=score;bestPos=pos;bestHero=h.n;}
 });
 });
 if(bestPos){d.oppPicks[bestPos]=bestHero;ensureHeroInPool((d.oppRoster||[]).find(x=>x.pos===bestPos&&x.injury<=0),bestHero);}
}
/* ---------- 我方操作入口 ---------- */
function bpBanPick(hero){
 const d=window._draft;if(!d)return;
 if(d.myBans.includes(hero)){toast('已禁用该英雄');return;}
 d.myBans.push(hero);d.idx++;d.curPos=null;renderBP();
}
function bpChoosePos(pos){const d=window._draft;if(!d)return;d.curPos=pos;renderBP();}
function bpBackToPos(){const d=window._draft;if(!d)return;d.curPos=null;renderBP();}
function bpBackFromSwap(){const d=window._draft;if(!d)return;d.swap=false;renderBP();}
function bpPickHero(hero){
 const d=window._draft;if(!d)return;
 const pos=d.curPos;if(!pos){toast('请先选择要出战的位置');return;}
 if(!myCandidates(d,pos).some(h=>h.n===hero)){toast('「'+hero+'」不可选');return;}
 const pl=(d.ls||[]).find(x=>x.pos===pos);
 if(pl&&!pl.heroPool.some(x=>x.n===hero))ensureHeroInPool(pl,hero); // 临时掏，生疏-8%
 d.myPicks[pos]=hero;d.idx++;d.curPos=null;renderBP();
}
/* ---------- 推荐与自动 ---------- */
function bpSuggest(){
 const d=window._draft;if(!d)return;
 let guard=0;
 while(guard++<40){
 const act=draftAction(d);
 if(act.type==='done')break;
 if(act.type==='ban'){
 const best=bestBanFor(d);
 if(best)d.myBans.push(best);
 d.idx++;
 }else{
 let bestPos=null,bestHero=null,bs=-1;
 myOpenPositions(d).forEach(pos=>{
 const avail=myCandidates(d,pos),best=bestHeroFor(d,pos,avail);
 if(best){const p=(d.ls||[]).find(x=>x.pos===pos);const pw=playerPower(p,best);if(pw>bs){bs=pw;bestPos=pos;bestHero=best;}}
 });
 if(bestPos){d.myPicks[bestPos]=bestHero;ensureHeroInPool((d.ls||[]).find(x=>x.pos===bestPos),bestHero);}
 d.idx++;
 }
 }
 renderBP();
}
function bpAuto(){bpSuggest();bpConfirm();}
function bpAutoAll(){
 if(!confirm('开启后本系列赛剩余局次将自动 BP 并直接开赛，不再弹 BP 界面（想手动参与就别开）。确定开启？'))return;
 S.seriesAuto=true;
 closeModal('app-modal');
 autoPlayNext();
}
/* 无 UI 自动跑完一整局 BP（系列赛自动模式） */
function autoPlayNext(){
 const sr=S.series;
 if(!sr)return;
 const isPeak=sr.max>=7&&sr.mw+sr.ow===sr.max-1;
 autoFillLineup(S); // 伤员自动换下/缺位递补
 const noGo=lineupNoGo(S);
 if(noGo.length){
 toast(' '+noGoDetail(S,noGo)+' 无法出战（伤停/无人/集训）——自动BP暂停，请补齐阵容');
 S.seriesAuto=false;
 openBP('伤停 · 请补齐阵容后继续',playGame);
 return;
 }
 const ls=rosterLineup(S);
 if(!ls.length){toast('没有可用阵容');S.seriesAuto=false;return;}
 const d={sr,ls,isPeak,
 used:(sr&&!isPeak&&sr.used)?sr.used.slice():[],
 usedOpp:(sr&&!isPeak&&sr.usedOpp)?sr.usedOpp.slice():[],
 steps:expandSteps(sr,isPeak),idx:0,
 myBans:[],oppBans:[],myPicks:{},oppPicks:{},curPos:null,
 oppRoster:isPeak?[]:(ensureAiRosters(S,sr.opName)||[])};
 let guard=0;
 while(guard++<40){
 const act=draftAction(d);
 if(act.type==='done')break;
 if(act.type==='ban'){
 const best=bestBanFor(d);
 if(best)d.myBans.push(best);
 d.idx++;
 }else{
 let bestPos=null,bestHero=null,bs=-1;
 myOpenPositions(d).forEach(pos=>{
 const avail=myCandidates(d,pos),best=bestHeroFor(d,pos,avail);
 if(best){const p=ls.find(x=>x.pos===pos);const pw=playerPower(p,best);if(pw>bs){bs=pw;bestPos=pos;bestHero=best;}}
 });
 if(bestPos){d.myPicks[bestPos]=bestHero;ensureHeroInPool(ls.find(x=>x.pos===bestPos),bestHero);}
 d.idx++;
 }
 }
 if(POS_ORDER.some(pos=>!d.myPicks[pos])){
 toast('有选手英雄池耗尽，自动BP暂停，请去阵容页换人');
 S.seriesAuto=false;
 openBP('英雄池耗尽 · 请换替补后继续',playGame);
 return;
 }
 sr.myBans=d.myBans;sr.oppBans=d.oppBans;sr.oppPicks={...d.oppPicks};
 applyBp({...d.myPicks});
 playGame();
}
function applyBp(sels){
 S.pick=sels;
 if(S.series){
 const sr=S.series;
 sr.used=sr.used||[];
 POS_ORDER.forEach(pos=>{const h=sels[pos];if(h&&!sr.used.includes(h))sr.used.push(h);});
 // 全局 BP 分队记账：对方本局所选英雄同样入册——己方用过的本系列赛不能再选，按队分开算
 sr.usedOpp=sr.usedOpp||[];
 POS_ORDER.forEach(pos=>{const h=(sr.oppPicks||{})[pos];if(h&&!sr.usedOpp.includes(h))sr.usedOpp.push(h);});
 }
}
/* ---------- BP 内换替补（不打断 BP 进度，已选英雄保留给该位置） ---------- */
function bpOpenSwap(){const d=window._draft;if(!d)return;d.swap=true;renderBP();}
function bpSwapIn(pid){
 const d=window._draft;if(!d)return;
 const p=S.players.find(x=>x.id===pid);
 if(p.injury>0){toast(p.name+' 伤停中（还剩'+p.injury+'天），无法登场');return;}
 const cur=rosterLineup(S).find(x=>x.pos===p.pos);
 if(!cur){toast('该位置没有首发');return;}
 S.lineup[S.lineup.indexOf(cur.id)]=p.id;
 if(S.pick&&S.pick[p.pos])ensureHeroInPool(p,S.pick[p.pos]); // 上局英雄残留：新选手临时掏
 if(d.myPicks[p.pos])ensureHeroInPool(p,d.myPicks[p.pos]); // 本局已选英雄：保留，新选手接手
 d.ls=rosterLineup(S);d.swap=false;
 save();toast(p.name+' 替补登场（'+POS[p.pos][0]+'）');
 renderBP();
}
function bpConfirm(){
 const d=window._draft;if(!d){toast('未找到BP状态');return;}
 if(d.stage!=='done')bpSuggest();
 const sels={...d.myPicks};
 if(POS_ORDER.some(pos=>!sels[pos])){toast('还有位置没选英雄');return;}
 const sr=d.sr;
 if(sr){sr.myBans=(d.myBans||[]).slice(0,4);sr.oppBans=(d.oppBans||[]).slice(0,4);sr.oppPicks={...d.oppPicks};}
 applyBp(sels);
 save();closeModal('app-modal');
 window._draft=null;
 if(d.onConfirm)d.onConfirm();
}

/* ================= BP 台 UI（赛事转播观感） ================= */
function bpSlot(cls,txt,sub){return `<div class="bp-slot ${cls}">${(cls.includes('filled')&&txt&&txt!=='—'&&txt!=='？？？')?heroIcon(txt,19):''}<b>${txt||'&nbsp;'}</b><small>${sub||'&nbsp;'}</small></div>`;}
function bpSideColumn(d,mine){
 const sr=d.sr;
 const myBlue=(sr.side!=='red');
 const isBlue=mine?myBlue:!myBlue;
 const name=mine?(S.teamName):(sr.opName);
 const bans=mine?d.myBans:d.oppBans;
 const picks=d.oppPicks;
 const order=mine?POS_ORDER:['top','jg','mid','ad','sup'];
 let pickSlots='';
 if(d.isPeak&&mine){
 pickSlots=order.map(pos=>bpSlot('pick'+(d.myPicks[pos]?' filled':''),d.myPicks[pos]||'',POS[pos][0])).join('');
 }else if(d.isPeak){
 pickSlots=order.map(()=>bpSlot('pick blind','？？？','盲选')).join('');
 }else{
 pickSlots=order.map(pos=>{
 const p=(mine?d.ls:d.oppRoster||[]).find(x=>x.pos===pos&&(mine||x.injury<=0)); // 对方位显示健康选手（青训递补）
 const hero=mine?d.myPicks[pos]:picks[pos];
 return bpSlot('pick'+(hero?' filled':''),hero||'',(p?p.name:POS[pos][0]));
 }).join('');
 }
 const banSlots=[0,1,2,3].map(i=>bpSlot('ban'+(bans[i]?' filled red':''),d.isPeak?'—':(bans[i]||''),'BAN')).join('');
 return `<div class="bp-col ${isBlue?'blue':'red'}">
 <div class="bp-col-hd"><span class="side-dot"></span>${name}<small>${isBlue?'蓝方':'红方'}</small></div>
 <div class="bp-bans">${banSlots}</div>
 <div class="bp-picks">${pickSlots}</div>
 </div>`;
}
function phaseLabel(d){
 if(d.isPeak)return '巅峰对决 · 盲选（无BAN · 不受全局BP限制）';
 if(d.idx<4)return '第一轮 BAN';
 if(d.idx<10)return '第一轮 PICK';
 if(d.idx<14)return '第二轮 BAN';
 if(d.idx<18)return '第二轮 PICK';
 return 'BP 完成';
}
function renderBP(){
 const d=window._draft;
 if(!d){toast('BP状态丢失');return;}
 const act=draftAction(d);
 const sr=d.sr;
 const sideTxt=(sr&&sr.side==='red')?'我方红方 · 第二轮后手 counter':'我方蓝方 · 第一轮先ban先选';
 let board;
 if(d.isPeak){
 board=`<div class="bp-board"><div class="bp-center"><div class="bp-phase">盲选模式 · 双方互相不可见 · 英雄池全解锁</div></div>
 <div style="display:flex;gap:8px;justify-content:center">${bpSideColumn(d,true)}</div></div>`;
 }else{
 board=`<div class="bp-board">
 ${bpSideColumn(d,true)}
 <div class="bp-center"><div class="bp-phase">${phaseLabel(d)}</div>
 <div class="bp-stepnum">${Math.min(d.idx+1,18)} / ${d.isPeak?5:18} 手</div><div class="bp-stepbar"><i style="width:${Math.min(100,Math.round((d.idx)/(d.isPeak?5:18)*100))}%"></i></div>
 ${(d.used.length||d.usedOpp.length)?`<div class="bp-used" style="cursor:help" title="我方已用：${d.used.join('、')||'无'}
对方已用：${d.usedOpp.join('、')||'无'}">全局BP已用 · 我方 ${d.used.length} 个 ｜ 对方 ${d.usedOpp.length} 个 · 悬停看明细</div>`:''}
 </div>
 ${bpSideColumn(d,false)}
 </div>`;
 }
 board=`<div class="hint" style="text-align:center;margin-bottom:8px">${d.title||''}　·　${d.isPeak?'盲选':sideTxt}</div>`+board;
 // 实时结算：BP 每一步对有效战力/胜率的影响
 const v=bpEffPreview(d);
 const wr=Math.round(winChance(v.my,v.op)*100);
 const est=!d.isPeak&&(Object.keys(d.myPicks).length<5||Object.keys(d.oppPicks).length<5);
 const verdict=`<div style="display:flex;gap:8px;margin:10px 0 0;align-items:stretch">
 <div style="flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center">
 <div style="font-size:11px;color:var(--dim)">我方有效战力</div>
 <div style="font-size:18px;font-weight:800;color:var(--cyan)">${v.my}</div></div>
 <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:92px">
 <div style="font-size:11px;color:var(--dim)">预测胜率</div>
 <div style="font-size:17px;font-weight:800;color:${wr>=55?'var(--green)':wr>=45?'var(--gold)':'var(--red)'}">${wr}%</div>
 <div style="font-size:10px;color:var(--dim)">BP 结算${est?'·含预估':''}</div></div>
 <div style="flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center">
 <div style="font-size:11px;color:var(--dim)">${sr.opName} 有效战力</div>
 <div style="font-size:18px;font-weight:800;color:var(--red)">${v.op}</div></div>
 </div>
 ${v.notes.length?`<div class="hint" style="font-size:11px;margin-top:4px;text-align:center"> ${v.notes.join('　')}</div>`:''}`;
 // 操作区
 let action='';
 if(d.swap){
 const bn=rosterBench(S);
 action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">换替补：点击替补换下同位置首发（BP 进度保留，已选英雄由新选手接手）</div>
 ${POS_ORDER.map(pos=>{
 const cur=d.ls.find(x=>x.pos===pos);
 const cands=bn.filter(x=>x.pos===pos&&x.injury<=0); // 伤员不可登场
 return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap">
 <span class="tag" style="min-width:58px;text-align:center">${POS[pos][1]} ${cur?cur.name:'空缺'}</span>
 ${cands.length?cands.map(p=>`<button class="btn sm" onclick="bpSwapIn('${p.id}')">${p.name} · 战力${playerPower(p)}</button>`).join(''):'<span class="dim" style="font-size:11px">该位置无替补</span>'}
 </div>`;
 }).join('')}
 <div class="center mt8"><button class="btn" onclick="bpBackFromSwap()">← 返回 BP</button></div>`;
 }else if(act.type==='ban'){
 const avail=banCandidates(d);
 const bestBan=bestBanFor(d);
 action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">轮到我方 BAN · 第 ${d.myBans.length+1}/4 个（BAN 对方池内英雄每个 -2% 战力 · 为推荐 · 别浪费在对方已用的英雄上）</div>
 <div class="bp-hero-grid">${avail.map(h=>{
 const th=threatOf(d,h,'opp');
 const oppUsed=(d.usedOpp||[]).includes(h);
 const real=!oppUsed&&(d.oppRoster||[]).some(p=>(p.heroPool||[]).some(x=>x.n===h));
 return `<button class="bp-hero ${h===bestBan?'rec':''}" ${oppUsed?'style="opacity:.4"':''} onclick="bpBanPick('${h}')">${h===bestBan?' ':''}${heroIcon(h,16)} ${h}<small>${oppUsed?'对方已用 · 本局选不了':(real?('对方威胁 '+(th==null?'—':Math.round(th))):('池外 · 仅-0.5%'))}</small></button>`;
 }).join('')}</div>`;
 }else if(act.type==='pick'){
 const open=myOpenPositions(d);
 if(!d.curPos){
 action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">轮到我方 PICK · 第 ${Object.keys(d.myPicks).length+1}/5 人：先点选要选人的位置</div>
 <div class="bp-hero-grid">${open.map(pos=>`<button class="bp-hero pos" onclick="bpChoosePos('${pos}')">${POS[pos][1]} ${POS[pos][0]}<small>${(d.ls.find(x=>x.pos===pos)||{}).name||''}</small></button>`).join('')}</div>`;
 }else{
 const pos=d.curPos,p=(d.ls||[]).find(x=>x.pos===pos);
 const avail=myCandidates(d,pos),best=bestHeroFor(d,pos,avail);
 if(!avail.length){
 action=`<div class="hint" style="color:var(--red);margin:10px 0">${p?p.name:''} 的英雄池已被禁完/用完！<button class="btn sm danger" onclick="bpOpenSwap()">换替补登场</button></div>`;
 }else{
 action=`<div class="hint" style="margin:10px 0 6px;color:var(--cyan)">为 <b>${POS[pos][1]} ${p?p.name:''}</b> 选英雄（推荐已标 · <button class="btn sm" style="display:inline;padding:1px 8px" onclick="bpBackToPos()">← 重选位置</button>）</div>
 <div class="bp-hero-grid">${avail.map(h=>{
 const hd=heroOf(h.n),lv=HERO_LV[h.lv],rec=best===h.n;
 return `<button class="bp-hero ${rec?'rec':''}" onclick="bpPickHero('${h.n}')">${rec?' ':''}${heroIcon(h.n,16)} ${h.n}${hd&&hd.hot?'':''}<small>${lv.n}${lv.b>0?'+'+Math.round(lv.b*100)+'%':lv.b<0?Math.round(lv.b*100)+'%':''} · ${TYPE_NAME[hd?hd.t:'team']}</small></button>`;
 }).join('')}</div>`;
 }
 }
 }else{
 action=`<div class="hint" style="margin:10px 0;text-align:center;color:var(--green)">BP 完成，可以确定出战</div>`;
 }
 const html=`<h2>${d.isPeak?'巅峰对决 · 盲选':'BP · 两段式征召'} <span class="tag">${d.isPeak?'第7局':'全局BP · 绝活+8%'}</span></h2>
 ${board}${verdict}${action}
 <div class="center mt16" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
 <button class="btn" onclick="closeModal('app-modal')">取消</button>
 <button class="btn" onclick="bpOpenSwap()">换替补</button>
 <button class="btn" onclick="bpSuggest()">一键推荐</button>
 <button class="btn" onclick="bpAuto()">自动本局</button>
 <button class="btn" onclick="bpAutoAll()">本系列赛自动</button>
 <button class="btn primary" onclick="bpConfirm()" ${act.type!=='done'?'disabled':''}>确定出战</button>
 </div>`;
 $('#app-modal-body').innerHTML=html;
 $('#app-modal').classList.add('wide');
 $('#app-modal').classList.add('on');
}

/* ================= 比赛流程（KPL 赛制：常规赛 BO5 / 季后赛 BO7 全局BP） ================= */
function singleGame(my,op){
 const w=Math.random()<winChance(my,op);
 return {w,myK:rnd(6,13),opK:rnd(6,13)};
}
/* 每局表现结算：为全体首发生成 KDA，滚动更新身价（均衡值=100×平均表现），并选出 MVP
 perf≈1 为平：EMA 每局向 100×近期表现收敛，区间 70~150；MVP 额外 +3 */
function gamePerform(winner){
 const ls=rosterLineup(S);
 if(!ls.length)return null;
 let best=null,bs=-1;
 ls.forEach(p=>{
 const pw=playerPower(p,pickedHero(S,p));
 const k=rnd(1,12),d=rnd(0,6),a=rnd(0,12);
 p._lk=k;p._ld=d;p._la=a; // 本局个人数据（选手生涯·「我的表现」汇总用）
 const score=k*3+a*2-d*1.5+(winner?6:2)+pw*0.5+rnd(0,3);
 const perf=(k*3+a*2-d*1.5)/25+(winner?0.35:-0.15);
 p.val=clamp(Math.round((p.val||100)*0.92+perf*8),70,150);
 p.kTotal=(p.kTotal||0)+k;p.dTotal=(p.dTotal||0)+d;p.aTotal=(p.aTotal||0)+a; // 赛季累计（场均展示用）
 if(score>bs){bs=score;best={id:p.id,name:p.name,k,d,a};}
 });
 return best;
}

 const rival=s.players.filter(p=>p.pos===me.pos&&p.id!==me.id&&p.injury<=0)
 .sort((a,b)=>playerPower(b)-playerPower(a))[0];
 const li=s.lineup.indexOf(me.id);
 if(!rival){if(li<0)s.lineup.push(me.id);return;}
 const myPow=playerPower(me,(s.pick&&s.pick[me.pos])||me.sig);
 const rivPow=playerPower(rival,rival.sig);
 if(myPow>=rivPow){
 if(li<0){const ri=s.lineup.indexOf(rival.id);if(ri>=0)s.lineup[ri]=me.id;else s.lineup.push(me.id);}
 }else if(li>=0)s.lineup[li]=rival.id;
}
function playerAutoSeries(s,opName,bo){ // 自动打完整场系列赛，返回 series 形状对象（finishSeries 可直接消费）

 const sr={used:[],usedOpp:[],mw:0,ow:0,max:bo,logs:[],myName:s.teamName,opName,side:firstSide(s,'regular',opName)};
 const need=Math.ceil(bo/2);
 let guard=0,myApps=0,myK=0,myD=0,myA=0,myMvp=0;
 while(sr.mw<need&&sr.ow<need&&guard++<bo+2){
 const my=teamPower(s),op=powerOf(s,opName);
 const g=singleGame(my,op);
 rosterLineup(s).forEach(p=>{p.energy=clamp(p.energy-8,0,ENERGY_MAX);p.caps=(p.caps||0)+1;});
 if(g.w)sr.mw++;else sr.ow++;
 const mvp=gamePerform(g.w);
 if(mvp){const mp=s.players.find(x=>x.id===mvp.id);if(mp){mp.mvp=(mp.mvp||0)+1;mp.popularity=Math.min(99,(mp.popularity||0)+2);mp.val=clamp((mp.val||100)+3,70,150);}}
 if(mvp){sr.mvpIds=(sr.mvpIds||[]).concat(mvp.id);sr.mvpKda=(sr.mvpKda||[]).concat(mvp.k+'/'+mvp.d+'/'+mvp.a);}
 const me=myPlayer(s);
 const meIn=me&&rosterLineup(s).some(p=>p.id===me.id);
 if(meIn){myApps++;myK+=me._lk||0;myD+=me._ld||0;myA+=me._la||0;if(mvp&&mvp.id===me.id)myMvp++;}
 sr.logs.push('第'+(sr.mw+sr.ow)+'局  我方 '+g.myK+'-'+g.opK+' '+(g.w?'击败':'憾负')+' '+opName+' ｜ 总比分 '+sr.mw+':'+sr.ow+(mvp?' ｜ MVP：'+mvp.name+'（'+mvp.k+'/'+mvp.d+'/'+mvp.a+'）':''));
 sr.logs.push(...genMatchStory(sr,g,mvp));
 }
 if(myApps)sr.logs.push(' 本场你的数据：出战 '+myApps+' 局 · 合计 '+myK+'/'+myD+'/'+myA+(myMvp?' · 拿下 '+myMvp+' 次单局MVP':'（尚无单局MVP）'));
 return sr;
}

function playGame(){
 const sr=S.series;
 // 有效战力结算：BAN/选人质量/红蓝 counter 全部折算进胜负（详见 bpEffective）
 const isLastPeak=sr.max>=7&&sr.mw+sr.ow===sr.max-1; // 巅峰对决：无 BP，不吃任何修正（BO7 第7局 / BO9 第9局）

 const g=singleGame(v.my,v.op);
 // 每小局双方消耗体力（8/局）：系列赛越深越考验轮换——替补体力满员是翻盘资本
 const opR=ensureAiRosters(S,sr.opName)||[];
 rosterLineup(S).forEach(p=>{p.energy=clamp(p.energy-8,0,ENERGY_MAX);p.caps=(p.caps||0)+1;}); // caps：出场记录（转售保护期解锁用）
 opR.forEach(p=>p.energy=clamp(p.energy-8,0,ENERGY_MAX));
 if(g.w)sr.mw++;else sr.ow++;
 const isPeak=sr.max>=7&&sr.mw+sr.ow===sr.max-1;
 const tag=isPeak?' 巅峰对决（盲选）':'';
 const mvp=gamePerform(g.w);
 if(mvp){const mp=S.players.find(x=>x.id===mvp.id);if(mp){mp.mvp=(mp.mvp||0)+1;mp.popularity=Math.min(99,(mp.popularity||0)+2);mp.val=clamp((mp.val||100)+3,70,150);}} // MVP：人气+2、身价+3
 if(mvp)sr.mvpIds=(sr.mvpIds||[]).concat(mvp.id); // 系列赛各局 MVP 记录（FMVP 评选用）
 if(mvp)sr.mvpKda=(sr.mvpKda||[]).concat(mvp.k+'/'+mvp.d+'/'+mvp.a); // 各局 MVP 的 KDA（AI 战报语境用）
 sr.logs.push('第'+(sr.mw+sr.ow)+'局 '+(g.w?'':'')+' 我方 '+g.myK+'-'+g.opK+' '+(g.w?'击败':'憾负')+' '+sr.opName+' ｜ 总比分 '+sr.mw+':'+sr.ow+tag+' '+(sr.side==='red'?'红方':'蓝方')+' '+pick(CASTER)+(mvp?' ｜ MVP：'+mvp.name+'（'+mvp.k+'/'+mvp.d+'/'+mvp.a+'）':''));
 // 文字直播（事件模板池 × 数据驱动语境：MVP KDA/英雄/战术/比分背景全部织进句子）

 const need=Math.ceil(sr.max/2);
 if(sr.mw>=need||sr.ow>=need){
 finishSeries(sr.mw>=need);
 }else{
 // 进入下一局：败方选边（KPL 规则：第2-6局败方选边；第7局巅峰对决由第6局败方选边）
 const nextTitle=(sr.stage==='card'?'卡位赛':sr.stage==='po'?(sr.poSlot==='总决赛'?'总决赛':'季后赛'):PHASE_NAME[S.phase])+' · 第'+(sr.mw+sr.ow+1)+'局（当前 '+sr.mw+':'+sr.ow+'）';
 if(S.seriesAuto){

 }else if(!g.w){
 // 玩家本局落败 → 玩家拥有选边权
 showSideChoice(nextTitle);
 }else{
 // AI 落败 → AI 自动选边

 }
 }

/* ================= AI 赛后战报（可选增强 · 默认关闭 · 失败静默回退） =================
 与「纯单机」承诺的边界：默认关闭、零请求；开启后每场系列赛结束向用户自填的
 OpenAI 兼容端点发一次请求。设置存 localStorage（AI_SET_KEY），不进存档对象——
 导出存档/代码分享不会带走 key。任何失败（断网/超时/HTTP错误/CORS/无fetch环境）
 都静默回退本地文案；比赛引擎与门禁测试完全不依赖本模块。 */
const AI_SET_KEY='km_ai_set';
function aiSettings(){
 try{return JSON.parse(localStorage.getItem(AI_SET_KEY))||{};}catch(e){return {};}
}
function aiEnabled(){const s=aiSettings();return !!(s.on&&s.base);}
function toggleAiReport(){
 const st=aiSettings();st.on=!st.on;
 try{localStorage.setItem(AI_SET_KEY,JSON.stringify(st));}catch(e){}
 save();renderAll();
 toast(st.on?' AI 战报已开启：每场赛后联网生成一次（经营页可配置端点）':' AI 战报已关闭：恢复纯单机模式');
}
function aiSaveForm(){
 const st=aiSettings();
 st.base=(document.getElementById('ai-base')||{value:''}).value.trim();
 st.model=(document.getElementById('ai-model')||{value:''}).value.trim();
 st.key=(document.getElementById('ai-key')||{value:''}).value.trim();
 try{localStorage.setItem(AI_SET_KEY,JSON.stringify(st));}catch(e){}
 toast('AI 战报端点已保存（仅存本机，不随存档导出）');
}
async function aiFillReport(r){
 let timer=null;
 try{
 if(typeof fetch!=='function')throw new Error('环境不支持 fetch');
 const st=aiSettings();
 const h=(S.history||[])[0];
 const prompt='你是KPL王者荣耀职业联赛的赛事文案作者。请根据以下比赛数据写一段120字以内的中文赛后战报，专业但带情绪，直接输出正文，不要标题、不要列表：\n'
 +'比赛：'+(r.stageTxt||'')+'，'+S.teamName+' vs '+r.opName+'，比分 '+r.score+'（我方'+(r.win?'胜':'负')+'）\n'
 +'我方首发：'+rosterLineup(S).map(p=>p.name+'（'+((S.pick&&S.pick[p.pos])||p.sig||'')+'）').join('、')+'\n'
 +((r.mvps||[]).length?'各局MVP：'+r.mvps.join('、')+'\n':'')
 +'直播要点：'+(r.logs||[]).slice(0,10).join(' / ');
 const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
 if(ctrl)timer=setTimeout(()=>ctrl.abort(),25000);
 const res=await fetch(st.base,{method:'POST',signal:ctrl?ctrl.signal:undefined,
 headers:Object.assign({'Content-Type':'application/json'},st.key?{Authorization:'Bearer '+st.key}:{}),
 body:JSON.stringify({model:st.model||'gpt-4o-mini',messages:[{role:'user',content:prompt}],temperature:0.9})});
 if(timer){clearTimeout(timer);timer=null;}
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 const txt=String((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim();
 if(!txt)throw new Error('空响应');
 if(h){h.aiReport=txt;save();} // 存入复盘记录：重放可见，之后离线也能看
 const box=document.getElementById('ai-report-box'); // 弹窗可能已被下一场替换，找不到就丢弃
 if(box)box.innerHTML='<div class="et">AI 战报</div><p>'+_escTxt(txt)+'</p>';
 }catch(e){
 if(timer)clearTimeout(timer);
 const box=document.getElementById('ai-report-box');
 if(box)box.innerHTML='<div class="hint">AI 战报生成失败（'+_escTxt(String(e&&e.message||e)).slice(0,80)+'）——本场沿用本地文案</div>';
 }
}

/* ================= 董事会终局的 UI 层守卫 =================
 下课是"软终局"：只在 UI 入口拦截，不改进程内部逻辑——平衡门禁（sim/sim-quick/fuzz）
 直接调用 nextDay/startMatch/startCup，若在那里硬守卫，门禁就再也测不出真实数值了。 */
function boardLocked(){return !!(S&&S.board&&S.board.fired);}
function uiGuard(msg){if(boardLocked()){try{toast(msg||'你已被董事会解约，执教生涯结束');}catch(_){}return true;}return false;}
function playerRetired(s){return !!(s&&s.mode==='player'&&s.career&&s.career.retired);}
function uiNextDay(s){if(uiGuard())return;if(playerRetired(s)){toast('职业生涯已退役——「生涯」页查看履历，或重新开始');return;}nextDay(s);}
function uiStartMatch(){if(uiGuard())return;if(playerRetired(S)){toast('职业生涯已退役');return;}startMatch();}
function uiStartCup(s){if(uiGuard())return;startCup(s);}
function uiSkipTransfer(s){if(uiGuard())return;skipTransferWindow(s);}
function uiEndPreseason(s){if(uiGuard())return;endPreseason(s);}
function uiAdvanceCalendar(s){if(uiGuard())return;advanceCalendar(s);}
function uiAsiadStep(s){if(uiGuard())return;asiadStep(s);}

function swapPlayer(pid){
 const p=S.players.find(x=>x.id===pid);
 const inLineup=S.lineup.includes(pid);
 if(!inLineup&&p.kjia>0){toast(p.name+' 正在 K甲锻炼（剩余 '+p.kjia+' 天），暂不能进入首发');return;}
 if(!inLineup&&p.injury>0){toast(p.name+' 伤停中（还剩'+p.injury+'天），不能进入首发');return;}
 if(!inLineup&&typeof natCamping==='function'&&natCamping(S,p)){toast(p.name+' 正在国家队集训（缺席整个夏季赛），不能进入首发');return;}
 if(inLineup){
 // 有同位置替补则对位换人；没有也允许直接下场（位置空缺）——否则满员时卖不掉、工资帽腾不出，买不了新人的死锁
 const bn=rosterBench(S).filter(x=>x.pos===p.pos&&x.injury<=0); // 伤员不可顶替上场
 if(bn.length){
 S.lineup[S.lineup.indexOf(pid)]=bn[0].id;
 toast(`${p.name} 换下，${bn[0].name} 上场`);
 }else{
 S.lineup.splice(S.lineup.indexOf(pid),1);
 toast(`${p.name} 已下场（${POS[p.pos][0]}空缺）——可出售/挂牌后补人，开赛前该位置必须有人`);
 }
 }else{
 const cur=rosterLineup(S).find(x=>x.pos===p.pos);
 if(cur){S.lineup[S.lineup.indexOf(cur.id)]=pid;toast(`${cur.name} 换下，${p.name} 上场`);}
 else{S.lineup.push(pid);toast(`${p.name} 加入首发`);}
 }
 if(S.pick)delete S.pick[p.pos]; // 换人后该位置英雄需重新 BP
 save();renderAll();
}

/* ================= 可排序数据表（点表头排序，再点反向） =================
 纯 DOM 排序：页面重渲染后排序状态自然重置，无额外状态要维护。
 单元格取 textContent 参与比较：纯数字/带万/亿单位/百分比自动按数值，其余按字符串。 */
function thSortVal(txt){
 const t=String(txt).replace(/[^0-9.万亿千%-]/g,'');
 let n=parseFloat(t);
 if(isNaN(n))return String(txt).trim();
 if(/万亿|千万/.test(t))n*=10000;else if(/亿/.test(t))n*=100000000;else if(/万/.test(t))n*=10000;
 else if(/千/.test(t))n*=1000;
 return n;
}
document.addEventListener('click',e=>{
 const th=e.target&&e.target.closest&&e.target.closest('table.tbl th');
 if(th&&th.parentNode.rowIndex===0)thSort(th); // 只响应首行表头
});
function thSort(th){
 const table=th.closest('table');
 if(!table)return;
 const dir=th.dataset.dir==='asc'?'desc':'asc';
 table.querySelectorAll('th[data-dir]').forEach(x=>{if(x!==th)x.dataset.dir='';});
 th.dataset.dir=dir;
 const headRow=th.parentNode;
 const rows=[].slice.call(table.rows).filter(r=>r!==headRow);
 const idx=[].slice.call(headRow.cells).indexOf(th);
 rows.sort((a,b)=>{
 const va=thSortVal(a.cells[idx]?a.cells[idx].textContent:'');
 const vb=thSortVal(b.cells[idx]?b.cells[idx].textContent:'');
 const cmp=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'zh');
 return dir==='asc'?cmp:-cmp;
 });
 const body=rows[0]&&rows[0].parentNode;
 if(body)rows.forEach(r=>body.appendChild(r)); // appendChild 移动已有节点即完成重排
 toast('已按「'+th.textContent.trim()+'」'+(dir==='asc'?'升序':'降序'));
}

 if(!f)return;

 try{
 const d=JSON.parse(rd.result);
 applyImport(d,'文件「'+f.name+'」');

 if(d.v&&d.v>SAVE_VERSION){toast('导入失败：存档版本（v'+d.v+'）比当前游戏更新，请先更新游戏');return;}

/* 战术板：切换系列赛倾向（改四维权重，强弱项随阵容取舍），克制关系在比赛模拟处结算 */
function setTactic(id){

 S.tactic=t.id;
 S.tacticW=t.w;
 logEvent(S,' 战术板：切换为「'+t.name+'」——'+t.desc+(t.beats?'（克制「'+tacticById(t.beats).name+'」）':''));

/* 队长任命：队长在首发阵中生效（全队战力 +2%），任命时全队士气提升；离队自动摘除（更衣室年检） */
function setCaptain(id){
 const p=(S.players||[]).find(x=>x.id===id);
 if(!p){toast('选手不在阵中');return;}
 if(S.captain===id){S.captain=null;logEvent(S,' 摘除队长袖标：'+p.name);}
 else{
 S.captain=id;
 (S.players||[]).forEach(x=>x.morale=clamp(x.morale+(x.id===id?5:3),20,100));
 logEvent(S,' 任命 '+p.name+' 为队长：全队士气提升，队长在阵时全队战力 +2%');
 }
 save();renderAll();
}
function upgradeSponsor(){
 const next=SPONSORS[S.sponsorLv+1];
 if(!next)return;
 if(S.fund<next.cost){toast('资金不足（需 '+next.cost+'万）');return;}
 const fans=Math.round(S.fans||0);
 if((next.fans||0)>fans){toast('粉丝不足：「'+next.name+'」要求 '+(next.fans||0)+' 万粉丝（当前 '+fans+' 万）——成绩与人气才能换来关注');return;}
 S.fund-=next.cost;S.sponsorLv++;
 logEvent(S,` 签约新赞助商「${next.name}」，每日收入 ${next.income}万（粉丝 ${fans} 万）`);
 save();renderAll();toast(`赞助商升级成功！`);
}
/* 教练生涯：回应豪门邀约（接受=换队执教重建班底，婉拒=留任加信任） */
function respondCoachOffer(accept){
 if(!S||!S.coachOffer)return;
 const o=S.coachOffer;
 const d=S.coachDeal=S.coachDeal||{years:0,honors:[],log:[]};
 if(accept){
 const tmpl=CLUB_TEMPLATES.find(c=>c.name===o.team);
 if(!tmpl){S.coachOffer=null;return;}
 d.log.unshift({year:gameYear(S),note:'离任 '+S.teamName+'，转投 '+tmpl.name});
 d.log=d.log.slice(0,8);
 S.teamName=tmpl.name;S.icon=tmpl.icon;
 S.fund=tmpl.budget;S.wageCap=tmpl.cap;
 S.players=[];
 tmpl.players.forEach(pid=>{const def=PLAYER_POOL.find(x=>x.id===pid);if(def)S.players.push(genPlayer(def));});
 const byPos={};
 S.players.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
 const lineup=[];
 POS_ORDER.forEach(pos=>{const cand=byPos[pos];if(cand&&cand.length){cand.sort((a,b)=>playerPower(b)-playerPower(a));lineup.push(cand[0].id);}});
 S.lineup=lineup;
 S.coach={...COACH_POOL.find(c=>c.id===tmpl.coach)};
 S.seedPower=teamPower(S)||tmpl.seed;
 S.board.trust=clamp((S.board?S.board.trust:60)+10,0,100); // 新东家信任重置偏高
 S.board.warn=0;
 logEvent(S,' 你接受 '+tmpl.name+' 的邀约：新班底战力 '+fmt(teamPower(S))+'——用成绩证明他们的选择');
 }else{
 d.log.unshift({year:gameYear(S),note:'婉拒 '+o.team+' 邀约，留任 '+S.teamName});
 d.log=d.log.slice(0,8);
 S.board.trust=clamp((S.board?S.board.trust:60)+3,0,100);
 logEvent(S,' 你婉拒了 '+o.team+' 的邀约，留任 '+S.teamName+'（管理层信任 +3）');
 }
 S.coachOffer=null;
 save();renderAll();
}

/* 开局剧本（难度档）：选中态只影响开局初始值，见 data.js SCENARIOS */
function pickScenario(id){
 _scenario=scenarioById(id).id;
 SCENARIOS.forEach(s=>{
  const b=document.getElementById('sc-btn-'+s.id);
  if(b)b.className='btn sm'+(s.id===_scenario?' primary':'');
 });
 const d=$('#sc-desc');
 if(d)d.textContent=scenarioById(_scenario).desc;
}
/* 把当前选中的剧本应用到刚建好的档（资金/工资帽/阵容/属性），并写入日志与成就判定依据 */
function applyScenario(s){
 s.scenario=_scenario||'normal';
 const sc=scenarioById(s.scenario);
 const dropped=sc.apply(s)||null;
 logEvent(s,'开局剧本「'+sc.name+'」：'+sc.desc+(dropped?'（离开的是 '+dropped.name+'）':''));
 return sc;
}

function createTeam(){
 // 自建队只开现役联盟：用户可能浏览过「历代联盟」标签（联盟被装成时代数据），必须先还原
 installEra(null);_eraSel=null;
 const name=$('#new-team-name').value.trim()||'无名战队';
 const b=_crBrandFor(name);
 if(!b.txt)b.txt=shortMark(name)||'队';
 S=newState(name,(b.txt||'队').slice(0,1));
 S.crest={sh:b.sh,c1:b.c1,c2:b.c2,c3:b.c3,txt:b.txt};
 S.selfBuilt=true; // 自建俱乐部开局（成就「白手起家」条件；执教原版不触发）
 // 直签开局：使用独立的自由球员池（与 18 队注册名单不重叠，保证全联盟一人一队）
 shuffle(ACADEMY_NAMES); // 打乱池序：开档阵容名字每次不同（池序决定 find 命中，否则恒为 弈秋/观澜/听松/照夜/惊蛰）
 const usedNames=new Set();
 POS_ORDER.forEach((pos,i)=>{
 const band=i===0?'star':'mid'; // 保底一名 90+ 王牌，其余主力级（档位决定四维基准）
 S.players.push(genPlayer(genFreeAgentDef(pos,band,usedNames)));
 });
 // 仍不足5人则按空缺位置强制补签
 while(POS_ORDER.some(pos=>!S.players.some(p=>p.pos===pos))){
 const miss=POS_ORDER.find(pos=>!S.players.some(p=>p.pos===pos));
 const cand=PLAYER_POOL.filter(p=>p.pos===miss&&!S.players.some(x=>x.id===p.id));
 if(cand.length)S.players.push(genPlayer(pick(cand)));
 else break;
 }
 // 按位置安排首发（每位置1人，多出的进替补，缺的留空）
 const byPos={};
 S.players.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
 const lineup=[];
 POS_ORDER.forEach(pos=>{
 const cand=byPos[pos];
 if(cand&&cand.length){
 cand.sort((a,b)=>playerPower(b)-playerPower(a));
 lineup.push(cand[0].id);
 }
 });
 S.lineup=lineup;
 applyScenario(S); // 开局剧本：可能削属性/砍工资帽/挖走主力——必须在 seedPower 与 initGroups 之前
 // 新手教练：青训助教
 S.coach={...COACH_POOL.find(c=>c.id==='co12')};
 S.seedPower=teamPower(S)||280; // 种子=开局真实战力（决定分组落位）
 initGroups(S); // KPL 2025 官方赛制：18队 S/A/B 分组
 // 赛前转会期：先组队再开赛
 S.preseason=true;S.transferWindow=7;
 setBoardKpi(S); // 首年董事会目标：按分组档位定（S组→前4 / A组→前8 / B组→前12）
 initFans(S); // 开档粉丝：由阵容人气决定起步规模（影响赞助单价/门票/代言与升级门槛）
 buildTransferMarket(S);refreshMarket(S);
 logEvent(S,`战队 ${name} 成立！初始资金8000万，目标：KPL 总冠军！`);
 logEvent(S,' 开局直签 5 名选手 + 青训助教，赛前转会期 7 天可自由调整阵容');
 logEvent(S,' 赛前转会期开启（7天）：买断/直签/挂牌自由组队，市场刷新免费；结束转会期后联赛开打');
 logEvent(S,' KPL 2025 赛制：第一轮3组单循环 → S/A/B → 卡位赛 → 第三轮 → 10强双败季后赛');
 $('#start-modal').classList.remove('on');
 goPage('market');
 toast(' 赛前转会期开启（7天）：先组队，再开赛');
 save();
}

 if(S.era)logEvent(S,' 历代联盟 '+KPL_ERAS[S.era].name+'：联盟成员与阵容回到当年（明星按史实，部分席位演绎）；赛制沿用现行年度赛历');
 else logEvent(S,' KPL 2025 赛制：第一轮3组单循环 → S/A/B → 卡位赛 → 第三轮 → 10强双败季后赛');
 $('#start-modal').classList.remove('on');
 goPage('market');

 save();

/* ================= 音效系统（WebAudio 合成短音，无资源文件；音量极小不打扰） ================= */
let _ac=null,_sfxOn=true;
try{_sfxOn=localStorage.getItem('km_sfx')!=='0';}catch(_){}
function sfx(freq,dur,type,vol){
 if(!_sfxOn)return;
 try{
 _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
 if(_ac.state==='suspended')_ac.resume();
 const o=_ac.createOscillator(),g=_ac.createGain();
 o.type=type||'sine';o.frequency.value=freq;
 const t=_ac.currentTime;
 g.gain.setValueAtTime(vol||0.04,t);
 g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
 o.connect(g);g.connect(_ac.destination);
 o.start(t);o.stop(t+(dur||0.12)+0.02);
 }catch(_){}
}
const SFX={
 click:()=>sfx(660,.05,'square',.022),
 win:()=>{sfx(523,.11);setTimeout(()=>sfx(784,.15),95);},
 lose:()=>sfx(311,.16,'triangle',.045),
 gold:()=>{sfx(880,.07);setTimeout(()=>sfx(1174,.09),70);},
};
function toggleSfx(){
 _sfxOn=!_sfxOn;
 try{localStorage.setItem('km_sfx',_sfxOn?'1':'0');}catch(_){}
 toast(_sfxOn?' 音效已开启':' 音效已关闭');
 renderHeader();
}

/* ================= 选手卡 3D 倾斜（仅指针设备；触屏与减弱动效自动跳过） ================= */
let _tilt=null;
document.addEventListener('mousemove',e=>{
 try{
 if(window.matchMedia&&(!window.matchMedia('(pointer:fine)').matches||window.matchMedia('(prefers-reduced-motion: reduce)').matches))return;
 const c=e.target&&e.target.closest?e.target.closest('.pcard'):null;
 if(c!==_tilt){if(_tilt){_tilt.style.transform='';_tilt.style.transition='';}_tilt=c;}
 if(!c)return;
 const r=c.getBoundingClientRect();
 if(!r.width)return;
 const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
 c.style.transition='transform 80ms linear';
 c.style.transform='perspective(680px) rotateX('+(-py*7).toFixed(2)+'deg) rotateY('+(px*7).toFixed(2)+'deg) translateY(-2px)';
 }catch(_){}
});
/* ================= 数字滚动动效（header 资金/战力平滑滚数，首次直接显示） ================= */
window.__numPrev={};
function tweenNum(el,key,to){
 const from=(key in window.__numPrev)?window.__numPrev[key]:to;
 window.__numPrev[key]=to;
 if(from===to||el.dataset.anim==='1'){el.textContent=fmt(to);return;}
 el.dataset.anim='1';
 const t0=performance.now(),dur=380;
 const step=now=>{
 const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3); // easeOutCubic
 el.textContent=fmt(Math.round(from+(to-from)*e));
 if(k<1)requestAnimationFrame(step);else{el.textContent=fmt(to);delete el.dataset.anim;}
 };
 requestAnimationFrame(step);
}
/* ================= 夺冠全屏庆典（总决赛/杯赛决赛赢下时一次性播放） =================
 深色覆盖层 + 队徽弹入 + 金色标题 + CSS 彩带；点按或 6 秒自动消失；减弱动效时直接跳过。 */
function playChampionCeremony(title){
 try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(_){}
 try{
 const ov=document.createElement('div');
 ov.id='champion-overlay';
 let confetti='';
 for(let i=0;i<26;i++){
 confetti+='<i style="left:'+rnd(2,98)+'%;animation-delay:'+(Math.random()*1.8).toFixed(2)+'s;background:'+(i%3===0?'#F2C41B':i%3===1?'#5c8af5':'#E8ECF4')+'"></i>';
 }
 ov.innerHTML='<div class="cc-inner"><div class="cc-cup">'+crest(S.icon,S.teamName,88)+'</div>'
 +'<div class="cc-title">'+_escTxt(title||'总冠军')+'</div>'
 +'<div class="cc-team">'+_escTxt(S.teamName)+' · 捧杯时刻</div>'
 +'<div class="cc-confetti">'+confetti+'</div></div>';
 document.body.appendChild(ov);
 ov.addEventListener('click',()=>{if(ov.parentNode)ov.parentNode.removeChild(ov);});
 setTimeout(()=>{if(ov.parentNode)ov.parentNode.removeChild(ov);},6000);
 }catch(_){}
}

/* ================= 启动 ================= */
/* 全局异常兜底：控制台可观测 + 用户侧提示（不白屏、不静默） */
window.__errLog=[]; // 最近 20 条异常（调试用，导出存档时随档带走也无妨）
/* PWA 离线可玩（借鉴开源浏览器游戏 Goooool.net 模式）：仅 https/localhost 注册 service worker；
 file:// 双击场景自动跳过，不影响单文件玩法 */
(function(){
 try{
 if(!('serviceWorker' in navigator))return;
 if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
 window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
 }catch(e){}
})();
function _reportErr(tag,msg){
 try{
 window.__errLog.push({t:Date.now(),tag,m:String(msg||'').slice(0,200)});
 window.__errLog=window.__errLog.slice(-20);
 console.error('['+tag+']',msg);
 if(S)try{logEvent(S,' 程序异常：'+String(msg||'').slice(0,80));}catch(_){}
 toast(' 出现异常：'+(String(msg||'未知错误').slice(0,60))+'（建议先导出存档）');
 }catch(_){}
}
window.addEventListener('error', e => _reportErr('全局异常', e.message||'未知错误'));
window.addEventListener('unhandledrejection', e => _reportErr('Promise拒绝', e.reason));
$$('nav button').forEach(b=>b.addEventListener('click',()=>goPage(b.dataset.page)));
if(load()&&S&&S.teamName){
 ensureSeason(S); // 旧档自动迁移到 KPL 2025 赛制
 applyModeNav();
 goPage(S.mode==='player'?'career':'club');
}else{
 initStart();
}
playIntro(); // 进场动画（仅首访播放）
