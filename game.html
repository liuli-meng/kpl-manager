const EWC_A=['Ra','Ze','Vi','Ka','Lo','Mi','Ne','Sa','Ti','Xa','Dy','Fe','Gu','Ha','Ji','Ky','Lu','Om','Pe','Qi','Ry','Su','Va','Wy','Ya','Zy','Da','Ki','Mo','Na','Or','Pa','Qu','Ri','Ta'];
const EWC_B=['nox','den','ki','ro','za','mir','to','lys','ven','tar','ric','sha','lin','vos','dra','kon','gar','nis','tur','lex','pine','mos','rei','tan','wick','ley','ska','nix','u','o','er','ing','on','us','ay'];
function ewcName(used){
 let g=0;
 while(g++<40){const n=pick(EWC_A)+pick(EWC_B);if(!used.has(n)){used.add(n);return n;}}
 for(const a of EWC_A)for(const b of EWC_B){const n=a+b;if(!used.has(n)){used.add(n);return n;}}
 for(const a of EWC_A)for(const b of EWC_B)for(const c of EWC_B){const n=a+b+c;if(!used.has(n)){used.add(n);return n;}}
 return 'EWC'+(used?used.size:0); // 理论不可达（1200+ 组合）
}
function genEwcDef(s,i,teamName){
 const used=new Set();
 (s.extraDefs||[]).forEach(d=>used.add(d.name));
 Object.values(s.aiRosterDefs||{}).forEach(arr=>arr.forEach(id=>{const d=defOf(s,id);if(d)used.add(d.name);}));
 (s.players||[]).forEach(p=>used.add(p.name));

 const rest=EWC_NAMES.filter(n=>!used.has(n));
 const name=rest.length?rest[rnd(0,rest.length-1)]:ewcName(used);
 used.add(name);
 const pos=POS_ORDER[i%5];
 const b=v=>clamp(v+rnd(-4,4),68,88);
 return {id:'ewc'+gameYear(s)+'_'+i,name,pos,team:teamName,tags:['国际'],
 base:[b(80),b(78),b(80),b(79)],skill:{n:'海外劲旅',t:pick(['lane','farm','team','mind']),d:'国际赛场淬炼的体系战力'},
 sig:pick(HEROES.filter(h=>h.pos[0]===pos)).n,career:gameYear(s)+' EWC 电竞世界杯海外参赛队选手。'};
}
function setupEWC(s){

 const p=s.playoff;
 const champ=p&&p.final&&p.final.r,runner=champ?(p.final.r===p.final.a?p.final.b:p.final.a):null;
 if(!champ){logEvent(s,' EWC 直邀名额待定：先完成联赛冠军结算');return;}
 const overs=shuffle(EWC_OVERSEAS.slice()).slice(0,6);

 s.ewcDefMap={};
 let ni=0;
 overs.forEach(tn=>{
 const ids=[];
 for(let k=0;k<5;k++){const def=genEwcDef(s,ni++,tn);(s.extraDefs=s.extraDefs||[]).push(def);ids.push(def.id);}
 s.ewcDefMap[tn]=ids;
 });
 const teams=shuffle([champ,runner,...overs]);
 s.ewc={teams,qf:[0,1,2,3].map(i=>({a:teams[i*2],b:teams[i*2+1],r:null})),
 sf:[{a:null,b:null,r:null},{a:null,b:null,r:null}],final:{a:null,b:null,r:null},champ:null};
 setPhase(s,'ewc',{who:'setupEWC',force:true});
 const myIn=teams.includes(s.teamName);
 logEvent(s,' '+gameYear(s)+' EWC 电竞世界杯（利雅得）开幕！'+champ+'（KPL直邀）与 '+runner+'（英雄亚冠ACL）代表 KPL 出战');
 if(myIn)logEvent(s,' 你队以「'+(champ===s.teamName?'KPL 春季赛冠军':'英雄亚冠 ACL')+'」身份直邀 8 强淘汰赛！');
 if(!myIn){simCup('ewc',s);return;} // 玩家未晋级：AI 自动补完（内部收尾进夏季赛）
 save();renderAll();
}
function ewcStep(s){
 const e=s.ewc;if(!e)return;
 for(let i=0;i<4;i++){const m=e.qf[i];if(!m.r){playCupMatch(s,m,'ewc_qf'+(i+1),'EWC·四分之一决赛',KPL.BO7);return;}}
 for(let i=0;i<2;i++){const m=e.sf[i];if(m.a===null)m.a=e.qf[i*2].r;if(m.b===null)m.b=e.qf[i*2+1].r;if(!m.r){playCupMatch(s,m,'ewc_sf'+(i+1),'EWC·半决赛',KPL.BO7);return;}}
 if(e.final.a===null)e.final.a=e.sf[0].r;
 if(e.final.b===null)e.final.b=e.sf[1].r;
 if(!e.final.r){playCupMatch(s,e.final,'ewc_final','EWC·总决赛',KPL.BO7);return;}
 finishEWC(s);
}
function finishEWC(s){
 const e=s.ewc;if(!e||!e.final.r||e.champ)return; // e.champ：防重复收尾（AI 补完与正常路径可能双入口）
 e.champ=e.final.r;
 const runner=loserOf(e.final);
 s.titleHistory=(s.titleHistory||[]).concat([{season:s.season,split:s.split,event:'EWC',champ:e.champ}]).slice(-48);
 logEvent(s,' EWC 总决赛落幕：'+e.champ+' 捧杯！'+(e.champ===s.teamName?'中国赛区的世界之巅！':''));
 let prize=0; // 奖金（美元折算，真实对齐 ÷6）：冠军60万$≈600 / 亚军30万$≈300 / 四强15万$≈150 / 八强9万$≈90
 if(e.champ===s.teamName)prize=600;
 else if(runner===s.teamName)prize=300;
 else if(e.sf.some(m=>m.r&&loserOf(m)===s.teamName))prize=150;
 else if(e.qf.some(m=>m.r&&loserOf(m)===s.teamName))prize=90;
 if(prize)grantPrize(s,prize,'EWC 赛事奖金');
 if(e.champ===s.teamName||runner===s.teamName){
 s.honors=s.honors||[];
 s.honors.push({season:s.season,title:gameYear(s)+' EWC 电竞世界杯 '+(e.champ===s.teamName?'冠军':'亚军'),champion:e.champ===s.teamName,roster:titleRoster(s)});
 s.honors=s.honors.slice(-20);
 noteCoachHonor(s,gameYear(s)+' EWC 冠军',e.champ===s.teamName);
 }
 if(e.champ===s.teamName)registerChampCore(s,gameYear(s)+' EWC 电竞世界杯'); // 冠军班底羁绊
 else if(e.champ)registerAiChampCore(s,e.champ);
 awardFMVP(s,e.champ,gameYear(s)+' EWC 电竞世界杯');

 s.yearStages=s.yearStages||[];
 s.yearStages.push({ev:'EWC电竞世界杯',place:e.champ===s.teamName?'冠军':runner===s.teamName?'亚军'
 :e.sf.some(m=>m.r&&loserOf(m)===s.teamName)?'四强'
 :e.qf.some(m=>m.r&&loserOf(m)===s.teamName)?'八强':'未晋级'});
 s.ewcDone=true;
 try{gcDefs(s);}catch(e){}

 if(typeof isAsiadYear==='function'&&isAsiadYear(s)&&!s.agDone){setupAsianGames(s);return;}
 setupAnnual(s);
}

const AG_NATIONS=[['韩国',470],['中国台北',432],['越南',427],['泰国',416],['日本',400],['沙特阿拉伯',385],['印度',365]];
const AG_CITY='名古屋';
 function agSelectSquad(s){
 const pool=[];
 (s.players||[]).forEach(p=>{const st=playerStatus(p,s);if(!st.loan&&!st.retiring)pool.push(p);});
 AI_TEAMS.forEach(t=>ensureAiRosters(s,t.name).forEach(p=>pool.push(p)));

 return POS_ORDER.map(pos=>pool.filter(p=>p.pos===pos)
 .sort((a,b)=>(overall(b)+(natCampFormBonus(s,b)||0))-(overall(a)+(natCampFormBonus(s,a)||0)))[0]).filter(Boolean);
 }
function setupAsianGames(s){

 const ownedIds=new Set((s.players||[]).map(p=>p.id));
 let squad=[];
 const nat=(s.natSquad||[]).map(x=>x.name);
 if(nat.length){
 squad=nat.map(n=>{
 const own=(s.players||[]).find(p=>p.name===n);
 if(own&&!own.retiring)return own;
 for(const t of AI_TEAMS){const q=ensureAiRosters(s,t.name).find(p=>p.name===n);if(q)return q;}
 return null;
 }).filter(Boolean);
 }
 if(squad.length<5)squad=agSelectSquad(s); // 兜底：名单残缺（退役/异常）按当前最强补
 const myPow=Math.round(squad.reduce((m,p)=>m+playerPower(p)+(natCampFormBonus(s,p)||0),0));
 s.aiPower=s.aiPower||{};
 s.aiPower['中国代表队']=myPow;
 AG_NATIONS.forEach(([n,pw])=>{s.aiPower[n]=pw+(gameYear(s)-2026)*3;}); // 海外对手逐年小幅变强

 const others=shuffle(AG_NATIONS.filter(([n])=>n!=='韩国').map(([n])=>n).slice());
 s.ag={squad:squad.map(p=>({name:p.name,pos:p.pos,mine:ownedIds.has(p.id),ovr:overall(p)})),
 myPow,qf:[{a:'中国代表队',b:others[0],r:null},{a:others[2],b:others[3],r:null},{a:others[4],b:others[5],r:null},{a:'韩国',b:others[1],r:null}],
 sf:[{a:null,b:null,r:null},{a:null,b:null,r:null}],final:{a:null,b:null,r:null},champ:null,mvp:null,medal:null};
 setPhase(s,'asiad',{who:'setupAsianGames',force:true});
 const mineCnt=s.ag.squad.filter(x=>x.mine).length;
 logEvent(s,' '+gameYear(s)+' '+AG_CITY+'亚运会开幕！中国代表队由 KPL 各位置当季最强组成（战力 '+myPow+'）');
 logEvent(s,' 中国代表队名单：'+s.ag.squad.map(x=>POS[x.pos][1]+' '+x.name+(x.mine?'（本队）':'')).join('、')+' —— 最强对手：韩国');
 if(mineCnt)logEvent(s,' 你队有 '+mineCnt+' 名选手被征召！赛程由国家队教练组指挥，成绩将以奖牌加成形式回流俱乐部');
 save();renderAll();
}
function asiadStep(s){
 const a=s.ag;if(!a||a.champ)return;
 const done=[];
 const play=m=>{const r=simSeriesResult(s,m.a,m.b,7);m.r=r.win?m.a:m.b;m.ms=r.mw;m.es=r.ow;done.push(m);};
 if(a.qf.some(m=>!m.r)){a.qf.forEach(m=>{if(!m.r)play(m);});}
 else if(a.sf.some(m=>!m.r)){a.sf.forEach((m,i)=>{if(m.a===null)m.a=a.qf[i*2].r;if(m.b===null)m.b=a.qf[i*2+1].r;if(!m.r)play(m);});}
 else if(!a.final.r){
 if(a.final.a===null)a.final.a=a.sf[0].r;
 if(a.final.b===null)a.final.b=a.sf[1].r;
 play(a.final);
 }else{finishAsianGames(s);return;}
 done.forEach(m=>logEvent(s,' 亚运会淘汰赛（BO7）：'+m.a+' '+(m.ms||0)+':'+(m.es||0)+' '+m.b+'，'+m.r+' 晋级'));
 if(a.final.r)finishAsianGames(s);
 else{save();renderAll();}
}
function finishAsianGames(s){
 const a=s.ag;if(!a||a.champ)return;
 a.champ=a.final.r;
 const runner=loserOf(a.final);
 const bronzes=a.sf.map(loserOf).filter(Boolean);
 a.medal=a.champ==='中国代表队'?'金牌':runner==='中国代表队'?'银牌':bronzes.includes('中国代表队')?'铜牌':'无';
 s.titleHistory=(s.titleHistory||[]).concat([{season:s.season,split:null,event:'亚运会',champ:a.champ}]).slice(-48);
 logEvent(s,' '+gameYear(s)+' 亚运会王者荣耀项目落幕：'+a.champ+' 金牌 · '+(runner==='中国代表队'?'中国队':'韩国等队')+' 银牌');
 if(a.champ==='中国代表队')logEvent(s,' 中国代表队登顶亚洲之巅——国旗升起时刻，整个 KPL 都在看！');
 else if(a.medal==='无')logEvent(s,' 中国队无缘领奖台，舆论哗然');

 if(a.champ==='中国代表队'){
 const best=a.squad.slice().sort((x,y)=>y.ovr-x.ovr)[0];
 if(best){a.mvp=best.name;logEvent(s,' 亚运会 MVP：'+best.name+'（'+POS[best.pos][0]+'）当选');}
 }

 const mine=a.squad.filter(x=>x.mine);
 const add={'金牌':[8,6],'银牌':[5,4],'铜牌':[3,2],'无':[1,0]}[a.medal];
 const prizeBase={'金牌':67,'银牌':33,'铜牌':17,'无':8}[a.medal];
 mine.forEach(x=>{
 const p=(s.players||[]).find(y=>y.name===x.name);
 if(!p)return;
 p.popularity=Math.min(99,(p.popularity||0)+add[0]);
 p.val=clamp((p.val||100)+add[1],70,150);
 p.morale=clamp(p.morale+5,20,100);
 p.energy=clamp((p.energy==null?100:p.energy)-15,30,100); // 国家队征召消耗：年总开局体力不满
 });
 if(mine.length){
 const prize=Math.round(prizeBase*mine.length/5);
 if(prize)grantPrize(s,prize,'亚运会奖金（'+a.medal+'档 · '+mine.length+' 名选手入选）');
 if(s.mode==='player'&&s.career&&mine.some(x=>x.name===(myPlayer(s)||{}).name))s.career.nat=(s.career.nat||0)+1; // 生涯履历：国家队履历
 logEvent(s,' 亚运会加成：'+mine.map(x=>x.name).join('、')+' 人气+'+add[0]+' · 身价+'+add[1]+'（征召消耗体力，年总开局体力不满）');
 if(a.mvp&&mine.some(x=>x.name===a.mvp)){
 const p=(s.players||[]).find(y=>y.name===a.mvp);
 if(p){p.popularity=Math.min(99,(p.popularity||0)+10);p.val=clamp((p.val||100)+5,70,150);
 logEvent(s,' 亚运会 MVP 是你的 '+a.mvp+'！专属冠军皮肤安排（人气+10 · 身价+5）');}
 }
 }
 if(a.squad.some(x=>x.mine)){ // 成绩曲线：本队有选手出征才记亚运
 s.yearStages=s.yearStages||[];
 s.yearStages.push({ev:'亚运会',place:a.medal==='金牌'?'金牌':a.medal==='银牌'?'银牌':a.medal==='铜牌'?'铜牌':'无奖牌'});
 }
 s.agDone=true;

 s.players.forEach(p=>{p.natCamp=false;p.natCampForm=0;});
 s.natCampIds=[];s.natCampDay=0;
 const fills=s.players.filter(p=>p.natFill);
 if(fills.length){
 fills.forEach(p=>{const li=s.lineup.indexOf(p.id);if(li>=0)s.lineup.splice(li,1);});
 s.players=s.players.filter(p=>!p.natFill);
 logEvent(s,' 集训借调青训归位：'+fills.map(p=>p.name).join('、')+' 返回青训营，征召选手全员归队备战年总');
 }
 setupAnnual(s);
}

const ANNUAL_SUB={
 masters:{minHealthy:6,mustRotate:true,rotatePenalty:4,maxSwaps:99,rosterN:7,rule:'7人大名单每人至少1小局'},
 elites:{minHealthy:5,mustRotate:false,rotatePenalty:0,maxSwaps:1,rosterN:0,rule:'无强制轮换'},
};
function annualGroupOf(s){
 if(!s||!s.annual||!s.annual.masters)return null;
 if(s.annual.masters.includes(s.teamName))return 'masters';
 if(s.annual.elites&&s.annual.elites.includes(s.teamName))return 'elites';
 return null;
}
function annualSubRule(g){return ANNUAL_SUB[g]||null;}
function annualHealthyCount(s){
 return (s&&s.players||[]).filter(p=>matchEligible(s,p)&&!p.loan).length;
}

function annualRosterPool(s){
 const n=(annualSubRule('masters')||{}).rosterN||7;
 return (s&&s.players||[]).filter(p=>matchEligible(s,p)&&!p.loan).slice(0,n);
}
function annualSubRuleText(s){
 const g=annualGroupOf(s);
 if(!g)return '';
 const r=annualSubRule(g);
 if(g==='masters')return '大师组官方轮换：擂台赛每场 BO5，7 人大名单内所有选手至少各出场 1 小局（否则士气-'+r.rotatePenalty+'）· 中途换人不限次';
 return '精英组：无强制轮换 · 年总系列赛中途换替补仅 '+r.maxSwaps+' 次';
}

function annualSubGuard(s){
 if(!s||s.phase!=='annual')return true;
 const g=annualGroupOf(s);
 const r=annualSubRule(g);
 if(!r||g!=='masters')return true;
 const n=annualHealthyCount(s);
 if(n<r.minHealthy){
 try{
 if(typeof emergencyFillRoster==='function')emergencyFillRoster(s);
 }catch(e){}
 logEvent(s,' 大师组年总要求 7 人名单可战（当前 '+n+'）——请补强替补；擂台赛 BO5 须全员轮换出场');
 }
 return true;
}

function annualMarkSeriesStart(s,sr){
 if(!s||!sr)return sr;
 sr._startIds=rosterLineup(s).map(p=>p.id);
 sr._swaps=0;
 sr._autoRotated=false;
 sr._played=sr._startIds.slice();
 return sr;
}

function annualMarkPlayed(s,sr){
 if(!s||!sr)return;
 sr._played=sr._played||[];
 rosterLineup(s).forEach(p=>{
 if(!sr._played.includes(p.id))sr._played.push(p.id);
 });
}

function annualAutoRotate(s,sr){
 if(!s||!sr||s.phase!=='annual')return false;
 if(annualGroupOf(s)!=='masters')return false;
 if(((sr.mw||0)+(sr.ow||0))<1)return false;
 const pool=annualRosterPool(s);
 if(pool.length<=5)return false; // 无可轮换空间
 const played=new Set(sr._played||sr._startIds||[]);
 const need=pool.filter(p=>!played.has(p.id));
 if(!need.length){sr._autoRotated=true;return false;}

 const curLine=rosterLineup(s);
 let swapped=false;
 need.forEach(p=>{
 if(swapped)return;
 if(played.has(p.id))return;
 const out=curLine.find(x=>x.pos===p.pos&&!need.includes(x))||curLine.find(x=>!need.includes(x));
 if(!out)return;
 const idx=s.lineup.indexOf(out.id);
 if(idx<0)return;
 s.lineup[idx]=p.id;
 sr._swaps=(sr._swaps||0)+1;
 if(!sr._played)sr._played=[];
 if(!sr._played.includes(p.id))sr._played.push(p.id);
 swapped=true;
 logEvent(s,' 大师轮换：'+p.name+'（'+POS[p.pos][0]+'）登场——推进名单全员出场');
 });
 if(swapped)sr._autoRotated=true;
 return swapped;
}

function annualSubSettle(s,sr){
 if(!s||!sr||s.phase!=='annual')return;
 const g=annualGroupOf(s);
 const r=annualSubRule(g);
 if(!r||!r.mustRotate)return;
 annualMarkPlayed(s,sr);
 const pool=annualRosterPool(s);
 const played=new Set(sr._played||[]);
 rosterLineup(s).forEach(p=>played.add(p.id));
 const missing=pool.filter(p=>!played.has(p.id));
 if(missing.length){
 rosterLineup(s).forEach(p=>{p.morale=clamp(p.morale-(r.rotatePenalty||4),20,100);});
 logEvent(s,' 大师轮换：本系列赛名单未全员出场（缺 '+missing.map(p=>p.name).join('、')+'）——联盟处罚，全队士气-'+(r.rotatePenalty||4));
 }else if(pool.length>=5){
 logEvent(s,' 大师轮换：'+pool.length+' 人名单已全员出场 ✓');
 }
}
function annualRank(s){
 return Object.keys(s.annualPts||{}).sort((a,b)=>(s.annualPts[b]||0)-(s.annualPts[a]||0)||powerOf(s,b)-powerOf(s,a));
}
function setupAnnual(s){
 const all=annualRank(s);
 const q=all.slice(0,12);
 s.annual={stage:'arena',roundIdx:0,masters:q.slice(0,6),elites:q.slice(6,12),q};

 s.annual.rounds=[];
 for(let r=0;r<6;r++){
 const ms=[];
 for(let i=0;i<6;i++)ms.push({a:s.annual.masters[i],b:s.annual.elites[(i+r)%6],r:null});
 s.annual.rounds.push(ms);
 }
 setPhase(s,'annual',{who:'setupAnnual',force:true});
 const myRank=all.indexOf(s.teamName);
 if(myRank<0||myRank>=12){
 logEvent(s,' 年度积分 '+(s.annualPts[s.teamName]||0)+' 分（第'+(myRank+1)+'），无缘年度总决赛（前12）——春夏赛季继续攒分');
 simCup('annual',s); // AI 自动补完全部年总赛程（内部收尾走年度轮换）
 return;
 }
 logEvent(s,' '+gameYear(s)+' KPL 年度总决赛开幕！你队以年度积分 '+s.annualPts[s.teamName]+' 分（第'+(myRank+1)+'名）进入'+(myRank<6?'大师组':'精英组'));
 logEvent(s,' '+annualSubRuleText(s));
 save();renderAll();
}
function arenaStandings(s){
 const M={},E={};
 if(!s||!s.annual||!s.annual.masters||!s.annual.elites)return {M,E};
 s.annual.masters.forEach(t=>M[t]={pts:0,pw:0});
 s.annual.elites.forEach(t=>E[t]={pts:0,pw:0});
 (s.annual.rounds||[]).flat().forEach(m=>{
 if(!m.r)return;
 const aWin=m.r===m.a,ms=m.ms==null?4:m.ms,es=m.es==null?0:m.es;
 const wT=aWin?M:E,lT=aWin?E:M;
 wT[m.r].pts++;wT[m.r].pw+=aWin?ms:es;
 lT[aWin?m.b:m.a].pw+=aWin?es:ms;
 });
 return {M,E};
}
function annualStep(s){ // 年总推进分派（finishSeries cup 分支 / AI 场次递归入口）
 const a=s.annual;if(!a)return;
 if(a.stage==='arena')annualArenaNext(s);
 else if(a.stage==='breakthrough')annualBrkNext(s);
 else if(a.stage==='po')annualPoStep(s);
}
function startAnnualArena(s){
 const a=s.annual;
 if(!a)return;
 const rd=a.rounds[a.roundIdx];
 if(!rd){finishArena(s);return;}

 const my=rd.find(m=>(m.a===s.teamName||m.b===s.teamName)&&!m.r);
 if(my){
 playCupMatch(s,my,'arena_r'+(a.roundIdx+1),'年总·擂台赛 第'+(a.roundIdx+1)+'轮',KPL.BO5);
 return;
 }
 annualArenaNext(s);
}
function annualArenaNext(s){
 const a=s.annual;
 const rd=a.rounds[a.roundIdx];
 if(!rd){finishArena(s);return;}

 rd.forEach(m=>{
 if(m.r)return;
 const r=simSeriesResult(s,m.a,m.b,KPL.BO5);
 m.r=r.win?m.a:m.b;m.ms=r.mw;m.es=r.ow;
 });
 const rep=rd.filter(m=>!(m.a===s.teamName||m.b===s.teamName)).slice(0,3).map(m=>m.a+' '+m.ms+':'+m.es+' '+m.b).join('；');
 if(rep)logEvent(s,' 擂台赛第'+(a.roundIdx+1)+'轮：'+rep);
 a.roundIdx++;
 if(a.roundIdx>=6)finishArena(s);
}
function finishArena(s){
 const st=arenaStandings(s);
 const rankOf=(tbl,teams)=>teams.slice().sort((x,y)=>tbl[y].pts-tbl[x].pts||tbl[y].pw-tbl[x].pw);
 const mRank=rankOf(st.M,s.annual.masters),eRank=rankOf(st.E,s.annual.elites);
 s.annual.mRank=mRank;s.annual.eRank=eRank;
 logEvent(s,' 擂台赛收官！大师组前四直进淘汰赛：'+mRank.slice(0,4).join('、')+'；精英组第1名 '+eRank[0]+' 直进淘汰赛');
 s.annual.stage='breakthrough';

 s.annual.brk=[{a:mRank[4],b:eRank[4],r:null},{a:mRank[5],b:eRank[3],r:null},{a:eRank[1],b:eRank[2],r:null}];
 logEvent(s,' 突围赛对阵：'+s.annual.brk.map(m=>m.a+' vs '+m.b).join('；')+'（胜者进淘汰赛 · 精英组第6名 '+eRank[5]+' 遗憾出局）');
 const myBrk=s.annual.brk.some(m=>m.a===s.teamName||m.b===s.teamName);
 if(!myBrk){let g=0;while(s.annual.stage==='breakthrough'&&g++<10)annualBrkNext(s);}
 save();renderAll();
}
function annualBrkNext(s){
 const a=s.annual;if(!a.brk)return;
 for(let i=0;i<3;i++){const m=a.brk[i];if(!m.r){playCupMatch(s,m,'brk'+(i+1),'年总·突围赛',KPL.BO7);return;}}
 finishBreakthrough(s);
}
function finishBreakthrough(s){
 const winners=s.annual.brk.map(m=>m.r);
 const eight=shuffle([s.annual.mRank[0],s.annual.mRank[1],s.annual.mRank[2],s.annual.mRank[3],s.annual.eRank[0],...winners]);
 s.annual.stage='po';
 s.annual.po=buildCup8(eight); // 8 队 BO7 双败
 logEvent(s,' 年度总决赛·淘汰赛开启！8 强 BO7 双败：'+eight.join('、'));
 if(!eight.includes(s.teamName)){
 let g=0;while(s.annual.po&&!s.annual.po.champ&&g++<30)annualPoStep(s); // 内部终局时自动 finishAnnual→年度轮换
 return;
 }
 save();renderAll();
}

function buildCup8(teams){
 return {
 wb1:[{a:teams[0],b:teams[7],r:null},{a:teams[3],b:teams[4],r:null},{a:teams[1],b:teams[6],r:null},{a:teams[2],b:teams[5],r:null}],
 wb2:[{a:null,b:null,r:null},{a:null,b:null,r:null}],wf:{a:null,b:null,r:null},
 lb1:[{a:null,b:null,r:null},{a:null,b:null,r:null}],lb2:[{a:null,b:null,r:null},{a:null,b:null,r:null}],
 lbs:{a:null,b:null,r:null},lbf:{a:null,b:null,r:null},final:{a:null,b:null,r:null},champ:null};
}
function annualPoStep(s){
 const p=s.annual.po;if(!p)return;
 cup8PoStep(s,p,{prefix:'apo_',label:'年总',
 finalMatch:()=>p.final,finalSlot:'apo_final',finalLabel:'年总·总决赛',finalBo:KPL.BO7,
 onFinish:()=>finishAnnual(s,true)});
}

function yearRollPending(s){
 return !!(s&&s.phase==='annual'&&s.annual&&s.annual.po&&s.annual.po.final&&s.annual.po.final.r);
}
function finishAnnual(s,silent){

 logEvent(s,' '+gameYear(s)+' KPL 年度总决赛落幕：'+p.champ+' 捧起圣龙杯！'+(p.champ===s.teamName?'年度至尊荣耀！':''));
 let prize=0; // 年总奖金（真实 2000 万级冠军奖，游戏内取 800 万）
 if(p.champ===s.teamName)prize=1333;
 else if(runner===s.teamName)prize=667;
 else if([p.lbf,p.lbs].some(m=>m.r&&loserOf(m)===s.teamName))prize=417;
 else if(p.lb2.concat(p.lb1).some(m=>m.r&&loserOf(m)===s.teamName))prize=200;
 if(prize)grantPrize(s,prize,'年度总决赛奖金');
 if(p.champ===s.teamName||runner===s.teamName){
 s.honors=s.honors||[];
 s.honors.push({season:s.season,title:gameYear(s)+' KPL年度总决赛 '+(p.champ===s.teamName?'冠军':'亚军'),champion:p.champ===s.teamName,roster:titleRoster(s)});

 awardFMVP(s,p.champ,gameYear(s)+' KPL 年度总决赛');
 s.champion=p.champ===s.teamName;
 addFans(s,p.champ===s.teamName?25:(runner===s.teamName?12:6),'KPL 年度总决赛'); // 年总是全年最大的曝光

 :p.lb2.concat(p.lb1).some(m=>m.r&&loserOf(m)===s.teamName)?'八强':'参赛';
 if(!(s.yearStages||[]).some(x=>x.ev==='KPL年度总决赛'))s.yearStages.push({ev:'KPL年度总决赛',place:myPlace});

 if(s.mode==='player')playerYearSettle(s);

 s._annualSettled=true;
 }catch(e){
 s._annualSettled=true; // 失败也标记，避免下次重试双份结算
 logEvent(s,' 年末结算异常：'+(e&&e.message)+'（继续开启新赛季）');
 }
 }
 try{
 newSeason(s); // 年度轮换：年龄/合同/退役结算 → 下一年春季赛
 }catch(e){
 logEvent(s,' 年度轮换异常：'+(e&&e.message)+'——请再点一次「进入新赛季」');
 }
}

const BO_TXT=bo=>bo===5?'BO5 全局BP':bo===9?'BO9·第9局巅峰对决':'BO7·含巅峰对决';
function playCupMatch(s,m,slot,label,bo){
 if(!m)return;
 if(m.r){ // 已赛场次：直接推进（读档残留/重复点击），避免重开幽灵系列赛
 if(s.phase==='ewc')ewcStep(s);
 else if(s.phase==='challenger')challengerStep(s);
 else annualStep(s);
 return;
 }
 if(m.a===s.teamName||m.b===s.teamName){
 const opName=m.a===s.teamName?m.b:m.a;
 if(s.mode==='player'){ // 选手生涯：教练指挥，自动打完整场杯赛系列赛（走 finishSeries：结算弹窗 + 延后推进）
 tagMatch(s,m,slot);
 const mark={};
 annualMarkSeriesStart(s,mark);
 playerPlayAndFinish(s,opName,bo,{stage:'cup',mid:slot,cupSlot:slot,cupLabel:label,_match:m,_startIds:mark._startIds||null,_swaps:0});
 return;
 }
 if(s.series&&s.series.stage==='cup'&&s.series.cupSlot===slot){
 showPreMatch(label+'（'+BO_TXT(bo)+'）vs '+opName+' · 第'+(s.series.mw+s.series.ow+1)+'局（'+s.series.mw+':'+s.series.ow+'）');
 return;
 }
 tagMatch(s,m,slot);
 s.series={used:[],usedOpp:[],mw:0,ow:0,max:bo,stage:'cup',mid:slot,cupSlot:slot,cupLabel:label,logs:[],myName:m.a===s.teamName?m.a:m.b,opName,side:firstSide(s,'playoff',opName)};s.seriesAuto=false;
 annualMarkSeriesStart(s,s.series);
 resetOppEnergy(s,opName);
 showPreMatch(label+'（'+BO_TXT(bo)+'）vs '+opName+' · 第1局');
 return;
 }
 const r=simSeriesResult(s,m.a,m.b,bo);
 m.r=r.win?m.a:m.b;m.ms=r.mw;m.es=r.ow;
 logEvent(s,' '+label+'：'+m.a+' '+(r.win?'胜':'负')+' '+m.b+'，'+m.r+' 晋级');
 save();renderAll();
 if(s.phase==='ewc')ewcStep(s);
 else if(s.phase==='challenger')challengerStep(s);
 else annualStep(s); // 年总各阶段推进（擂台 AI 场次不走此路径，突围/淘汰赛走此分派）
}
function simCup(kind,s){ // 玩家未晋级：AI 自动补完杯赛
 let guard=0;
 if(kind==='ewc'){while(s.ewc&&!s.ewc.champ&&guard++<20)ewcStep(s);}
 else if(kind==='challenger'){while(s.challenger&&!s.challenger.champ&&guard++<60)challengerStep(s);}
 else{while(s.annual&&(s.annual.stage!=='po'||!s.annual.po.champ)&&guard++<80)annualStep(s);}
}
function startCup(s){ // 杯赛 UI 入口（进行下一场 / 快进）
 if(!s||!s.players){try{toast('存档状态异常，无法推进杯赛');}catch(_){}return;}
 if(s.phase==='ewc'){ewcStep(s);return;}
 if(s.phase==='challenger'){challengerStep(s);return;}
 if(s.phase==='annual'){
 const a=s.annual;
 if(!a)return;

 if(a.po&&a.po.champ&&yearRollPending(s)){finishAnnual(s,true);return;}
 if(typeof annualSubGuard==='function'&&!annualSubGuard(s))return; // 大师组名单深度
 if(a.stage==='arena')startAnnualArena(s);
 else if(a.stage==='breakthrough')annualBrkNext(s);
 else annualPoStep(s);
 }
}

function coachAutoSquad(s){ // 教练/选手模式：俱乐部自动续约与引援（你只管竞技）
 (s.expiring||[]).slice().forEach(pid=>{
 const p=s.players.find(x=>x.id===pid);
 if(!p||p.loan)return;
 if(s.mode==='player'&&s.career&&pid===s.career.me)return; // 你本人的合同由选手分支单独谈/续

 });
 s.expiring=[];

 if(s.mode==='coach'&&Array.isArray(s.coachRecs)&&s.coachRecs.length){
  const rest=[];
  s.coachRecs.forEach(rec=>{
   try{
    if(rec.type==='loan'&&rec.pid){
     const cands=loanCandidates(s);
     const hit=cands.find(c=>c.p.id===rec.pid)||cands.find(c=>c.p.pos===rec.pos);
     if(hit&&loanCap(s)>(s.players||[]).filter(p=>p.loan).length){
      loanPlayer(s,hit.from,hit.p.id);
      return; // 成功租借
     }
    }
    if(rec.type==='sign'&&rec.pid){
     const fa=(s.freeAgents||[]).find(p=>p.id===rec.pid);
     if(fa&&s.fund>(fa.signCost||0)&&!rosterFull(s)){
      const cost=Math.max(0,Math.round(fa.signCost||valueOf(overall(fa))));
      if(s.fund>=cost){
       if(s.players.some(x=>x.id===fa.id))return;
       s.fund-=cost;fa.acqCost=cost;fa.contract=2;fa.loan=null;
       delete fa.freeAgent;delete fa.signCost;
       s.players.push(fa);
       s.freeAgents=s.freeAgents.filter(x=>x.id!==fa.id);
       s.aiRosters={};
       logEvent(s,' 俱乐部采纳教练申请：签下自由球员 '+fa.name+'（'+POS[fa.pos][0]+' · 总值 '+overall(fa)+' · '+cost+'万）');
       return;
      }
     }
    }
    if(rec.type==='gap'&&rec.pos){

     const need=rec.pos;
     if(s.players.some(p=>p.pos===need&&matchEligible(s,p)))return;
     const fa=(s.freeAgents||[]).filter(p=>p.pos===need).sort((a,b)=>overall(b)-overall(a))[0];
     if(fa&&s.fund>=(fa.signCost||80)&&!rosterFull(s)){
      if(s.players.some(x=>x.id===fa.id))return;
      const cost=Math.max(0,Math.round(fa.signCost||80));
      s.fund-=cost;fa.acqCost=cost;fa.contract=2;
      delete fa.freeAgent;delete fa.signCost;
      s.players.push(fa);
      s.freeAgents=s.freeAgents.filter(x=>x.id!==fa.id);
      s.aiRosters={};
      logEvent(s,' 俱乐部采纳教练申请：紧急签下 '+POS[need][0]+' '+fa.name+'（总值 '+overall(fa)+'）');
      return;
     }
    }
   }catch(e){}
   rest.push(rec);
  });
  s.coachRecs=rest.slice(0,8);
 }

 const playable=p=>p&&!playerStatus(p,s).loan&&matchEligible(s,p); // 只补 matchEligible 不管的「租入」

 const u=typeof rookieUsedNames==='function'?rookieUsedNames(s):new Set(s.players.map(p=>p.name));

function coachAdvice(s){
 if(!s||s.mode!=='coach')return {gaps:[],weak:[],loans:[],signs:[]};
 const gaps=injuryGapPositions(s);
 const healthyPos=pos=>(s.players||[]).filter(p=>p.pos===pos&&matchEligible(s,p));
 const weak=POS_ORDER.map(pos=>{
  const list=healthyPos(pos);
  const best=list.length?Math.max.apply(null,list.map(p=>overall(p))):0;
  return {pos,best,cnt:list.length};
 }).filter(x=>x.cnt===0||x.best<78).sort((a,b)=>(a.cnt-b.cnt)||(a.best-b.best));
 const loans=(loanCandidates(s)||[]).slice(0,8).map(c=>({
  id:c.p.id,pos:c.p.pos,name:c.p.name,from:c.from,ovr:overall(c.p),rent:c.rent,
  gap:gaps.includes(c.p.pos),age:c.p.age
 }));
 const signs=(s.freeAgents||[]).slice().sort((a,b)=>{
  const ag=gaps.includes(a.pos)?1:0,bg=gaps.includes(b.pos)?1:0;
  if(ag!==bg)return bg-ag;
  return overall(b)-overall(a);
 }).slice(0,6).map(p=>({
  id:p.id,pos:p.pos,name:p.name,ovr:overall(p),cost:Math.round(p.signCost||valueOf(overall(p))),
  gap:gaps.includes(p.pos),age:p.age
 }));
 return {gaps,weak:weak.slice(0,4),loans,signs};
}

 if(typeof transferOpsBlockedReason==='function'){
 const modeBlock=transferOpsBlockedReason(s);
 if(modeBlock){toast(modeBlock);return;}
 }
 const p=(s.freeAgents||[]).find(x=>x.id===id);
 if(!p)return;
 if(s.players.some(x=>x.id===p.id)){toast('已拥有该选手');return;}
 if(s.fund<(p.signCost||0)){toast('资金不足（签约费 '+(p.signCost||0)+'万）');return;}
 if(weeklyWage(s)+(p.wage||0)>s.wageCap){
 const {over,tax}=overCapTax(s,p.wage||0);
 if(!confirm(' 超帽签约：签下 '+p.name+' 后年薪 '+(weeklyWage(s)+(p.wage||0))+'万（帽 '+s.wageCap+'万），超出 '+over+'万 需每周缴纳 60% 奢侈税（'+tax+'万）。\n多花钱可以，确定签下？'))return;
 }
 s.fund-=(p.signCost||0);
 p.acqCost=p.signCost; // 买入价锚定（转售保护用）
 if(p.contract==null)p.contract=2; // 签约即给合同年限
 s.freeAgents=s.freeAgents.filter(x=>x.id!==id);
 s.players.push(p);
 recordTransfer(s,'in',p,p.signCost,'自由球员','自由市场直签'); // 年度回顾·转会台账
 logEvent(s,' 自由市场签下 '+p.name+'（无球可打选手 · 签约费 '+p.signCost+'万）');
 save();renderAll();toast(p.name+' 加盟！');
}

function maybeOpenMedia(s,ctx){

const NAT_FOCUS={
  form:{n:'状态拉满',d:'集训汇报额外状态+1，体力消耗+3'},
  rest:{n:'养精蓄锐',d:'体力+8/次，状态成长放缓'},
  bond:{n:'更衣室外交',d:'国家队队友人气+1，你心态+1'},
};
function setNatFocus(s,fk){
  if(!s||s.mode!=='player'||!s.career)return false;
  const me=myPlayer(s);
  if(!me||!natCamping(s,me)){toast('你不在国家队集训中');return false;}
  if(!NAT_FOCUS[fk])return false;
  s.career.natFocus=fk;
  logEvent(s,' 国家队集训策略：'+me.name+' 将「'+NAT_FOCUS[fk].n+'」（'+NAT_FOCUS[fk].d+'）');
  save();renderAll();
  return true;
}

function applyNatFocus(s,p){
  if(!s||s.mode!=='player'||!s.career||!p)return;
  const me=myPlayer(s);
  if(!me||me.id!==p.id)return;
  const fk=s.career.natFocus||'form';
  if(fk==='form'){
    p.natCampForm=clamp((p.natCampForm||0)+1,0,5);
    p.energy=clamp(p.energy-3,0,ENERGY_MAX);
  }else if(fk==='rest'){
    p.energy=clamp(p.energy+8,0,ENERGY_MAX);
    p.natCampForm=clamp((p.natCampForm||0)-0,0,5); // 不额外加状态
  }else if(fk==='bond'){
    p.attrs.mind=clamp(p.attrs.mind+1,40,99);
    p.popularity=Math.min(99,(p.popularity||0)+1);
  }
}

function playerForm(p){
  if(!p)return 50;
  const val=(p.val==null)?100:p.val;

  const v=clamp((val-90)*1.5+40,0,100);
  const mo=clamp(p.morale==null?70:p.morale,0,100);
  const en=p.energy==null?100:clamp(p.energy,0,ENERGY_MAX||100);
  let f=v*0.5+mo*0.25+en*0.25;
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  if((p.age||0)>m.gold)f-=(p.age-m.gold)*6;
  if((p.injury||0)>0)f-=15;
  return clamp(Math.round(f),0,100);
}
function formLabel(f){
  return f>=80?'火热':f>=55?'平稳':'低迷';
}
function ensurePlayerPeak(p){
  if(!p)return null;
  if(p.peak&&p.peak.lane!=null)return p.peak;
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  const age=p.age==null?20:p.age;
  let room;
  if(age<18)room=12;
  else if(age<m.gold-1)room=8;
  else if(age<=m.gold)room=5;
  else if(age<m.retire)room=2;
  else room=0;
  const o=overall(p);
  if(o>=90)room=Math.min(room,3);
  else if(o>=85)room=Math.min(room,5);
  p.peak={};
  ['lane','farm','team','mind'].forEach(k=>{
    const a=p.attrs[k]||70;
    p.peak[k]=clamp(a+room,a,96);
  });
  return p.peak;
}

function trainOutcome(role,p,k){
  ensurePlayerPeak(p);
  const form=playerForm(p);
  const attr=p.attrs[k]||70;
  const peak=(p.peak&&p.peak[k]!=null)?p.peak[k]:attr;
  const room=Math.max(0,peak-attr);
  const m=AGE_MODEL[p.pos]||AGE_MODEL.mid;
  const pastGold=(p.age||0)>m.gold;
  if(room<=0){
    if(!pastGold&&form>=90&&Math.random()<0.08){
      p.peak[k]=clamp(peak+1,40,98);
      return {gain:1,form,peak:p.peak[k],note:'突破个人天花板'};
    }
    return {gain:0,form,peak,note:pastGold?'已过巅峰，只能维持':'已到个人天花板'};
  }
  let gain;
  if(form>=80){
    gain=(room>=2&&Math.random()<0.5)?2:1;
    if(role==='proj'&&room>=2)gain=2;
  }else if(form>=55){
    gain=Math.random()<0.55?1:0;
    if(gain===1&&room>=2&&Math.random()<0.2)gain=2;
  }else{
    gain=Math.random()<0.2?1:0;
  }
  if(pastGold&&gain>0&&Math.random()<0.5)gain=0; // 下滑期再砍半
  if(gain>room)gain=room;

  const base=formLabel(form);
  return {gain,form,peak,note:gain>0?base:base+'，今天没有提升'};
}
function benchMoraleDelta(role,base){
  if(role==='star')return base*2;
  return base;
}

function playerAfterMatch(s,finalWin,sr){
 if(!s||s.mode!=='player')return;
 s.career.stats=s.career.stats||{trained:0,social:0,media:0,matches:0};
 s.career.stats.matches++;
 const isTitle=finalWin&&(s.phase==='champion'||(sr&&(sr.poSlot==='总决赛'||['ch_final','ewc_final','apo_final'].includes(sr.cupSlot))));
 if(isTitle)maybeOpenMedia(s,'title');
 else maybeOpenMedia(s,'match');
}

function playerTrainDay(s,k){
 if(!s||s.mode!=='player')return {ok:false,reason:''};
 if(s.trained)return {ok:false,reason:'今天已经练过了，明天再来'};
 const me=myPlayer(s);if(!me)return {ok:false,reason:''};
 if(s.career&&s.career.retired)return {ok:false,reason:'职业生涯已结束'};
 const blocked=trainBlockedReason(s,me);
 if(blocked)return {ok:false,reason:blocked};
 if(me.energy<10)return {ok:false,reason:'体力不足（需 10），先休息'};
 const r=trainOutcome(playerRole(s),me,k);

 if(s.career&&s.career.mediaBuff==='train'){
  s.career.mediaBuff=null;
  const room=Math.max(0,(r.peak!=null?r.peak:99)-(me.attrs[k]||0));
  if(room>0){
   if(r.gain<1)r.gain=1;
   else if(r.gain<room)r.gain=Math.min(r.gain+1,room);
   r.note=(r.note||'状态平稳')+' · 采访加成';
  }
 }
 me.attrs[k]=clamp(me.attrs[k]+r.gain,40,99);
 me.energy=clamp(me.energy-10,0,ENERGY_MAX);
 s.trained=true;
 if(s.career){s.career.stats=s.career.stats||{trained:0,social:0,media:0,matches:0};s.career.stats.trained++;}
 const label={lane:'对线',farm:'运营',team:'团战',mind:'心态'}[k]||'属性';
 logEvent(s, r.gain>0
  ?(' 加练'+label+'：'+me.name+' '+r.note+'，属性 +'+r.gain+'（状态 '+r.form+' · 天花板 '+(r.peak||'—')+'）')
  :(' 加练'+label+'：'+me.name+' '+r.note+'（状态 '+r.form+'）'));
 return {ok:true,gain:r.gain,note:r.note};
}
function playerHeroTrainDay(s){
 if(!s||s.mode!=='player')return {ok:false,reason:''};
 if(s.trained)return {ok:false,reason:'今天已经练过了'};
 const me=myPlayer(s);if(!me)return {ok:false,reason:''};
 if(s.career&&s.career.retired)return {ok:false,reason:'职业生涯已结束'};
 const blocked=trainBlockedReason(s,me);
 if(blocked)return {ok:false,reason:blocked};
 if(me.energy<15)return {ok:false,reason:'体力不足（需 15），先休息'};
 const cand=(me.heroPool||[]).filter(h=>h.lv===2&&h.n!==me.sig);
 if(!cand.length)return {ok:false,reason:'没有可升绝活的熟练英雄（先在英雄池把英雄练到「熟练」）'};
 const h=pick(cand);h.lv=3;
 me.energy=clamp(me.energy-15,0,ENERGY_MAX);
 s.trained=true;
 logEvent(s,' 英雄特训：'+me.name+' 把 '+h.n+' 练成了绝活（战力 +8%）');
 return {ok:true,hero:h.n};
}
function playerRestDay(s){
 if(!s||s.mode!=='player')return {ok:false,reason:''};
 if(s.trained)return {ok:false,reason:'今天已经休息过了'};
 const me=myPlayer(s);if(!me)return {ok:false,reason:''};
 const injBefore=me.injury||0;
 me.energy=clamp(me.energy+55,0,ENERGY_MAX);
 me.morale=clamp(me.morale+4,20,100);
 if(me.injury>0)me.injury=Math.max(0,me.injury-2); // 与教练模式全队休息同规则：休息加速养伤
 s.trained=true;
 logEvent(s,' 休息一天：'+me.name+' 体力恢复'+(injBefore>0?'，伤情 '+injBefore+'→'+me.injury+' 天':''));
 return {ok:true};
}

function _shareWrap(fn){
 try{
 const cv=document.createElement('canvas');
 cv.width=750;cv.height=1200;
 const ctx=cv.getContext('2d');
 if(!ctx)throw new Error('canvas 不可用');
 fn(ctx,cv);
 const fname='kpl-honor-'+Date.now()+'.png';
 const doDownload=url=>{
 const a=document.createElement('a');
 a.href=url;a.download=fname;
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 };

 const showInline=url=>{
 const mb=$('#app-modal-body');
 if(!mb){toast('分享图已生成，请长按图片保存');return;}
 mb.innerHTML='<h2>分享图</h2>'
  +'<div class="hint" style="margin-bottom:8px">在图片上<b>长按 → 存储到照片</b>即可保存，也可长按转发给好友。</div>'
  +'<div class="center"><img src="'+url+'" alt="KPL 分享图" style="max-width:100%;height:auto;display:block;margin:0 auto;border-radius:8px"></div>'
  +'<div class="center mt12"><button class="btn" onclick="closeModal(\'app-modal\')">关闭</button></div>';
 $('#app-modal').classList.add('on');
 toast('分享图已生成，长按图片保存');
 };
 if(typeof blobDLBlocked==='function'&&blobDLBlocked()){
  const showData=()=>showInline(cv.toDataURL('image/png'));
  try{
   if(navigator.canShare&&typeof File!=='undefined'&&cv.toBlob){
    cv.toBlob(b=>{
     if(!b){showData();return;}
     try{
      const file=new File([b],fname,{type:'image/png'});
      if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'KPL 分享图'}).catch(showData);return;}
     }catch(e){}
     showData();
    },'image/png');
    return;
   }
  }catch(e){}
  showData();
  return;
 }

 if(cv.toBlob){
 cv.toBlob(b=>{
 if(!b){doDownload(cv.toDataURL('image/png'));return;}
 const url=URL.createObjectURL(b);
 doDownload(url);
 setTimeout(()=>URL.revokeObjectURL(url),4000);
 toast(' 分享图已生成，已开始下载');
 },'image/png');
 }else{
 doDownload(cv.toDataURL('image/png'));
 toast(' 分享图已生成，已开始下载');
 }
 }catch(e){toast(' 生成失败：'+(e.message||e));}
}

<script>
const TOUR_KEY='km_tour',HINT_KEY='km_hints',MISSION_KEY='km_missions';
const PAGE_HINTS={
 club:'推进日期打比赛：赛程/赛况/复盘都在这。转会期结束前先凑齐首发',
 lineup:'选手卡管一切：训练、身价、续约、挂牌出售、替补轮换',
 market:'买人卖人：赛前转会期自由组队，赛季中留意报价与自由市场。教练模式=应急租借与引援申请',
 train:'变强在本页：专项训练/青训营/位置改造，花钱要精打细算',
 league:'联盟战局：积分榜、赛程比分、数据榜——看看对手有多强',
 kjia:'K甲二队：替补和青训生的练级场，表现好可提拔上一队',
 union:'联盟总览：18 队战力榜与历代联盟史册',
 hall:'荣誉馆：冠军墙/王朝纪录/FMVP/最佳阵容，夺冠后可生成战绩分享图',
 biz:'钱袋子：粉丝/赞助/代言/门票——收入全靠经营，别只顾战绩',
 career:'你的故事：训练/更衣室/媒体/生涯目标，选手模式每天来这打卡'
};
const TOUR_TITLES={
 club:'俱乐部 · 比赛主场',lineup:'阵容 · 管理选手',market:'转会 · 买卖选手',
 train:'训练 · 变强',league:'联赛 · 联盟战局',kjia:'二队 · K甲练级',
 union:'联盟 · 战力榜',hall:'荣誉馆 · 收藏馆',biz:'经营 · 钱袋子',career:'生涯 · 你的故事'
};
var _tour={on:false,i:0,mode:'quick'}; // mode: quick=3步上手 | full=完整页码tour

let _missionCache=null;
function missionState(){
 if(_missionCache)return _missionCache;
 try{_missionCache=JSON.parse(localStorage.getItem(MISSION_KEY)||'{}')||{};}catch(_){_missionCache={};}
 return _missionCache;
}
function saveMissionState(m){_missionCache=m;try{localStorage.setItem(MISSION_KEY,JSON.stringify(m));}catch(_){}}
function missionDefs(mode){
 if(mode==='player')return [
  {id:'p1',day:1,title:'完成一次加练',text:'在「生涯」页练一项属性（体力不够先休息）',page:'career',
   done:s=>!!(s&&s.career&&s.career.stats&&s.career.stats.trained>=1)},
  {id:'p2',day:1,title:'更衣室走一遭',text:'「生涯」页聚餐/陪练/直播任选其一（与加练独立）',page:'career',
   done:s=>!!(s&&s.career&&s.career.stats&&s.career.stats.social>=1)},
  {id:'p3',day:2,title:'打完一场联赛',text:'「俱乐部」页开赛——比赛会自动模拟',page:'club',
   done:s=>!!(s&&s.career&&s.career.stats&&s.career.stats.matches>=1)},
 ];
 return [
  {id:'m1',day:1,title:'完成一次训练',text:'「训练」页给选手加练，或全队休息恢复',page:'train',
   done:s=>!!(s&&s.trained)},
  {id:'m2',day:1,title:'推进一场比赛',text:'「俱乐部」页开赛，赢下第一场联赛',page:'club',
   done:s=>!!(s&&(s.matchIdx>0||(s.history&&s.history.length)))},
  {id:'m3',day:2,title:'看清联盟格局',text:'打开「联赛」页看积分榜与下一对手',page:'league',
   done:s=>!!(s&&(missionState().seenLeague||s.matchIdx>=2))},
 ];
}
function markMissionSeen(key){
 const m=missionState();
 if(m[key])return; // 已是 1 就不再写盘：renderLeague 每次渲染都会调到这里
 m[key]=1;saveMissionState(m);
}
function activeMissions(s){
 const mode=(s&&s.mode)||'manager';
 const day=(s&&s.day)||1;
 if(day>3)return []; // 只提示前 3 日
 const st=missionState(); // 只读一次（原来在 filter 内部逐任务读，一次渲染 parse 好几遍）
 let dirty=false;
 const out=missionDefs(mode).filter(m=>{
  if((m.day||1)>day)return false; // 按任务标注日解锁（避免第 1 天就出现「打完一场联赛」）
  if((s&&s.preseason)&&m.id==='m2')return false; // 转会期还没开赛，先不催打比赛
  if(st['done_'+m.id])return false;
  try{if(m.done(s)){st['done_'+m.id]=1;dirty=true;return false;}}catch(_){}
  return true;
 });
 if(dirty)saveMissionState(st); // 本帧内多个任务同时达成：合并成一次写盘
 return out;
}
function missionStrip(s){
 const list=activeMissions(s);
 const seasonBar=seasonQuestStrip(s);
 if(!list.length&&!seasonBar)return '';
 const dayTag=list.length?`<span> <b>新手任务</b>（第 ${Math.min((s&&s.day)||1,3)} 天）：${list.map(m=>`<button class="btn sm" style="margin-left:4px" onclick="goPage('${m.page}')" title="${m.text}">${m.title}</button>`).join('')}</span>`:'';
 return dayTag+seasonBar;
}

const SEASONQ_KEY='km_seasonquest';
function seasonQuestState(){
 try{return JSON.parse(localStorage.getItem(SEASONQ_KEY)||'{}')||{};}catch(_){return {};}
}
function saveSeasonQuest(m){try{localStorage.setItem(SEASONQ_KEY,JSON.stringify(m));}catch(_){}}
function seasonQuestDefs(mode){
 if(mode==='player')return [
  {id:'q1',title:'加练一次',page:'career',done:s=>!!(s.career&&s.career.stats&&s.career.stats.trained>=1)},
  {id:'q2',title:'打完一场',page:'club',done:s=>!!(s.career&&s.career.stats&&s.career.stats.matches>=1)},
  {id:'q3',title:'更衣室互动',page:'career',done:s=>!!(s.career&&s.career.stats&&s.career.stats.social>=1)},
  {id:'q4',title:'关注身价/目标',page:'career',done:s=>!!(s.career&&(s.career.stats&&s.career.stats.matches>=3||s.val>=105))},
  {id:'q5',title:'打完整赛季',page:'club',done:s=>['champion','eliminated'].includes(s.phase)},
 ];
 return [
  {id:'q1',title:'凑齐 5 人首发',page:'lineup',
   done:s=>POS_ORDER.every(pos=>(s.players||[]).some(p=>p.pos===pos&&(s.lineup||[]).includes(p.id)))},
  {id:'q2',title:'结束转会期开赛',page:'club',
   done:s=>!s.preseason&&!(s.transferWindow>0)},
  {id:'q3',title:'完成一次训练',page:'train',
   done:s=>!!s.trained||(s.academy||[]).some(r=>r.attrs&&(r.attrs.lane+r.attrs.farm+r.attrs.team+r.attrs.mind)>280)},
  {id:'q4',title:'看过联赛积分榜',page:'league',
   done:s=>!!(seasonQuestState()['seenLeague_'+((s.season)||1)]|| (s.matchIdx||0)>=3)},
  {id:'q5',title:'赛季收官（任意结局）',page:'club',
   done:s=>['champion','eliminated'].includes(s.phase)||(s.board&&s.board.fired)},
 ];
}
function markSeasonQuestSeen(key){
 const m=seasonQuestState();
 const sk='seen_'+key;
 if(m[sk])return;
 m[sk]=1;saveSeasonQuest(m);
}
function seasonQuestProgress(s){
 const mode=(s&&s.mode)||'manager';
 const season=(s&&s.season)||1;
 const st=seasonQuestState();
 const key='s'+season+'_'+mode;
 if(st['doneSeason_'+key])return {done:true,total:0,list:[],season};
 let dirty=false;
 const defs=seasonQuestDefs(mode);
 const list=defs.filter(q=>{
  if(st['done_'+season+'_'+q.id])return false;
  try{if(q.done(s)){st['done_'+season+'_'+q.id]=1;dirty=true;return false;}}catch(_){}
  return true;
 });
 if(!list.length){st['doneSeason_'+key]=1;dirty=true;}

 if(S.preseason&&(S.transferWindow||0)>0)return;
 startQuickOnboard(); // 首进：3 步上手（目标驱动），完整 tour 从管理页重放

function renderTour(){

 const st=steps[_tour.i]||steps[0];
 if(st.page)goPage(st.page); // goPage 会再进 maybeStartTour：_tour.on 守卫挡住，不递归

 $('#app-modal-body').innerHTML=`<h2>${_escTxt(st.title)}</h2>
 <div class="hint" style="margin-bottom:10px">${st.text}</div>

 </div>`;

}
function tourNext(){const steps=_tour.mode==='quick'?quickSteps():tourSteps();const n=steps.length;if(_tour.i<n-1){_tour.i++;renderTour();}else tourFinish();}

<script>
function groupOfTeam(s,n){

 if(!s||!s.groups)return 'G3';
 for(const g of ['S','A','B','G1','G2','G3']){if(s.groups[g]&&s.groups[g].includes(n))return g;}
 return 'G3';
}
function sidePriority(s,a,b){
 const order={S:0,A:1,B:2,G1:0,G2:1,G3:2};
 const gA=groupOfTeam(s,a),gB=groupOfTeam(s,b);
 if(order[gA]!==order[gB])return order[gA]<order[gB]?a:b;
 const tA=(s.tables[gA]||{})[a]||{pts:0,pw:0},tB=(s.tables[gB]||{})[b]||{pts:0,pw:0};
 if(tA.pts!==tB.pts)return tA.pts>tB.pts?a:b;
 return tA.pw>=tB.pw?a:b;
}

function firstSide(s,stage,opName){
 if(stage==='regular'||!stage)return Math.random()<0.5?'blue':'red';
 const hi=sidePriority(s,s.teamName,opName);
 if(hi===s.teamName)return Math.random()<0.5?'blue':'red';
 return Math.random()<0.6?'red':'blue'; // AI 偏好红方 counter
}
function aiPickSide(s){
 const sr=s&&s.series;
 const opName=sr&&sr.opName;
 const brain=(s&&opName&&typeof aiBrain==='function')?aiBrain(s,opName)
  :(opName&&typeof aiTierOf==='function'?(aiTierOf(s,opName)==='elite'?1.3:aiTierOf(s,opName)==='weak'?0.7:1):1);

 const pSwitch=Math.max(0.2,Math.min(0.9,0.35+0.4*brain));
 if(sr&&sr._aiLastSide&&sr._aiLastGameLost&&Math.random()<pSwitch){
  return sr._aiLastSide==='blue'?'red':'blue';
 }

 const pRed=Math.max(0.42,Math.min(0.75,0.42+0.2*brain));
 return Math.random()<pRed?'red':'blue';
}

function showSideChoice(nextTitle){
 $('#app-modal-body').innerHTML=`
 <h2>败方选边</h2>
 <div class="hint" style="text-align:center;margin-bottom:14px">上一局落败，按 KPL 规则败方拥有下一局选边权（自由选蓝/红，非强制互换）</div>
 <div style="display:flex;gap:10px;justify-content:center">
 <button class="btn primary" style="flex:1" onclick="setSide('blue')">蓝方 · 先ban先选<br><small style="color:var(--dim)">第一轮主动权 · 一抢版本强势</small></button>
 <button class="btn gold" style="flex:1" onclick="setSide('red')">红方 · 后手counter<br><small style="color:var(--dim)">第二轮针对性选人 · 克制对方</small></button>
 </div>`;
 $('#app-modal').classList.add('on');
 window._sideNext=nextTitle||'';
}
function setSide(side){
 if(S.series)S.series.side=side;
 closeModal('app-modal');
 openBP(window._sideNext||'',playGame);
}

function bpEffective(v){
 const myLs=rosterLineup(S);
 let my=teamPower(S,v.myPicks||null);

 let op=(v.opRoster&&v.opRoster.length)?aiRosterPower(v.opRoster,S,v.opName):powerOf(S,v.opName);
 const notes=[];
 if(!v.isPeak){
 let banCut=0;
 (v.myBans||[]).forEach(h=>{
 const real=(v.opRoster||[]).some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.usedOpp||[]).includes(h); // 对方本系列赛已用：BAN不到，只算池外价
 banCut+=real?0.02:0.005;
 });
 if(banCut){op*=1-banCut;notes.push('我方 BAN×'+(v.myBans||[]).length+' 对方-'+Math.round(banCut*100)+'%');}
 let myCut=0;
 (v.oppBans||[]).forEach(h=>{
 const real=myLs.some(p=>(p.heroPool||[]).some(x=>x.n===h))&&!(v.used||[]).includes(h);
 myCut+=real?0.01:0.002;
 });
 if(myCut){my*=1-myCut;notes.push('对方 BAN×'+(v.oppBans||[]).length+' 我方-'+Math.round(myCut*100)+'%');}
 const hot=Object.values(v.oppPicks||{}).filter(h=>heroOf(h)&&heroOf(h).hot).length;
 if(hot){op*=1+hot*0.02;notes.push('对方×'+hot+' +'+(hot*2)+'%');}
 if(v.side==='red'){my*=1.02;notes.push('红方counter+2%');}
 else{op*=1.02;notes.push('对方counter+2%');}

 const mySt=dynastyStreak(S,S.teamName),opSt=dynastyStreak(S,v.opName);
 if(mySt){op*=1+mySt*0.02;notes.push('对手研究我方'+mySt+'连冠 +'+(mySt*2)+'%');}
 if(opSt){my*=1+opSt*0.02;notes.push('我方研究对方'+opSt+'连冠 +'+(opSt*2)+'%');}
 }
 return {my:Math.round(my),op:Math.round(op),notes};
}

function bpEffPreview(d){
 const myPicks={...d.myPicks};
 myOpenPositions(d).forEach(pos=>{
 const best=bestHeroFor(d,pos,myCandidates(d,pos));
 if(best)myPicks[pos]=best;
 });
 const taken=takenSet(d),oppPicks={...d.oppPicks};
 (d.oppRoster||[]).forEach(p=>{
 if(p.injury>0)return; // 伤员不计入对方可选估算
 if(oppPicks[p.pos])return;
 let best=null,bp=-1;
 (p.heroPool||[]).forEach(x=>{
 const h=heroOf(x.n);
 if(h&&h.pos.includes(p.pos)&&!taken.has(x.n)&&!(d.usedOpp||[]).includes(x.n)){const pw=playerPower(p,x.n);if(pw>bp){bp=pw;best=x.n;}}
 });
 if(best)oppPicks[p.pos]=best;
 });
 return bpEffective({myPicks,myBans:d.myBans,oppPicks,oppBans:d.oppBans,side:d.sr.side,isPeak:d.isPeak,opName:d.sr.opName,opRoster:d.oppRoster,used:d.used,usedOpp:d.usedOpp});
}

function kplDraftSteps(){
 return [ // {s:蓝/红, t:ban/pick, n:连选手数} —— 共 8 ban + 10 pick = 18 手
 {s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},
 {s:'B',t:'pick',n:1},{s:'R',t:'pick',n:2},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
 {s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},{s:'R',t:'ban',n:1},{s:'B',t:'ban',n:1},
 {s:'R',t:'pick',n:1},{s:'B',t:'pick',n:2},{s:'R',t:'pick',n:1},
 ];
}
function expandSteps(sr,isPeak){
 if(isPeak)return [{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'},{side:'M',type:'pick'}];
 const myIsBlue=(sr.side!=='red');
 const steps=[];
 kplDraftSteps().forEach(st=>{
 const mine=(st.s==='B')===myIsBlue;
 for(let i=0;i<st.n;i++)steps.push({side:mine?'M':'O',type:st.t});
 });
 return steps; // 18 手，side: M=我方 O=对方
}

function natBusy(s,p){return !matchEligible(s,p);} // 统一不可出战：伤停/集训/未满18岁

function lineupNoGo(s){
 return POS_ORDER.filter(pos=>{
 const p=rosterLineup(s).find(x=>x.pos===pos);
 return !p||natBusy(s,p);
 });
}
function noGoDetail(s,noGo){
 return noGo.map(pos=>{
 const p=rosterLineup(s).find(x=>x.pos===pos);
 return POS[pos][0]+(p?('（'+p.name+' '+(matchIneligibleReason(s,p)||'无法出战')+'）'):'（无人）');
 }).join('、');
}
function autoFillLineup(s){
 POS_ORDER.forEach(pos=>{
 const cur=s.lineup.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);
 const inPos=cur.find(p=>p.pos===pos);
 if(inPos&&natBusy(s,inPos)){ // 伤员/集训/未成年/K甲/外租一律自动下场（KPL 不因伤停推迟）
 const cands=s.players.filter(p=>!s.lineup.includes(p.id)&&p.pos===pos&&!natBusy(s,p))
 .sort((a,b)=>playerPower(b,b.sig)-playerPower(a,a.sig)); // 替补择优上场
 const fit=cands[0];
 const why=matchIneligibleReason(s,inPos)||'无法出战';
 if(fit){
 s.lineup[s.lineup.indexOf(inPos.id)]=fit.id;
 logEvent(s,' '+inPos.name+'（'+why+'）'+fit.name+' 顶替首发（'+POS[pos][0]+'）');
 return;
 }

 s.lineup.splice(s.lineup.indexOf(inPos.id),1);
 logEvent(s,' '+inPos.name+' '+why+'且无替补可顶——'+POS[pos][0]+'空缺！可紧急补签，比赛照常进行');
 return;
 }
 if(!cur.some(p=>p.pos===pos)){
 const cands=s.players.filter(p=>!s.lineup.includes(p.id)&&p.pos===pos&&!natBusy(s,p))
 .sort((a,b)=>playerPower(b,b.sig)-playerPower(a,a.sig));
 const bench=cands[0];
 if(bench){s.lineup.push(bench.id);logEvent(s,' '+bench.name+' 递补进入首发（'+POS[pos][0]+'）');}
 }
 });

 s.lineup=(s.lineup||[]).filter(id=>{
 const p=s.players.find(x=>x.id===id);
 return p&&!natBusy(s,p);
 });
}

function optimizeLineup(s){
 try{if(!simpleMode())return;}catch(e){return;}
 POS_ORDER.forEach(pos=>{
  const pool=s.players.filter(p=>p.pos===pos&&!natBusy(s,p)&&(p.kjia||0)<=0);
  if(!pool.length)return;
  const best=pool.slice().sort((a,b)=>playerPower(b,b.sig)-playerPower(a,a.sig))[0];
  const idx=s.lineup.findIndex(id=>{
   const p=s.players.find(x=>x.id===id);
   return p&&p.pos===pos;
  });
  const cur=idx>=0?s.players.find(p=>p.id===s.lineup[idx]):null;
  if(!best||(cur&&best.id===cur.id))return;
  if(cur&&playerPower(best,best.sig)<=playerPower(cur,cur.sig))return;
  if(s.lineup.includes(best.id))return; // 已在首发其他位：不跨位强换
  if(idx>=0)s.lineup[idx]=best.id;
  else s.lineup.push(best.id);
 });
}

function resetOppEnergy(s,opName){
 ensureAiRosters(s,opName);
 const r=s.aiRosters[opName]||[];
 r.forEach(p=>{p.energy=ENERGY_MAX;});
 if(!s.aiInj)s.aiInj={};
 const inj=s.aiInj[opName]=s.aiInj[opName]||{};
 r.forEach(p=>{
 if(p.id.startsWith('ac_'))return; // 递补青训不再受伤
 if(inj[p.id]>0){
 inj[p.id]--;
 }else if(Math.random()<0.06){
 inj[p.id]=rnd(1,2); // 缺席 1-2 个系列赛
 logEvent(s,' 对方 '+p.name+' 赛前训练受伤，将缺阵 '+inj[p.id]+' 个系列赛');
 }
 });
 POS_ORDER.forEach(pos=>{
 const real=r.filter(p=>p.pos===pos&&!p.id.startsWith('ac_'));
 const sick=real.some(p=>inj[p.id]>0);
 const fill=r.find(p=>p.pos===pos&&p.id.startsWith('ac_'));
 if(sick&&!fill){
 const usedNames=rookieUsedNames(s); // 全局查重：避免与玩家/其他 AI 队青训重名
 r.forEach(x=>usedNames.add(x.name));
 const f=genPlayer(genAcademyDef(pos,usedNames,s.season));
 r.push(f);
 const who=real.find(p=>inj[p.id]>0);
 logEvent(s,' '+opName+' 青训 '+f.name+' 顶替伤停的 '+who.name+'（'+POS[pos][0]+'）');
 }else if(real.length&&!sick&&fill){
 r.splice(r.indexOf(fill),1); // 伤愈且有健康主力在位：递补退场

 }
 });
 s.aiPower[opName]=aiRosterPower(r,s,opName);
}

function showNoGoModal(title,onConfirm,noGo){
 _noGoRetry={title,onConfirm};

 try{if(typeof emergencyFillRoster==='function')emergencyFillRoster(S);}catch(e){}

function uiNoGoEmergency(){
 if(typeof emergencyFillRoster==='function')emergencyFillRoster(S); // 自动模式同款：不花钱、按位置补自由球员
 autoFillLineup(S);
 closeModal('app-modal');
 const r=_noGoRetry||{};_noGoRetry=null;
 if(lineupNoGo(S).length){toast(' 紧急补签后仍有人无法出战（集训/伤停），请去转会市场签约或提拔青训');renderAll();return;}
 save();renderAll();

let _noGoRetry=null; // 缺位处理弹窗记住原来的 BP 回调，补人后直接重试
function openBP(title,onConfirm){
 autoFillLineup(S);
 const ls=rosterLineup(S);
 const noGo=lineupNoGo(S);
 if(noGo.length){showNoGoModal(title,onConfirm,noGo);return;}
 const sr=S.series;
 const isPeak=sr&&sr.max>=fmtOf(S).peakBoMin&&sr.mw+sr.ow===sr.max-1; // 巅峰对决：BO7 3:3 / BO9 4:4
 window._draft={
 onConfirm,sr,ls,title,isPeak,
 used:(sr&&!isPeak&&sr.used)?sr.used.slice():[],
 usedOpp:(sr&&!isPeak&&sr.usedOpp)?sr.usedOpp.slice():[],
 steps:expandSteps(sr,isPeak),idx:0,
 myBans:[],oppBans:[],myPicks:{},oppPicks:{},curPos:null,
 oppRoster:isPeak?[]:(ensureAiRosters(S,sr.opName)||[]),
 };
 renderBP();
}

function draftAction(d){
 while(d.idx<d.steps.length&&d.steps[d.idx].side==='O'){
 aiDraftStep(d);d.idx++;
 }
 if(d.idx>=d.steps.length)return {type:'done'};
 const st=d.steps[d.idx];
 return {type:st.type,side:'M'};
}

function takenSet(d){
 return new Set([...d.used,...d.myBans,...d.oppBans,...Object.values(d.myPicks),...Object.values(d.oppPicks)]);
}
function myCandidates(d,pos){
 const p=(d.ls||[]).find(x=>x.pos===pos);
 if(!p)return [];
 const taken=takenSet(d);
 const cand=p.heroPool.filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n));
 if(cand.length)return cand;

 return HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)).map(h=>({n:h.n,lv:0}));
}

function ensureHeroInPool(p,hero){
 if(p&&!p.heroPool.some(x=>x.n===hero))p.heroPool.push({n:hero,lv:0});
}
function banCandidates(d){
 const taken=takenSet(d);
 return HEROES.map(h=>h.n).filter(n=>!taken.has(n));
}
function myOpenPositions(d){
 return POS_ORDER.filter(pos=>!(pos in d.myPicks)&&d.ls.some(x=>x.pos===pos));
}
function bestHeroFor(d,pos,avail){
 const p=(d.ls||[]).find(x=>x.pos===pos);
 if(!p||!avail.length)return null;
 const s=(typeof S!=='undefined')?S:null;
 const opts={
  focusType:tacticFocusType(s),
  sigW:1.0,
  enemyPicks:Object.values(d.oppPicks||{}),
  behind:(d.sr&&d.sr.ow||0)>(d.sr&&d.sr.mw||0),
 };
 let best=avail[0].n,bs=-1;
 avail.forEach(h=>{
  const v=pickUtility(d,p,h.n,Object.assign({counterW:1.2},opts));
  if(v>bs){bs=v;best=h.n;}
 });
 return best;
}

function threatOf(d,h,side){
 if(side==='opp'&&(d.usedOpp||[]).includes(h))return null; // 对方本系列赛已用：本局选不了，无威胁
 if(side!=='opp'&&(d.used||[]).includes(h))return null; // 我方已用同理
 const roster=side==='opp'?(d.oppRoster||[]):d.ls;
 let bp=null;
 roster.forEach(p=>{
 if(p.injury>0)return; // 伤员无法出战，不构成威胁
 if((p.heroPool||[]).some(x=>x.n===h)&&heroOf(h)&&heroOf(h).pos.includes(p.pos)){
 const pw=playerPower(p,h);if(bp==null||pw>bp)bp=pw;
 }
 });
 return bp;
}

function heroTypeOf(h){
 const d=heroOf(h);
 return (d&&d.t)||'team';
}
function typeBeats(a,b){
 return (a==='team'&&b==='farm')||(a==='farm'&&b==='mind')
  ||(a==='mind'&&b==='lane')||(a==='lane'&&b==='team');
}

function tacticFocusType(s){
 const id=(s&&s.tactic)||'balanced';
 if(id==='balanced')return null;
 return id; // farm/team/lane/mind 与英雄 t 同一套枚举
}

function banScore(d,h,opts){
 opts=opts||{};
 const threatSide=opts.threatSide||'opp';
 const denyUsed=threatSide==='opp'?(d.usedOpp||[]).includes(h):(d.used||[]).includes(h);
 const hd=heroOf(h)||{};
 const th=threatOf(d,h,threatSide)||0;
 let score=th;
 if(hd.hot&&!denyUsed)score+=2;
 if(denyUsed)score-=1; // 该侧本系列赛已用：本局选不了，BAN=浪费
 if(opts.watchSig&&opts.sigSet&&opts.sigSet.has(h))score+=opts.watchSig||0;
 if(opts.focusType&&typeBeats(heroTypeOf(h),opts.focusType))score+=1.5;
 if((hd.pos||[]).length>1)score+=0.8;
 if(opts.scarcity&&opts.scarcity[h]!=null)score+=opts.scarcity[h];
 return score;
}

function pickUtility(d,p,h,opts){
 opts=opts||{};
 const hd=heroOf(h)||{};
 const myT=heroTypeOf(h);
 let score=playerPower(p,h);
 if(hd.hot)score+=1.2;
 if(h.n===p.sig)score+=opts.sigW||0;
 const focus=opts.focusType;
 if(focus&&myT===focus)score+=1.4;
 if(focus&&typeBeats(myT,focus))score-=0.4; // 被我战术克制的英雄略降（对内不协调）

 let counterHits=0;
 (opts.enemyPicks||[]).forEach(eh=>{
  const et=heroTypeOf(eh);
  if(typeBeats(myT,et))counterHits++;
  if(typeBeats(et,myT))score-=0.6; // 对面已选克制我
 });
 score+=counterHits*(opts.counterW||1.2);

 if(opts.enemyThreat&&opts.enemyThreat[h]!=null)score+=Math.min(2.5,opts.enemyThreat[h]/25);

 if((hd.pos||[]).length>1)score+=0.5;
 if(opts.behind&&hd.hot)score+=(opts.behindBoost||0)*0.5;
 return score;
}
function bestBanFor(d){
 const s=(typeof S!=='undefined')?S:null;
 const focusType=tacticFocusType(s);
 const mySig=new Set((d.ls||[]).map(p=>p&&p.sig).filter(Boolean));
 let best=null,bs=-1;
 banCandidates(d).forEach(h=>{
  const v=banScore(d,h,{threatSide:'opp',focusType,sigSet:mySig,watchSig:1.2});
  if(v>bs){bs=v;best=h;}
 });
 return best;
}

function aiDraftStep(d){
 const st=d.steps[d.idx];
 const sr=d.sr||{};
 const s=(typeof S!=='undefined')?S:null;
 const opName=sr.opName;
 const brain=(s&&opName&&typeof aiBrain==='function')?aiBrain(s,opName)
  :(s&&opName&&typeof aiTierOf==='function'?(aiTierOf(s,opName)==='elite'?1.3:aiTierOf(s,opName)==='weak'?0.7:1):1);
 const behind=(sr.ow||0)>(sr.mw||0); // 系列赛落后：智能越高越会加压
 const noise=Math.max(0.25,1.9-1.2*brain); // 高难度=低噪声=决策更稳
 const behindBoost=behind?Math.max(0,2.8*(brain-0.5)):0;
 const sigW=Math.max(0.4,2.6*(brain-0.45)); // 盯防招牌：低难度几乎不盯
 const mySig=new Set((d.ls||[]).map(p=>p&&p.sig).filter(Boolean));

 const myFocus=tacticFocusType(s);
 const oppFocus=myFocus?(Object.keys({team:0,farm:0,lane:0,mind:0}).find(t=>typeBeats(t,myFocus))||null):null;
 if(st.type==='ban'){

  const avail=banCandidates(d).filter(h=>!((d.usedOpp||[]).includes(h)));
  let best=null,bs=-1;
  avail.forEach(h=>{
   let score=banScore(d,h,{threatSide:'me',focusType:myFocus,sigSet:mySig,watchSig:sigW});
   score+=Math.random()*noise;
   if(behind&&(threatOf(d,h,'me')||0)>0)score+=behindBoost;
   if(score>bs){bs=score;best=h;}
  });
  if(best)d.oppBans.push(best);
  return;
 }

 const enemyPicks=Object.values(d.myPicks||{});
 const enemyThreat={};
 banCandidates(d).forEach(h=>{const th=threatOf(d,h,'me');if(th!=null)enemyThreat[h]=th;});
 let bestPos=null,bestHero=null,bs=-1;
 POS_ORDER.forEach(pos=>{
  if(pos in d.oppPicks)return;
  const p=(d.oppRoster||[]).find(x=>x.pos===pos&&x.injury<=0);
  if(!p)return;
  const taken=takenSet(d),oppUsed=d.usedOpp||[];
  let cand=(p.heroPool||[]).filter(h=>heroOf(h.n)&&heroOf(h.n).pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n));
  if(!cand.length)cand=HEROES.filter(h=>h.pos.includes(pos)&&!taken.has(h.n)&&!oppUsed.includes(h.n)).map(h=>({n:h.n,lv:0}));
  cand.forEach(h=>{
   const score=pickUtility(d,p,h.n,{
    focusType:oppFocus,
    sigW:Math.max(0.4,1.6*(brain-0.4)),
    enemyPicks,
    enemyThreat,
    counterW:0.8+1.2*(brain-0.5),
    behind,
    behindBoost,
   })+Math.random()*noise;
   if(score>bs){bs=score;bestPos=pos;bestHero=h.n;}
  });
 });
 if(bestPos){d.oppPicks[bestPos]=bestHero;ensureHeroInPool((d.oppRoster||[]).find(x=>x.pos===bestPos&&x.injury<=0),bestHero);}
}

function applyBp(sels){

}

function singleGame(my,op,opts){
 opts=opts||{};
 const pWin=winChance(my,op);
 const w=Math.random()<pWin;

 let gold=(my-op)*0.03;
 let myK=0,opK=0;
 const evs=[];
 const phases=[
  {key:'lane',n:2,vol:0.8,tag:'对线期'},
  {key:'obj',n:3,vol:1.0,tag:'资源团'},
  {key:'tf',n:3,vol:1.25,tag:'大团'}
 ];
 phases.forEach(ph=>{
  for(let i=0;i<ph.n;i++){
   const swing=Math.tanh(gold/10);
   const p=clamp(0.28+pWin*0.44+swing*0.28,0.12,0.88);
   const side=Math.random()<p;
   const vol=ph.vol;
   let kills=0;const r=Math.random();
   if(ph.key==='lane')kills=r<0.45?0:r<0.8?1:2;
   else if(ph.key==='obj')kills=r<0.25?0:r<0.65?1:r<0.9?2:3;
   else kills=r<0.15?0:r<0.45?1:r<0.75?2:r<0.92?3:4;
   let flip=false;
   if(!side&&gold>6&&ph.key==='tf'&&Math.random()<0.18)flip=true;
   const gain=Math.max(0,kills)*vol;
   if(side||flip){
    const k=flip?Math.max(1,kills):kills;
    myK+=k;opK+=flip?0:Math.floor(kills*0.3);
    gold+=1.2+gain+(ph.key==='obj'?1.5:0)+(ph.key==='tf'?1.8:0);
    evs.push({tag:ph.tag,side:1,k:k,flip});
   }else{
    const k=kills;
    opK+=k;myK+=Math.floor(kills*0.3);
    gold-=1.2+gain+(ph.key==='obj'?1.5:0)+(ph.key==='tf'?1.8:0);
    evs.push({tag:ph.tag,side:-1,k,flip});
   }
   gold=clamp(gold,-14,14);
  }
 });

 if(w&&myK<=opK)myK=opK+1+rnd(0,2);
 if(!w&&opK<=myK)opK=myK+1+rnd(0,2);
 const finalGap=Math.abs(myK-opK);
 if(Math.abs(gold)>=8&&finalGap<3){
  if(w)myK=opK+3+rnd(0,2);else opK=myK+3+rnd(0,2);
 }else if(Math.abs(gold)<=2&&finalGap>4){
  if(w)myK=opK+1+rnd(0,1);else opK=myK+1+rnd(0,1);
 }
 myK=clamp(myK,3,28);opK=clamp(opK,3,28);
 return {w,myK,opK,gold:Math.round(gold),pWin,evs};
}

function gamePerform(winner){
 const ls=rosterLineup(S);
 if(!ls.length)return null;
 let best=null,bs=-1;
 ls.forEach(p=>{
 const pw=playerPower(p,pickedHero(S,p));
 const k=rnd(1,12),d=rnd(0,6),a=rnd(0,12);
 p._lk=k;p._ld=d;p._la=a; // 本局个人数据（选手生涯·「我的表现」汇总用）
 const score=k*3+a*2-d*1.5+(winner?6:2)+pw*0.5+rnd(0,3);
 const perf=(k*3+a*2-d*1.5)/25+(winner?0.35:-0.15);
 p.val=clamp(Math.round((p.val||100)*0.92+perf*8),70,150);
 p.kTotal=(p.kTotal||0)+k;p.dTotal=(p.dTotal||0)+d;p.aTotal=(p.aTotal||0)+a; // 赛季累计（场均展示用）
 if(score>bs){bs=score;best={id:p.id,name:p.name,k,d,a};}
 });
 return best;
}

}

function maybeUpsetLoss(s,finalWin,opName){

 if(!my||!op||my<op*1.15)return false;

 }
}

function coachPickLineup(s){ // 教练排首发：同位置健康者中取战力更强者（体力/士气实时计入）
 if(s.mode!=='player')return;
 const me=myPlayer(s);
 if(!me)return;

 if(!matchEligible(s,me)){
 if(me.injury>0&&!s._meOutNoted){logEvent(s,' 伤停报告：'+me.name+'（'+me.injury+' 天恢复）本场缺席');s._meOutNoted=true;}
 if(s.lineup.includes(me.id))s.lineup.splice(s.lineup.indexOf(me.id),1);
 return;
 }
 s._meOutNoted=false;
 const rival=s.players.filter(p=>p.pos===me.pos&&p.id!==me.id&&matchEligible(s,p))
 .sort((a,b)=>playerPower(b)-playerPower(a))[0];
 const li=s.lineup.indexOf(me.id);
 if(!rival){if(li<0)s.lineup.push(me.id);return;}
 const myPow=playerPower(me,(s.pick&&s.pick[me.pos])||me.sig);
 const rivPow=playerPower(rival,rival.sig);
 if(myPow>=rivPow){
 if(li<0){const ri=s.lineup.indexOf(rival.id);if(ri>=0)s.lineup[ri]=me.id;else s.lineup.push(me.id);}
 }else if(li>=0)s.lineup[li]=rival.id;
}

function playerAutoSeries(s,opName,bo){ // 自动打完整场系列赛，返回 series 形状对象（finishSeries 可直接消费）
 coachPickLineup(s);
 autoFillLineup(s); // 我方不可出战时同位置替补顶上；转会/伤停/集训后不留空位
 resetOppEnergy(s,opName);
 const sr={used:[],usedOpp:[],mw:0,ow:0,max:bo,logs:[],myName:s.teamName,opName,side:firstSide(s,'regular',opName)};
 if(typeof annualMarkSeriesStart==='function')annualMarkSeriesStart(s,sr); // 年总：记首发/出场
 const need=Math.ceil(bo/2);
 let guard=0,myApps=0,myK=0,myD=0,myA=0,myMvp=0;
 while(sr.mw<need&&sr.ow<need&&guard++<bo+2){
 if(typeof annualAutoRotate==='function'){try{annualAutoRotate(s,sr);}catch(e){}} // 大师组官方轮换
 const my=teamPower(s),op=powerOf(s,opName);
 const g=singleGame(my,op);
 rosterLineup(s).forEach(p=>{p.energy=clamp(p.energy-8,0,ENERGY_MAX);p.caps=(p.caps||0)+1;});
 if(g.w)sr.mw++;else sr.ow++;
 if(typeof annualMarkPlayed==='function'){try{annualMarkPlayed(s,sr);}catch(e){}}
 const mvp=gamePerform(g.w);
 if(mvp){const mp=s.players.find(x=>x.id===mvp.id);if(mp){mp.mvp=(mp.mvp||0)+1;mp.popularity=Math.min(99,(mp.popularity||0)+2);mp.val=clamp((mp.val||100)+3,70,150);}}
 if(mvp){sr.mvpIds=(sr.mvpIds||[]).concat(mvp.id);sr.mvpKda=(sr.mvpKda||[]).concat(mvp.k+'/'+mvp.d+'/'+mvp.a);}
 const me=myPlayer(s);
 const meIn=me&&rosterLineup(s).some(p=>p.id===me.id);
 if(meIn){myApps++;myK+=me._lk||0;myD+=me._ld||0;myA+=me._la||0;if(mvp&&mvp.id===me.id)myMvp++;}
 sr.logs.push('第'+(sr.mw+sr.ow)+'局  我方 '+g.myK+'-'+g.opK+' '+(g.w?'击败':'憾负')+' '+opName+' ｜ 总比分 '+sr.mw+':'+sr.ow+(mvp?' ｜ MVP：'+mvp.name+'（'+mvp.k+'/'+mvp.d+'/'+mvp.a+'）':''));
 sr.logs.push(...genMatchStory(sr,g,mvp));
 }
 if(myApps)sr.logs.push(' 本场你的数据：出战 '+myApps+' 局 · 合计 '+myK+'/'+myD+'/'+myA+(myMvp?' · 拿下 '+myMvp+' 次单局MVP':'（尚无单局MVP）'));
 return sr;
}

;(function aiCoachLogWrap(){
  const _pick=coachPickLineup;
  coachPickLineup=function(s){
    const r=_pick.apply(this,arguments);
    try{if(typeof gameLog!=='undefined')gameLog.info('aiCoach','pickLineup',{mode:s&&s.mode,lineup:s&&s.lineup&&s.lineup.slice()});}catch(e){}

    return sr;

})();

function yearPlaceRank(place){

 if(!place)return 12;
 if(place==='冠军'||place==='金牌')return 1;
 if(place==='亚军'||place==='银牌')return 2;
 if(place==='四强'||place==='铜牌')return 3;
 if(/^5-6/.test(place))return 5.5;
 if(/^7-8/.test(place))return 7.5;
 if(/^9-10/.test(place))return 9.5;
 if(/^11-12/.test(place))return 11.5;

 return 12;
}
function yearTrendSvg(stages){
 if(!stages||stages.length<2)return '';
 const W=520,H=140,PAD_L=40,PAD_R=28,PAD_T=20,PAD_B=30;
 const ranks=stages.map(st=>yearPlaceRank(st.place));
 const yMin=1,yMax=16;
 const x=i=>PAD_L+i*(W-PAD_L-PAD_R)/(stages.length-1);
 const y=r=>PAD_T+(r-yMin)/(yMax-yMin)*(H-PAD_T-PAD_B);
 const pts=ranks.map((r,i)=>x(i)+','+y(r).toFixed(1)).join(' ');
 const gridY=[1,4,8,12,16].map(g=>{
 const gy=y(g).toFixed(1);
 return `<line x1="${PAD_L}" y1="${gy}" x2="${W-PAD_R}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>
 <text x="${PAD_L-6}" y="${gy}" text-anchor="end" dominant-baseline="central" fill="var(--dim)" font-size="10">${g===1?'冠军':g===16?'垫底':g+'名'}</text>`;
 }).join('');
 const dots=ranks.map((r,i)=>{
 const cx=x(i),cy=y(r);
 const col=r<=2?'var(--gold)':r<=4?'var(--cyan)':r<=8?'var(--green)':'var(--dim)';

 const tx=Math.min(Math.max(cx,PAD_L+18),W-PAD_R-18);
 const label=_escTxt(String(stages[i].place||'—'));
 const short=_escTxt(String(stages[i].ev||'').replace(/KPL年度总决赛/,'年总').replace(/电竞世界杯/,'EWC').replace(/挑战者杯/,'挑杯').slice(0,6));
 return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${col}"/>
 <text x="${tx.toFixed(1)}" y="${(cy-10).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="10" font-weight="600">${label}</text>
 <text x="${tx.toFixed(1)}" y="${H-8}" text-anchor="middle" fill="var(--dim)" font-size="10">${short}</text>`;
 }).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block;max-width:${W}px;margin:0 auto" role="img" aria-label="年度成绩走势">
 ${gridY}
 <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
 ${dots}
 </svg>`;
}

function decoratePanelMarks(root){

 root.querySelectorAll('.panel>h3').forEach(h=>{

function boardLocked(){return !!(S&&S.board&&S.board.fired);}
function seatLocked(){return !!(S&&S.seatLost);}
function uiGuard(msg){
 if(boardLocked()){try{toast(msg||'你已被董事会解约，执教生涯结束');}catch(_){}return true;}
 if(seatLocked()){try{toast(msg||'临时席位被收回，已降入 K甲——执教生涯结束');}catch(_){}return true;}
 return false;
}
function uiSave(){if(!requireSave('存档'))return;if(save())toast('存档成功');}
function playerRetired(s){return !!(s&&s.mode==='player'&&s.career&&s.career.retired);}
function uiNextDay(s){if(uiGuard())return;if(!requireSave('推进一天'))return;if(playerRetired(s)){toast('职业生涯已退役——「生涯」页查看履历，或重新开始');return;}nextDay(s);renderAll();}
function uiStartMatch(){if(uiGuard())return;if(!requireSave('开赛'))return;if(playerRetired(S)){toast('职业生涯已退役');return;}startMatch();}
function uiStartCup(s){if(uiGuard())return;startCup(s);}
function uiSkipTransfer(s){if(uiGuard())return;skipTransferWindow(s);}
function uiEndPreseason(s){if(uiGuard())return;endPreseason(s);}

function cupMatchRow(m,tag){
 return `<div class="match" style="margin-bottom:6px"><div class="vs"><span class="tname" style="font-size:13px">${tag?tag+'：':''}${m.a?m.a:'待定'} vs ${m.b?m.b:'待定'}</span></div><div class="score" style="font-size:12px">${m.r?m.r+' 晋级':'待赛'}</div></div>`;
}
function hasMyPending(list,team){
 return (list||[]).some(m=>m&&!m.r&&(m.a===team||m.b===team));
}

function playerBusy(s,p){
 return playerStatus(p,s).busy; // 原实现漏传 s，丢掉了 natCamping(s,p) 分支；改用 busy 单一出口
}

function uiAdvanceCalendar(s){
 if(uiGuard())return;
 if(!requireSave('推进赛历'))return;
 const label=calendarNextLabel(s)||'推进赛历';

 if(/年度收官|年度总决赛|新赛季/.test(label)){
 if(!confirmSoft(label.replace(/^[\s]*/,'')+'？\n继续将推进年度赛历（可能直接进入下一年结算）。'))return;
 }
 advanceCalendar(s);
}

function nextAction(s){
 if(!s||!s.players||!s.players.length){

      return {type:'uiGoMarket',label:'去转会市场 · 买人/签自由球员',fn:'uiGoMarket'};
  }
 if(playerRetired(s))return null;
 if(s.board&&s.board.fired)return null;
 if(s.preseason)return {type:'endPreseason',label:' 结束转会期 · 开始赛季',fn:'uiEndPreseason'};
 const p=s.phase;
 if(p==='r1'||p==='r2'||p==='r3'){
 if(!(s.schedule||[])[s.matchIdx])return null;
 return s.mode==='player'
 ?{type:'startPlayerMatch',label:' 出战比赛 · 教练指挥',fn:'startPlayerMatch'}
 :{type:'startMatch',label:' 赛前准备 · 调整阵容 / BP 开赛',fn:'uiStartMatch'};
 }
 if(p==='card'){
 const matches=(s.card&&s.card.matches)||[];
 const myPending=matches.some(m=>m&&!m.r&&(m.a===s.teamName||m.b===s.teamName));
 if(myPending||(s.card&&s.card.idx<matches.length))return {type:'startCard',label:' 进行卡位赛',fn:'startCard'};
 return null;
 }
 if(p==='playoff'){
 const pf=s.playoff;
 if(!pf||!pf.final)return null;

 if(pf.final.r&&!pf.champ)return {type:'startPlayoff',label:' 季后赛结算 · 推进赛历',fn:'startPlayoff'};
 if(pf.final.r)return null;
 return {type:'startPlayoff',label:' 进行季后赛 / 快进',fn:'startPlayoff'};
 }
 if(p==='challenger'){
 const c=s.challenger;
 if(!c){

     return {type:'advanceCalendar',label:'推进赛历',fn:'uiAdvanceCalendar'};
 }
 if(c.champ)return null;
 return {type:'startCup',label:' 进行挑战者杯',fn:'uiStartCup'};
 }
 if(p==='ewc'){
 const e=s.ewc;
 if(!e||e.champ)return null;
 return {type:'startCup',label:' 进行 EWC',fn:'uiStartCup'};
 }
 if(p==='asiad'){
 const a=s.ag;
 if(!a||a.champ)return null;
 return {type:'asiadStep',label:' 推进亚运会',fn:'uiAsiadStep'};
 }
 if(p==='annual'){
 const a=s.annual;
 if(!a)return null;

 if(yearRollPending(s))return {type:'finishAnnual',label:' 进入新赛季 · 年度轮换',fn:'uiFinishAnnual'};
 if(a.po&&a.po.champ)return null; // 已轮换但 phase 残留：无需动作
 return {type:'startCup',label:' 进行年度总决赛',fn:'uiStartCup'};
 }
 if(p==='champion'||p==='eliminated'){
 return {type:'advanceCalendar',label:calendarNextLabel(s)||' 推进赛历',fn:'uiAdvanceCalendar'};
 }
 return null;
}
function uiDoNextAction(s){
 if(uiGuard())return;

 if(typeof s==='string')s=S;
 const a=nextAction(s||S);
 if(!a){toast('当前没有可进行的比赛');return;}
 if(a.fn==='uiEndPreseason')uiEndPreseason(s||S);
 else if(a.fn==='uiStartMatch')uiStartMatch();
 else if(a.fn==='startPlayerMatch'){if(!requireSave('出战'))return;startPlayerMatch();}
 else if(a.fn==='startCard')startCard();
 else if(a.fn==='startPlayoff')startPlayoff();
 else if(a.fn==='uiStartCup')uiStartCup(s||S);
 else if(a.fn==='uiFinishAnnual')uiFinishAnnual(s||S);
 else if(a.fn==='uiAsiadStep')uiAsiadStep(s||S);
 else if(a.fn==='uiAdvanceCalendar')uiAdvanceCalendar(s||S);
}
function uiFinishAnnual(s){
 if(uiGuard())return;
 try{finishAnnual(s||S,true);}
 catch(e){toast('年度轮换失败：'+(e&&e.message||e));return;}
 save();renderAll();
}
function uiAsiadStep(s){if(uiGuard())return;asiadStep(s);}

function thSortVal(txt){
 const t=String(txt).replace(/[^0-9.万亿千%-]/g,'');
 let n=parseFloat(t);
 if(isNaN(n))return String(txt).trim();
 if(/万亿|千万/.test(t))n*=10000;else if(/亿/.test(t))n*=100000000;else if(/万/.test(t))n*=10000;
 else if(/千/.test(t))n*=1000;
 return n;
}
document.addEventListener('click',e=>{
 const th=e.target&&e.target.closest&&e.target.closest('table.tbl th');
 if(th&&th.parentNode.rowIndex===0)thSort(th); // 只响应首行表头
});
function thSort(th){
 const table=th.closest('table');
 if(!table)return;
 const dir=th.dataset.dir==='asc'?'desc':'asc';
 table.querySelectorAll('th[data-dir]').forEach(x=>{if(x!==th)x.dataset.dir='';});
 th.dataset.dir=dir;
 const headRow=th.parentNode;
 const rows=[].slice.call(table.rows).filter(r=>r!==headRow);
 const idx=[].slice.call(headRow.cells).indexOf(th);
 rows.sort((a,b)=>{
 const va=thSortVal(a.cells[idx]?a.cells[idx].textContent:'');
 const vb=thSortVal(b.cells[idx]?b.cells[idx].textContent:'');
 const cmp=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'zh');
 return dir==='asc'?cmp:-cmp;
 });
 const body=rows[0]&&rows[0].parentNode;
 if(body)rows.forEach(r=>body.appendChild(r)); // appendChild 移动已有节点即完成重排
 toast('已按「'+th.textContent.trim()+'」'+(dir==='asc'?'升序':'降序'));
}

function getSortKey(key){return _sortPrefs()[key]||'ovr';}

function curPageName(){const c=document.querySelector('nav button.on');return c&&c.dataset&&c.dataset.page?c.dataset.page:'club';}
const SORTERS={
 ovr:{n:'总值',f:(a,b)=>overall(b)-overall(a)},
 val:{n:'身价',f:(a,b)=>sellAskPrice(b)-sellAskPrice(a)},
 age:{n:'年轻',f:(a,b)=>(a.age||0)-(b.age||0)},
 mor:{n:'士气',f:(a,b)=>(b.morale||0)-(a.morale||0)}
};

function applySortPref(key,list){
 let out=(list||[]).slice();
 const pos=getPosFilter(key);
 if(pos)out=out.filter(p=>p.pos===pos);
 const s=SORTERS[getSortKey(key)];
 if(s)out.sort(s.f);

}

 <button class="btn sm" onclick="playerTrain('farm')" ${canTrain?'':'disabled'}>练运营</button>

 html+=`<div class="panel"><h3>更衣室 · 社交 <span class="tag">${S.socialUsed?'今日已参与':'今天还可参与一次'}</span></h3>
 <div class="hint" style="margin-bottom:8px">训练管成长，社交管人缘：人气影响转会接盘与代言，士气影响首发竞争力。与「加练」互相独立。</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap">
 ${Object.keys(SOCIAL_ACTIONS||{}).map(sk=>`<button class="btn sm" onclick="playerSocial(S,'${sk}')" ${S.socialUsed||c.retired||(sk!=='bond'&&me.injury>0)||(me.energy<(SOCIAL_ACTIONS[sk].energy||0))?'disabled':''}>${SOCIAL_ACTIONS[sk].n}</button>`).join('')}
 </div>
 <div class="hint mt8">${Object.keys(SOCIAL_ACTIONS||{}).map(sk=>SOCIAL_ACTIONS[sk].n+'：'+SOCIAL_ACTIONS[sk].d).join(' · ')}</div>

 if(c.media){

 }

 if(rival)html+=`<div class="panel"><h3>首发竞争 <span class="tag">${POS[me.pos][0]}</span></h3>
 <div class="match"><div class="vs"><span style="display:inline-flex;align-items:center;gap:6px">${avatar(me,28)} <b>${me.name}</b>${starter?' <span class="green">首发中</span>':''}</span></div>
 <div class="score" style="font-size:13px">战力 <b style="color:var(--cyan)">${myPow}</b> vs <b style="color:${rivPow>myPow?'var(--red)':'var(--dim)'}">${rivPow}</b></div>

 const benchDays=c.benchDays||0;
 if(natCamping(S,me)){

 html+=`<div class="panel" style="border-color:var(--gold)"><h3>国家队集训中 <span class="tag" style="color:var(--gold)">状态 ${me.natCampForm||0}/5 · 专注：${(typeof NAT_FOCUS!=='undefined'&&NAT_FOCUS[nf]?NAT_FOCUS[nf].n:'状态')}</span></h3>

 <div class="hint mt8">国家队名单：${(S.natSquad||[]).filter(x=>x.mine).map(x=>x.name+'（'+POS[x.pos][0]+'）').join('、')||'—'}</div>
 </div>`;
 }else if(me.loanOut){

 <div class="hint" style="margin-bottom:8px">长期没球打会伤士气。连续替补满 3 天后，可向经纪人申请<b>租借离队</b>（去缺人的俱乐部打 ${LOAN_DAYS} 天主力）或<b>下放 K甲</b>（二队练级 ${KJIA_DAYS} 天）——两条路都带成长，归队再争首发。</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">
 <button class="btn sm gold" onclick="playerRequestLoanOut(S)" ${canOut?'':'disabled'}> 租借离队（${LOAN_DAYS}天）</button>
 <button class="btn sm" onclick="playerRequestKjia(S)"> 下放 K甲（${KJIA_DAYS}天练级）</button>
 </div>
 ${canOut?'':'<div class="hint mt8">租借需连续替补满 3 天（K甲可随时申请）</div>'}

 }

 const mst=playerStatus(me,S); // 集训/外租/K甲统一走状态出口（st.natCamp 内含 natCamping(S,me) 的计算）
 const canReq=!c.pendingMove&&!myOffers.length&&!mst.loanOut&&!mst.kjia&&!mst.natCamp&&!c.retired;
 html+=`<div class="panel"><h3>转会 <span class="tag">${c.pendingMove?'已锁定下家':myOffers.length?myOffers.length+' 份报价':'可主动申请'}</span></h3>
 ${myOffers.length?myOffers.map(o=>`<div class="match" style="margin-bottom:6px;padding:8px 10px">
 <div class="vs"><span class="tname" style="font-size:13px">${o.team} 邀请你加盟</span>
 <div class="power" style="font-size:10px">报价 <b class="gold">${o.fee}万</b>（转会费越高，新俱乐部给你的薪资越好）· 第 ${o.expire} 天到期</div></div>
 <div style="display:flex;gap:4px">
 <button class="btn sm" onclick="respondOffer(S,${S.offers.indexOf(o)},'keep')">留队（涨薪 8%）</button>
 <button class="btn sm primary" onclick="respondOffer(S,${S.offers.indexOf(o)},'sell')">接受（赛段结束后加盟）</button>
 </div></div>`).join(''):`<div class="hint" style="margin-bottom:8px">表现火热（身价系数 ≥112%）会被动收到报价；也可主动向经纪人申请转会——总值/身价/人气决定有没有人接盘，合同最后一年更容易谈。</div>

 </div>`;
 if(c.pendingMove)html+=`<div class="panel" style="border-color:var(--gold)"><h3>转会意向 <span class="tag" style="color:var(--gold)">将加盟 ${c.pendingMove.team}</span></h3>
 <div class="hint">当前赛段继续为 ${S.teamName} 出战；打完挑战者杯/年总等收官战后，新赛季开始时正式加盟新东家。</div></div>`;

 html+=`<div class="panel"><h3>生涯履历 <span class="tag">${c.seasons.length} 个赛季</span></h3>
 ${c.seasons.length?`<table class="tbl"><tr><th>赛季</th><th>球队</th><th>出场</th><th>场均KDA</th><th>MVP</th><th>总值</th><th>身价</th><th>荣誉</th></tr>
 ${c.seasons.map(r=>`<tr><td>${r.year}</td><td>${r.team}</td><td>${r.apps}</td><td>${r.kda||'—'}</td><td>${r.mvp}</td><td>${r.ovr}</td><td>${r.val}%</td><td class="gold">${r.titles?r.titles+' 冠':''}</td></tr>`).join('')}</table>`:'<div class="hint">首个赛季进行中——每个赛季结束后这里记录你的一年</div>'}
 </div>`;
 el.innerHTML=html;
}

function playerTrain(k){

 if(!r.ok){if(r.reason)toast(r.reason);return;}
 save();renderAll();

 if(r.gain<=0)toast(' 加练'+({lane:'对线',farm:'运营',team:'团战',mind:'心态'}[k]||'属性')+'：'+(r.note||'状态不佳，今天没有提升'));
}
function playerHeroTrain(){

 if(!r.ok){if(r.reason)toast(r.reason);return;}
 save();renderAll();toast(r.hero+' 已练成绝活！');
}
function playerRest(){
 const r=playerRestDay(S);
 if(!r.ok){if(r.reason)toast(r.reason);return;}
 save();renderAll();
}

</script>
<script>
let _bgmOn=false,_bgmNode=null,_bgmVolume=0.35,_bgmAc=null,_bgmTimer=null;
try{
 _bgmOn=localStorage.getItem('km_bgm')==='1';
 const v=parseFloat(localStorage.getItem('km_bgm_vol'));
 if(isFinite(v))_bgmVolume=Math.max(0,Math.min(1,v/100));
}catch(_){}

const BGM={

 idle:{freqs:[261.63,329.63,392.00,392.00*1.003],type:'sine',vol:0.006},

 win:{chords:[[523.25,659.25,783.99],[659.25,783.99,987.77]],delays:[0,160],vol:0.035},

 lose:{chords:[[261.63,311.13,392.00],[246.94,293.66,369.99]],delays:[0,140],vol:0.03},

 title:{chords:[[523.25,659.25,783.99],[659.25,783.99,987.77],[783.99,987.77,1174.66],[1046.50,1318.51,1567.98]],delays:[0,120,240,380],vol:0.04}
};

function _bgmEnsureAc(){
 try{
  if(!_bgmAc)_bgmAc=new (window.AudioContext||window.webkitAudioContext)();
  if(_bgmAc.state==='suspended')_bgmAc.resume();
  return _bgmAc;
 }catch(_){return null;}
}
function _bgmOk(){return !!( _bgmOn && (window.AudioContext||window.webkitAudioContext));}

function stopBGM(fadeMs){
 if(_bgmTimer){clearTimeout(_bgmTimer);_bgmTimer=null;}
 if(!_bgmNode)return;
 try{
  const t=fadeMs==null?280:fadeMs;
  if(_bgmNode.oscs&&_bgmNode.oscs.length)fadeControl(false,t);
  else if(_bgmNode.stop)try{_bgmNode.stop();}catch(_){}
  setTimeout(()=>{
   if(_bgmNode&&_bgmNode.oscs){
    _bgmNode.oscs.forEach(x=>{try{x.o.stop();}catch(_){}});
    _bgmNode.oscs=[];
   }
   if(_bgmNode&&_bgmNode.mode==='idle')_bgmNode=null;
  },t+40);
 }catch(_){_bgmNode=null;}
}

function playIdlePad(){
 if(!_bgmOk())return;
 const ac=_bgmEnsureAc();if(!ac)return;
 if(_bgmNode&&_bgmNode.mode==='idle'&&_bgmNode.oscs&&_bgmNode.oscs.length)return;
 if(_bgmNode&&_bgmNode.mode!=='idle')stopBGM(120);
 try{
  const now=ac.currentTime,oscs=[];
  BGM.idle.freqs.forEach(f=>{
   const o=ac.createOscillator(),g=ac.createGain();
   o.type=BGM.idle.type;o.frequency.value=f;
   const target=Math.max(0.0002,BGM.idle.vol*_bgmVolume);
   g.gain.setValueAtTime(0,now);
   g.gain.linearRampToValueAtTime(target,now+1.1);
   o.connect(g);g.connect(ac.destination);
   o.start(now);
   oscs.push({o,g,baseVol:BGM.idle.vol});
  });
  _bgmNode={ac,mode:'idle',oscs};
 }catch(e){try{console.warn('BGM idle fail',e&&e.message);}catch(_){}}
}

function playChordBGM(mode){
 if(!_bgmOk())return;
 const ac=_bgmEnsureAc();if(!ac)return;
 const cfg=BGM[mode];if(!cfg)return;
 try{

  cfg.chords.forEach((chord,i)=>{
   const delay=cfg.delays[i]||0;
   _bgmTimer=setTimeout(()=>{
    if(!_bgmOn)return;
    const t0=ac.currentTime;
    chord.forEach((f,j)=>{
     const o=ac.createOscillator(),g=ac.createGain();
     o.type='triangle';o.frequency.value=f;
     const peak=Math.max(0.0003,(cfg.vol||0.03)*_bgmVolume);
     const at=t0+j*0.02;
     g.gain.setValueAtTime(0.0001,at);
     g.gain.exponentialRampToValueAtTime(peak,at+0.03);
     g.gain.exponentialRampToValueAtTime(0.0001,at+0.55);
     o.connect(g);g.connect(ac.destination);
     o.start(at);o.stop(at+0.6);
    });
   },delay);
  });
 }catch(e){try{console.warn('BGM chord fail',e&&e.message);}catch(_){}}
}

function playBGM(mode){
 if(!_bgmOk())return;
 if(mode==='idle'){playIdlePad();return;}
 if(mode==='win'||mode==='lose'||mode==='title')playChordBGM(mode);
}

function toggleBGM(){
 _bgmOn=!_bgmOn;
 try{localStorage.setItem('km_bgm',_bgmOn?'1':'0');}catch(_){}
 if(_bgmOn){playIdlePad();toast(' BGM 已开启');}
 else{stopBGM();toast(' BGM 已关闭');}
 try{if(S)renderHeader();}catch(_){}
}

function setBgmVolume(percent){
 const p=Math.max(0,Math.min(100,Number(percent)||0));
 _bgmVolume=p/100;
 try{localStorage.setItem('km_bgm_vol',String(p));}catch(_){}

 if(_bgmNode&&_bgmNode.oscs&&_bgmNode.ac){
  const now=_bgmNode.ac.currentTime;
  _bgmNode.oscs.forEach(osc=>{
   try{osc.g.gain.setTargetAtTime(Math.max(0.0002,osc.baseVol*_bgmVolume),now,0.08);}catch(_){}
  });
 }
 try{const el=document.getElementById('bgm-vol-display');if(el)el.textContent=p+'%';}catch(_){}
}

function fadeControl(fadeIn,duration){
 if(!_bgmNode||!_bgmNode.ac||!_bgmNode.oscs||!_bgmNode.oscs.length)return;
 const dur=duration||500,now=_bgmNode.ac.currentTime;
 _bgmNode.oscs.forEach(osc=>{
  try{
   const cur=osc.g.gain.value;
   osc.g.gain.cancelScheduledValues(now);
   osc.g.gain.setValueAtTime(cur,now);
   const target=fadeIn?Math.max(0.0002,osc.baseVol*_bgmVolume):0.0001;
   osc.g.gain.exponentialRampToValueAtTime(target,now+dur/1000);
  }catch(_){}
 });
}

function detectAndPlayBGM(){
 if(!_bgmOk())return;
 try{
  const cur=document.querySelector('.page.on');
  const id=cur&&cur.id?cur.id.replace('page-',''):'';
  if(id==='club'||id==='biz'||id==='hall'||id==='career'||id==='league')playIdlePad();
 }catch(_){playIdlePad();}
}

function bgmOnMoment(sfxKey){
 if(!_bgmOn)return;
 try{
  if(sfxKey==='title'||sfxKey==='fmvp'||sfxKey==='dynasty')playBGM('title');
  else if(sfxKey==='win'||sfxKey==='gold')playBGM('win');
  else if(sfxKey==='lose')playBGM('lose');
  else if(sfxKey==='comeback'||sfxKey==='peak')playBGM('win');
 }catch(_){}
}

function _bgmUnlock(){
 if(_bgmOn)playIdlePad();
 document.removeEventListener('pointerdown',_bgmUnlock);
 document.removeEventListener('keydown',_bgmUnlock);
}
document.addEventListener('pointerdown',_bgmUnlock);
document.addEventListener('keydown',_bgmUnlock);
try{
 if(document.readyState==='complete')setTimeout(detectAndPlayBGM,600);
 else document.addEventListener('DOMContentLoaded',()=>setTimeout(detectAndPlayBGM,600));
}catch(_){}

</script>
