# GitHub Pages 在线试玩：push main 后自动构建并部署
# 在线地址：https://liuli-meng.github.io/kpl-manager/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建单文件 game.html
        run: npm run build

      - name: 准备站点根目录（game.html → index.html + PWA 文件）
        run: |
          New-Item -ItemType Directory -Force site
          Copy-Item game.html site/index.html
          Copy-Item manifest.webmanifest site/
          Copy-Item sw.js site/
          Copy-Item icon.svg site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
